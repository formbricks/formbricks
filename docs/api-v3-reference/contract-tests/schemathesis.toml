# Schemathesis configuration for the v3 API contract tests (ENG-2191).
#
# The committed bundle one directory up (../openapi.yml) is the only contract input — there is no
# second copy of the spec to keep in sync. Pass this file explicitly, since Schemathesis only
# discovers `schemathesis.toml` in the working directory and its parents:
#
#   schemathesis --config-file docs/api-v3-reference/contract-tests/schemathesis.toml run ...
#
# See README.md in this directory for the full local invocation.

# Overridden by --url in CI; this is the local dev-server default.
base-url = "http://localhost:3000"

# Generous enough for a cold Next.js route on the first hit, tight enough that a hung route fails the
# job instead of sitting until the step timeout.
request-timeout = 30

[phases.examples]
# Load-bearing. The examples phase only emits cases for operations that carry explicit `example` /
# `examples` in the spec — three of the twenty-eight v3 operations today. The other twenty-five are
# silently skipped, which reads as a green run that proves nothing. `fill-missing` generates the
# absent parts so every documented operation gets a case, which is also what makes newly documented
# endpoints covered with no per-endpoint registration.
fill-missing = true

# The `V3 Feedback Records` operations used to be excluded here: the gateway served them, so CI had
# nothing to exercise but a dev-only proxy with no upstream. They are ordinary app routes now
# (ENG-3117) and run like every other operation — which is most of the point of moving them. They do
# need the feedback store to answer with anything but a 503, so the workflow starts one alongside an
# offline embedding stub; see contract-tests/README.md.

# The v3 response operations are documented but not all routed yet: ENG-2868 agreed the contract
# before implementation, deliberately. `fill-missing` above means a documented operation is exercised
# the moment it is selected, so an unrouted one answers Next.js's HTML 404 against a spec documenting
# 200/400/401/403/429/500 — a red job that says nothing about the contract.
#
# One block per operation, keyed by `operationId`, so each endpoint's PR deletes exactly its own and
# the gate opens as the route lands rather than all at once at the end (ENG-2959). Keyed by operation
# id rather than path because two of the three remaining paths carry a routed method beside the
# unrouted one — `POST /responses` sits under the routed `GET`, and `PATCH /responses/{responseId}`
# under the routed `GET` and `DELETE` — which a path filter cannot separate.
[[operations]]
include-operation-id = "createResponseV3"     # ENG-2866
enabled = false

[[operations]]
include-operation-id = "updateResponseV3"     # ENG-2866
enabled = false

[[operations]]
include-operation-id = "validateResponseV3"   # ENG-2954
enabled = false
