# Schemathesis configuration for the v3 API contract tests (ENG-2191).
#
# The committed bundle one directory up (../openapi.yml) is the only contract input — there is no
# second copy of the spec to keep in sync. Pass this file explicitly, since Schemathesis only
# discovers `schemathesis.toml` in the working directory and its parents:
#
#   schemathesis --config-file docs/api-v3-reference/contract-tests/schemathesis.toml run ...
#
# See README.md in this directory for the full local invocation.

# Overridden by --url in CI; this is the local dev-server default.
base-url = "http://localhost:3000"

# Generous enough for a cold Next.js route on the first hit, tight enough that a hung route fails the
# job instead of sitting until the step timeout.
request-timeout = 30

[phases.examples]
# Load-bearing. The examples phase only emits cases for operations that carry explicit `example` /
# `examples` in the spec — only a few of the v3 operations. The rest would be silently skipped,
# which reads as a green run that proves nothing. `fill-missing` generates the
# absent parts so every documented operation gets a case, which is also what makes newly documented
# endpoints covered with no per-endpoint registration.
fill-missing = true

# The eight `V3 Feedback Records` operations are served by the API gateway (Envoy in Cloud, Traefik
# in the one-click Docker install → the Hub), not by this app: the Next.js route under
# /api/v3/feedbackRecords is a local-dev proxy that needs a running Hub and answers 404 in production
# builds. CI has no Hub, so exercising the proxy would only prove that a proxy without an upstream
# answers 502 — nothing about the documented contract. Excluded rather than shallow-tested; the
# contract is checked by the Hub's own suite and by the live smoke recorded in ENG-1259.
[[operations]]
include-tag = "V3 Feedback Records"
enabled = false

# The three chart query operations run a Cube query, and this job runs no Cube. Where the licence grants
# Dashboards they answer the documented 502 `bad_gateway`, and where it does not, the documented 403
# `dashboards_plan_required` — which one a run gets is the licence's call, not the route's. 502 is
# allowed here only so `not_a_server_error` stops failing on it; the status, content-type and response
# schema checks still hold the 502 body to the documented problem shape. Any other 5xx still fails.
[[operations]]
include-operation-id = ["previewChartV3", "getChartDataV3", "listChartFieldValuesV3"]
checks.not_a_server_error.expected-statuses = ["2xx", "3xx", "4xx", "502"]
