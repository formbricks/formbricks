  /api/v3/tags/{tagId}:
    patch:
      operationId: renameTagV3
      summary: Rename a tag
      description: |
        Renames a tag. The workspace is resolved from the tag itself, so the caller cannot choose which scope
        it is authorized against. Requires organization owner/manager, or a workspace team membership with
        read-write permission.

        An unknown `tagId` answers `403`, not `404`, so tag ids cannot be probed for existence. A name that
        collides with another tag in the same workspace answers `422`.
      tags:
        - V3 Tags
      parameters:
        - in: path
          name: tagId
          required: true
          schema:
            type: string
            format: cuid2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: New label. Trimmed; must not be empty.
      responses:
        '200':
          description: Tag renamed successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/TagResource'
        '400':
          $ref: '#/components/responses/V3BadRequest'
        '401':
          $ref: '#/components/responses/V3Unauthorized'
        '403':
          $ref: '#/components/responses/V3Forbidden'
        '422':
          $ref: '#/components/responses/V3UnprocessableContent'
        '429':
          $ref: '#/components/responses/V3TooManyRequests'
        '500':
          $ref: '#/components/responses/V3InternalServerError'
      security:
        - sessionAuth: []
    delete:
      operationId: deleteTagV3
      summary: Delete a tag
      description: |
        Deletes a tag and removes it from every response carrying it. Same authorization as rename.
      tags:
        - V3 Tags
      parameters:
        - in: path
          name: tagId
          required: true
          schema:
            type: string
            format: cuid2
      responses:
        '200':
          description: Tag deleted successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - id
                    properties:
                      id:
                        type: string
                        format: cuid2
                        description: The deleted tag's id.
        '400':
          $ref: '#/components/responses/V3BadRequest'
        '401':
          $ref: '#/components/responses/V3Unauthorized'
        '403':
          $ref: '#/components/responses/V3Forbidden'
        '429':
          $ref: '#/components/responses/V3TooManyRequests'
        '500':
          $ref: '#/components/responses/V3InternalServerError'
      security:
        - sessionAuth: []
  /api/v3/tags/{tagId}/merge:
    post:
      operationId: mergeTagsV3
      summary: Merge a tag into another
      description: |
        Moves every response tagged `{tagId}` onto `newTagId`, then deletes `{tagId}`.

        Both tags must belong to the same workspace — a cross-workspace merge answers `403`, since it would
        move responses across a tenant boundary. Same authorization as rename.

        Merging a tag into itself answers `400`.
      tags:
        - V3 Tags
      parameters:
        - in: path
          name: tagId
          required: true
          schema:
            type: string
            format: cuid2
          description: The tag being merged away.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - newTagId
              properties:
                newTagId:
                  type: string
                  format: cuid2
                  description: The surviving tag.
      responses:
        '200':
          description: Tags merged successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - id
                    properties:
                      id:
                        type: string
                        format: cuid2
                        description: The surviving tag's id.
        '400':
          $ref: '#/components/responses/V3BadRequest'
        '401':
          $ref: '#/components/responses/V3Unauthorized'
        '403':
          $ref: '#/components/responses/V3Forbidden'
        '429':
          $ref: '#/components/responses/V3TooManyRequests'
        '500':
          $ref: '#/components/responses/V3InternalServerError'
      security:
        - sessionAuth: []
components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: next-auth.session-token
      description: |
        NextAuth session JWT cookie. **Development:** often `next-auth.session-token`.
        **Production (HTTPS):** often `__Secure-next-auth.session-token`. Send the cookie your browser receives after sign-in.
    apiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: |
        Management API key; must include **workspaceId** as an allowed workspace with read, write, or manage permission.
  schemas:
    SurveyListItem:
      type: object
      description: |
        Shape returned by `GET /api/v3/surveys`. Serialized dates are ISO 8601 strings.
        The v3 overview contract intentionally omits internal fields such as `_count`.
        Legacy DB rows may include survey **type** values `website` or `web` (see Prisma); filter **type** only accepts `link` | `app`.
      required:
        - id
        - name
        - workspaceId
        - type
        - status
        - publishOn
        - createdAt
        - updatedAt
        - archivedAt
        - responseCount
        - completedResponseCount
        - creator
      properties:
        id:
          type: string
        name:
          type: string
        workspaceId:
          type: string
        type:
          type: string
          enum:
            - link
            - app
            - website
            - web
        status:
          type: string
          enum:
            - draft
            - inProgress
            - paused
            - completed
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        archivedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: Soft-delete/archive marker (ISO 8601); `null` when the survey is active.
        publishOn:
          type:
            - string
            - 'null'
          format: date-time
          description: Scheduled publish time (ISO 8601), or null if not scheduled.
        responseCount:
          type: integer
          description: Number of responses, including partial ones.
        completedResponseCount:
          type: integer
          description: Number of responses the respondent finished.
        creator:
          type:
            - object
            - 'null'
          description: The user who created the survey, or null for API-key/system-created surveys.
          required:
            - name
          properties:
            name:
              type: string
          additionalProperties: false
    InvalidParam:
      type: object
      description: |
        Field-level validation error. `name` and `reason` are always intended for humans.
        Optional machine-readable fields are included when the API can identify the semantic error,
        especially for survey locale, identifier, and reference validation used by MCP and agent clients.
      required:
        - name
        - reason
      properties:
        name:
          type: string
          description: Dot-path to the invalid request field.
        reason:
          type: string
          description: Human-readable repair guidance.
        code:
          type: string
          enum:
            - dangling_reference
            - duplicate_identifier
            - duplicate_locale
            - forbidden_identifier
            - immutable_identifier
            - invalid_graph
            - invalid_locale
            - invalid_reference
            - missing_required_field
            - missing_translation
            - rule_violation
            - unsupported_field
            - unsupported_locale
          description: |
            Machine-readable validation category, when available. `invalid_graph` covers workflow
            graph-structure violations such as a duplicated trigger edge, an unreachable node, or a
            cycle. `rule_violation` covers a submitted answer that breaks one of the survey's own validation rules (see `SurveyValidationRule`) — a value below a `minLength`, outside a rating range, or with fewer selections than `minSelections`. It is used by response validation and response writes.
        identifier:
          type: string
          description: Identifier involved in the validation failure, when available. For language errors, this can be the normalized language code.
        referenceType:
          type: string
          enum:
            - block
            - element
            - ending
            - hiddenField
            - language
            - variable
            - variableName
            - recall
            - node
            - edge
            - survey
            - endingCard
            - response
            - contact
            - display
            - tag
            - quota
          description: Identifier namespace involved in the validation failure. `node`, `edge`, `survey`, and `endingCard` are used by workflow validation. `response`, `contact`, `display`, `tag`, and `quota` are used by response validation and response writes.
        missingId:
          type: string
          description: Referenced id that does not exist in the submitted survey document.
        firstUsedAt:
          type: string
          description: Dot-path where a duplicate identifier was first used.
        conflictsWith:
          type: string
          description: Dot-path to the existing identifier that conflicts with this field.
      additionalProperties: false
    Problem:
      type: object
      description: RFC 9457 Problem Details for HTTP APIs (`application/problem+json`). Responses typically include a machine-readable `code` field alongside `title`, `status`, `detail`, and `requestId`.
      required:
        - title
        - status
        - detail
        - requestId
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          enum:
            - ai_features_not_enabled
            - ai_generated_payload_invalid
            - ai_instance_not_configured
            - ai_output_too_long
            - ai_smart_tools_disabled
            - bad_gateway
            - bad_request
            - conflict
            - forbidden
            - internal_server_error
            - invalid_workflow_state
            - not_authenticated
            - not_found
            - payload_too_large
            - service_unavailable
            - too_many_requests
            - unprocessable_content
            - workflow_not_executable
        requestId:
          type: string
        details:
          type: object
        invalid_params:
          type: array
          items:
            $ref: '#/components/schemas/InvalidParam'
    TranslatableTextMap:
      type: object
      description: Multilingual text map keyed by the emitted `languages[].code` values for this survey.
      propertyNames:
        type: string
        description: Survey language code/tag, for example `en-US`, `de-DE`, or `zh-Hans-CN`.
      additionalProperties:
        type: string
    TranslatableText:
      allOf:
        - $ref: '#/components/schemas/TranslatableTextMap'
      description: |
        Survey authoring text. `GET /api/v3/surveys/{surveyId}` always returns maps keyed by the emitted
        `languages[].code` values for this survey. Use `?lang=` to filter which language keys are included.
        The internal storage key `default` is never exposed by v3.
      examples:
        - en-US: What should we improve?
          de-DE: Was sollten wir verbessern?
    SurveyMetadata:
      type: object
      description: |
        Arbitrary JSON survey context for customer- or operation-specific metadata. v3 preserves
        arbitrary metadata values as-is. If present, `title` and `description` are treated as
        translatable text maps and returned with real locale-code keys.
      properties:
        title:
          $ref: '#/components/schemas/TranslatableText'
        description:
          $ref: '#/components/schemas/TranslatableText'
      additionalProperties: true
    LocaleCode:
      type: string
      pattern: ^[a-z]{2}(?:-[A-Z][a-z]{3})?-[A-Z]{2}$
      description: Canonical locale code accepted by v3 survey APIs, for example `en-US`, `de-DE`, or `zh-Hans-CN`.
      example: en-US
