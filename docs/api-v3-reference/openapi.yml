          openText: '#/components/schemas/SurveyOpenTextElement'
          consent: '#/components/schemas/SurveyConsentElement'
          multipleChoiceSingle: '#/components/schemas/SurveyMultipleChoiceSingleElement'
          multipleChoiceMulti: '#/components/schemas/SurveyMultipleChoiceMultiElement'
          nps: '#/components/schemas/SurveyNpsElement'
          cta: '#/components/schemas/SurveyCtaElement'
          rating: '#/components/schemas/SurveyRatingElement'
          pictureSelection: '#/components/schemas/SurveyPictureSelectionElement'
          date: '#/components/schemas/SurveyDateElement'
          fileUpload: '#/components/schemas/SurveyFileUploadElement'
          cal: '#/components/schemas/SurveyCalElement'
          matrix: '#/components/schemas/SurveyMatrixElement'
          address: '#/components/schemas/SurveyAddressElement'
          ranking: '#/components/schemas/SurveyRankingElement'
          contactInfo: '#/components/schemas/SurveyContactInfoElement'
          csat: '#/components/schemas/SurveyCsatElement'
          ces: '#/components/schemas/SurveyCesElement'
      description: |
        Survey element/question inside a block. Element ids are stable public identifiers used by
        logic, recall strings, response data, quotas, integrations, and analysis. `type` selects the
        allowed shape; unsupported fields are rejected instead of ignored.
    SurveyDynamicReference:
      type: object
      description: Dynamic reference to another value in the survey document.
      required:
        - type
        - value
      properties:
        type:
          type: string
          enum:
            - element
            - variable
            - hiddenField
            - reserved
        value:
          type: string
          description: Element id, variable id, hidden field id, or — for `reserved` — the name of an Embedded Data field-catalog entry (`country`, `deviceType`, `utmSource`, …). Reserved names are checked for non-emptiness only, deliberately not against the catalog, so a survey authored against a newer catalog still parses on an older self-hosted deployment.
        meta:
          type: object
          additionalProperties:
            type: string
      additionalProperties: false
    SurveyLogicOperand:
      oneOf:
        - type: object
          required:
            - type
            - value
          properties:
            type:
              type: string
              enum:
                - static
            value:
              oneOf:
                - type: string
                - type: number
                - type: array
                  items:
                    type: string
          additionalProperties: false
        - $ref: '#/components/schemas/SurveyDynamicReference'
    SurveyCondition:
      type: object
      description: |
        Single condition. Operators such as `isSubmitted`, `isSkipped`, `isClicked`, `isAccepted`,
        `isBooked`, `isSet`, and `isEmpty` do not use `rightOperand`; comparison operators do.
      required:
        - id
        - leftOperand
        - operator
      properties:
        id:
          type: string
          format: cuid2
        leftOperand:
          $ref: '#/components/schemas/SurveyDynamicReference'
        operator:
          type: string
          enum:
            - equals
            - doesNotEqual
            - contains
            - doesNotContain
            - startsWith
            - doesNotStartWith
            - endsWith
            - doesNotEndWith
            - isSubmitted
            - isSkipped
            - isGreaterThan
            - isLessThan
            - isGreaterThanOrEqual
            - isLessThanOrEqual
            - equalsOneOf
            - includesAllOf
            - includesOneOf
            - doesNotIncludeOneOf
            - doesNotIncludeAllOf
            - isClicked
            - isNotClicked
            - isAccepted
            - isBefore
            - isAfter
            - isBooked
            - isPartiallySubmitted
            - isCompletelySubmitted
            - isSet
            - isNotSet
            - isEmpty
            - isNotEmpty
            - isAnyOf
        rightOperand:
          $ref: '#/components/schemas/SurveyLogicOperand'
      additionalProperties: false
    SurveyConditionGroup:
      type: object
      required:
        - id
        - connector
        - conditions
      properties:
        id:
          type: string
          format: cuid2
        connector:
          type: string
          enum:
            - and
            - or
        conditions:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/SurveyCondition'
              - $ref: '#/components/schemas/SurveyConditionGroup'
      additionalProperties: false
    SurveyCalculateAction:
      type: object
      description: Updates a survey variable when the logic rule matches.
      required:
        - id
        - objective
        - variableId
        - operator
        - value
      properties:
        id:
          type: string
          format: cuid2
        objective:
          type: string
          enum:
            - calculate
        variableId:
          type: string
          format: cuid2
          description: Variable id for `calculate`.
        operator:
          type: string
          enum:
            - assign
            - concat
            - add
            - subtract
            - multiply
            - divide
        value:
          $ref: '#/components/schemas/SurveyLogicOperand'
      additionalProperties: false
    SurveyRequireAnswerAction:
      type: object
      description: Requires an element/question to be answered before continuing.
      required:
        - id
        - objective
        - target
      properties:
        id:
          type: string
          format: cuid2
        objective:
          type: string
          enum:
            - requireAnswer
        target:
          type: string
          description: Target element id.
      additionalProperties: false
    SurveyJumpToBlockAction:
      type: object
      description: Jumps to another block or ending when the logic rule matches.
      required:
        - id
        - objective
        - target
      properties:
        id:
          type: string
          format: cuid2
        objective:
          type: string
          enum:
            - jumpToBlock
        target:
          type: string
          format: cuid2
          description: Target block id or ending id.
      additionalProperties: false
    SurveyLogicAction:
      oneOf:
        - $ref: '#/components/schemas/SurveyCalculateAction'
        - $ref: '#/components/schemas/SurveyRequireAnswerAction'
        - $ref: '#/components/schemas/SurveyJumpToBlockAction'
      description: |
        Logic action. Keep referenced ids stable: `calculate.variableId` points to a variable id,
        `requireAnswer.target` points to an element id, and `jumpToBlock.target` points to a block id
        or ending id.
    SurveyBlockLogic:
      type: object
      description: Conditional logic rule evaluated at block level.
      required:
        - id
        - conditions
        - actions
      properties:
        id:
          type: string
          format: cuid2
        conditions:
          $ref: '#/components/schemas/SurveyConditionGroup'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/SurveyLogicAction'
      additionalProperties: false
    CreateSurveyBlock:
      type: object
      description: |
        Block accepted by `POST /api/v3/surveys`. `id` may be omitted and will be generated by the
        server. Provide an explicit cuid2 id when logic in the same request needs to jump to this block.
        For normal sequential flow, omit `logic` and `logicFallback`. `logicFallback` is only valid
        when this same block has at least one `logic` rule.
      required:
        - name
        - elements
      properties:
        id:
          type: string
          format: cuid2
          description: Optional stable block id. Generated when omitted.
        name:
          type: string
          minLength: 1
        elements:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SurveyElement'
        logic:
          type: array
          items:
            $ref: '#/components/schemas/SurveyBlockLogic'
        logicFallback:
          type: string
          format: cuid2
          description: |
            Block or ending id used when no logic condition matches. Only valid when this same block
            has at least one `logic` rule; omit it for normal sequential flow.
        buttonLabel:
          $ref: '#/components/schemas/TranslatableText'
        backButtonLabel:
          $ref: '#/components/schemas/TranslatableText'
      additionalProperties: false
    SurveyEndScreenEnding:
      type: object
      description: Visual end screen displayed after survey completion.
      required:
        - id
        - type
      properties:
        id:
          type: string
          format: cuid2
          description: Stable ending id. `jumpToBlock.target` may point to this id.
        type:
          type: string
          enum:
            - endScreen
        headline:
          $ref: '#/components/schemas/TranslatableText'
        subheader:
          $ref: '#/components/schemas/TranslatableText'
        buttonLabel:
          $ref: '#/components/schemas/TranslatableText'
        buttonLink:
          type: string
        imageUrl:
          type: string
        videoUrl:
          type: string
        hideDefaultIcon:
          type: boolean
          description: Hides the default checkmark icon rendered above the headline when the ending carries no image or video. Omit to keep the icon.
      additionalProperties: false
    SurveyRedirectEnding:
      type: object
      description: |
        Redirects the respondent to a URL after survey completion. External redirects require the
        organization's external URL permission; otherwise write endpoints return `403 Forbidden`.
      required:
        - id
        - type
        - url
      properties:
        id:
          type: string
          format: cuid2
          description: Stable ending id. `jumpToBlock.target` may point to this id.
        type:
          type: string
          enum:
            - redirectToUrl
        url:
          type: string
          format: uri
          description: External redirect URL. Requires the organization's external URL permission.
        label:
          type: string
          description: Optional internal label for redirect endings.
      additionalProperties: false
    SurveyEnding:
      oneOf:
        - $ref: '#/components/schemas/SurveyEndScreenEnding'
        - $ref: '#/components/schemas/SurveyRedirectEnding'
      discriminator:
        propertyName: type
        mapping:
          endScreen: '#/components/schemas/SurveyEndScreenEnding'
          redirectToUrl: '#/components/schemas/SurveyRedirectEnding'
      description: |
        Ending reached after the last block or a jump action. `type` selects the allowed shape;
        unsupported fields are rejected instead of ignored.
    SurveyHiddenFields:
      type: object
      description: |
        Hidden fields, sometimes called embedded data in other survey products. Field ids are stable public identifiers and may be referenced by logic, recall, quotas, integrations, and response data.

        **Naming rule for new field ids** — the same rule the survey editor applies (ENG-2539): a new id must start with a lowercase letter and then contain only lowercase letters, numbers and underscores (`^[a-z][a-z0-9_]*$`), and must not take a reserved name. Reserved are the link-survey system params and internal ids — `userId`, `source`, `suid`, `end`, `start`, `welcomeCard`, `hidden`, `verifiedEmail`, `multiLanguage`, `embed`, `verify`, `suToken`, `lang`, `preview`, `startAt`, `skipPrefilled`, `offlineSupport` (matched case-insensitively) — and the names of auto-captured system fields, which every survey can already read without declaring them: `source`, `url`, `country`, `action`, `browser`, `os`, `deviceType`, `ipAddress`, `finished`, `language`, `locale`, `responseId`, `surveyId`, `durationSeconds`, `startedAt`, `finishedAt`, `pagePath`, `pageReferrer`, `utmSource`, `utmMedium`, `utmCampaign`, `utmTerm`, `utmContent`, `screenWidth`, `screenHeight`, `viewportWidth`, `viewportHeight`, `timezone`.

        **Ids a survey already declares are grandfathered**: they always load, and re-sending the survey unchanged never fails validation — only *adding* such a name as a new field is refused. Deleting a grandfathered field spends the reprieve: once it is gone from the saved survey, the name can no longer be re-added. Note this means re-creating a survey from an exported document can fail with a 400 when the export declares a name the rule refuses; rename the field in the payload before importing. The `pattern` below describes what stored surveys may hold (the pre-existing lenient charset), not what a new id may look like.
      required:
        - enabled
      properties:
        enabled:
          type: boolean
        fieldIds:
          type: array
          items:
            type: string
            pattern: ^[a-zA-Z0-9_-]+$
          uniqueItems: true
      additionalProperties: false
    CreateSurveyNumberVariable:
      type: object
      required:
        - name
        - type
        - value
      properties:
        id:
          type: string
          format: cuid2
          description: Optional stable variable id. Generated when omitted.
        name:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
          description: |
            Unique variable name. Must start with a lowercase letter, then lowercase letters, numbers and underscores only — the same rule as new hidden-field ids (this schema is create-only, so no grandfathered name validates against it). Reserved names are refused: `userId`, `source`, `suid`, `end`, `start`, `welcomeCard`, `hidden`, `verifiedEmail`, `multiLanguage`, `embed`, `verify`, `suToken`, `lang`, `preview`, `startAt`, `skipPrefilled`, `offlineSupport`, and the auto-captured system field names `source`, `url`, `country`, `action`, `browser`, `os`, `deviceType`, `ipAddress`, `finished`, `language`, `locale`, `responseId`, `surveyId`, `durationSeconds`, `startedAt`, `finishedAt`, `pagePath`, `pageReferrer`, `utmSource`, `utmMedium`, `utmCampaign`, `utmTerm`, `utmContent`, `screenWidth`, `screenHeight`, `viewportWidth`, `viewportHeight`, `timezone`.
        type:
          type: string
          enum:
            - number
        value:
          type: number
          description: Default numeric value.
      additionalProperties: false
    CreateSurveyTextVariable:
      type: object
      required:
        - name
        - type
        - value
      properties:
        id:
          type: string
          format: cuid2
          description: Optional stable variable id. Generated when omitted.
        name:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
          description: |
            Unique variable name. Must start with a lowercase letter, then lowercase letters, numbers and underscores only — the same rule as new hidden-field ids (this schema is create-only, so no grandfathered name validates against it). Reserved names are refused: `userId`, `source`, `suid`, `end`, `start`, `welcomeCard`, `hidden`, `verifiedEmail`, `multiLanguage`, `embed`, `verify`, `suToken`, `lang`, `preview`, `startAt`, `skipPrefilled`, `offlineSupport`, and the auto-captured system field names `source`, `url`, `country`, `action`, `browser`, `os`, `deviceType`, `ipAddress`, `finished`, `language`, `locale`, `responseId`, `surveyId`, `durationSeconds`, `startedAt`, `finishedAt`, `pagePath`, `pageReferrer`, `utmSource`, `utmMedium`, `utmCampaign`, `utmTerm`, `utmContent`, `screenWidth`, `screenHeight`, `viewportWidth`, `viewportHeight`, `timezone`.
        type:
          type: string
          enum:
            - text
        value:
          type: string
          description: Default text value.
      additionalProperties: false
    CreateSurveyVariable:
      oneOf:
        - $ref: '#/components/schemas/CreateSurveyNumberVariable'
        - $ref: '#/components/schemas/CreateSurveyTextVariable'
      description: |
        Survey variable accepted by `POST /api/v3/surveys`. `id` may be omitted and will be
        generated by the server. Provide an explicit cuid2 id when logic in the same request needs
        to reference this variable.
    SurveyTrigger:
      type: object
      description: |
        Reference to an existing workspace action class that triggers this app survey. Discover available action-class ids with `GET /api/v3/action-classes`.
      required:
        - actionClassId
      properties:
        actionClassId:
          type: string
          format: cuid2
          description: Id of an action class in the same workspace.
      additionalProperties: false
    SurveyDistribution:
      type: object
      description: |
        App-survey runtime/display settings. Only valid for `type: app`; rejected for link surveys.
        **Replacement semantics (destructive):** when `distribution` is provided on PATCH it fully replaces the stored object — any sub-field you omit is reset to its default, NOT preserved. In particular, omitting `triggers` removes ALL existing triggers, and omitting `displayOption` resets it to `displayOnce`. To change one setting, send the complete desired distribution. To leave distribution untouched, omit the whole `distribution` key.
      properties:
        displayOption:
          type: string
          enum:
            - displayOnce
            - displayMultiple
            - respondMultiple
            - displaySome
          default: displayOnce
          description: |
            How often the survey may be shown to a contact. `displaySome` shows it up to `displayLimit` times (or until the contact responds, whichever comes first).
        displayPercentage:
          type:
            - number
            - 'null'
          minimum: 0.01
          maximum: 100
          default: null
          description: |
            Independent throttle: show the survey to only this percentage of triggered contacts. Optional and valid with any `displayOption`; null/omitted means no throttle (shown to everyone).
        displayLimit:
          type:
            - integer
            - 'null'
          minimum: 0
          default: null
          description: |
            Maximum number of times the survey is shown to a single contact. Required (must be >= 1) when `displayOption` is `displaySome`; otherwise optional.
        recontactDays:
          type:
            - integer
            - 'null'
          minimum: 0
          default: null
          description: Days to wait before showing this survey again to the same contact. Null uses the workspace default.
        autoClose:
          type:
            - integer
            - 'null'
          minimum: 0
          default: null
          description: Seconds of inactivity after which the survey widget auto-closes. Null disables auto-close.
        autoComplete:
          type:
            - integer
            - 'null'
          minimum: 1
          default: null
          description: Automatically stop collecting responses after this many completed responses. Null disables it.
        delay:
          type: integer
          minimum: 0
          default: 0
          description: Seconds to wait after a trigger fires before showing the survey.
        triggers:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/SurveyTrigger'
          description: |
            Action classes that trigger the survey. Every id must reference an existing workspace action class. On PATCH this list fully replaces the survey's triggers — omitting it (or sending `[]`) removes all existing triggers.
      additionalProperties: false
      example:
        displayOption: displaySome
        displayLimit: 3
        displayPercentage: null
        recontactDays: 7
        autoClose: null
        autoComplete: null
        delay: 0
        triggers:
          - actionClassId: clyy1234567890123456789012
    SegmentFilterValue:
      description: |
        Comparison value for a segment filter condition. A string or number for most operators; a relative-date object (`{ amount, unit }`) for `isOlderThan` / `isNewerThan`; a two-element `[from, to]` string array for `isBetween`. Ignored for `isSet` / `isNotSet` but still required.
      oneOf:
        - type: string
        - type: number
        - type: object
          required:
            - amount
            - unit
          properties:
            amount:
              type: number
            unit:
              type: string
              enum:
                - days
                - weeks
                - months
                - years
          additionalProperties: false
        - type: array
          items:
            type: string
          minItems: 2
          maxItems: 2
    SegmentFilter:
      description: |
        A single targeting condition. `root.type` selects the subject and determines the valid `qualifier.operator` set: `attribute` (a workspace contact-attribute key), `person` (a built-in person identifier such as `userId`/`email`), `segment` (membership in another segment), or `device`. Each variant is one member of this union; the matching member is chosen by `root.type`.
      oneOf:
        - title: AttributeFilter
          description: Matches on a workspace contact-attribute value.
          type: object
          required:
            - id
            - root
            - qualifier
            - value
          properties:
            id:
              type: string
              format: cuid2
            root:
              type: object
              required:
                - type
                - contactAttributeKey
              properties:
                type:
                  type: string
                  enum:
                    - attribute
                contactAttributeKey:
                  type: string
                  description: A contact-attribute key defined in the workspace (e.g. `plan`, `role`).
              additionalProperties: false
            qualifier:
              type: object
              required:
                - operator
              properties:
                operator:
                  type: string
                  enum:
                    - lessThan
                    - lessEqual
                    - greaterThan
                    - greaterEqual
                    - equals
                    - notEquals
                    - isSet
                    - isNotSet
                    - contains
                    - doesNotContain
                    - startsWith
                    - endsWith
                    - isOlderThan
                    - isNewerThan
                    - isBefore
                    - isAfter
                    - isBetween
                    - isSameDay
              additionalProperties: false
            value:
              $ref: '#/components/schemas/SegmentFilterValue'
          additionalProperties: false
        - title: PersonFilter
          description: Matches on a built-in person identifier.
          type: object
          required:
            - id
            - root
            - qualifier
            - value
          properties:
            id:
              type: string
              format: cuid2
            root:
              type: object
              required:
                - type
                - personIdentifier
              properties:
                type:
                  type: string
                  enum:
                    - person
                personIdentifier:
                  type: string
                  description: A built-in person identifier (e.g. `userId`).
              additionalProperties: false
            qualifier:
              type: object
              required:
                - operator
              properties:
                operator:
                  type: string
                  enum:
                    - equals
                    - notEquals
                    - isSet
                    - isNotSet
                    - contains
                    - doesNotContain
                    - startsWith
                    - endsWith
              additionalProperties: false
            value:
              $ref: '#/components/schemas/SegmentFilterValue'
          additionalProperties: false
        - title: SegmentFilter
          description: Matches on membership in another segment.
          type: object
          required:
            - id
            - root
            - qualifier
            - value
          properties:
            id:
              type: string
              format: cuid2
            root:
              type: object
              required:
                - type
                - segmentId
              properties:
                type:
                  type: string
                  enum:
                    - segment
                segmentId:
                  type: string
                  description: Id of the segment to test membership against.
              additionalProperties: false
            qualifier:
              type: object
              required:
                - operator
              properties:
                operator:
                  type: string
                  enum:
                    - userIsIn
                    - userIsNotIn
              additionalProperties: false
            value:
              $ref: '#/components/schemas/SegmentFilterValue'
          additionalProperties: false
        - title: DeviceFilter
          description: Matches on the contact's device type.
          type: object
          required:
            - id
            - root
            - qualifier
            - value
          properties:
            id:
              type: string
              format: cuid2
            root:
              type: object
              required:
                - type
                - deviceType
              properties:
                type:
                  type: string
                  enum:
                    - device
                deviceType:
                  type: string
                  description: Device type (e.g. `desktop`, `phone`).
              additionalProperties: false
            qualifier:
              type: object
              required:
                - operator
              properties:
                operator:
                  type: string
                  enum:
                    - equals
                    - notEquals
              additionalProperties: false
            value:
              $ref: '#/components/schemas/SegmentFilterValue'
          additionalProperties: false
    SegmentFilters:
      type: array
      description: |
        Contact targeting filter tree. An empty array targets everyone. Each node joins the previous one via its `connector` (`and`/`or`; the first node's connector is null). A node's `resource` is either a single filter condition or a nested filter group (enabling parenthesized `and`/`or` logic).
      items:
        type: object
        required:
          - id
          - connector
          - resource
        properties:
          id:
            type: string
            format: cuid2
          connector:
            type:
              - string
              - 'null'
            enum:
              - and
              - or
              - null
            description: Logical connector joining this node to the previous one. Null for the first node.
          resource:
            oneOf:
              - $ref: '#/components/schemas/SegmentFilter'
              - $ref: '#/components/schemas/SegmentFilters'
            description: A single filter condition, or a nested filter group for grouped logic.
        additionalProperties: false
    SurveyTargeting:
      type: object
      description: |
        App-survey contact targeting. Only valid for `type: app`. `filters: []` targets everyone. Setting or changing non-empty filters requires the Contacts entitlement; otherwise create/patch returns 403.

        `attribute` filters reference workspace contact-attribute keys (discover them via `GET /api/v3/contact-attribute-keys`) and `segment` filters reference other segment ids — both are workspace-scoped resources you must obtain before constructing filters (an invalid key/id targets no one rather than erroring). See `SegmentFilter` for the per-`root.type` operator sets.
      required:
        - filters
      properties:
        filters:
          $ref: '#/components/schemas/SegmentFilters'
      additionalProperties: false
    CreateSurveyRequest:
      type: object
      description: |
        Strict v3 survey creation document. This endpoint accepts survey structure only: name,
        metadata, languages, welcome card, blocks/elements/logic, endings, hidden fields, and variables.
        App surveys (`type: app`) additionally accept the `distribution` (display options + triggers) and `targeting` (contact segment filters) objects; these are rejected for `link` surveys.
        It rejects legacy `questions` and out-of-scope settings such as styling, follow-ups, recaptcha, single-use/email verification, slug, custom scripts, analytics fields, timestamps, and `createdBy`.

        Translatable fields use real locale-code maps. The map must include the canonical
        `defaultLanguage` key, such as `en-US`, so the server can persist the internal default
        translation. Locale keys must be canonical BCP 47 codes such as `de-DE`, `pt-PT`, or
        `zh-Hans-CN`. Non-default locale keys must be declared in `languages`; undeclared locale
        keys in metadata, welcome cards, blocks, or endings are rejected with `unsupported_locale`.

        `blocks[].id` and `variables[].id` may be omitted on create and will be generated by the
        server. Provide explicit cuid2 ids when other fields in the same request reference them.
        For normal sequential flow, omit `logicFallback`. It is only valid together with a non-empty
        `logic` array on the same block.
      required:
        - workspaceId
        - name
        - blocks
      properties:
        workspaceId:
          type: string
          format: cuid2
          description: Workspace where the survey will be created. Requires read/write access.
        name:
          type: string
          minLength: 1
        type:
          type: string
          enum:
            - link
            - app
          default: link
          description: |
            Survey type. `link` surveys are distributed by URL; `app` surveys are shown in-app and configure their runtime behavior via the `distribution` and `targeting` objects. `type` is immutable after creation (it cannot be changed via PATCH).
        status:
          type: string
          enum:
            - draft
            - inProgress
            - paused
            - completed
          default: draft
        metadata:
          allOf:
            - $ref: '#/components/schemas/SurveyMetadata'
          default: {}
        defaultLanguage:
          allOf:
            - $ref: '#/components/schemas/LocaleCode'
          default: en-US
          description: Default authoring locale. Translatable maps must include this locale key.
        languages:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/CreateSurveyLanguage'
          description: |
            Optional survey language configuration. Every non-default locale used by translatable maps
            must be declared here; omitted languages are not inferred from map keys.
        welcomeCard:
          allOf:
            - $ref: '#/components/schemas/SurveyWelcomeCard'
          default:
            enabled: false
        blocks:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CreateSurveyBlock'
        endings:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/SurveyEnding'
        hiddenFields:
          allOf:
            - $ref: '#/components/schemas/SurveyHiddenFields'
          default:
            enabled: false
        variables:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/CreateSurveyVariable'
        distribution:
          allOf:
            - $ref: '#/components/schemas/SurveyDistribution'
          description: App-survey runtime/display settings. Only valid when `type` is `app`.
        targeting:
          allOf:
            - $ref: '#/components/schemas/SurveyTargeting'
          description: App-survey contact targeting. Only valid when `type` is `app`.
      additionalProperties: false
    SurveyLanguage:
      type: object
      description: |
        Language configured for this survey. GET responses expose the server-emitted code/tag used as the
        translatable map key. Existing surveys can use region-qualified, language-only, or script-only codes.
        Disabled languages can still be read by the management API so unfinished translations can be completed.
      required:
        - code
        - default
        - enabled
      properties:
        code:
          type: string
          description: Server-emitted survey language code/tag used as the translatable map key.
          example: en-US
        alias:
          type:
            - string
            - 'null'
          description: Optional configured alias accepted by `?lang` for compatibility and agent discovery.
          example: english
        default:
          type: boolean
          description: Whether this is the default authoring language.
        enabled:
          type: boolean
          description: Whether this language is enabled for respondent-facing delivery.
    SurveyBlock:
      type: object
      description: |
        Block-based survey section. Block ids are stable public identifiers. Logic and fallbacks can
        jump to block ids or ending ids, so clients and agents should preserve ids unless intentionally
        creating/deleting a block.
      required:
        - id
        - name
        - elements
      properties:
        id:
          type: string
          format: cuid2
          description: Stable block id.
        name:
          type: string
          minLength: 1
        elements:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SurveyElement'
        logic:
          type: array
          items:
            $ref: '#/components/schemas/SurveyBlockLogic'
        logicFallback:
          type: string
          format: cuid2
          description: |
            Block or ending id used when no logic condition matches. Only valid when this same block
            has at least one `logic` rule; omit it for normal sequential flow.
        buttonLabel:
          $ref: '#/components/schemas/TranslatableText'
        backButtonLabel:
          $ref: '#/components/schemas/TranslatableText'
      additionalProperties: false
    SurveyNumberVariable:
      type: object
      description: |
        Number variable. Used by `calculate` logic actions with numeric operators such as `add`,
        `subtract`, `multiply`, `divide`, or `assign`.
      required:
        - id
        - name
        - type
        - value
      properties:
        id:
          type: string
          format: cuid2
          description: Stable variable id referenced from logic.
        name:
          type: string
          pattern: ^[a-z0-9_]+$
          description: |
            Unique variable name. `pattern` is the charset of a *stored* name; a newly declared one is held to more than that, and the extra rules split into two groups that behave differently.

            **400 `forbidden_identifier`, grandfathered.** A new name must match `^[a-z][a-z0-9_]*$` (no leading digit or underscore) and must not take a reserved name — the link-survey system params and internal ids (`userId`, `source`, `suid`, `end`, `start`, `welcomeCard`, `hidden`, `verifiedEmail`, `multiLanguage`, `embed`, `verify`, `suToken`, `lang`, `preview`, `startAt`, `skipPrefilled`, `offlineSupport`) or an auto-captured system field name (`country`, `browser`, `deviceType`, …; `SurveyHiddenFields` carries the full list, and the two sets are the same there). Names the survey already declares are grandfathered against these, so re-sending an existing document never trips them.

            **400 `duplicate_identifier`, not grandfathered.** A variable name that collides case-insensitively with a hidden field id on the same survey. This is checked by reference validation over the whole merged document rather than against the incoming names, so a survey that already holds such a clash is refused on **every** patch — including one that touches neither collection — until one side is renamed.
        type:
          type: string
          enum:
            - number
        value:
          type: number
          description: Default numeric value.
      additionalProperties: false
    SurveyTextVariable:
      type: object
      description: |
        Text variable. Used by `calculate` logic actions with text operators such as `assign` or `concat`.
      required:
        - id
        - name
        - type
        - value
      properties:
        id:
          type: string
          format: cuid2
          description: Stable variable id referenced from logic.
        name:
          type: string
          pattern: ^[a-z0-9_]+$
          description: |
            Unique variable name. `pattern` is the charset of a *stored* name; a newly declared one is held to more than that, and the extra rules split into two groups that behave differently.

            **400 `forbidden_identifier`, grandfathered.** A new name must match `^[a-z][a-z0-9_]*$` (no leading digit or underscore) and must not take a reserved name — the link-survey system params and internal ids (`userId`, `source`, `suid`, `end`, `start`, `welcomeCard`, `hidden`, `verifiedEmail`, `multiLanguage`, `embed`, `verify`, `suToken`, `lang`, `preview`, `startAt`, `skipPrefilled`, `offlineSupport`) or an auto-captured system field name (`country`, `browser`, `deviceType`, …; `SurveyHiddenFields` carries the full list, and the two sets are the same there). Names the survey already declares are grandfathered against these, so re-sending an existing document never trips them.

            **400 `duplicate_identifier`, not grandfathered.** A variable name that collides case-insensitively with a hidden field id on the same survey. This is checked by reference validation over the whole merged document rather than against the incoming names, so a survey that already holds such a clash is refused on **every** patch — including one that touches neither collection — until one side is renamed.
        type:
          type: string
          enum:
            - text
        value:
          type: string
          description: Default text value.
      additionalProperties: false
    SurveyVariable:
      oneOf:
        - $ref: '#/components/schemas/SurveyNumberVariable'
        - $ref: '#/components/schemas/SurveyTextVariable'
      description: |
        Survey variable. Variable ids are stable references used by logic and calculation actions.
        Variable names are human-readable labels and must be unique within the survey.
    SurveyResource:
      type: object
      required:
        - id
        - workspaceId
        - createdAt
        - updatedAt
        - archivedAt
        - name
        - type
        - status
        - metadata
        - defaultLanguage
        - languages
        - welcomeCard
        - blocks
        - endings
        - hiddenFields
        - variables
      properties:
        id:
          type: string
        workspaceId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        archivedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: Soft-delete/archive marker (ISO 8601); `null` when the survey is active.
        name:
          type: string
        type:
          type: string
          enum:
            - link
            - app
            - website
            - web
        status:
          type: string
          enum:
            - draft
            - inProgress
            - paused
            - completed
        metadata:
          anyOf:
            - $ref: '#/components/schemas/SurveyMetadata'
            - type: 'null'
        defaultLanguage:
          type: string
          description: Emitted language code/tag for the survey default language. The internal `default` translation key is never exposed.
        languages:
          type: array
          items:
            $ref: '#/components/schemas/SurveyLanguage'
        welcomeCard:
          $ref: '#/components/schemas/SurveyWelcomeCard'
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/SurveyBlock'
        endings:
          type: array
          items:
            $ref: '#/components/schemas/SurveyEnding'
        hiddenFields:
          $ref: '#/components/schemas/SurveyHiddenFields'
        variables:
          type: array
          items:
            $ref: '#/components/schemas/SurveyVariable'
        distribution:
          allOf:
            - $ref: '#/components/schemas/SurveyDistribution'
          description: App-survey runtime/display settings. Present only for app surveys; omitted for link surveys.
        targeting:
          allOf:
            - $ref: '#/components/schemas/SurveyTargeting'
          description: App-survey contact targeting. Present only for app surveys; omitted for link surveys.
    AISurveyGenerationLocaleCode:
      type: string
      enum:
        - de-DE
        - en-US
        - es-ES
        - fr-FR
        - hu-HU
        - ja-JP
        - nl-NL
        - pt-BR
        - pt-PT
        - ro-RO
        - ru-RU
        - sv-SE
        - tr-TR
        - zh-Hans-CN
        - zh-Hant-TW
      description: Supported app locale code that AI survey creation can return.
      example: en-US
    GenerateSurveyRequest:
      type: object
      description: |
        AI survey creation request. `prompt` is used only to create a draft payload; it is not
        persisted by this endpoint. The generated payload is validated and returned to the caller for
        a separate create request.
      required:
        - workspaceId
        - prompt
      properties:
        workspaceId:
          type: string
          format: cuid2
          description: Workspace where the AI-created survey draft would be created. Requires read/write access.
        prompt:
          type: string
          minLength: 4
          maxLength: 1200
          description: |
            Natural-language survey goal and audience. Prompts with fewer than 24 characters or fewer
            than four whitespace-separated words return prompt feedback before any AI provider call.
        type:
          type: string
          enum:
            - link
            - app
          default: link
          description: Survey type to generate. The AI generates the survey content (blocks/questions) for both types; for `app` it additionally seeds a default `distribution` (display once, no triggers, no targeting) that you finish configuring before publishing.
        language:
          $ref: '#/components/schemas/AISurveyGenerationLocaleCode'
          description: |
            Preferred survey language. Session clients should send the logged-in user's language.
            The generator uses it when the prompt language is ambiguous or cannot be confidently
            matched to a supported app locale.
      additionalProperties: false
    GeneratedSurveyValidationLanguage:
      type: object
      required:
        - code
        - default
        - enabled
      properties:
        code:
          $ref: '#/components/schemas/AISurveyGenerationLocaleCode'
        default:
          type: boolean
        enabled:
          type: boolean
      additionalProperties: false
    GeneratedSurveyValidationResult:
      type: object
      required:
        - valid
        - invalid_params
        - languages
      properties:
        valid:
          type: boolean
          description: Whether the generated create payload passed the same v3 create preparation pipeline.
        invalid_params:
          type: array
          description: Repairable validation errors. Successful generate responses return an empty array.
          items:
            $ref: '#/components/schemas/InvalidParam'
        languages:
          type: array
          description: Languages that the generated create payload would connect or create.
          items:
            $ref: '#/components/schemas/GeneratedSurveyValidationLanguage'
      additionalProperties: false
    GenerateSurveyResult:
      type: object
      required:
        - language
        - payload
        - validation
      properties:
        language:
          $ref: '#/components/schemas/AISurveyGenerationLocaleCode'
          description: Supported app locale used for the AI-created survey content and create payload language maps.
        payload:
          allOf:
            - $ref: '#/components/schemas/CreateSurveyRequest'
          description: |
            Strict create payload ready for `POST /api/v3/surveys`. It always has `status: draft`.
        validation:
          $ref: '#/components/schemas/GeneratedSurveyValidationResult'
      additionalProperties: false
    ValidateSurveyCreateRequest:
      type: object
      required:
        - operation
        - data
      properties:
        operation:
          type: string
          enum:
            - create
        data:
          description: Intended create payload. Invalid documents are allowed so the endpoint can return repairable validation errors.
          anyOf:
            - $ref: '#/components/schemas/CreateSurveyRequest'
            - type: object
              additionalProperties: true
      additionalProperties: false
    PatchSurveyRequest:
      type: object
      minProperties: 1
      description: |
        Patch payload shape. Top-level fields are partial; any provided nested object or array
        fully replaces that subtree. Omitted top-level fields are preserved. Immutable/system fields
        such as `id`, `workspaceId`, `type`, `defaultLanguage`, timestamps, `questions`, analytics, styling,
        and scripts are rejected. App surveys (stored `type: app`) additionally accept `distribution` and `targeting`; both are rejected for link surveys, and changing `targeting` filters requires the Contacts entitlement.

        `metadata`, `languages`, `welcomeCard`, `blocks`, `endings`, `hiddenFields`, and `variables`
        replace their full top-level value when provided. Missing ids in replaced arrays are deletions.
        Non-default locale keys in translatable maps must be declared in `languages`; undeclared locale
        keys are rejected with `unsupported_locale`. To remove a language, remove it from both
        `languages` and every translatable map that contains that locale key.
        Use `/api/v3/surveys/validate` with `operation: patch` before committing automated or agentic
        changes.
      properties:
        name:
          type: string
          minLength: 1
        status:
          type: string
          enum:
            - draft
            - inProgress
            - paused
            - completed
        metadata:
          allOf:
            - $ref: '#/components/schemas/SurveyMetadata'
        languages:
          type: array
          items:
            $ref: '#/components/schemas/CreateSurveyLanguage'
          description: |
            Replaces the survey language configuration. The default language cannot be changed through
            PATCH; any `default: true` entry must match the existing default language. Languages referenced
            by `metadata`, `welcomeCard`, `blocks`, or `endings` translatable maps must be explicitly
            declared here, so remove the locale key from those maps as well when intentionally removing
            a language.
        welcomeCard:
          $ref: '#/components/schemas/SurveyWelcomeCard'
        blocks:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SurveyBlock'
        endings:
          type: array
          items:
            $ref: '#/components/schemas/SurveyEnding'
        hiddenFields:
          $ref: '#/components/schemas/SurveyHiddenFields'
        variables:
          type: array
          items:
            $ref: '#/components/schemas/SurveyVariable'
        distribution:
          allOf:
            - $ref: '#/components/schemas/SurveyDistribution'
          description: |
            App-survey runtime/display settings. Only valid for stored `type: app`. Replaces the full distribution; omitted scalars reset to their defaults.
        targeting:
          allOf:
            - $ref: '#/components/schemas/SurveyTargeting'
          description: App-survey contact targeting. Only valid for stored app surveys.
      additionalProperties: false
    ValidateSurveyPatchRequest:
      type: object
      required:
        - operation
        - surveyId
        - data
      properties:
        operation:
          type: string
          enum:
            - patch
        surveyId:
          type: string
          format: cuid2
        data:
          description: Intended patch payload. Invalid documents are allowed so the endpoint can return repairable validation errors.
          anyOf:
            - $ref: '#/components/schemas/PatchSurveyRequest'
            - type: object
              additionalProperties: true
      additionalProperties: false
    ValidateSurveyRequest:
      oneOf:
        - $ref: '#/components/schemas/ValidateSurveyCreateRequest'
        - $ref: '#/components/schemas/ValidateSurveyPatchRequest'
      discriminator:
        propertyName: operation
        mapping:
          create: '#/components/schemas/ValidateSurveyCreateRequest'
          patch: '#/components/schemas/ValidateSurveyPatchRequest'
    SurveyValidationLanguage:
      type: object
      required:
        - code
        - default
        - enabled
        - writeBehavior
      properties:
        code:
          $ref: '#/components/schemas/LocaleCode'
        default:
          type: boolean
        enabled:
          type: boolean
        writeBehavior:
          type: string
          enum:
            - connect_or_create
          description: Validation is read-only; a real write would connect an existing language or create it if missing.
      additionalProperties: false
    SurveyValidationResult:
      type: object
      required:
        - valid
        - operation
        - invalid_params
      properties:
        valid:
          type: boolean
          description: Whether the submitted survey document is valid.
        operation:
          type: string
          enum:
            - create
            - patch
        invalid_params:
          type: array
          description: Repairable validation errors using document-relative paths.
          items:
            $ref: '#/components/schemas/InvalidParam'
        languages:
          type: array
          description: Languages that a successful write would connect or create. Present only when `valid=true`.
          items:
            $ref: '#/components/schemas/SurveyValidationLanguage'
      additionalProperties: false
    ResponseResolution:
      type: object
      description: |
        Receipt describing how `answers[]` and `embeddedData[]` labels were produced. It exists so a consumer can tell whether the labels it is reading are the wording the respondent actually saw.
      required:
        - labelPolicy
        - labelsLanguage
        - surveyUpdatedAt
      properties:
        labelPolicy:
          type: string
          enum:
            - currentSurveyDefinition
          description: |
            Where labels came from. Today the only value is `currentSurveyDefinition`: labels are resolved at **read time** against the survey as it stands now. Nothing about the survey is snapshotted when a response is written and there is no survey-version model, so a response collected under an older headline reads back under today's wording — text the respondent may never have seen. Typeform, SurveyMonkey, Qualtrics, Google Forms and Jotform all behave this way, so this is the industry norm rather than a shortcut. Compare `surveyUpdatedAt` against the response's `createdAt` to detect that the definition moved after collection. If a write-time label snapshot ever ships, a second value `asAsked` is added here and consumers branch on it — treat this as an open enum.
        labelsLanguage:
          type:
            - string
            - 'null'
          description: The language the labels in this payload were resolved in. Follows the response's `language` when it is set and the survey has that language enabled, otherwise the survey's default language. `null` when the survey carries no translations.
        surveyUpdatedAt:
          type: string
          format: date-time
          description: When the survey definition was last modified. Later than the response's `createdAt` means the wording in `elementLabel` may have drifted from what was asked.
      additionalProperties: false
    ResponseAnswerBase:
      type: object
      description: Fields every answer carries, whatever the element type. `elementType` selects the value-bearing shape — see `ResponseAnswer`.
      required:
        - position
        - elementId
        - elementType
        - elementLabel
      properties:
        position:
          type: integer
          minimum: 1
          description: 1-based position of the element in the current survey definition, so a consumer can present answers in survey order without fetching the survey. Elements the respondent never reached are absent from `answers[]` entirely rather than present-and-empty.
        elementId:
          type: string
          description: Stable element id, as authored on the survey.
        elementType:
          type: string
          enum:
            - openText
            - multipleChoiceSingle
            - multipleChoiceMulti
            - nps
            - rating
            - csat
            - ces
            - consent
            - pictureSelection
            - cta
            - date
            - fileUpload
            - cal
            - matrix
            - address
            - ranking
            - contactInfo
          description: The element's type in the current survey definition. Matches the `type` of the corresponding `SurveyElement`.
        elementLabel:
          type: string
          description: The element's headline, resolved in `resolution.labelsLanguage`. Read at request time from the current definition — see `ResponseResolution` for what that means for older responses.
        durationSeconds:
          type: number
          minimum: 0
          maximum: 86400
          description: |
            Seconds the respondent spent on this element. Converted from the stored per-element time-to-complete, which is recorded in milliseconds. This telemetry is reported by the client and is therefore not trustworthy input: treat it as an indication rather than a measurement. Absent when the submission carried no timing for this element.

            The bounds hold on **every** row, including ones collected before the write-side clamp shipped. The stored representation is deliberately unbounded so that historical data still parses, and a row written then can hold a negative value or a tab left open for days; those are clamped into range on read rather than returned as-is, because a schema a real row violates is worse than a slightly blunted outlier. So `86400` means "at least 24 hours", not exactly.
    ResponseAnswerText:
      allOf:
        - $ref: '#/components/schemas/ResponseAnswerBase'
        - type: object
          required:
            - valueText
          properties:
            elementType:
              type: string
              enum:
                - openText
            valueText:
              type: string
              description: The submitted text, verbatim.
            inputType:
              type: string
              enum:
                - text
                - email
                - url
                - number
                - phone
              description: The element's configured input type in the current definition. Useful for rendering and for knowing how the value was validated at collection time; the value itself is always returned as a string, including for `number`.
      unevaluatedProperties: false
      description: Free-text answer to an `openText` element.
    ResponseAnswerNumber:
      allOf:
        - $ref: '#/components/schemas/ResponseAnswerBase'
        - type: object
          required:
            - valueNumber
            - range
          properties:
            elementType:
              type: string
              enum:
                - nps
                - rating
                - csat
                - ces
            valueNumber:
              type: number
              description: The submitted score.
            range:
              type: object
              description: The scale the score was collected on, from the current definition. Returned because a bare `8` is uninterpretable without it, and because scales are editable — a consumer comparing scores across time needs to see that the range moved.
              required:
                - min
                - max
              properties:
                min:
                  type: number
                max:
                  type: number
              additionalProperties: false
            scale:
              type: string
              enum:
                - number
                - smiley
                - star
              description: How the scale was presented. Carried by the element types that configure one — `rating`, `csat` and `ces` — and absent for `nps`, which has no scale presentation.
      unevaluatedProperties: false
      description: Numeric-scale answer. Covers `nps` (0–10), `rating` (configurable range and presentation), `csat` and `ces`.
    ResponseAnswerBoolean:
      allOf:
        - $ref: '#/components/schemas/ResponseAnswerBase'
        - type: object
          required:
            - valueBoolean
            - rawValue
          properties:
            elementType:
              type: string
              enum:
                - consent
                - cta
            valueBoolean:
              type: boolean
              description: Whether the respondent accepted (`consent`) or clicked through (`cta`). Derived from the stored token, which is why `rawValue` is returned alongside it.
            rawValue:
              type: string
              description: The token as stored — conventionally `accepted` for `consent` and `clicked` for `cta`. Returned because the boolean is a derivation and this is the underlying fact.
      unevaluatedProperties: false
      description: Acknowledgement answer. Covers `consent` (accepted) and `cta` (clicked through). A `cta` element the respondent skipped has no entry in `answers[]` at all.
    ResponseValueMatch:
      type: string
      enum:
        - exact
        - label
        - other
        - unmatched
      description: |
        How a stored raw value was resolved against the current survey definition. Precedence is fixed and applied in this order:

        - `exact` — the stored value matched an option **id** in the current definition.
        - `label` — the stored value matched an option's **label text** (ids are stable, labels are
          editable and language-dependent, so a label match is weaker evidence).

        - `other` — the value arrived through the element's **Other** free-text input. Only reported when
          the element actually has that input enabled and the value was submitted through it.

        - `unmatched` — no option resolves. The raw value is still returned; it is **not** silently
          reclassified as `other`, because a *renamed* option is also unmatched text and filing it as a
          write-in would misattribute the answer.
    ResponseSelection:
      type: object
      description: |
        One selected option within a choice-style answer. `optionId` plus `rawValue` is deliberately a two-field split — the same split the Hub stores as `value_id` plus `value_text` — because option ids are stable while labels are editable and language-dependent. Consumers that need to group or compare across time should key on `optionId`; consumers rendering to a human should use `optionLabel`.
      required:
        - optionId
        - optionLabel
        - rawValue
        - match
      properties:
        optionId:
          type:
            - string
            - 'null'
          description: Resolved option id, or the literal `other` for a write-in. `null` when `match` is `unmatched`.
        optionLabel:
          type:
            - string
            - 'null'
          description: Option label in the resolved language. `null` when `match` is `unmatched`.
        rawValue:
          type: string
          description: 'The value as stored on the response, verbatim and before resolution — always present, and the string to use when rebuilding the stored map. Note what is stored differs by element type: `multipleChoiceSingle`, `multipleChoiceMulti` and `ranking` store the option **label** in the respondent''s language, while `pictureSelection` stores the option **id**. `""` occurs when the respondent selected Other and left it blank, and is returned rather than dropped.'
        match:
          $ref: '#/components/schemas/ResponseValueMatch'
        rank:
          type: integer
          minimum: 1
          description: 1-based rank, present only for `ranking` elements. Array order already reflects the rank; this field makes it explicit so consumers need not rely on ordering.
      additionalProperties: false
    ResponseAnswerSelection:
      allOf:
        - $ref: '#/components/schemas/ResponseAnswerBase'
        - type: object
          required:
            - selections
          properties:
            elementType:
              type: string
              enum:
                - multipleChoiceSingle
                - multipleChoiceMulti
                - pictureSelection
                - ranking
            selections:
              type: array
              description: The chosen options, resolved against the current definition. Always an array, including for `multipleChoiceSingle`, so consumers need one code path rather than two. For `ranking`, the array is in rank order and each entry also carries an explicit `rank`.
              items:
                $ref: '#/components/schemas/ResponseSelection'
      unevaluatedProperties: false
      description: Choice-style answer. Covers `multipleChoiceSingle`, `multipleChoiceMulti`, `pictureSelection` and `ranking`. See `ResponseValueMatch` for how each selection was resolved and why an unresolvable value is never reclassified as a write-in.
    ResponseAnswerDate:
      allOf:
        - $ref: '#/components/schemas/ResponseAnswerBase'
        - type: object
          required:
            - valueDate
          properties:
            elementType:
              type: string
              enum:
                - date
            valueDate:
              type: string
              description: The submitted date as stored, an ISO-8601 date or date-time string. No `format` is asserted because historical rows were written by several client versions and the stored precision varies; parse defensively.
      unevaluatedProperties: false
      description: Date answer.
    ResponseAnswerFileUpload:
      allOf:
        - $ref: '#/components/schemas/ResponseAnswerBase'
        - type: object
          required:
            - fileUrls
          properties:
            elementType:
              type: string
              enum:
                - fileUpload
            fileUrls:
              type: array
              description: |
                The uploaded files, **as stored** — workspace-relative paths, not absolute URLs, and neither resolved nor signed.

                A deliberate choice between two things this field could be. Storage writes a relative path and the app's own read paths rewrite it to an absolute URL for display; v3 returns the stored bytes instead, because `answers[]` promises verbatim values a client can write straight back, and an absolute URL is neither what is stored nor what a write accepts. Fetching a file is a separate concern with its own ticket (ENG-513, signed short-lived URLs behind a dedicated endpoint); this field identifies the file, it does not serve it.

                Not publicly fetchable in any case: access follows the same authorization as the response, and deleting the response deletes the underlying files.
              items:
                type: string
            fileCount:
              type: integer
              minimum: 0
              description: Convenience count of `fileUrls`, so a list consumer need not materialize the array.
      unevaluatedProperties: false
      description: File-upload answer.
    ResponseAnswerBooking:
      allOf:
        - $ref: '#/components/schemas/ResponseAnswerBase'
        - type: object
          required:
            - booked
            - rawValue
          properties:
            elementType:
              type: string
              enum:
                - cal
            booked:
              type: boolean
              description: Whether the respondent completed a booking.
            rawValue:
              type: string
              description: The token as stored, verbatim — conventionally `booked`. Required, like the equivalent field on `consent` and `cta`, because `booked` is a derivation and this is the underlying value a client needs to rebuild the stored map.
      unevaluatedProperties: false
      description: Scheduling answer for a `cal` element. Only the fact of the booking is recorded on the response; the meeting itself lives in the scheduling provider and is not proxied by this API.
    ResponseAnswerMatrix:
      allOf:
        - $ref: '#/components/schemas/ResponseAnswerBase'
        - type: object
          required:
            - rows
          properties:
            elementType:
              type: string
              enum:
                - matrix
            rows:
              type: array
              description: One entry per row the respondent answered. Rows left blank are omitted rather than returned with a null column. Both sides of a matrix cell need resolving against the current definition, so each entry reports its own `match` — see `ResponseValueMatch`.
              items:
                type: object
                required:
                  - rawKey
                  - rowLabel
                  - rawValue
                  - columnLabel
                  - match
                properties:
                  rawKey:
                    type: string
                    description: The stored map key for this row, verbatim. Matrix answers are stored keyed by the **localized row label** in the respondent's language, not by row id — so this is the string to use when rebuilding the stored object, and it is not necessarily equal to `rowLabel`, which is resolved in the *current* definition's language.
                  rowId:
                    type:
                      - string
                      - 'null'
                    description: Row id resolved from the current definition, or `null` when the stored key matches no current row. Derived, never stored.
                  rowLabel:
                    type: string
                    description: Row label in the resolved language. Falls back to `rawKey` when the row no longer resolves.
                  columnId:
                    type:
                      - string
                      - 'null'
                    description: Column id resolved from the current definition, or `null` when it no longer resolves. Derived, never stored.
                  columnLabel:
                    type:
                      - string
                      - 'null'
                    description: Column label in the resolved language. `null` when `match` is `unmatched`.
                  rawValue:
                    type: string
                    description: The selected column as stored, verbatim — the localized column label, not a column id. This is the value to use when rebuilding the stored object.
                  match:
                    $ref: '#/components/schemas/ResponseValueMatch'
                additionalProperties: false
      unevaluatedProperties: false
      description: Matrix answer — one selected column per answered row.
    ResponseAnswerComposite:
      allOf:
        - $ref: '#/components/schemas/ResponseAnswerBase'
        - type: object
          required:
            - fields
          properties:
            elementType:
              type: string
              enum:
                - address
                - contactInfo
            fields:
              type: array
              description: |
                The element's sub-fields, **every slot, in storage order**, including ones the respondent left blank (`valueText: ""`). Blanks are returned rather than omitted because the stored value is a positional fixed-length array — `address` has 6 slots, `contactInfo` has 5 — so dropping an empty slot would shift every later value onto the wrong field and make the stored array impossible to rebuild.
              items:
                type: object
                required:
                  - slot
                  - fieldId
                  - fieldLabel
                  - valueText
                properties:
                  slot:
                    type: integer
                    minimum: 0
                    description: 0-based index of this sub-field in the stored array. Reconstruct the stored value by ordering on this and taking `valueText`.
                  fieldId:
                    type: string
                    enum:
                      - addressLine1
                      - addressLine2
                      - city
                      - state
                      - zip
                      - country
                      - firstName
                      - lastName
                      - email
                      - phone
                      - company
                    description: Stable sub-field id. `address` uses `addressLine1`, `addressLine2`, `city`, `state`, `zip`, `country` in that order; `contactInfo` uses `firstName`, `lastName`, `email`, `phone`, `company`.
                  fieldLabel:
                    type: string
                    description: Sub-field label in the resolved language.
                  valueText:
                    type: string
                    description: The submitted value, verbatim. `""` when the respondent left it blank.
                additionalProperties: false
      unevaluatedProperties: false
      description: Composite answer whose value is a set of labelled sub-fields. Covers `address` and `contactInfo`. Stored as a positional array of strings, which is why every slot is reported.
    ResponseAnswer:
      oneOf:
        - $ref: '#/components/schemas/ResponseAnswerText'
        - $ref: '#/components/schemas/ResponseAnswerNumber'
        - $ref: '#/components/schemas/ResponseAnswerBoolean'
        - $ref: '#/components/schemas/ResponseAnswerSelection'
        - $ref: '#/components/schemas/ResponseAnswerDate'
        - $ref: '#/components/schemas/ResponseAnswerFileUpload'
        - $ref: '#/components/schemas/ResponseAnswerBooking'
        - $ref: '#/components/schemas/ResponseAnswerMatrix'
        - $ref: '#/components/schemas/ResponseAnswerComposite'
      discriminator:
        propertyName: elementType
        mapping:
          openText: '#/components/schemas/ResponseAnswerText'
          nps: '#/components/schemas/ResponseAnswerNumber'
          rating: '#/components/schemas/ResponseAnswerNumber'
          csat: '#/components/schemas/ResponseAnswerNumber'
          ces: '#/components/schemas/ResponseAnswerNumber'
          consent: '#/components/schemas/ResponseAnswerBoolean'
          cta: '#/components/schemas/ResponseAnswerBoolean'
          multipleChoiceSingle: '#/components/schemas/ResponseAnswerSelection'
          multipleChoiceMulti: '#/components/schemas/ResponseAnswerSelection'
          pictureSelection: '#/components/schemas/ResponseAnswerSelection'
          ranking: '#/components/schemas/ResponseAnswerSelection'
          date: '#/components/schemas/ResponseAnswerDate'
          fileUpload: '#/components/schemas/ResponseAnswerFileUpload'
          cal: '#/components/schemas/ResponseAnswerBooking'
          matrix: '#/components/schemas/ResponseAnswerMatrix'
          address: '#/components/schemas/ResponseAnswerComposite'
          contactInfo: '#/components/schemas/ResponseAnswerComposite'
      description: |
        One answer, carrying the element's id, its label, its type and its value. `elementType` selects the shape: switch on it rather than probing for which value field is present.

        Answers are a **typed array**, not a map keyed by element id, because a consumer holding only a response would otherwise see bare ids and have to fetch the survey and join to learn what was asked — a join that is easy to get wrong and that agent clients cannot make cheaply. The array also separates answers from hidden fields and variables, which the stored representation mixes into one flat map. Non-answer data lives in `embeddedData[]`.

        Several element types share a value shape and therefore a schema — the four numeric scales, the four choice styles, the two composites. All seventeen element types are covered.

        Only elements the respondent actually reached appear here. Data whose element has since been deleted appears in `unresolved[]` instead.
    ResponseEmbeddedDatum:
      type: object
      description: |
        One piece of non-answer data carried by the response. Survey **variables**, **hidden fields** and **auto-captured context** are one concept here rather than three parallel ones: they all have a key, a provenance, a declared type and a label, and consumers treat them alike.

        Auto-captured (`reserved`) entries are drawn from the Embedded Data field catalog, which declares a privacy policy per field (`keep` / `drop` / `redactQuery`). Two of those act **before** this API sees the response, and one is a rule this API adds:

        - `drop` is an **ingest-time** policy, not a filter applied here: when the survey has "Anonymize
          responses" enabled the field is never captured, so it is absent from the response for every
          consumer. With anonymization off it is captured and appears here normally.

        - `redactQuery` is applied on **every** read, anonymization or not — `url` and `pageReferrer` carry
          their query string stripped.

        - `ipAddress` is **never** projected by this API, in any view. That is a v3 rule rather than a
          catalog behaviour: the catalog reads the field, and the dashboard shows it. Do not infer the same
          suppression for the other `drop` fields.


        Where a survey's own field and a catalog entry share a name, both appear — the declared one as `ingested` or `computed`, the auto-captured one as `reserved` — and `kind` is what tells them apart. Neither shadows the other, because each is a real value the response carries and dropping one would hide data the author can see elsewhere.

        Which catalog entries appear at all is a third axis, `display`, and this collection carries the ones that are not `none`. The `none` set is the response's own identity and timing — `responseId`, `surveyId`, `finished`, `language`, `durationSeconds`, `startedAt`, `finishedAt` — every one of which is already a first-class field on the response. Without that filter they would each appear twice in the same payload, once at the top level and once here.
      required:
        - key
        - kind
        - type
        - label
        - value
      properties:
        key:
          type: string
          description: |
            The field's **name** — what an author calls it, and the key `embeddedData` on a write accepts.

            Not the storage key. A hidden field happens to be stored under its name and a variable under its cuid, and that split is a property of the storage layout rather than of the field; exposing it would publish an internal id and make the writable and readable views of one field disagree on how to address it.

            **Unique per `kind`, not across the collection.** A survey created before the reserved names were enforced can declare a hidden field called `country`, and the auto-captured `country` still exists — so the same name can appear once as `ingested` and once as `reserved`. That set is finite and no longer growing: a new declaration may no longer take a reserved name, or the name of a variable or hidden field the survey already has. Key on `(key, kind)` rather than `key` alone, or read the pair you care about.
        kind:
          type: string
          enum:
            - ingested
            - computed
            - reserved
          description: |
            Provenance of the value:

            - `ingested` — supplied by the caller or the embedding page (hidden fields).
            - `computed` — derived during the submission by survey logic (variables).
            - `reserved` — auto-captured context from the submission environment (for example `country`,
              `deviceType`), drawn from the Embedded Data field catalog.
        type:
          type: string
          enum:
            - string
            - number
            - boolean
            - date
          description: Declared type of `value`, so a consumer need not infer it. `computed` entries are only ever `string` or `number`, because survey variables are typed that narrowly.
        label:
          type: string
          description: Human-readable name for the key, in the resolved language where one exists.
        value:
          oneOf:
            - type: string
            - type: number
            - type: boolean
          description: |-
            The value, matching `type`. `date` values are ISO-8601 strings.

            Always a scalar. A legacy row can hold an array or an object under a declared field's key — the ingest contract refuses those now, but older rows have them — and such a value resolves to nothing rather than being coerced, so the entry is omitted here and reported in `unresolved[]` with the bytes intact. Nothing is silently dropped, and no `type` would describe an array anyway.

            There is no `null` member: a declared key that resolves to nothing is **omitted** from the collection rather than carried with a null. So `embeddedData[]` enumerates what the response actually holds, not what the survey declares — a survey with twelve declared fields and two filled in yields two entries. A field with a default value is never unset, since the default is the fallback before the key is considered missing.
      additionalProperties: false
    ResponseUnresolvedEntry:
      type: object
      description: |
        Stored data whose element no longer exists in the survey definition. Deleting an element leaves its answers behind on already-collected responses and nothing cleans them up, so the payload reports them here instead of dropping them silently or faking them into `answers[]` without a type or a label. Consumers doing analysis can ignore this array; consumers doing export or migration should not.
      required:
        - key
        - rawValue
        - reason
      properties:
        key:
          type: string
          description: The key as stored on the response — usually a former element id or hidden-field key.
        rawValue:
          description: The stored value, returned verbatim and untyped because nothing describes it any more.
          oneOf:
            - type: string
            - type: number
            - type: array
              items:
                type: string
            - type: object
              additionalProperties:
                type: string
        reason:
          type: string
          enum:
            - elementNotInSurvey
            - hiddenFieldNotInSurvey
            - variableNotInSurvey
            - valueShapeMismatch
          description: |
            Why the entry could not be resolved:

            - `elementNotInSurvey` — no element with this id exists in the current definition.
            - `hiddenFieldNotInSurvey` — the key is not among the survey's declared hidden fields.
            - `variableNotInSurvey` — no variable with this id exists in the current definition.
            - `valueShapeMismatch` — the key resolves to a current element **or a declared Embedded Data
              field**, but the stored value's shape cannot be read as an
              answer of that element's type (for example a string where the element expects a selection
              list). Signals element-type churn rather than deletion.
      additionalProperties: false
    ResponseTag:
      type: object
      description: |
        A tag applied to a response, as a lightweight reference. Deliberately **not** the full `TagResource`: that shape carries a `count` of how many responses hold the tag, which would mean an extra aggregate per tag on every row of every page. Read tags in full — with counts and timestamps — from `GET /api/v3/tags`.
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: cuid2
        name:
          type: string
          description: Tag label as shown in the app.
      additionalProperties: false
    ResponseBase:
      type: object
      description: |
        Fields shared by both response views. Self-describing: `answers[]` carries each element's id, label, type and value, so a consumer can read a response without also fetching the survey.

        Deliberately open — `ResponseListItem` and `ResponseResource` compose this and close themselves, so that the detailed view can add fields without the base rejecting them.
      required:
        - id
        - surveyId
        - surveyName
        - workspaceId
        - createdAt
        - updatedAt
        - finished
        - endingId
        - language
        - resolution
        - answers
        - embeddedData
        - unresolved
        - tags
      properties:
        id:
          readOnly: true
          type: string
          format: cuid2
          description: Response identifier.
        surveyId:
          type: string
          format: cuid2
          description: The survey this response belongs to.
        surveyName:
          readOnly: true
          type: string
          description: The survey's current name, denormalized into the payload so a consumer listing responses need not resolve survey names separately.
        workspaceId:
          readOnly: true
          type: string
          format: cuid2
          description: The owning workspace, resolved through the survey. Responses carry no workspace column of their own; this is a derived field.
        createdAt:
          readOnly: true
          type: string
          format: date-time
          description: |
            When the response was created. **Server-owned** — it cannot be supplied on create or changed by a patch. This is the AIP-148 output-only convention, and it is deliberate on two counts: monthly response metering counts rows by `(surveyId, createdAt)`, and a client-chosen `createdAt` can insert rows into the middle of another consumer's already-paginated stream. Backdating remains available on v1/v2; a dedicated import path is future work.
        updatedAt:
          readOnly: true
          type: string
          format: date-time
          description: When the response was last modified. Server-owned. Neither filterable nor sortable — it has no index, and being mutable it cannot anchor a pagination cursor.
        finished:
          type: boolean
          description: Whether the respondent reached an ending.
        endingId:
          type:
            - string
            - 'null'
          description: The ending card the respondent reached. `null` for unfinished responses.
        language:
          type:
            - string
            - 'null'
          description: The survey language this response was collected in, as a survey language code (not necessarily a BCP-47 locale — `default` is a legitimate value). `null` when the survey is single-language or no language was stamped.
        durationSeconds:
          readOnly: true
          type: number
          minimum: 0
          description: |-
            Total seconds the respondent spent, summed from per-element timing and **excluding** the stored `_total` bucket, which the server maintains alongside real element ids and which would otherwise be double-counted. Absent when the submission carried no timing.

            Summing rather than reading `_total` is deliberate: the stored bucket is only written when a response is finished, so reading it would leave every partial response without a duration even when it carries per-element timing. This is also why the value can differ from the reserved `durationSeconds` catalog entry, which does read the bucket and rounds to whole seconds — that entry is not projected into `embeddedData[]`, so the two never appear side by side.
        resolution:
          readOnly: true
          $ref: '#/components/schemas/ResponseResolution'
        answers:
          readOnly: true
          type: array
          description: One entry per element the respondent reached, in survey order. Empty for a response that recorded no answers.
          items:
            $ref: '#/components/schemas/ResponseAnswer'
        embeddedData:
          readOnly: true
          type: array
          description: Hidden fields, variables and auto-captured context, as one collection. Empty when the response carries none.
          items:
            $ref: '#/components/schemas/ResponseEmbeddedDatum'
        unresolved:
          readOnly: true
          type: array
          description: Stored data whose element or key no longer exists in the survey definition. Empty in the normal case.
          items:
            $ref: '#/components/schemas/ResponseUnresolvedEntry'
        tags:
          type: array
          description: Tags applied to this response, as `{ id, name }` references. Empty when the response is untagged.
          items:
            $ref: '#/components/schemas/ResponseTag'
    ResponseListItem:
      allOf:
        - $ref: '#/components/schemas/ResponseBase'
      unevaluatedProperties: false
      description: |
        A survey response as returned by the list endpoint. Self-describing: `answers[]` carries each element's id, label, type and value, so a consumer can read a response without also fetching the survey.

        `answers[]` and `embeddedData[]` ship on the list view as well as the detailed view — they are the point of the resource, and withholding them from the list would force consumers into an N+1 of item reads. The list view omits only the identity and provenance fields: `contact`, `displayId` and `singleUseId`. See `ResponseResource` for those.
    ResponseDataMap:
      type: object
      description: |
        Answers as stored, **keyed by element id**.

        Hidden-field values do not live here. They are stored in the same underlying map, but that is a storage detail rather than part of this contract: a hidden field is an Embedded Data field, and Embedded Data is addressed by name through `embeddedData`.

        A hidden field's name appearing as a key here is rejected rather than silently written to the wrong namespace — with **422**, not 400, because knowing that a key names a hidden field means loading the survey, and these operations route every failure that needs stored state to 422. The problem carries `invalid_params[]` with `name` set to the offending key, `code: unsupported_field` and `referenceType: hiddenField`, so a client can point at it without parsing prose.

        A key that is **also** an element id is the exception, and it is **accepted**: the answer owns that address. Answers and hidden fields do share one slot, and the older surveys that declare a field named after a question have exactly one value under that key — but it is always the answer's. The field is dropped at ingest with `element_id_collision` (`packages/types/embedded-data-ingest.ts`) and filtered again in the renderer before it can reach a submission, precisely so a display-time field value cannot land on top of what the respondent answered. So on such a survey `answers[]` carries the value, `embeddedData` neither reports it nor accepts a write for it, and refusing the key here would block the only write that fits it.

        New surveys cannot reach that state through the editor or `POST`/`PATCH /api/v3/surveys`, which refuse an element id colliding with a declared field name. Both v1 management survey writes still accept one — that guard reads variable and hidden-field names but never element ids — so this set, unlike the reserved-name one, is still growing.

        Keeping the two apart is what lets the storage layout change underneath — the legacy columns go away eventually — without this contract either following it or breaking a round-trip it promised.

        The value shapes are the stored ones, and they differ by element type. `ResponseAnswer` documents each; `answers[]` on the read is the resolved view of this same map.
      additionalProperties:
        oneOf:
          - type: string
          - type: number
          - type: array
            items:
              type: string
          - type: object
            additionalProperties:
              type: string
    ResponseEmbeddedDataInput:
      type: object
      description: |
        Embedded Data values to write, **keyed by field name**.

        This is the write counterpart of `embeddedData[]` on the read, and it is keyed the way an author names a field rather than the way storage addresses it. A hidden field is stored under its name but a variable is stored under its cuid, and that split is an implementation detail of the storage layout — the server resolves a name to its storage key through the survey's Embedded Data links, so a caller never sees a cuid and never has to know which kind it is writing.

        **Which kinds are writable:**

        - `ingested` (hidden fields) — accepted, through the same ingest contract the SDK uses: the name
          must be declared on the survey, the value is coerced to the field's declared `type`, a `locked`
          field ignores the write, and the whole payload is bounded. A name the survey does not declare is
          a **422** rather than a silent drop — knowing whether a name is declared means loading the
          survey, and these operations route every failure that needs stored state to 422.

        - `computed` (variables) — accepted, because a management caller correcting a response needs to,
          and v1 and v2 both allow it today.

        - `reserved` — refused. Auto-captured context describes the submission environment, and a
          caller-supplied value would be fiction. The three exceptions are `source`, `url` and `action`,
          which `ResponseMetaInput` accepts for exactly the replay case.


        Values follow their field's declared type. A field the payload omits is left as it is; this is a merge over named fields, not a replacement of the collection.

        `null` **clears** a field. Omission and `null` therefore mean different things — leave it alone versus remove its value — which is the only reading that makes a merge-shaped map able to express deletion at all. A cleared field is then absent from `embeddedData[]` on the next read, exactly as one that was never written, and a field whose definition carries a `defaultValue` falls back to that default rather than disappearing.

        **An ambiguous name is refused.** The read says `key` is unique per `kind` rather than across the collection, because a survey predating the reserved-name guard can hold a variable and a hidden field under one name. This map has no `kind`, so on such a survey a name cannot say which field it means — and guessing would write the caller's value into the wrong one. A name that matches more than one declared field is a **422** naming it, for the same reason as an undeclared one; rename one side on the survey to clear it. The set is finite, frozen and tracked, and nothing new can enter it.

        Reserved names collide differently and are not ambiguous: `reserved` is not writable at all, so a name that matches both a declared field and a catalog entry resolves to the declared one.
      additionalProperties:
        oneOf:
          - type: string
          - type: number
          - type: boolean
          - type: 'null'
    ResponseTtcMap:
      type: object
      description: |
        Per-element time-to-complete, keyed by element id, in **milliseconds**. Accepted on create so that a caller replaying a real submission can carry its timing; reads report the same information as `durationSeconds` in seconds, on each answer and summed at the top level.

        This is client-reported telemetry, not a measurement the server can vouch for, so each value is clamped into `[0, 86400000]` (24 hours per element) rather than rejected — a noisy timing value should never cost you the response. Any finite number is therefore accepted, which is why no bounds are declared here.

        **Do not send a `_total` key.** The server writes that bucket itself when the response is finished, by summing every value in this map — including a `_total` you supplied, which is then counted twice and permanently skews the stored total. `durationSeconds` on the read is computed from the real element entries and ignores the bucket entirely, so there is nothing to gain by sending one.
      additionalProperties:
        type: number
    ResponseMetaInput:
      type: object
      description: |
        Submission context, on the narrow subset a caller can legitimately supply. A management-API create has no browser behind it, so unlike a client-side submission there is nothing for the server to auto-capture — if these are not sent they are simply absent, which is why the API accepts them at all rather than treating all context as server-derived.

        Deliberately **not** accepted here, because the routes derive them from the request itself and a caller-supplied value would be fiction: `country`, `userAgent` (the browser/OS/device breakdown is nested under it, there is no top-level `device` key) and `ipAddress`. `ipAddress` is additionally never projected by v3 on read, in any view.

        The stored `meta` is wider than this input. It also carries a block of browser-runtime context — `pagePath`, `pageReferrer`, the five `utm*` keys, the four screen/viewport dimensions, `timezone` and `locale` — which the SDK captures and which this endpoint does **not** currently accept, so sending one is a 400. That is a gap rather than a decision: an integration replaying a real submission can legitimately carry `utmSource` or `pagePath`, and those are live catalog entries that read back in `embeddedData[]`. Whether v3 create accepts them is open on the write ticket.

        Reads surface what is stored as `reserved` entries in `embeddedData[]`.
      properties:
        source:
          type: string
          maxLength: 512
          description: Where the submission came from — the integration or channel name. The field most worth setting on an API create, since nothing else can distinguish an imported or integration-created response from an organic one.
        url:
          type: string
          maxLength: 2048
          description: The page or context the response was collected from.
        action:
          type: string
          maxLength: 512
          description: The action or trigger that produced the submission, when one applies.
      additionalProperties: false
    CreateResponseRequest:
      type: object
      description: |
        Creates a survey response. **This is a real submission**: it runs the full response pipeline — webhooks, integrations, follow-ups, quota evaluation, and Hub ingestion once the response is finished — and it counts against metered monthly responses, exactly as a v1/v2 management create does today. It is not an import primitive; a dedicated import path is future work.

        The workspace is resolved from `surveyId`, so unlike `POST /api/v3/surveys` there is no `workspaceId` in the body — the caller cannot choose which scope it is authorized against.

        Unsupported fields are rejected rather than ignored. Absent by design, each for its own reason:

        - `createdAt` and `updatedAt` are **server-owned** — see `ResponseListItem.createdAt`. This is the
          one capability v3 does not carry over from v2, and it is why bulk historical loading still
          belongs on v2 until a dedicated import path exists.

        - `userId` is not accepted: a contact `userId` is a non-unique **attribute**, not a column, so it
          cannot safely identify who to attribute a response to. Link the contact explicitly with
          `contactId`.

        - `contactAttributes` is not accepted, and never was writable — v1/v2 snapshot it from the linked
          contact. v3 does not expose the snapshot at all; `contact` covers the need.

        - `meta.ipAddress`, and the derived `userAgent` / `country` / `device` family, are not accepted;
          see `ResponseMetaInput` for what is.
      required:
        - surveyId
        - finished
        - data
      properties:
        surveyId:
          type: string
          format: cuid2
          description: The survey to record the response against. Immutable after creation.
        finished:
          type: boolean
          description: 'Whether this response is complete. Creating with `finished: true` fires the finish side of the pipeline immediately, including Hub ingestion.'
        data:
          $ref: '#/components/schemas/ResponseDataMap'
        embeddedData:
          $ref: '#/components/schemas/ResponseEmbeddedDataInput'
        ttc:
          $ref: '#/components/schemas/ResponseTtcMap'
        meta:
          $ref: '#/components/schemas/ResponseMetaInput'
        tags:
          type: array
          uniqueItems: true
          description: Tag ids to apply, so a tagged response can be created in one call rather than a create followed by a patch. Tags must already exist in the same workspace — create them via `POST /api/v3/tags`. Applied in the same transaction as the response.
          items:
            type: string
            format: cuid2
        endingId:
          type:
            - string
            - 'null'
          description: The ending card the respondent reached. Must exist in the survey definition.
        language:
          type:
            - string
            - 'null'
          description: Survey language code to stamp on the response. Must be a language the survey has enabled. Omit for single-language surveys.
        contactId:
          type: string
          format: cuid2
          description: Contact to attribute the response to. **Create-only** — a response cannot later be re-linked to a different contact. Must be a contact in the same workspace.
        displayId:
          type: string
          description: Display (survey impression) this response answers. Create-only. Each display can back at most one response.
        singleUseId:
          type: string
          description: Single-use link id, for surveys configured with single-use links. Create-only, and unique per survey.
      additionalProperties: false
    ResponseContact:
      type: object
      description: |
        The contact that submitted the response, when the response is identified. Present on the detailed view only — the list view omits it. `null` for anonymous (link-survey) responses.
      required:
        - id
      properties:
        id:
          type: string
          format: cuid2
          description: Contact identifier.
        userId:
          type:
            - string
            - 'null'
          description: The contact's `userId` attribute — the id your application knows the person by. This is a contact **attribute**, not a column, and it is not guaranteed unique within a workspace, so it identifies the person for display but must not be used as a lookup key. `null` when the contact has no `userId` attribute set.
      additionalProperties: false
    ResponseResource:
      allOf:
        - $ref: '#/components/schemas/ResponseBase'
        - type: object
          required:
            - contact
            - displayId
            - singleUseId
            - data
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/ResponseDataMap'
              description: |
                Answers in their **stored** form — byte-for-byte the same map `POST /api/v3/responses` and `PATCH /api/v3/responses/{responseId}` accept. Returned so that a read can be edited and written straight back: take this map, change what you need, and `PATCH` it. Without it a client wanting to correct one answer would have to rebuild the map from `answers[]`, which is possible but is work the server can simply not impose.

                `answers[]` remains the field to read — it is typed, labelled and ordered, and it separates answers from hidden fields. This is the same data in the shape the write side speaks, offered alongside rather than instead.

                Present on the detailed view only. The list view omits it deliberately: on a page of 250 it would carry every answer twice, and a bulk reader is not editing.
            contact:
              anyOf:
                - $ref: '#/components/schemas/ResponseContact'
                - type: 'null'
              description: The contact that submitted the response, or `null` when the response is anonymous. Present on the detailed view only.
            displayId:
              type:
                - string
                - 'null'
              description: The display (survey impression) this response was submitted against, when one was recorded.
            singleUseId:
              type:
                - string
                - 'null'
              description: The single-use link id this response was submitted through, when the survey uses single-use links.
      unevaluatedProperties: false
      description: |
        A survey response in the detailed view, as returned by `GET /api/v3/responses/{responseId}` and by the write endpoints. Everything in `ResponseListItem`, plus the identity and provenance fields the list view omits.

        It also carries `data` — the answers as stored, returned unchanged, so a client can read a response, edit an answer and send it straight back. Embedded Data is not echoed in stored form: the read's `embeddedData[]` and a request's `embeddedData` map already address the same fields by the same names, so a second raw map would only republish the storage layout. That is the property v1/v2 had for free by being symmetric, and the one OpenAPI 3.1.1 argues for directly: its "Validating `readOnly` and `writeOnly`" section notes that making clients strip fields before a write is "burdensome for clients, particularly when the JSON data is complex or deeply nested".

        They are not the *same* view, and the differences are deliberate. A write accepts `ingested` and `computed` fields only: a `reserved` entry describes the submission environment, and being able to read one back is not a licence to author it. An unset field is **omitted** from the read while `null` on a write **clears** one, because a merge-shaped map has no other way to spell deletion. And a name the read returns twice under different `kind`s cannot be written at all — see `ResponseEmbeddedDataInput`, which refuses an ambiguous name rather than guessing.

        Values themselves round-trip: within those two kinds every value the read emits is accepted verbatim on a write, and a `date` reads and writes as the same ISO-8601 string. So a read-edit-write cycle loses nothing except on the finite set of legacy surveys carrying one name as both a variable and a hidden field, where the write refuses the name outright.

        Note which fields carry `readOnly` here and which do not, because it is the opposite of what an "echo" framing would suggest. `readOnly` means a value is managed exclusively by the server, so it marks the **derived** views — `answers[]`, `embeddedData[]`, `unresolved[]`, `resolution`, the denormalized `surveyName` and `workspaceId`, the timestamps, `durationSeconds` and `id`. `data` is *not* read-only: it is exactly what the write endpoints accept, and leaving it unmarked is what makes this representation round-trippable rather than merely informative.

        To correct one answer, read this resource, take `data`, change the entry you want and `PATCH` `{ "data": … }`. Send only the fields you are changing — `PATCH` rejects unknown and non-patchable keys, so passing the whole representation back verbatim is not the intended flow; passing `data` back is.

        **Never exposed on this resource, in either view:** the respondent's IP address, and the `contactAttributes` snapshot that v1/v2 return. That snapshot is copied from the contact at submission time and never updated after, so it is stale PII by construction — `contact` covers the legitimate need to know who answered.
    ValidateResponseCreateRequest:
      type: object
      required:
        - operation
        - data
      properties:
        operation:
          type: string
          enum:
            - create
        data:
          description: Intended create payload. Invalid documents are allowed so the endpoint can return repairable validation errors.
          anyOf:
            - $ref: '#/components/schemas/CreateResponseRequest'
            - type: object
              additionalProperties: true
      additionalProperties: false
    PatchResponseRequest:
      type: object
      description: |
        Partially updates a response. Strict at the top level: unknown keys return **400** rather than being ignored, and at least one patchable field must be present.

        `data` is **replaced wholesale**, not deep-merged — send the complete answer map you want stored. `embeddedData` is the exception and merges by name: it addresses individual fields, so a field the payload omits keeps its value rather than being cleared.

        **Note for the implementation, because the obvious shortcut is wrong.** The one shipped update service merges `data` (`apps/web/lib/response/service.ts`, `// merge data object`), and merges `ttc` with it. Reusing it would ship merge semantics under a replace contract, silently — an unimplemented route has no test to catch the difference. v3 replaces on purpose: a merge makes it impossible to delete an answer, which a correction flow needs. A patch that sets `finished` to `true` fires the finish side of the response pipeline.

        Not patchable, and rejected if sent: `createdAt`, `updatedAt`, `surveyId`, `contactId`, `displayId`, `singleUseId`, `contactAttributes`, and the create-only `ttc` and `meta` — timing and submission context describe the original submission event, so they are set once and not revised. `contactId` is create-only deliberately — re-attributing an existing response to a different person is a capability only v2 offers, and it is not carried forward.
      minProperties: 1
      properties:
        finished:
          type: boolean
        endingId:
          type:
            - string
            - 'null'
        language:
          type:
            - string
            - 'null'
        data:
          $ref: '#/components/schemas/ResponseDataMap'
        embeddedData:
          $ref: '#/components/schemas/ResponseEmbeddedDataInput'
        tags:
          type: array
          description: Complete set of tag ids for this response, replacing whatever is currently applied. Tags must already exist in the same workspace — create them via `POST /api/v3/tags`.
          items:
            type: string
            format: cuid2
      additionalProperties: false
    ValidateResponsePatchRequest:
      type: object
      required:
        - operation
        - responseId
        - data
      properties:
        operation:
          type: string
          enum:
            - patch
        responseId:
          type: string
          format: cuid2
        data:
          description: Intended patch payload. Invalid documents are allowed so the endpoint can return repairable validation errors.
          anyOf:
            - $ref: '#/components/schemas/PatchResponseRequest'
            - type: object
              additionalProperties: true
      additionalProperties: false
    ValidateResponseRequest:
      oneOf:
        - $ref: '#/components/schemas/ValidateResponseCreateRequest'
        - $ref: '#/components/schemas/ValidateResponsePatchRequest'
      discriminator:
        propertyName: operation
        mapping:
          create: '#/components/schemas/ValidateResponseCreateRequest'
          patch: '#/components/schemas/ValidateResponsePatchRequest'
    ResponseValidationEffects:
      type: object
      description: |
        What a successful write **would** do, reported without doing it. This mirrors the detail that makes `POST /api/v3/surveys/validate` useful: it reports effects, not just a verdict, so a caller can see the consequences of a payload before committing thousands of them.

        Present only when `valid` is `true`.
      required:
        - language
        - firesPipeline
        - countsTowardMeteredResponses
      properties:
        language:
          type:
            - string
            - 'null'
          description: The survey language code that would be stamped on the response. `null` means the response would be stored **without** a language — the case worth catching before a bulk write, since language-less responses cannot later be told apart by language.
        contactId:
          type:
            - string
            - 'null'
          description: The contact that would be linked, or `null` if the response would be anonymous.
        displayId:
          type:
            - string
            - 'null'
          description: The display that would be linked, or `null` if none.
        firesPipeline:
          type: boolean
          description: Whether a real write would run the response pipeline — webhooks, integrations, follow-ups, and Hub ingestion. True for a create, and for a patch that transitions the response to finished.
        countsTowardMeteredResponses:
          type: boolean
          description: Whether a real write would consume one metered monthly response.
        quotas:
          type: array
          description: Quotas this response would count against, and whether it would fill them. Empty when the survey defines no quotas or the plan does not include them.
          items:
            type: object
            required:
              - quotaId
              - quotaName
              - wouldCount
            properties:
              quotaId:
                type: string
                format: cuid2
              quotaName:
                type: string
              wouldCount:
                type: boolean
                description: Whether this response matches the quota's criteria.
              wouldFill:
                type: boolean
                description: Whether counting this response would take the quota to its limit. Absent when `wouldCount` is `false`.
            additionalProperties: false
        tagsToApply:
          type: array
          description: Tag ids that would end up applied to the response. Patch operations only.
          items:
            type: string
            format: cuid2
      additionalProperties: false
    ResponseValidationResult:
      type: object
      description: |
        Outcome of a dry-run validation. Deliberately the same shape as `SurveyValidationResult` — the value of this endpoint is that the two behave alike, so a client can treat validation uniformly.

        Answers are checked against the survey's own validation rules (`SurveyValidationRule`) rather than a parallel rule set, so a payload this endpoint accepts is a payload the real write accepts.
      required:
        - valid
        - operation
        - invalid_params
      properties:
        valid:
          type: boolean
          description: Whether the submitted payload would be accepted by the real operation.
        operation:
          type: string
          enum:
            - create
            - patch
        invalid_params:
          type: array
          description: Repairable validation errors, using paths relative to the submitted `data` document.
          items:
            $ref: '#/components/schemas/InvalidParam'
        effects:
          $ref: '#/components/schemas/ResponseValidationEffects'
      additionalProperties: false
    BatchDeleteResponsesRequest:
      type: object
      description: |
        Ids to delete. A POST custom method rather than a `DELETE` on the collection: a collection-level `DELETE` that loses its filters degrades into erasing every response in scope, and a distinct path cannot be reached by accident — which is exactly the shape `feedbackRecords` ships today, a collection `DELETE` whose filters are the only thing standing between a caller and the whole dataset. AIP-165 blesses the custom-method form.
      required:
        - ids
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          description: Response ids to delete, at most 100 per call.
          items:
            type: string
            format: cuid2
      additionalProperties: false
    WorkflowStatus:
      type: string
      enum:
        - draft
        - enabled
        - disabled
        - archived
      description: |
        Workflow lifecycle state. `draft` workflows are editable and inert. `enabled` workflows
        respond to trigger events. `disabled` workflows keep their configuration but are inert.
        `archived` workflows are soft-deleted: read-only, excluded from default list reads, and
        restorable via unarchive.

        Status only changes through lifecycle endpoints. Valid transitions: `draft` → `enabled`,
        `enabled` ↔ `disabled`, `enabled`/`disabled` → `draft`, any non-archived state → `archived`
        (archive), and `archived` → `draft` (unarchive).
    WorkflowRunStatus:
      type: string
      enum:
        - queued
        - running
        - completed
        - failed
        - canceled
      description: |
        Workflow run lifecycle state. `completed`, `failed`, and `canceled` are terminal. Valid
        transitions: `queued` → `running`, `running` → `queued` (retry/backoff), `queued` →
        `canceled`, and `running` → `completed`/`failed`/`canceled`. Retries do not introduce a
        separate status; retry state is exposed via `attempt` and `nextAttemptAt`.
    WorkflowRunSummary:
      type: object
      description: |
        Slim run shape embedded as `lastRun` in workflow resources. The runs list (`GET /api/v3/workflows/runs`)
        returns `WorkflowRunListItem`, which extends this with `workflowName`. Excludes `triggerPayload`, `data`, and `logs`.
      required:
        - id
        - workflowId
        - workspaceId
        - workflowVersionId
        - status
        - isDryRun
        - triggerType
        - surveyId
        - responseId
        - error
        - attempt
        - createdAt
        - updatedAt
        - startedAt
        - finishedAt
      properties:
        id:
          type: string
          format: cuid2
        workflowId:
          type: string
          format: cuid2
        workspaceId:
          type: string
          format: cuid2
        workflowVersionId:
          type:
            - string
            - 'null'
          format: cuid2
          description: |
            Immutable workflow version snapshot the run executes against. `null` for dry runs of
            workflows that have never been enabled. Version contents are not readable through the
            v3 API in Scope 1.
        status:
          $ref: '#/components/schemas/WorkflowRunStatus'
        isDryRun:
          type: boolean
          description: '`true` for runs created by `POST /api/v3/workflows/{workflowId}/test`.'
        triggerType:
          type: string
          enum:
            - response.completed
        surveyId:
          type:
            - string
            - 'null'
          format: cuid2
        responseId:
          type:
            - string
            - 'null'
          format: cuid2
          description: Survey response that triggered the run. `null` for synthesized dry-run data or when the response was deleted.
        error:
          type:
            - string
            - 'null'
          description: Terminal or most recent failure reason. `null` while the run is healthy.
        attempt:
          type: integer
          minimum: 0
          description: Retry attempt counter. `0` on the first execution; retries increment it without changing `status`.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        startedAt:
          type:
            - string
            - 'null'
          format: date-time
        finishedAt:
          type:
            - string
            - 'null'
          format: date-time
    WorkflowListItem:
      type: object
      description: |
        Slim workflow shape returned by `GET /api/v3/workflows`. `triggerType` and `surveyId` are
        derived read-only projections of `definition.trigger`, so list consumers can render and
        filter without loading full definitions. Serialized dates are ISO 8601 strings.
      required:
        - id
        - workspaceId
        - name
        - description
        - status
        - triggerType
        - surveyId
        - createdBy
        - creator
        - createdAt
        - updatedAt
        - lastRun
        - runCount
      properties:
        id:
          type: string
          format: cuid2
        workspaceId:
          type: string
          format: cuid2
        name:
          type: string
        description:
          type:
            - string
            - 'null'
        status:
          $ref: '#/components/schemas/WorkflowStatus'
        triggerType:
          type: string
          enum:
            - response.completed
          description: Derived from `definition.trigger.triggerType`.
        surveyId:
          type: string
          format: cuid2
          description: Derived from `definition.trigger.config.surveyId`.
        createdBy:
          type:
            - string
            - 'null'
          format: cuid2
          description: User id that created the workflow. `null` when the creating user was deleted.
        creator:
          type:
            - object
            - 'null'
          required:
            - name
          properties:
            name:
              type: string
          description: Creating user's name. `null` when the creating user was deleted.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastRun:
          anyOf:
            - $ref: '#/components/schemas/WorkflowRunSummary'
            - type: 'null'
          description: Most recent run summary (dry runs included). `null` when the workflow has never run.
        runCount:
          type: integer
          minimum: 0
          description: Total number of runs (dry runs included) for this workflow.
    CursorPaginationMeta:
      type: object
      required:
        - limit
        - nextCursor
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100
        nextCursor:
          type:
            - string
            - 'null'
          description: Opaque cursor for the next page. `null` when there are no more results.
      additionalProperties: false
    WorkflowNodeUi:
      type: object
      description: Builder-only UI metadata that does not affect workflow execution. Additional keys are preserved.
      properties:
        position:
          type: object
          required:
            - x
            - 'y'
          properties:
            x:
              type: number
            'y':
              type: number
          additionalProperties: false
        collapsed:
          type: boolean
      additionalProperties: true
    WorkflowResponseCompletedTriggerNode:
      type: object
      required:
        - id
        - type
        - triggerType
        - config
      properties:
        id:
          type: string
          minLength: 1
        type:
          type: string
          enum:
            - trigger
        triggerType:
          type: string
          enum:
            - response.completed
        label:
          type: string
          minLength: 1
          maxLength: 120
          description: Optional display label shown in the builder.
        config:
          type: object
          required:
            - surveyId
          properties:
            surveyId:
              type: string
              format: cuid2
              description: Survey whose completed responses trigger the workflow. Must exist in the workspace.
            endingCardIds:
              type: array
              items:
                type: string
                format: cuid2
              default: []
              description: Ending card ids that should trigger the workflow. Empty or omitted means every ending matches.
          additionalProperties: false
        ui:
          $ref: '#/components/schemas/WorkflowNodeUi'
      additionalProperties: false
    WorkflowSendEmailActionConfig:
      type: object
      description: |-
        Send-email action with 1:1 field parity to survey Follow-ups (`ZSurveyFollowUpAction`).

        `to`, `subject` and `body` accept an empty string on create and update, so an author can save an unfinished draft. Completeness is enforced when the workflow has to run: enabling it returns **422** `workflow_not_executable` naming each blank field, and the dry run reports them as problems.
      required:
        - to
        - from
        - replyTo
        - subject
        - body
        - attachResponseData
      properties:
        to:
          type: string
          description: |
            Recipient: either a literal email address (e.g. a teammate) or the element id of a
            survey question / hidden field whose answer contains the respondent's email address
            (contact-info elements resolve index [2]) — the same semantics as the Follow-ups `to` field.

            A **literal** address must belong to someone who can access this workspace — an organization owner or manager, or a member of a team the
            workspace is shared with. Enabling a workflow whose literal recipient cannot access the workspace returns **422** `workflow_not_executable`, the
            dry run reports a `recipient_not_allowed` problem, and the runner refuses to send to it — so a
            workflow cannot forward response data to an arbitrary external inbox. An element-id `to`
            resolves to the respondent's own address and is never allowlist-checked.
        from:
          type: string
          format: email
        replyTo:
          type: array
          items:
            type: string
            format: email
        subject:
          type: string
          maxLength: 998
          description: |
            Email subject. Used verbatim (recall tokens are not expanded in the subject), the same as Follow-ups. Capped at RFC 5322's maximum line length.
        body:
          type: string
          maxLength: 100000
          description: |
            Email body as HTML with recall tokens (`#recall:[elementId]/fallback:x#`). Recall tokens
            are expanded against the response, the result is sanitized to a narrow HTML allowlist,
            and it is wrapped in the branded Follow-ups email template — identical rendering to survey Follow-ups.
        attachResponseData:
          type: boolean
        includeVariables:
          type: boolean
          default: false
        includeHiddenFields:
          type: boolean
          default: false
      additionalProperties: false
    WorkflowSendEmailActionNode:
      type: object
      description: 'Send-email action node. Renders 1:1 with survey Follow-ups: recall-token body, question/hidden-field `to` resolution, and the branded Follow-ups email template.'
      required:
        - id
        - type
        - actionType
        - config
      properties:
        id:
          type: string
          minLength: 1
        type:
          type: string
          enum:
            - action
        actionType:
          type: string
          enum:
            - send_email
        label:
          type: string
          minLength: 1
          maxLength: 120
          description: Optional display label shown in the builder.
        config:
          $ref: '#/components/schemas/WorkflowSendEmailActionConfig'
        ui:
          $ref: '#/components/schemas/WorkflowNodeUi'
      additionalProperties: false
    WorkflowEdge:
      type: object
      required:
        - id
        - source
        - target
      properties:
        id:
          type: string
          minLength: 1
        source:
          type: string
          minLength: 1
          description: Node id the edge starts from.
        target:
          type: string
          minLength: 1
          description: Node id the edge points to.
        sourceHandle:
          type: string
          minLength: 1
          description: Builder handle identifier on the source node. Reserved for branch nodes (`then`/`else`) in future scopes.
        targetHandle:
          type: string
          minLength: 1
          description: Builder handle identifier on the target node.
      additionalProperties: false
    WorkflowDefinition:
      type: object
      description: |
        Scope 1 workflow JSON document, mirroring `ZWorkflowDefinition` in `packages/workflows`. The
        definition is the public source of truth for the builder and API clients. Scope 1
        intentionally excludes user-authored if/else branches, webhook actions, schedules, delays,
        loops, and AI/MCP-assisted creation; future node types extend `nodes` additively.

        Graph rules enforced on every write (**400** with `invalid_params` on violation):
        node ids are unique across `trigger` and `nodes`; every edge references existing node ids;
        the trigger has at most one outgoing edge; `entryNodeId` equals `trigger.id`. Trigger-only
        drafts (no `nodes`, no `edges`) are valid persisted documents. Executability rules (exactly
        one outgoing trigger edge, acyclic graph, every node reachable from the trigger) are
        additionally enforced by `enable` and `test` with **422** `workflow_not_executable`.
      required:
        - trigger
        - entryNodeId
      properties:
        schemaVersion:
          type: integer
          enum:
            - 1
          default: 1
          description: Definition schema version. Optional on writes (defaults to the current version); always present in responses.
        trigger:
          $ref: '#/components/schemas/WorkflowResponseCompletedTriggerNode'
        nodes:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/WorkflowSendEmailActionNode'
          description: Child nodes of the graph. The trigger lives in `trigger`, not in this array. Scope 1 accepts `send_email` action nodes only. Optional on writes (defaults to empty for trigger-only drafts); always present in responses.
        edges:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/WorkflowEdge'
          description: Optional on writes (defaults to empty for trigger-only drafts); always present in responses.
        entryNodeId:
          type: string
          minLength: 1
          description: Workflow entry point. Must equal `trigger.id`.
      additionalProperties: false
    CreateWorkflowRequest:
      type: object
      required:
        - workspaceId
        - name
        - definition
      properties:
        workspaceId:
          type: string
          format: cuid2
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type:
            - string
            - 'null'
          maxLength: 500
        status:
          type: string
          enum:
            - draft
          description: New workflows are created as drafts in Scope 1.
        definition:
          $ref: '#/components/schemas/WorkflowDefinition'
      additionalProperties: false
    WorkflowResource:
      description: |
        Full workflow shape returned by detail, create, update, duplicate, and lifecycle endpoints:
        the list-item fields plus the complete `definition` document.
      allOf:
        - $ref: '#/components/schemas/WorkflowListItem'
        - type: object
          required:
            - definition
          properties:
            definition:
              $ref: '#/components/schemas/WorkflowDefinition'
    WorkflowRunListItem:
      description: |
        Run-list row returned by `GET /api/v3/workflows/runs`: the slim run summary plus the resolved
        `workflowName`, joined so the workspace-wide runs table can label each row. Distinct from the
        `lastRun` summary embedded in workflow resources, which omits the name (the parent workflow
        already carries it). Excludes `triggerPayload`, `data`, and `logs`.
      allOf:
        - $ref: '#/components/schemas/WorkflowRunSummary'
        - type: object
          required:
            - workflowName
          properties:
            workflowName:
              type: string
              description: Name of the workflow this run belongs to, joined for the runs-list display.
    WorkflowTriggerPayload:
      type: object
      description: |
        Trigger payload snapshot captured when a run is created, mirroring
        `ZWorkflowTriggerRunPayload`. Additional runner keys may be present.
      required:
        - type
        - workspaceId
        - surveyId
        - responseId
        - triggeredAt
      properties:
        type:
          type: string
          enum:
            - response.completed
        workspaceId:
          type: string
          format: cuid2
        surveyId:
          type: string
          format: cuid2
        responseId:
          type: string
          format: cuid2
          description: For dry runs without a `responseId` input, this references the synthesized sample response.
        endingCardId:
          type: string
          format: cuid2
          description: Ending card the respondent reached, when the survey uses ending cards.
        data:
          type: object
          description: Response data snapshot used by the runner.
        triggeredAt:
          type: string
          format: date-time
      additionalProperties: true
    WorkflowRunLogStatus:
      type: string
      enum:
        - pending
        - running
        - succeeded
        - failed
        - skipped
      description: Status of one executed (or skipped) workflow step within a run.
    WorkflowRunStepResult:
      type: object
      description: In-document result for one workflow step, mirroring `ZWorkflowStepResult`.
      required:
        - stepId
        - stepType
        - status
      properties:
        stepId:
          type: string
          minLength: 1
          description: Node id of the executed step.
        stepType:
          type: string
          minLength: 1
          description: Node/step type, e.g. `response.completed` or `send_email`.
        status:
          $ref: '#/components/schemas/WorkflowRunLogStatus'
        input:
          type: object
          description: Step input snapshot.
        output:
          type: object
          description: Step output snapshot, or the mocked output for dry runs.
        error:
          type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
      additionalProperties: false
    WorkflowRunData:
      type: object
      description: |
        Run execution data persisted with the run, mirroring `ZWorkflowRunData`. Scope 1 exposes
        this as a debug-oriented JSON dump. Additional runner keys may be present.
      required:
        - steps
      properties:
        trigger:
          allOf:
            - $ref: '#/components/schemas/WorkflowTriggerPayload'
          description: Optional duplicate of the trigger payload snapshot kept inside the run data document.
        steps:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowRunStepResult'
      additionalProperties: true
    WorkflowRunLog:
      type: object
      description: Persisted trace entry for one workflow run step, mirroring the `WorkflowRunLog` table row.
      required:
        - id
        - runId
        - sequence
        - stepId
        - stepType
        - status
        - input
        - output
        - error
        - startedAt
        - finishedAt
      properties:
        id:
          type: string
          format: cuid2
        runId:
          type: string
          format: cuid2
        sequence:
          type: integer
          minimum: 0
          description: Order of the entry within the run.
        stepId:
          type: string
          minLength: 1
        stepType:
          type: string
          minLength: 1
        status:
          $ref: '#/components/schemas/WorkflowRunLogStatus'
        input:
          type: object
          description: Step input snapshot. Empty object when nothing was recorded.
        output:
          type: object
          description: Step output snapshot (mocked for dry runs). Empty object when nothing was recorded.
        error:
          type:
            - string
            - 'null'
        startedAt:
          type:
            - string
            - 'null'
          format: date-time
        finishedAt:
          type:
            - string
            - 'null'
          format: date-time
      additionalProperties: false
    WorkflowRunResource:
      description: |
        Full run shape returned by `GET /api/v3/workflows/runs/{runId}` and
        `POST /api/v3/workflows/{workflowId}/test`: the summary fields plus the captured trigger
        payload, per-step results, the persisted log trace, and retry/idempotency metadata.
      allOf:
        - $ref: '#/components/schemas/WorkflowRunSummary'
        - type: object
          required:
            - triggerPayload
            - data
            - logs
            - idempotencyKey
            - nextAttemptAt
            - lastErrorAt
          properties:
            triggerPayload:
              $ref: '#/components/schemas/WorkflowTriggerPayload'
            data:
              $ref: '#/components/schemas/WorkflowRunData'
            logs:
              type: array
              items:
                $ref: '#/components/schemas/WorkflowRunLog'
              description: Persisted step-by-step trace, ordered by `sequence`. Empty while the run is still `queued`.
            idempotencyKey:
              type:
                - string
                - 'null'
              description: Deduplication key for this run, unique per workflow. Set from the `Idempotency-Key` header on dry runs or from trigger-event deduplication.
            nextAttemptAt:
              type:
                - string
                - 'null'
              format: date-time
              description: When the next retry attempt is scheduled. `null` when no retry is pending.
            lastErrorAt:
              type:
                - string
                - 'null'
              format: date-time
    PatchWorkflowRequest:
      type: object
      description: |
        Partial workflow update. `name` and `description` are accepted in any state except
        `archived`; `definition` is only accepted while the workflow is `draft` or `disabled`.
        `status` is intentionally not patchable — use the lifecycle endpoints.
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type:
            - string
            - 'null'
          maxLength: 500
        definition:
          $ref: '#/components/schemas/WorkflowDefinition'
      additionalProperties: false
    DuplicateWorkflowRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Optional name for the duplicate. If omitted, the server chooses a non-conflicting copy name.
      additionalProperties: false
    WorkflowTestResult:
      type: object
      description: |
        Result of dry-running (testing) a workflow: whether it would execute and, if not, why not. No run is created and no side effects occur.
      required:
        - workflowId
        - ok
        - problems
      properties:
        workflowId:
          type: string
          format: cuid2
          example: clworkflow0000000000000000
        ok:
          type: boolean
          description: |
            True when the definition is executable, every trigger reference resolves, and every literal `send_email` recipient can access this workspace.
        problems:
          type: array
          description: Every problem found, so all issues can be fixed at once. Empty when `ok` is true.
          items:
            type: object
            required:
              - code
              - field
              - message
            properties:
              code:
                type: string
                enum:
                  - definition_not_executable
                  - survey_not_found
                  - ending_card_not_found
                  - recipient_not_allowed
                description: Machine-readable problem category.
              field:
                type: string
                description: |
                  Dotted path to the offending field, e.g. `definition.trigger.config.surveyId`.
              message:
                type: string
                description: Human-readable explanation of the problem.
    ActionClassResource:
      type: object
      description: A workspace action class that can be referenced from an app-survey trigger.
      required:
        - id
        - name
        - description
        - type
        - key
      properties:
        id:
          type: string
          format: cuid2
          description: Use this value as `distribution.triggers[].actionClassId` on an app survey.
        name:
          type: string
        description:
          type:
            - string
            - 'null'
        type:
          type: string
          enum:
            - code
            - noCode
        key:
          type:
            - string
            - 'null'
          description: Code-action key for code-type action classes; null for no-code actions.
      additionalProperties: false
    ContactAttributeKeyResource:
      type: object
      description: |
        A workspace contact-attribute key. Use `key` as `targeting.filters[].root.contactAttributeKey` on an app survey; `dataType` indicates which operators apply (e.g. `number`/`date` attributes support arithmetic/date operators).
      required:
        - id
        - key
        - name
        - description
        - type
        - dataType
      properties:
        id:
          type: string
          format: cuid2
        key:
          type: string
          description: The attribute key used in targeting filters (e.g. `plan`, `role`).
        name:
          type:
            - string
            - 'null'
          description: Human-readable display name, or null.
        description:
          type:
            - string
            - 'null'
        type:
          type: string
          enum:
            - default
            - custom
          description: Whether this is a built-in (`default`) or workspace-defined (`custom`) attribute.
        dataType:
          type: string
          enum:
            - string
            - number
            - date
      additionalProperties: false
    TagResource:
      type: object
      required:
        - id
        - name
        - workspaceId
        - createdAt
        - updatedAt
        - count
      properties:
        id:
          type: string
          format: cuid2
        name:
          type: string
          description: Tag label as shown in the app. Unique within a workspace.
        workspaceId:
          type: string
          format: cuid2
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        count:
          type: integer
          minimum: 0
          description: Responses currently carrying this tag. `0` when the tag exists but has never been applied.
    FeedbackRecordFieldType:
      type: string
      description: 'The type of a feedback field, which determines which `value_*` member carries the answer: `text` → `value_text` (the only enrichable type), `categorical` → `value_text` + `value_id`, `nps` / `csat` / `ces` / `rating` / `number` → `value_number`, `boolean` → `value_boolean`, `date` → `value_date`.'
      enum:
        - text
        - categorical
        - nps
        - csat
        - ces
        - rating
        - number
        - boolean
        - date
    FeedbackRecordSentiment:
      type: string
      description: 'Sentiment polarity label inferred from `value_text` by the sentiment enrichment: five ordinal levels plus a distinct `mixed`. Server-generated and read-only.'
      enum:
        - very_negative
        - negative
        - neutral
        - positive
        - very_positive
        - mixed
    FeedbackRecordEmotion:
      type: string
      description: A single emotion label inferred from `value_text` by the emotion enrichment (the six Ekman basic emotions). Emotions are multi-label, so a record carries zero or more of these; "mixed" is not a label, it is two or more present at once. Server-generated and read-only.
      enum:
        - joy
        - anger
        - sadness
        - fear
        - surprise
        - disgust
    FeedbackRecord:
      type: object
      description: 'One piece of feedback in the normalized Feedback Record shape. Field names are `snake_case`: the payload is the Hub''s, passed through the API gateway unchanged. Optional members are **absent** (not `null`) when unset.'
      additionalProperties: false
      required:
        - id
        - collected_at
        - created_at
        - updated_at
        - source_type
        - field_id
        - field_type
        - submission_id
        - tenant_id
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7 primary key.
        tenant_id:
          type: string
          format: cuid2
          description: The feedback dataset this record belongs to (the dataset id, as shown by the MCP `list_feedback_datasets` tool).
        collected_at:
          type: string
          format: date-time
          description: When the feedback was given.
        created_at:
          type: string
          format: date-time
          description: When the record was stored. Diverges from `collected_at` on a historical re-import.
        updated_at:
          type: string
          format: date-time
          description: When the record was last changed.
        source_type:
          type: string
          description: Type of feedback source, e.g. `survey`, `review`, `feedback_form`.
        source_id:
          type: string
          description: Reference to the survey / form / ticket the record came from.
        source_name:
          type: string
          description: Human-readable name of the source.
        submission_id:
          type: string
          description: Identifier of the logical submission this record belongs to (e.g. a response id). Records are unique per (`tenant_id`, `submission_id`, `field_id`).
        field_id:
          type: string
          description: Identifier of the question / field.
        field_label:
          type: string
          description: The question text.
        field_group_id:
          type: string
          description: Stable identifier grouping related fields (ranking, matrix and grid questions).
        field_group_label:
          type: string
          description: Human-readable question text for the group.
        field_type:
          $ref: '#/components/schemas/FeedbackRecordFieldType'
        language:
          type: string
          description: ISO language code the feedback was given in.
        user_id:
          type: string
          description: End-user identifier (e.g. an anonymous id or an email hash).
        value_text:
          type: string
          description: Text answer.
        value_id:
          type: string
          description: Stable id of the selected option in the source system (e.g. a survey choice id), stored alongside `value_text` so choice answers keep their identity across label edits and languages. Opaque. Absent for free-text and non-choice answers.
        value_number:
          type: number
          format: double
          description: Numeric answer (ratings, NPS scores, numbers).
        value_boolean:
          type: boolean
          description: Yes / no answer.
        value_date:
          type: string
          format: date-time
          description: Date answer.
        metadata:
          type:
            - object
            - array
            - string
            - number
            - boolean
            - 'null'
          items: {}
          description: Arbitrary context stored with the record and returned with equivalent values (key order and number formatting are normalized). Omitted when the record has no metadata; a record explicitly stored with a JSON `null` returns `null`. An object is the supported shape and the only one the write operations accept; the wider union exists so records written before that convention still deserialize.
        sentiment:
          $ref: '#/components/schemas/FeedbackRecordSentiment'
        sentiment_score:
          type: number
          format: double
          minimum: -1
          maximum: 1
          description: Signed sentiment polarity from `-1.0` (very negative) to `1.0` (very positive). Read-only; absent until the record is enriched.
        emotions:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/FeedbackRecordEmotion'
          description: 'Emotions inferred from `value_text`; multi-label from a fixed set. Read-only, and **never an empty array** — the column is either absent or has at least one label. Absent covers two different states: not yet classified, and classified with no emotion detected. Do not read absence as "not enriched yet"; `has_emotions=false` selects both, and the enrichment-status endpoint is what distinguishes them.'
        value_text_translated:
          type: string
          description: '`value_text` translated into the dataset''s configured target language. Read-only; absent until the record is enriched.'
        translation_lang_key:
          type: string
          maxLength: 35
          description: BCP-47 locale that `value_text_translated` was produced in. Read-only; absent until the record is enriched.
    FeedbackRecordList:
      type: object
      additionalProperties: false
      required:
        - data
        - limit
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FeedbackRecord'
        limit:
          type: integer
          description: The page size that was applied.
        next_cursor:
          type: string
          description: Opaque keyset cursor for the next page. **Present only when there may be more results**; absent on the last page. Pass it back unchanged as `cursor`, with the same `sort` and `order`.
    HubInvalidParam:
      type: object
      additionalProperties: false
      description: A single invalid request parameter (RFC 9457 `invalid_params` extension member).
      required:
        - name
        - reason
      properties:
        name:
          type: string
          description: Dotted path to the offending request field, e.g. `field_type` or `items[0].field_type`.
        reason:
          type: string
          description: Human- and agent-readable explanation of why the value is invalid, naming allowed values or constraints so the request can be corrected without guessing.
    HubProblem:
      type: object
      additionalProperties: false
      description: RFC 9457 problem details (`application/problem+json`) as produced by the feedback store behind the API gateway. Branch on the stable `code` member rather than on `title` or `type`. Note the member names differ from the rest of v3 (`request_id`, not `requestId`) — the payload is passed through unchanged.
      required:
        - title
        - status
        - code
        - request_id
      properties:
        type:
          type: string
          format: uri
          description: A URI reference identifying the problem type.
        title:
          type: string
          description: Short, human-readable summary of the problem type; stable across occurrences.
        status:
          type: integer
          description: HTTP status code.
        code:
          type: string
          description: Stable, machine-readable error code. `service_unavailable` means a feature or dependency is temporarily unavailable and the request may be retried later; `tenant_write_conflict` means the write collided with an in-progress dataset purge and may be retried unchanged. Every other code is terminal until the request itself changes.
          enum:
            - validation
            - bad_request
            - unauthorized
            - forbidden
            - not_found
            - conflict
            - tenant_write_conflict
            - method_not_allowed
            - content_too_large
            - service_unavailable
            - internal_server_error
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          description: URI reference identifying this occurrence — the request path **as the feedback store saw it** (`/v1/feedback-records/...`), not the `/api/v3/feedbackRecords/...` path you called.
        request_id:
          type: string
          description: Identifier for this request, also returned in the `X-Request-ID` response header; include it when reporting a problem.
        details:
          type: object
          additionalProperties: true
          description: Optional structured context, e.g. `resource_type` on a not-found problem.
        invalid_params:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/HubInvalidParam'
          description: Field-level validation failures. Present on `validation` problems.
    CreateFeedbackRecordRequest:
      type: object
      description: A new feedback record. Exactly one `value_*` member should carry the answer, matching `field_type`. Strings must be valid UTF-8 without NULL bytes; violations answer **400**.
      additionalProperties: false
      required:
        - tenant_id
        - source_type
        - field_id
        - field_type
        - submission_id
      properties:
        tenant_id:
          type: string
          format: cuid2
          description: The feedback dataset to write into (the dataset id). The gateway authorizes the request against this dataset, so it must be one the API key's workspace is assigned to.
        source_type:
          type: string
          minLength: 1
          maxLength: 255
          description: Type of feedback source, e.g. `survey`, `review`, `feedback_form`.
        source_id:
          type:
            - string
            - 'null'
          maxLength: 255
          description: Reference to the survey / form / ticket the record came from.
        source_name:
          type:
            - string
            - 'null'
          maxLength: 255
          description: Human-readable name of the source.
        submission_id:
          type: string
          minLength: 1
          maxLength: 255
          description: 'Identifier of the logical submission this record belongs to. Groups multi-field submissions and makes ingestion idempotent: records are unique per (`tenant_id`, `submission_id`, `field_id`) and a duplicate answers **409**. If a record has no logical submission, reuse `field_id`.'
        field_id:
          type: string
          minLength: 1
          maxLength: 255
          description: Identifier of the question / field.
        field_label:
          type:
            - string
            - 'null'
          maxLength: 2048
          description: The question text.
        field_group_id:
          type: string
          maxLength: 255
          description: Stable identifier grouping related fields (ranking, matrix and grid questions).
        field_group_label:
          type:
            - string
            - 'null'
          maxLength: 2048
          description: Human-readable question text for the group.
        field_type:
          $ref: '#/components/schemas/FeedbackRecordFieldType'
        language:
          type: string
          maxLength: 10
          description: ISO language code the feedback was given in.
        user_id:
          type: string
          maxLength: 255
          description: 'End-user identifier (e.g. an anonymous id or an email hash). Set it on anything you may later have to erase: `DELETE /api/v3/feedbackRecords` matches on `user_id`.'
        collected_at:
          type: string
          format: date-time
          description: When the feedback was given. Defaults to now. Must be between 1970-01-01 and 2080-12-31.
        value_text:
          type:
            - string
            - 'null'
          maxLength: 30000
          description: Text answer. The only member that feeds sentiment, emotion, translation and embedding enrichment.
        value_id:
          type:
            - string
            - 'null'
          maxLength: 255
          description: Stable id of the selected option in the source system (e.g. a survey choice id or matrix column id), stored alongside `value_text`. Opaque, not validated. Omit for free-text, "other" and non-choice answers.
        value_number:
          type: number
          format: double
          minimum: -1000000000000000
          maximum: 1000000000000000
          description: Numeric answer (ratings, NPS scores, numbers). Must be between -1e15 and +1e15.
        value_boolean:
          type: boolean
          description: Yes / no answer.
        value_date:
          type: string
          format: date-time
          description: Date answer. Must be between 1970-01-01 and 2080-12-31.
        metadata:
          type:
            - object
            - 'null'
          additionalProperties: {}
          description: 'Arbitrary context for this record, stored as JSON: the dimensions you want to slice a dashboard by, such as channel, device, country, campaign, plan or tags. Values may be strings, numbers, booleans, `null`, or nested objects and arrays. Use stable `snake_case` keys — a key is what a dashboard groups by. Numbers keep full precision in storage. Metadata is **not** sent to the enrichment providers, but it **is** included in the `feedback_record.created` / `feedback_record.updated` webhook payloads.'
    DeleteFeedbackRecordsByUserResult:
      type: object
      additionalProperties: false
      required:
        - deleted_count
        - message
      properties:
        deleted_count:
          type: integer
          minimum: 0
          description: Number of records deleted. `0` when the user had no remaining records — the operation is idempotent.
        message:
          type: string
          description: Human-readable status message.
    FeedbackRecordSemanticSearchRequest:
      type: object
      additionalProperties: false
      required:
        - query
        - tenant_id
      properties:
        query:
          type: string
          minLength: 1
          description: Natural-language search text. It is embedded and compared to record embeddings by cosine similarity.
        tenant_id:
          type: string
          format: cuid2
          description: The feedback dataset to search (the dataset id). Results never cross datasets.
    FeedbackRecordSimilarityItem:
      type: object
      additionalProperties: false
      required:
        - feedback_record_id
        - score
        - field_label
        - value_text
      properties:
        feedback_record_id:
          type: string
          format: uuid
          description: The matching record. Fetch it with `GET /api/v3/feedbackRecords/{id}` for the full payload.
        score:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Cosine similarity, `0` unrelated to `1` identical.
        field_label:
          type: string
          description: The record's question text (part of what was embedded). Empty when the record has no label.
        value_text:
          type: string
          description: The record's text answer (the text that was embedded). Empty when it has since been cleared — only records with a non-empty `value_text` are embedded in the first place.
    FeedbackRecordSimilarityResult:
      type: object
      additionalProperties: false
      required:
        - data
        - limit
      properties:
        data:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/FeedbackRecordSimilarityItem'
          description: Matches ordered by descending `score`.
        limit:
          type: integer
          description: The page size that was applied.
        next_cursor:
          type: string
          description: Opaque keyset cursor for the next page. Present only when a full page was returned and there may be more results. Pass it back unchanged as `cursor`.
    UpdateFeedbackRecordRequest:
      type: object
      description: A partial update. Only the members sent are changed; an empty body is accepted and changes nothing. Provenance (`tenant_id`, `source_*`, `field_*`, `submission_id`, `collected_at`) is immutable.
      additionalProperties: false
      properties:
        value_text:
          type: string
          maxLength: 30000
          description: New text answer. Changing it clears the server-generated enrichment members (`sentiment`, `sentiment_score`, `emotions`, `value_text_translated`, `translation_lang_key`), queues re-enrichment and re-embedding, and the response reflects the cleared state.
        value_id:
          type: string
          maxLength: 255
          description: New stable option id for a choice answer. Opaque, not validated.
        value_number:
          type: number
          format: double
          minimum: -1000000000000000
          maximum: 1000000000000000
          description: New numeric answer. Must be between -1e15 and +1e15.
        value_boolean:
          type: boolean
          description: New yes / no answer.
        value_date:
          type: string
          format: date-time
          description: New date answer. Must be between 1970-01-01 and 2080-12-31.
        language:
          type: string
          maxLength: 10
          description: New ISO language code. Changing it clears and re-queues the translation pair only.
        user_id:
          type: string
          maxLength: 255
          description: New end-user identifier.
        metadata:
          type:
            - object
            - 'null'
          additionalProperties: {}
          description: '**Replaces** the stored metadata wholesale — it is not merged, so send every key you want to keep. Same value rules and **400** rejections as on create.'
  responses:
    V3BadRequest:
      description: Bad Request — malformed JSON, invalid query/body/params, duplicate name, or unsupported field.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request correlation ID
        Cache-Control:
          schema:
            type: string
          example: private, no-store
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    V3Unauthorized:
      description: Not authenticated (no valid session or API key).
      headers:
        WWW-Authenticate:
          schema:
            type: string
          example: Bearer realm="formbricks"
          description: 'Authentication scheme challenge. RFC 9110 §15.5.2 asks a 401 for a challenge "applicable to the target resource", and Bearer is applicable here because these operations accept the API key as `Authorization: Bearer <key>` as well as `x-api-key`. Session-cookie-only operations send no challenge — see `V3UnauthorizedSession`. The MCP endpoints send a richer OAuth challenge carrying `resource_metadata` and `scope`.'
        X-Request-Id:
          schema:
            type: string
          description: Request correlation ID
        Cache-Control:
          schema:
            type: string
          example: private, no-store
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    V3Forbidden:
      description: Forbidden — no workspace access, or resource does not exist (404 not used; avoids existence leak).
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request correlation ID
        Cache-Control:
          schema:
            type: string
          example: private, no-store
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    V3TooManyRequests:
      description: Rate limit exceeded.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request correlation ID
        Cache-Control:
          schema:
            type: string
          example: private, no-store
        Retry-After:
          schema:
            type: integer
          description: Seconds until the current rate-limit window resets.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    V3InternalServerError:
      description: Internal Server Error.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request correlation ID
        Cache-Control:
          schema:
            type: string
          example: private, no-store
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    V3UnprocessableContent:
      description: Unprocessable Content — semantic validation failed or the requested lifecycle transition is invalid.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request correlation ID
        Cache-Control:
          schema:
            type: string
          example: private, no-store
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    WorkflowResourceResponse:
      description: Workflow returned successfully
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request correlation ID
        Cache-Control:
          schema:
            type: string
          example: private, no-store
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                $ref: '#/components/schemas/WorkflowResource'
    V3Conflict:
      description: Conflict — an `Idempotency-Key` retry arrived while the original request was still being processed (IETF `draft-ietf-httpapi-idempotency-key-header` semantics). Retry after the original request completes to receive its stored result.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request correlation ID
        Cache-Control:
          schema:
            type: string
          example: private, no-store
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    V3UnauthorizedSession:
      description: Not authenticated (no valid session).
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request correlation ID
        Cache-Control:
          schema:
            type: string
          example: private, no-store
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    FeedbackRecordsBadRequest:
      description: 'Bad Request. From the **gateway** (`text/plain`): a missing or malformed `tenant_id`, a request body that is not JSON, or a path under `/api/v3/feedbackRecords` that is not one of the documented operations. A record id that is not a UUID and a path such as `/count` both fall in that last case and share the one `Unsupported FeedbackRecords route` body, so the two cannot be told apart from the response. From the **feedback store** (`application/problem+json`): schema validation failures — an unknown enum value, an inverted range, a malformed or re-ordered cursor, or a string with NULL bytes or invalid UTF-8.'
      content:
        text/plain:
          schema:
            type: string
          examples:
            missingTenant:
              summary: Gateway — tenant_id missing or malformed
              value: Invalid or missing tenant_id
            unsupportedRoute:
              summary: Gateway — not a documented operation
              value: Unsupported FeedbackRecords route
        application/problem+json:
          schema:
            $ref: '#/components/schemas/HubProblem'
          examples:
            invertedRange:
              summary: Feedback store — a range filter supplied backwards
              value:
                type: https://hub.formbricks.com/problems/validation
                title: Validation Failed
                status: 400
                code: validation
                detail: One or more request parameters are invalid
                request_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5b
                invalid_params:
                  - name: sentiment_score_min
                    reason: must be less than or equal to sentiment_score_max
    FeedbackRecordsUnauthorized:
      description: Unauthorized — no credentials, or an API key that does not exist or is revoked. Answered by the gateway as `text/plain`, before the request reaches the feedback store.
      content:
        text/plain:
          schema:
            type: string
          example: Unauthorized
    FeedbackRecordsForbidden:
      description: 'Forbidden. Answered by the gateway as `text/plain` whenever the request cannot be authorized: the dataset does not exist, is archived, or is not assigned to a workspace the API key has the required permission on; the organization lacks the Unify Feedback entitlement; a mutation was attempted with an API key on a dataset shared by more than one workspace; or the record id does not exist. Existence is not leaked: an unknown dataset or record is refused here rather than with a 404. The single-record operations are the one exception, and only for a minute after a delete — see their `404`.'
      content:
        text/plain:
          schema:
            type: string
          example: Forbidden
    FeedbackRecordsInternalServerError:
      description: 'Internal Server Error from the feedback store (`application/problem+json`, `code: internal_server_error`).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/HubProblem'
    FeedbackRecordsServiceUnavailable:
      description: 'Service Unavailable. From the **gateway** (`text/plain`): the record''s dataset could not be resolved because the feedback store did not answer, the authorization service itself was unreachable, or the record''s stored `tenant_id` is not a dataset id this API can address. From the **feedback store** (`application/problem+json`, `code: service_unavailable`): the operation needs a capability that is not configured on this instance — semantic search and similar records require an embedding model.'
      content:
        text/plain:
          schema:
            type: string
          example: Feedback record lookup failed
        application/problem+json:
          schema:
            $ref: '#/components/schemas/HubProblem'
    FeedbackRecordsConflict:
      description: 'Conflict (`application/problem+json`). Either a **duplicate** — a record with this `tenant_id`, `submission_id` and `field_id` already exists (`code: conflict`, terminal; update the existing record instead) — or the dataset is being **purged** while you write to it (`code: tenant_write_conflict`, transient; retry unchanged once the purge completes).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/HubProblem'
    FeedbackRecordsPayloadTooLarge:
      description: Payload Too Large. The gateway buffers the request body in order to authorize it, and the proxy in front of it stops reading at 1 MiB — Envoy's `maxRequestBytes` on Formbricks Cloud, Traefik's `maxbodysize` in the Docker install. The refusal is therefore generated by that proxy rather than by the application, so neither its media type nor its body is part of this contract; branch on the status alone.
    FeedbackRecordsWriteConflict:
      description: 'Conflict (`application/problem+json`, `code: tenant_write_conflict`). The dataset is being **purged** while you write to it. Transient: retry the request unchanged once the purge completes. Only creates can conflict on a duplicate, so this operation never answers `code: conflict`.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/HubProblem'
    FeedbackRecordsRecordNotFound:
      description: 'Not Found from the feedback store (`application/problem+json`, `code: not_found`). The record was deleted after the gateway resolved its dataset: that lookup is cached for 60 seconds, so for up to a minute after a delete the call is still authorized and reaches the store, which no longer has the record. Once the cache entry expires the same id answers **403** instead. Treat both as "this record is not available to you".'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/HubProblem'
    FeedbackRecordsNotFound:
      description: 'Not Found from the feedback store (`application/problem+json`, `code: not_found`), for one of two reasons. Usually the record exists but has **no embedding** for the current model: it has no text, or was created moments ago and is not embedded yet. It can also mean the record itself is **gone** — deleted after the gateway authorized the call against its cached dataset (see the `id` parameter).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/HubProblem'
  parameters:
    WorkspaceIdQuery:
      in: query
      name: workspaceId
      required: true
      schema:
        type: string
        format: cuid2
      description: Workspace identifier. This is the canonical container ID for v3 APIs.
    LimitQuery:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 250
        default: 20
      description: Page size. A value above the maximum is rejected with **400** rather than silently reduced to it — v3 rejects unusable input instead of substituting its own, the same way it rejects unrecognized query parameters. The server may still return fewer items than requested, so treat `meta.nextCursor` as the only end-of-collection signal rather than comparing the page length against `limit`.
    CursorQuery:
      in: query
      name: cursor
      schema:
        type: string
      description: Opaque cursor returned as `meta.nextCursor` from the previous page. Omit on the first request.
    CreatedAtGteQuery:
      in: query
      name: filter[createdAt][gte]
      schema:
        type: string
        format: date-time
      description: Only records created at or after this instant (**inclusive**). Mutually exclusive with `filter[createdAt][gt]` — sending both is a **400**.
    CreatedAtGtQuery:
      in: query
      name: filter[createdAt][gt]
      schema:
        type: string
        format: date-time
      description: Only records created strictly after this instant (**exclusive**). Paired with `filter[createdAt][lt]` this is a fully open `(start, end)` window. For a half-open `[start, end)` window — the one whose consecutive pages tile without dropping a record that sits exactly on a boundary instant — use `filter[createdAt][gte]` with `filter[createdAt][lt]`. Mutually exclusive with `filter[createdAt][gte]` — sending both is a **400**.
    CreatedAtLteQuery:
      in: query
      name: filter[createdAt][lte]
      schema:
        type: string
        format: date-time
      description: Only records created at or before this instant (**inclusive**). Mutually exclusive with `filter[createdAt][lt]` — sending both is a **400**.
    CreatedAtLtQuery:
      in: query
      name: filter[createdAt][lt]
      schema:
        type: string
        format: date-time
      description: Only records created strictly before this instant (**exclusive**). The upper bound of a half-open `[start, end)` window, which is what makes consecutive windows tile without overlapping or dropping a record on the boundary. Mutually exclusive with `filter[createdAt][lte]` — sending both is a **400**.
    ResponseIdPath:
      in: path
      name: responseId
      required: true
      schema:
        type: string
        format: cuid2
      description: Response identifier.
    WorkflowRunIdPath:
      in: path
      name: runId
      required: true
      schema:
        type: string
        format: cuid2
      description: Workflow run identifier.
    WorkflowIdPath:
      in: path
      name: workflowId
      required: true
      schema:
        type: string
        format: cuid2
      description: Workflow identifier.
    FeedbackRecordsTenantIdQuery:
      in: query
      name: tenant_id
      required: true
      schema:
        type: string
        format: cuid2
      description: 'The feedback dataset to operate on (the dataset id, as shown by the MCP `list_feedback_datasets` tool). **Required by the gateway on this operation**: a missing or malformed value answers **400** before the request reaches the feedback store, and a dataset the API key''s workspace is not assigned to answers **403**. The two `POST` operations take the same value in the request body instead, and the single-record operations derive it from the record.'
    SimilarityLimitQuery:
      in: query
      name: limit
      schema:
        type: integer
        default: 10
      description: 'Page size, at most 100. Unlike the `limit` on `GET /api/v3/feedbackRecords`, this one is never rejected: the search endpoints **clamp** instead of answering 400. A value above 100 is reduced to 100, and `0`, a negative number or a non-numeric value falls back to the default of 10. Read the `limit` in the response to see what was actually applied.'
    SimilarityCursorQuery:
      in: query
      name: cursor
      schema:
        type: string
      description: Opaque keyset cursor returned as `next_cursor` by the previous page. Omit on the first request. A malformed cursor answers **400**.
    MinScoreQuery:
      in: query
      name: min_score
      schema:
        type: number
        format: float
        default: 0.7
      description: 'Only matches with `score >= min_score` are returned. Like `limit`, this value is **clamped rather than rejected**: above `1` it becomes `1`, below `0` it becomes `0`, and a non-numeric value falls back to the default of `0.7`. That default is conservative — on the embedding model we measured, query→record similarities for genuinely relevant text often landed around `0.55–0.7` — so if a good query returns nothing, lower it (e.g. `0.5`) and filter on the returned `value_text`. Score distributions differ per model, so treat those numbers as an observation rather than a guarantee.'
    FeedbackRecordIdPath:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
      description: Feedback record id (UUID). The dataset is resolved from the record itself, so the caller cannot choose which dataset it is authorized against. An id that is not a UUID answers **400**, and an id whose dataset the API key cannot reach answers **403** rather than 404, so ids cannot be probed. The gateway caches the record→dataset lookup for 60 seconds, so for up to a minute after a delete the id is still authorized and the store answers **404**; after that the same id answers **403**.
