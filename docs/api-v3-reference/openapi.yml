          type: object
          additionalProperties:
            type: string
      additionalProperties: false
    SurveyLogicOperand:
      oneOf:
        - type: object
          required:
            - type
            - value
          properties:
            type:
              type: string
              enum:
                - static
            value:
              oneOf:
                - type: string
                - type: number
                - type: array
                  items:
                    type: string
          additionalProperties: false
        - $ref: '#/components/schemas/SurveyDynamicReference'
    SurveyCondition:
      type: object
      description: |
        Single condition. Operators such as `isSubmitted`, `isSkipped`, `isClicked`, `isAccepted`,
        `isBooked`, `isSet`, and `isEmpty` do not use `rightOperand`; comparison operators do.
      required:
        - id
        - leftOperand
        - operator
      properties:
        id:
          type: string
          format: cuid2
        leftOperand:
          $ref: '#/components/schemas/SurveyDynamicReference'
        operator:
          type: string
          enum:
            - equals
            - doesNotEqual
            - contains
            - doesNotContain
            - startsWith
            - doesNotStartWith
            - endsWith
            - doesNotEndWith
            - isSubmitted
            - isSkipped
            - isGreaterThan
            - isLessThan
            - isGreaterThanOrEqual
            - isLessThanOrEqual
            - equalsOneOf
            - includesAllOf
            - includesOneOf
            - doesNotIncludeOneOf
            - doesNotIncludeAllOf
            - isClicked
            - isNotClicked
            - isAccepted
            - isBefore
            - isAfter
            - isBooked
            - isPartiallySubmitted
            - isCompletelySubmitted
            - isSet
            - isNotSet
            - isEmpty
            - isNotEmpty
            - isAnyOf
        rightOperand:
          $ref: '#/components/schemas/SurveyLogicOperand'
      additionalProperties: false
    SurveyConditionGroup:
      type: object
      required:
        - id
        - connector
        - conditions
      properties:
        id:
          type: string
          format: cuid2
        connector:
          type: string
          enum:
            - and
            - or
        conditions:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/SurveyCondition'
              - $ref: '#/components/schemas/SurveyConditionGroup'
      additionalProperties: false
    SurveyCalculateAction:
      type: object
      description: Updates a survey variable when the logic rule matches.
      required:
        - id
        - objective
        - variableId
        - operator
        - value
      properties:
        id:
          type: string
          format: cuid2
        objective:
          type: string
          enum:
            - calculate
        variableId:
          type: string
          format: cuid2
          description: Variable id for `calculate`.
        operator:
          type: string
          enum:
            - assign
            - concat
            - add
            - subtract
            - multiply
            - divide
        value:
          $ref: '#/components/schemas/SurveyLogicOperand'
      additionalProperties: false
    SurveyRequireAnswerAction:
      type: object
      description: Requires an element/question to be answered before continuing.
      required:
        - id
        - objective
        - target
      properties:
        id:
          type: string
          format: cuid2
        objective:
          type: string
          enum:
            - requireAnswer
        target:
          type: string
          description: Target element id.
      additionalProperties: false
    SurveyJumpToBlockAction:
      type: object
      description: Jumps to another block or ending when the logic rule matches.
      required:
        - id
        - objective
        - target
      properties:
        id:
          type: string
          format: cuid2
        objective:
          type: string
          enum:
            - jumpToBlock
        target:
          type: string
          format: cuid2
          description: Target block id or ending id.
      additionalProperties: false
    SurveyLogicAction:
      oneOf:
        - $ref: '#/components/schemas/SurveyCalculateAction'
        - $ref: '#/components/schemas/SurveyRequireAnswerAction'
        - $ref: '#/components/schemas/SurveyJumpToBlockAction'
      description: |
        Logic action. Keep referenced ids stable: `calculate.variableId` points to a variable id,
        `requireAnswer.target` points to an element id, and `jumpToBlock.target` points to a block id
        or ending id.
    SurveyBlockLogic:
      type: object
      description: Conditional logic rule evaluated at block level.
      required:
        - id
        - conditions
        - actions
      properties:
        id:
          type: string
          format: cuid2
        conditions:
          $ref: '#/components/schemas/SurveyConditionGroup'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/SurveyLogicAction'
      additionalProperties: false
    CreateSurveyBlock:
      type: object
      description: |
        Block accepted by `POST /api/v3/surveys`. `id` may be omitted and will be generated by the
        server. Provide an explicit cuid2 id when logic in the same request needs to jump to this block.
        For normal sequential flow, omit `logic` and `logicFallback`. `logicFallback` is only valid
        when this same block has at least one `logic` rule.
      required:
        - name
        - elements
      properties:
        id:
          type: string
          format: cuid2
          description: Optional stable block id. Generated when omitted.
        name:
          type: string
          minLength: 1
        elements:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SurveyElement'
        logic:
          type: array
          items:
            $ref: '#/components/schemas/SurveyBlockLogic'
        logicFallback:
          type: string
          format: cuid2
          description: |
            Block or ending id used when no logic condition matches. Only valid when this same block
            has at least one `logic` rule; omit it for normal sequential flow.
        buttonLabel:
          $ref: '#/components/schemas/TranslatableText'
        backButtonLabel:
          $ref: '#/components/schemas/TranslatableText'
      additionalProperties: false
    SurveyEndScreenEnding:
      type: object
      description: Visual end screen displayed after survey completion.
      required:
        - id
        - type
      properties:
        id:
          type: string
          format: cuid2
          description: Stable ending id. `jumpToBlock.target` may point to this id.
        type:
          type: string
          enum:
            - endScreen
        headline:
          $ref: '#/components/schemas/TranslatableText'
        subheader:
          $ref: '#/components/schemas/TranslatableText'
        buttonLabel:
          $ref: '#/components/schemas/TranslatableText'
        buttonLink:
          type: string
        imageUrl:
          type: string
        videoUrl:
          type: string
        hideDefaultIcon:
          type: boolean
          description: Hides the default checkmark icon rendered above the headline when the ending carries no image or video. Omit to keep the icon.
      additionalProperties: false
    SurveyRedirectEnding:
      type: object
      description: |
        Redirects the respondent to a URL after survey completion. External redirects require the
        organization's external URL permission; otherwise write endpoints return `403 Forbidden`.
      required:
        - id
        - type
        - url
      properties:
        id:
          type: string
          format: cuid2
          description: Stable ending id. `jumpToBlock.target` may point to this id.
        type:
          type: string
          enum:
            - redirectToUrl
        url:
          type: string
          format: uri
          description: External redirect URL. Requires the organization's external URL permission.
        label:
          type: string
          description: Optional internal label for redirect endings.
      additionalProperties: false
    SurveyEnding:
      oneOf:
        - $ref: '#/components/schemas/SurveyEndScreenEnding'
        - $ref: '#/components/schemas/SurveyRedirectEnding'
      discriminator:
        propertyName: type
        mapping:
          endScreen: '#/components/schemas/SurveyEndScreenEnding'
          redirectToUrl: '#/components/schemas/SurveyRedirectEnding'
      description: |
        Ending reached after the last block or a jump action. `type` selects the allowed shape;
        unsupported fields are rejected instead of ignored.
    SurveyHiddenFields:
      type: object
      description: |
        Hidden fields, sometimes called embedded data in other survey products. Field ids are stable
        public identifiers and may be referenced by logic, recall, quotas, integrations, and response data.
        Use only letters, numbers, underscores, and hyphens; avoid spaces and reserved ids.
      required:
        - enabled
      properties:
        enabled:
          type: boolean
        fieldIds:
          type: array
          items:
            type: string
            pattern: ^[a-zA-Z0-9_-]+$
          uniqueItems: true
      additionalProperties: false
    CreateSurveyNumberVariable:
      type: object
      required:
        - name
        - type
        - value
      properties:
        id:
          type: string
          format: cuid2
          description: Optional stable variable id. Generated when omitted.
        name:
          type: string
          pattern: ^[a-z0-9_]+$
          description: Unique variable name. Lowercase letters, numbers, and underscores only.
        type:
          type: string
          enum:
            - number
        value:
          type: number
          description: Default numeric value.
      additionalProperties: false
    CreateSurveyTextVariable:
      type: object
      required:
        - name
        - type
        - value
      properties:
        id:
          type: string
          format: cuid2
          description: Optional stable variable id. Generated when omitted.
        name:
          type: string
          pattern: ^[a-z0-9_]+$
          description: Unique variable name. Lowercase letters, numbers, and underscores only.
        type:
          type: string
          enum:
            - text
        value:
          type: string
          description: Default text value.
      additionalProperties: false
    CreateSurveyVariable:
      oneOf:
        - $ref: '#/components/schemas/CreateSurveyNumberVariable'
        - $ref: '#/components/schemas/CreateSurveyTextVariable'
      description: |
        Survey variable accepted by `POST /api/v3/surveys`. `id` may be omitted and will be
        generated by the server. Provide an explicit cuid2 id when logic in the same request needs
        to reference this variable.
    SurveyTrigger:
      type: object
      description: |
        Reference to an existing workspace action class that triggers this app survey. Discover available action-class ids with `GET /api/v3/action-classes`.
      required:
        - actionClassId
      properties:
        actionClassId:
          type: string
          format: cuid2
          description: Id of an action class in the same workspace.
      additionalProperties: false
    SurveyDistribution:
      type: object
      description: |
        App-survey runtime/display settings. Only valid for `type: app`; rejected for link surveys.
        **Replacement semantics (destructive):** when `distribution` is provided on PATCH it fully replaces the stored object — any sub-field you omit is reset to its default, NOT preserved. In particular, omitting `triggers` removes ALL existing triggers, and omitting `displayOption` resets it to `displayOnce`. To change one setting, send the complete desired distribution. To leave distribution untouched, omit the whole `distribution` key.
      properties:
        displayOption:
          type: string
          enum:
            - displayOnce
            - displayMultiple
            - respondMultiple
            - displaySome
          default: displayOnce
          description: |
            How often the survey may be shown to a contact. `displaySome` shows it up to `displayLimit` times (or until the contact responds, whichever comes first).
        displayPercentage:
          type:
            - number
            - 'null'
          minimum: 0.01
          maximum: 100
          default: null
          description: |
            Independent throttle: show the survey to only this percentage of triggered contacts. Optional and valid with any `displayOption`; null/omitted means no throttle (shown to everyone).
        displayLimit:
          type:
            - integer
            - 'null'
          minimum: 0
          default: null
          description: |
            Maximum number of times the survey is shown to a single contact. Required (must be >= 1) when `displayOption` is `displaySome`; otherwise optional.
        recontactDays:
          type:
            - integer
            - 'null'
          minimum: 0
          default: null
          description: Days to wait before showing this survey again to the same contact. Null uses the workspace default.
        autoClose:
          type:
            - integer
            - 'null'
          minimum: 0
          default: null
          description: Seconds of inactivity after which the survey widget auto-closes. Null disables auto-close.
        autoComplete:
          type:
            - integer
            - 'null'
          minimum: 1
          default: null
          description: Automatically stop collecting responses after this many completed responses. Null disables it.
        delay:
          type: integer
          minimum: 0
          default: 0
          description: Seconds to wait after a trigger fires before showing the survey.
        triggers:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/SurveyTrigger'
          description: |
            Action classes that trigger the survey. Every id must reference an existing workspace action class. On PATCH this list fully replaces the survey's triggers — omitting it (or sending `[]`) removes all existing triggers.
      additionalProperties: false
      example:
        displayOption: displaySome
        displayLimit: 3
        displayPercentage: null
        recontactDays: 7
        autoClose: null
        autoComplete: null
        delay: 0
        triggers:
          - actionClassId: clyy1234567890123456789012
    SegmentFilterValue:
      description: |
        Comparison value for a segment filter condition. A string or number for most operators; a relative-date object (`{ amount, unit }`) for `isOlderThan` / `isNewerThan`; a two-element `[from, to]` string array for `isBetween`. Ignored for `isSet` / `isNotSet` but still required.
      oneOf:
        - type: string
        - type: number
        - type: object
          required:
            - amount
            - unit
          properties:
            amount:
              type: number
            unit:
              type: string
              enum:
                - days
                - weeks
                - months
                - years
          additionalProperties: false
        - type: array
          items:
            type: string
          minItems: 2
          maxItems: 2
    SegmentFilter:
      description: |
        A single targeting condition. `root.type` selects the subject and determines the valid `qualifier.operator` set: `attribute` (a workspace contact-attribute key), `person` (a built-in person identifier such as `userId`/`email`), `segment` (membership in another segment), or `device`. Each variant is one member of this union; the matching member is chosen by `root.type`.
      oneOf:
        - title: AttributeFilter
          description: Matches on a workspace contact-attribute value.
          type: object
          required:
            - id
            - root
            - qualifier
            - value
          properties:
            id:
              type: string
              format: cuid2
            root:
              type: object
              required:
                - type
                - contactAttributeKey
              properties:
                type:
                  type: string
                  enum:
                    - attribute
                contactAttributeKey:
                  type: string
                  description: A contact-attribute key defined in the workspace (e.g. `plan`, `role`).
              additionalProperties: false
            qualifier:
              type: object
              required:
                - operator
              properties:
                operator:
                  type: string
                  enum:
                    - lessThan
                    - lessEqual
                    - greaterThan
                    - greaterEqual
                    - equals
                    - notEquals
                    - isSet
                    - isNotSet
                    - contains
                    - doesNotContain
                    - startsWith
                    - endsWith
                    - isOlderThan
                    - isNewerThan
                    - isBefore
                    - isAfter
                    - isBetween
                    - isSameDay
              additionalProperties: false
            value:
              $ref: '#/components/schemas/SegmentFilterValue'
          additionalProperties: false
        - title: PersonFilter
          description: Matches on a built-in person identifier.
          type: object
          required:
            - id
            - root
            - qualifier
            - value
          properties:
            id:
              type: string
              format: cuid2
            root:
              type: object
              required:
                - type
                - personIdentifier
              properties:
                type:
                  type: string
                  enum:
                    - person
                personIdentifier:
                  type: string
                  description: A built-in person identifier (e.g. `userId`).
              additionalProperties: false
            qualifier:
              type: object
              required:
                - operator
              properties:
                operator:
                  type: string
                  enum:
                    - equals
                    - notEquals
                    - isSet
                    - isNotSet
                    - contains
                    - doesNotContain
                    - startsWith
                    - endsWith
              additionalProperties: false
            value:
              $ref: '#/components/schemas/SegmentFilterValue'
          additionalProperties: false
        - title: SegmentFilter
          description: Matches on membership in another segment.
          type: object
          required:
            - id
            - root
            - qualifier
            - value
          properties:
            id:
              type: string
              format: cuid2
            root:
              type: object
              required:
                - type
                - segmentId
              properties:
                type:
                  type: string
                  enum:
                    - segment
                segmentId:
                  type: string
                  description: Id of the segment to test membership against.
              additionalProperties: false
            qualifier:
              type: object
              required:
                - operator
              properties:
                operator:
                  type: string
                  enum:
                    - userIsIn
                    - userIsNotIn
              additionalProperties: false
            value:
              $ref: '#/components/schemas/SegmentFilterValue'
          additionalProperties: false
        - title: DeviceFilter
          description: Matches on the contact's device type.
          type: object
          required:
            - id
            - root
            - qualifier
            - value
          properties:
            id:
              type: string
              format: cuid2
            root:
              type: object
              required:
                - type
                - deviceType
              properties:
                type:
                  type: string
                  enum:
                    - device
                deviceType:
                  type: string
                  description: Device type (e.g. `desktop`, `phone`).
              additionalProperties: false
            qualifier:
              type: object
              required:
                - operator
              properties:
                operator:
                  type: string
                  enum:
                    - equals
                    - notEquals
              additionalProperties: false
            value:
              $ref: '#/components/schemas/SegmentFilterValue'
          additionalProperties: false
    SegmentFilters:
      type: array
      description: |
        Contact targeting filter tree. An empty array targets everyone. Each node joins the previous one via its `connector` (`and`/`or`; the first node's connector is null). A node's `resource` is either a single filter condition or a nested filter group (enabling parenthesized `and`/`or` logic).
      items:
        type: object
        required:
          - id
          - connector
          - resource
        properties:
          id:
            type: string
            format: cuid2
          connector:
            type:
              - string
              - 'null'
            enum:
              - and
              - or
              - null
            description: Logical connector joining this node to the previous one. Null for the first node.
          resource:
            oneOf:
              - $ref: '#/components/schemas/SegmentFilter'
              - $ref: '#/components/schemas/SegmentFilters'
            description: A single filter condition, or a nested filter group for grouped logic.
        additionalProperties: false
    SurveyTargeting:
      type: object
      description: |
        App-survey contact targeting. Only valid for `type: app`. `filters: []` targets everyone. Setting or changing non-empty filters requires the Contacts entitlement; otherwise create/patch returns 403.

        `attribute` filters reference workspace contact-attribute keys (discover them via `GET /api/v3/contact-attribute-keys`) and `segment` filters reference other segment ids — both are workspace-scoped resources you must obtain before constructing filters (an invalid key/id targets no one rather than erroring). See `SegmentFilter` for the per-`root.type` operator sets.
      required:
        - filters
      properties:
        filters:
          $ref: '#/components/schemas/SegmentFilters'
      additionalProperties: false
    CreateSurveyRequest:
      type: object
      description: |
        Strict v3 survey creation document. This endpoint accepts survey structure only: name,
        metadata, languages, welcome card, blocks/elements/logic, endings, hidden fields, and variables.
        App surveys (`type: app`) additionally accept the `distribution` (display options + triggers) and `targeting` (contact segment filters) objects; these are rejected for `link` surveys.
        It rejects legacy `questions` and out-of-scope settings such as styling, follow-ups, recaptcha, single-use/email verification, slug, custom scripts, analytics fields, timestamps, and `createdBy`.

        Translatable fields use real locale-code maps. The map must include the canonical
        `defaultLanguage` key, such as `en-US`, so the server can persist the internal default
        translation. Locale keys must be canonical BCP 47 codes such as `de-DE`, `pt-PT`, or
        `zh-Hans-CN`. Non-default locale keys must be declared in `languages`; undeclared locale
        keys in metadata, welcome cards, blocks, or endings are rejected with `unsupported_locale`.

        `blocks[].id` and `variables[].id` may be omitted on create and will be generated by the
        server. Provide explicit cuid2 ids when other fields in the same request reference them.
        For normal sequential flow, omit `logicFallback`. It is only valid together with a non-empty
        `logic` array on the same block.
      required:
        - workspaceId
        - name
        - blocks
      properties:
        workspaceId:
          type: string
          format: cuid2
          description: Workspace where the survey will be created. Requires read/write access.
        name:
          type: string
          minLength: 1
        type:
          type: string
          enum:
            - link
            - app
          default: link
          description: |
            Survey type. `link` surveys are distributed by URL; `app` surveys are shown in-app and configure their runtime behavior via the `distribution` and `targeting` objects. `type` is immutable after creation (it cannot be changed via PATCH).
        status:
          type: string
          enum:
            - draft
            - inProgress
            - paused
            - completed
          default: draft
        metadata:
          allOf:
            - $ref: '#/components/schemas/SurveyMetadata'
          default: {}
        defaultLanguage:
          allOf:
            - $ref: '#/components/schemas/LocaleCode'
          default: en-US
          description: Default authoring locale. Translatable maps must include this locale key.
        languages:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/CreateSurveyLanguage'
          description: |
            Optional survey language configuration. Every non-default locale used by translatable maps
            must be declared here; omitted languages are not inferred from map keys.
        welcomeCard:
          allOf:
            - $ref: '#/components/schemas/SurveyWelcomeCard'
          default:
            enabled: false
        blocks:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CreateSurveyBlock'
        endings:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/SurveyEnding'
        hiddenFields:
          allOf:
            - $ref: '#/components/schemas/SurveyHiddenFields'
          default:
            enabled: false
        variables:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/CreateSurveyVariable'
        distribution:
          allOf:
            - $ref: '#/components/schemas/SurveyDistribution'
          description: App-survey runtime/display settings. Only valid when `type` is `app`.
        targeting:
          allOf:
            - $ref: '#/components/schemas/SurveyTargeting'
          description: App-survey contact targeting. Only valid when `type` is `app`.
      additionalProperties: false
    SurveyLanguage:
      type: object
      description: |
        Language configured for this survey. GET responses expose the server-emitted code/tag used as the
        translatable map key. Existing surveys can use region-qualified, language-only, or script-only codes.
        Disabled languages can still be read by the management API so unfinished translations can be completed.
      required:
        - code
        - default
        - enabled
      properties:
        code:
          type: string
          description: Server-emitted survey language code/tag used as the translatable map key.
          example: en-US
        alias:
          type:
            - string
            - 'null'
          description: Optional configured alias accepted by `?lang` for compatibility and agent discovery.
          example: english
        default:
          type: boolean
          description: Whether this is the default authoring language.
        enabled:
          type: boolean
          description: Whether this language is enabled for respondent-facing delivery.
    SurveyBlock:
      type: object
      description: |
        Block-based survey section. Block ids are stable public identifiers. Logic and fallbacks can
        jump to block ids or ending ids, so clients and agents should preserve ids unless intentionally
        creating/deleting a block.
      required:
        - id
        - name
        - elements
      properties:
        id:
          type: string
          format: cuid2
          description: Stable block id.
        name:
          type: string
          minLength: 1
        elements:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SurveyElement'
        logic:
          type: array
          items:
            $ref: '#/components/schemas/SurveyBlockLogic'
        logicFallback:
          type: string
          format: cuid2
          description: |
            Block or ending id used when no logic condition matches. Only valid when this same block
            has at least one `logic` rule; omit it for normal sequential flow.
        buttonLabel:
          $ref: '#/components/schemas/TranslatableText'
        backButtonLabel:
          $ref: '#/components/schemas/TranslatableText'
      additionalProperties: false
    SurveyNumberVariable:
      type: object
      description: |
        Number variable. Used by `calculate` logic actions with numeric operators such as `add`,
        `subtract`, `multiply`, `divide`, or `assign`.
      required:
        - id
        - name
        - type
        - value
      properties:
        id:
          type: string
          format: cuid2
          description: Stable variable id referenced from logic.
        name:
          type: string
          pattern: ^[a-z0-9_]+$
          description: Unique variable name. `pattern` is the charset of a *stored* name; a newly declared one is held to more than that. It must match `^[a-z][a-z0-9_]*$` (so no leading digit or underscore), must not take an Embedded Data reserved name (`country`, `browser`, `language`, …), and must not collide case-insensitively with a hidden field id on the same survey. Names the survey already declares are grandfathered, so re-sending an existing document never trips this. A new name that breaks any of the three answers 400 `forbidden_identifier`.
        type:
          type: string
          enum:
            - number
        value:
          type: number
          description: Default numeric value.
      additionalProperties: false
    SurveyTextVariable:
      type: object
      description: |
        Text variable. Used by `calculate` logic actions with text operators such as `assign` or `concat`.
      required:
        - id
        - name
        - type
        - value
      properties:
        id:
          type: string
          format: cuid2
          description: Stable variable id referenced from logic.
        name:
          type: string
          pattern: ^[a-z0-9_]+$
          description: Unique variable name. `pattern` is the charset of a *stored* name; a newly declared one is held to more than that. It must match `^[a-z][a-z0-9_]*$` (so no leading digit or underscore), must not take an Embedded Data reserved name (`country`, `browser`, `language`, …), and must not collide case-insensitively with a hidden field id on the same survey. Names the survey already declares are grandfathered, so re-sending an existing document never trips this. A new name that breaks any of the three answers 400 `forbidden_identifier`.
        type:
          type: string
          enum:
            - text
        value:
          type: string
          description: Default text value.
      additionalProperties: false
    SurveyVariable:
      oneOf:
        - $ref: '#/components/schemas/SurveyNumberVariable'
        - $ref: '#/components/schemas/SurveyTextVariable'
      description: |
        Survey variable. Variable ids are stable references used by logic and calculation actions.
        Variable names are human-readable labels and must be unique within the survey.
    SurveyResource:
      type: object
      required:
        - id
        - workspaceId
        - createdAt
        - updatedAt
        - archivedAt
        - name
        - type
        - status
        - metadata
        - defaultLanguage
        - languages
        - welcomeCard
        - blocks
        - endings
        - hiddenFields
        - variables
      properties:
        id:
          type: string
        workspaceId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        archivedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: Soft-delete/archive marker (ISO 8601); `null` when the survey is active.
        name:
          type: string
        type:
          type: string
          enum:
            - link
            - app
            - website
            - web
        status:
          type: string
          enum:
            - draft
            - inProgress
            - paused
            - completed
        metadata:
          anyOf:
            - $ref: '#/components/schemas/SurveyMetadata'
            - type: 'null'
        defaultLanguage:
          type: string
          description: Emitted language code/tag for the survey default language. The internal `default` translation key is never exposed.
        languages:
          type: array
          items:
            $ref: '#/components/schemas/SurveyLanguage'
        welcomeCard:
          $ref: '#/components/schemas/SurveyWelcomeCard'
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/SurveyBlock'
        endings:
          type: array
          items:
            $ref: '#/components/schemas/SurveyEnding'
        hiddenFields:
          $ref: '#/components/schemas/SurveyHiddenFields'
        variables:
          type: array
          items:
            $ref: '#/components/schemas/SurveyVariable'
        distribution:
          allOf:
            - $ref: '#/components/schemas/SurveyDistribution'
          description: App-survey runtime/display settings. Present only for app surveys; omitted for link surveys.
        targeting:
          allOf:
            - $ref: '#/components/schemas/SurveyTargeting'
          description: App-survey contact targeting. Present only for app surveys; omitted for link surveys.
    AISurveyGenerationLocaleCode:
      type: string
      enum:
        - de-DE
        - en-US
        - es-ES
        - fr-FR
        - hu-HU
        - ja-JP
        - nl-NL
        - pt-BR
        - pt-PT
        - ro-RO
        - ru-RU
        - sv-SE
        - tr-TR
        - zh-Hans-CN
        - zh-Hant-TW
      description: Supported app locale code that AI survey creation can return.
      example: en-US
    GenerateSurveyRequest:
      type: object
      description: |
        AI survey creation request. `prompt` is used only to create a draft payload; it is not
        persisted by this endpoint. The generated payload is validated and returned to the caller for
        a separate create request.
      required:
        - workspaceId
        - prompt
      properties:
        workspaceId:
          type: string
          format: cuid2
          description: Workspace where the AI-created survey draft would be created. Requires read/write access.
        prompt:
          type: string
          minLength: 4
          maxLength: 1200
          description: |
            Natural-language survey goal and audience. Prompts with fewer than 24 characters or fewer
            than four whitespace-separated words return prompt feedback before any AI provider call.
        type:
          type: string
          enum:
            - link
            - app
          default: link
          description: Survey type to generate. The AI generates the survey content (blocks/questions) for both types; for `app` it additionally seeds a default `distribution` (display once, no triggers, no targeting) that you finish configuring before publishing.
        language:
          $ref: '#/components/schemas/AISurveyGenerationLocaleCode'
          description: |
            Preferred survey language. Session clients should send the logged-in user's language.
            The generator uses it when the prompt language is ambiguous or cannot be confidently
            matched to a supported app locale.
      additionalProperties: false
    GeneratedSurveyValidationLanguage:
      type: object
      required:
        - code
        - default
        - enabled
      properties:
        code:
          $ref: '#/components/schemas/AISurveyGenerationLocaleCode'
        default:
          type: boolean
        enabled:
          type: boolean
      additionalProperties: false
    GeneratedSurveyValidationResult:
      type: object
      required:
        - valid
        - invalid_params
        - languages
      properties:
        valid:
          type: boolean
          description: Whether the generated create payload passed the same v3 create preparation pipeline.
        invalid_params:
          type: array
          description: Repairable validation errors. Successful generate responses return an empty array.
          items:
            $ref: '#/components/schemas/InvalidParam'
        languages:
          type: array
          description: Languages that the generated create payload would connect or create.
          items:
            $ref: '#/components/schemas/GeneratedSurveyValidationLanguage'
      additionalProperties: false
    GenerateSurveyResult:
      type: object
      required:
        - language
        - payload
        - validation
      properties:
        language:
          $ref: '#/components/schemas/AISurveyGenerationLocaleCode'
          description: Supported app locale used for the AI-created survey content and create payload language maps.
        payload:
          allOf:
            - $ref: '#/components/schemas/CreateSurveyRequest'
          description: |
            Strict create payload ready for `POST /api/v3/surveys`. It always has `status: draft`.
        validation:
          $ref: '#/components/schemas/GeneratedSurveyValidationResult'
      additionalProperties: false
    ValidateSurveyCreateRequest:
      type: object
      required:
        - operation
        - data
      properties:
        operation:
          type: string
          enum:
            - create
        data:
          description: Intended create payload. Invalid documents are allowed so the endpoint can return repairable validation errors.
          anyOf:
            - $ref: '#/components/schemas/CreateSurveyRequest'
            - type: object
              additionalProperties: true
      additionalProperties: false
    PatchSurveyRequest:
      type: object
      minProperties: 1
      description: |
        Patch payload shape. Top-level fields are partial; any provided nested object or array
        fully replaces that subtree. Omitted top-level fields are preserved. Immutable/system fields
        such as `id`, `workspaceId`, `type`, `defaultLanguage`, timestamps, `questions`, analytics, styling,
        and scripts are rejected. App surveys (stored `type: app`) additionally accept `distribution` and `targeting`; both are rejected for link surveys, and changing `targeting` filters requires the Contacts entitlement.

        `metadata`, `languages`, `welcomeCard`, `blocks`, `endings`, `hiddenFields`, and `variables`
        replace their full top-level value when provided. Missing ids in replaced arrays are deletions.
        Non-default locale keys in translatable maps must be declared in `languages`; undeclared locale
        keys are rejected with `unsupported_locale`. To remove a language, remove it from both
        `languages` and every translatable map that contains that locale key.
        Use `/api/v3/surveys/validate` with `operation: patch` before committing automated or agentic
        changes.
      properties:
        name:
          type: string
          minLength: 1
        status:
          type: string
          enum:
            - draft
            - inProgress
            - paused
            - completed
        metadata:
          allOf:
            - $ref: '#/components/schemas/SurveyMetadata'
        languages:
          type: array
          items:
            $ref: '#/components/schemas/CreateSurveyLanguage'
          description: |
            Replaces the survey language configuration. The default language cannot be changed through
            PATCH; any `default: true` entry must match the existing default language. Languages referenced
            by `metadata`, `welcomeCard`, `blocks`, or `endings` translatable maps must be explicitly
            declared here, so remove the locale key from those maps as well when intentionally removing
            a language.
        welcomeCard:
          $ref: '#/components/schemas/SurveyWelcomeCard'
        blocks:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SurveyBlock'
        endings:
          type: array
          items:
            $ref: '#/components/schemas/SurveyEnding'
        hiddenFields:
          $ref: '#/components/schemas/SurveyHiddenFields'
        variables:
          type: array
          items:
            $ref: '#/components/schemas/SurveyVariable'
        distribution:
          allOf:
            - $ref: '#/components/schemas/SurveyDistribution'
          description: |
            App-survey runtime/display settings. Only valid for stored `type: app`. Replaces the full distribution; omitted scalars reset to their defaults.
        targeting:
          allOf:
            - $ref: '#/components/schemas/SurveyTargeting'
          description: App-survey contact targeting. Only valid for stored app surveys.
      additionalProperties: false
    ValidateSurveyPatchRequest:
      type: object
      required:
        - operation
        - surveyId
        - data
      properties:
        operation:
          type: string
          enum:
            - patch
        surveyId:
          type: string
          format: cuid2
        data:
          description: Intended patch payload. Invalid documents are allowed so the endpoint can return repairable validation errors.
          anyOf:
            - $ref: '#/components/schemas/PatchSurveyRequest'
            - type: object
              additionalProperties: true
      additionalProperties: false
    ValidateSurveyRequest:
      oneOf:
        - $ref: '#/components/schemas/ValidateSurveyCreateRequest'
        - $ref: '#/components/schemas/ValidateSurveyPatchRequest'
      discriminator:
        propertyName: operation
        mapping:
          create: '#/components/schemas/ValidateSurveyCreateRequest'
          patch: '#/components/schemas/ValidateSurveyPatchRequest'
    SurveyValidationLanguage:
      type: object
      required:
        - code
        - default
        - enabled
        - writeBehavior
      properties:
        code:
          $ref: '#/components/schemas/LocaleCode'
        default:
          type: boolean
        enabled:
          type: boolean
        writeBehavior:
          type: string
          enum:
            - connect_or_create
          description: Validation is read-only; a real write would connect an existing language or create it if missing.
      additionalProperties: false
    SurveyValidationResult:
      type: object
      required:
        - valid
        - operation
        - invalid_params
      properties:
        valid:
          type: boolean
          description: Whether the submitted survey document is valid.
        operation:
          type: string
          enum:
            - create
            - patch
        invalid_params:
          type: array
          description: Repairable validation errors using document-relative paths.
          items:
            $ref: '#/components/schemas/InvalidParam'
        languages:
          type: array
          description: Languages that a successful write would connect or create. Present only when `valid=true`.
          items:
            $ref: '#/components/schemas/SurveyValidationLanguage'
      additionalProperties: false
    ResponseResolution:
      type: object
      description: |
        Receipt describing how `answers[]` and `embeddedData[]` labels were produced. It exists so a consumer can tell whether the labels it is reading are the wording the respondent actually saw.
      required:
        - labelPolicy
        - labelsLanguage
        - surveyUpdatedAt
      properties:
        labelPolicy:
          type: string
          enum:
            - currentSurveyDefinition
          description: |
            Where labels came from. Today the only value is `currentSurveyDefinition`: labels are resolved at **read time** against the survey as it stands now. Nothing about the survey is snapshotted when a response is written and there is no survey-version model, so a response collected under an older headline reads back under today's wording — text the respondent may never have seen. Typeform, SurveyMonkey, Qualtrics, Google Forms and Jotform all behave this way, so this is the industry norm rather than a shortcut. Compare `surveyUpdatedAt` against the response's `createdAt` to detect that the definition moved after collection. If a write-time label snapshot ever ships, a second value `asAsked` is added here and consumers branch on it — treat this as an open enum.
        labelsLanguage:
          type:
            - string
            - 'null'
          description: The language the labels in this payload were resolved in. Follows the response's `language` when it is set and the survey has that language enabled, otherwise the survey's default language. `null` when the survey carries no translations.
        surveyUpdatedAt:
          type: string
          format: date-time
          description: When the survey definition was last modified. Later than the response's `createdAt` means the wording in `elementLabel` may have drifted from what was asked.
      additionalProperties: false
    ResponseAnswerBase:
      type: object
      description: Fields every answer carries, whatever the element type. `elementType` selects the value-bearing shape — see `ResponseAnswer`.
      required:
        - position
        - elementId
        - elementType
        - elementLabel
      properties:
        position:
          type: integer
          minimum: 1
          description: 1-based position of the element in the current survey definition, so a consumer can present answers in survey order without fetching the survey. Elements the respondent never reached are absent from `answers[]` entirely rather than present-and-empty.
        elementId:
          type: string
          description: Stable element id, as authored on the survey.
        elementType:
          type: string
          enum:
            - openText
            - multipleChoiceSingle
            - multipleChoiceMulti
            - nps
            - rating
            - csat
            - ces
            - consent
            - pictureSelection
            - cta
            - date
            - fileUpload
            - cal
            - matrix
            - address
            - ranking
            - contactInfo
          description: The element's type in the current survey definition. Matches the `type` of the corresponding `SurveyElement`.
        elementLabel:
          type: string
          description: The element's headline, resolved in `resolution.labelsLanguage`. Read at request time from the current definition — see `ResponseResolution` for what that means for older responses.
        durationSeconds:
          type: number
          minimum: 0
          maximum: 86400
          description: |
            Seconds the respondent spent on this element. Converted from the stored per-element time-to-complete, which is recorded in milliseconds. This telemetry is reported by the client and is therefore not trustworthy input: it is clamped to at most 24 hours per element at the write boundary, so treat it as an indication rather than a measurement. Absent when the submission carried no timing for this element.
    ResponseAnswerText:
      allOf:
        - $ref: '#/components/schemas/ResponseAnswerBase'
        - type: object
          required:
            - valueText
          properties:
            elementType:
              type: string
              enum:
                - openText
            valueText:
              type: string
              description: The submitted text, verbatim.
            inputType:
              type: string
              enum:
                - text
                - email
                - url
                - number
                - phone
              description: The element's configured input type in the current definition. Useful for rendering and for knowing how the value was validated at collection time; the value itself is always returned as a string, including for `number`.
      unevaluatedProperties: false
      description: Free-text answer to an `openText` element.
    ResponseAnswerNumber:
      allOf:
        - $ref: '#/components/schemas/ResponseAnswerBase'
        - type: object
          required:
            - valueNumber
            - range
          properties:
            elementType:
              type: string
              enum:
                - nps
                - rating
                - csat
                - ces
            valueNumber:
              type: number
              description: The submitted score.
            range:
              type: object
              description: The scale the score was collected on, from the current definition. Returned because a bare `8` is uninterpretable without it, and because scales are editable — a consumer comparing scores across time needs to see that the range moved.
              required:
                - min
                - max
              properties:
                min:
                  type: number
                max:
                  type: number
              additionalProperties: false
            scale:
              type: string
              enum:
                - number
                - smiley
                - star
              description: How the scale was presented. Carried by the element types that configure one — `rating`, `csat` and `ces` — and absent for `nps`, which has no scale presentation.
      unevaluatedProperties: false
      description: Numeric-scale answer. Covers `nps` (0–10), `rating` (configurable range and presentation), `csat` and `ces`.
    ResponseAnswerBoolean:
      allOf:
        - $ref: '#/components/schemas/ResponseAnswerBase'
        - type: object
          required:
            - valueBoolean
            - rawValue
          properties:
            elementType:
              type: string
              enum:
                - consent
                - cta
            valueBoolean:
              type: boolean
              description: Whether the respondent accepted (`consent`) or clicked through (`cta`). Derived from the stored token, which is why `rawValue` is returned alongside it.
            rawValue:
              type: string
              description: The token as stored — conventionally `accepted` for `consent` and `clicked` for `cta`. Returned because the boolean is a derivation and this is the underlying fact.
      unevaluatedProperties: false
      description: Acknowledgement answer. Covers `consent` (accepted) and `cta` (clicked through). A `cta` element the respondent skipped has no entry in `answers[]` at all.
    ResponseValueMatch:
      type: string
      enum:
        - exact
        - label
        - other
        - unmatched
      description: |
        How a stored raw value was resolved against the current survey definition. Precedence is fixed and applied in this order:

        - `exact` — the stored value matched an option **id** in the current definition.
        - `label` — the stored value matched an option's **label text** (ids are stable, labels are
          editable and language-dependent, so a label match is weaker evidence).

        - `other` — the value arrived through the element's **Other** free-text input. Only reported when
          the element actually has that input enabled and the value was submitted through it.

        - `unmatched` — no option resolves. The raw value is still returned; it is **not** silently
          reclassified as `other`, because a *renamed* option is also unmatched text and filing it as a
          write-in would misattribute the answer.
    ResponseSelection:
      type: object
      description: |
        One selected option within a choice-style answer. `optionId` plus `rawValue` is deliberately a two-field split — the same split the Hub stores as `value_id` plus `value_text` — because option ids are stable while labels are editable and language-dependent. Consumers that need to group or compare across time should key on `optionId`; consumers rendering to a human should use `optionLabel`.
      required:
        - optionId
        - optionLabel
        - rawValue
        - match
      properties:
        optionId:
          type:
            - string
            - 'null'
          description: Resolved option id, or the literal `other` for a write-in. `null` when `match` is `unmatched`.
        optionLabel:
          type:
            - string
            - 'null'
          description: Option label in the resolved language. `null` when `match` is `unmatched`.
        rawValue:
          type: string
          description: 'The value as stored on the response, verbatim and before resolution — always present, and the string to use when rebuilding the stored map. Note what is stored differs by element type: `multipleChoiceSingle`, `multipleChoiceMulti` and `ranking` store the option **label** in the respondent''s language, while `pictureSelection` stores the option **id**. `""` occurs when the respondent selected Other and left it blank, and is returned rather than dropped.'
        match:
          $ref: '#/components/schemas/ResponseValueMatch'
        rank:
          type: integer
          minimum: 1
          description: 1-based rank, present only for `ranking` elements. Array order already reflects the rank; this field makes it explicit so consumers need not rely on ordering.
      additionalProperties: false
    ResponseAnswerSelection:
      allOf:
        - $ref: '#/components/schemas/ResponseAnswerBase'
        - type: object
          required:
            - selections
          properties:
            elementType:
              type: string
              enum:
                - multipleChoiceSingle
                - multipleChoiceMulti
                - pictureSelection
                - ranking
            selections:
              type: array
              description: The chosen options, resolved against the current definition. Always an array, including for `multipleChoiceSingle`, so consumers need one code path rather than two. For `ranking`, the array is in rank order and each entry also carries an explicit `rank`.
              items:
                $ref: '#/components/schemas/ResponseSelection'
      unevaluatedProperties: false
      description: Choice-style answer. Covers `multipleChoiceSingle`, `multipleChoiceMulti`, `pictureSelection` and `ranking`. See `ResponseValueMatch` for how each selection was resolved and why an unresolvable value is never reclassified as a write-in.
    ResponseAnswerDate:
      allOf:
        - $ref: '#/components/schemas/ResponseAnswerBase'
        - type: object
          required:
            - valueDate
          properties:
            elementType:
              type: string
              enum:
                - date
            valueDate:
              type: string
              description: The submitted date as stored, an ISO-8601 date or date-time string. No `format` is asserted because historical rows were written by several client versions and the stored precision varies; parse defensively.
      unevaluatedProperties: false
      description: Date answer.
    ResponseAnswerFileUpload:
      allOf:
        - $ref: '#/components/schemas/ResponseAnswerBase'
        - type: object
          required:
            - fileUrls
          properties:
            elementType:
              type: string
              enum:
                - fileUpload
            fileUrls:
              type: array
              description: URLs of the uploaded files. These point at private storage and are not publicly fetchable; access follows the same authorization as the response itself. Deleting the response deletes the underlying files.
              items:
                type: string
            fileCount:
              type: integer
              minimum: 0
              description: Convenience count of `fileUrls`, so a list consumer need not materialize the array.
      unevaluatedProperties: false
      description: File-upload answer.
    ResponseAnswerBooking:
      allOf:
        - $ref: '#/components/schemas/ResponseAnswerBase'
        - type: object
          required:
            - booked
            - rawValue
          properties:
            elementType:
              type: string
              enum:
                - cal
            booked:
              type: boolean
              description: Whether the respondent completed a booking.
            rawValue:
              type: string
              description: The token as stored, verbatim — conventionally `booked`. Required, like the equivalent field on `consent` and `cta`, because `booked` is a derivation and this is the underlying value a client needs to rebuild the stored map.
      unevaluatedProperties: false
      description: Scheduling answer for a `cal` element. Only the fact of the booking is recorded on the response; the meeting itself lives in the scheduling provider and is not proxied by this API.
    ResponseAnswerMatrix:
      allOf:
        - $ref: '#/components/schemas/ResponseAnswerBase'
        - type: object
          required:
            - rows
          properties:
            elementType:
              type: string
              enum:
                - matrix
            rows:
              type: array
              description: One entry per row the respondent answered. Rows left blank are omitted rather than returned with a null column. Both sides of a matrix cell need resolving against the current definition, so each entry reports its own `match` — see `ResponseValueMatch`.
              items:
                type: object
                required:
                  - rawKey
                  - rowLabel
                  - rawValue
                  - columnLabel
                  - match
                properties:
                  rawKey:
                    type: string
                    description: The stored map key for this row, verbatim. Matrix answers are stored keyed by the **localized row label** in the respondent's language, not by row id — so this is the string to use when rebuilding the stored object, and it is not necessarily equal to `rowLabel`, which is resolved in the *current* definition's language.
                  rowId:
                    type:
                      - string
                      - 'null'
                    description: Row id resolved from the current definition, or `null` when the stored key matches no current row. Derived, never stored.
                  rowLabel:
                    type: string
                    description: Row label in the resolved language. Falls back to `rawKey` when the row no longer resolves.
                  columnId:
                    type:
                      - string
                      - 'null'
                    description: Column id resolved from the current definition, or `null` when it no longer resolves. Derived, never stored.
                  columnLabel:
                    type:
                      - string
                      - 'null'
                    description: Column label in the resolved language. `null` when `match` is `unmatched`.
                  rawValue:
                    type: string
                    description: The selected column as stored, verbatim — the localized column label, not a column id. This is the value to use when rebuilding the stored object.
                  match:
                    $ref: '#/components/schemas/ResponseValueMatch'
                additionalProperties: false
      unevaluatedProperties: false
      description: Matrix answer — one selected column per answered row.
    ResponseAnswerComposite:
      allOf:
        - $ref: '#/components/schemas/ResponseAnswerBase'
        - type: object
          required:
            - fields
          properties:
            elementType:
              type: string
              enum:
                - address
                - contactInfo
            fields:
              type: array
              description: |
                The element's sub-fields, **every slot, in storage order**, including ones the respondent left blank (`valueText: ""`). Blanks are returned rather than omitted because the stored value is a positional fixed-length array — `address` has 6 slots, `contactInfo` has 5 — so dropping an empty slot would shift every later value onto the wrong field and make the stored array impossible to rebuild.
              items:
                type: object
                required:
                  - slot
                  - fieldId
                  - fieldLabel
                  - valueText
                properties:
                  slot:
                    type: integer
                    minimum: 0
                    description: 0-based index of this sub-field in the stored array. Reconstruct the stored value by ordering on this and taking `valueText`.
                  fieldId:
                    type: string
                    enum:
                      - addressLine1
                      - addressLine2
                      - city
                      - state
                      - zip
                      - country
                      - firstName
                      - lastName
                      - email
                      - phone
                      - company
                    description: Stable sub-field id. `address` uses `addressLine1`, `addressLine2`, `city`, `state`, `zip`, `country` in that order; `contactInfo` uses `firstName`, `lastName`, `email`, `phone`, `company`.
                  fieldLabel:
                    type: string
                    description: Sub-field label in the resolved language.
                  valueText:
                    type: string
                    description: The submitted value, verbatim. `""` when the respondent left it blank.
                additionalProperties: false
      unevaluatedProperties: false
      description: Composite answer whose value is a set of labelled sub-fields. Covers `address` and `contactInfo`. Stored as a positional array of strings, which is why every slot is reported.
    ResponseAnswer:
      oneOf:
        - $ref: '#/components/schemas/ResponseAnswerText'
        - $ref: '#/components/schemas/ResponseAnswerNumber'
        - $ref: '#/components/schemas/ResponseAnswerBoolean'
        - $ref: '#/components/schemas/ResponseAnswerSelection'
        - $ref: '#/components/schemas/ResponseAnswerDate'
        - $ref: '#/components/schemas/ResponseAnswerFileUpload'
        - $ref: '#/components/schemas/ResponseAnswerBooking'
        - $ref: '#/components/schemas/ResponseAnswerMatrix'
        - $ref: '#/components/schemas/ResponseAnswerComposite'
      discriminator:
        propertyName: elementType
        mapping:
          openText: '#/components/schemas/ResponseAnswerText'
          nps: '#/components/schemas/ResponseAnswerNumber'
          rating: '#/components/schemas/ResponseAnswerNumber'
          csat: '#/components/schemas/ResponseAnswerNumber'
          ces: '#/components/schemas/ResponseAnswerNumber'
          consent: '#/components/schemas/ResponseAnswerBoolean'
          cta: '#/components/schemas/ResponseAnswerBoolean'
          multipleChoiceSingle: '#/components/schemas/ResponseAnswerSelection'
          multipleChoiceMulti: '#/components/schemas/ResponseAnswerSelection'
          pictureSelection: '#/components/schemas/ResponseAnswerSelection'
          ranking: '#/components/schemas/ResponseAnswerSelection'
          date: '#/components/schemas/ResponseAnswerDate'
          fileUpload: '#/components/schemas/ResponseAnswerFileUpload'
          cal: '#/components/schemas/ResponseAnswerBooking'
          matrix: '#/components/schemas/ResponseAnswerMatrix'
          address: '#/components/schemas/ResponseAnswerComposite'
          contactInfo: '#/components/schemas/ResponseAnswerComposite'
      description: |
        One answer, carrying the element's id, its label, its type and its value. `elementType` selects the shape: switch on it rather than probing for which value field is present.

        Answers are a **typed array**, not a map keyed by element id, because a consumer holding only a response would otherwise see bare ids and have to fetch the survey and join to learn what was asked — a join that is easy to get wrong and that agent clients cannot make cheaply. The array also separates answers from hidden fields and variables, which the stored representation mixes into one flat map. Non-answer data lives in `embeddedData[]`.

        Several element types share a value shape and therefore a schema — the four numeric scales, the four choice styles, the two composites. All seventeen element types are covered.

        Only elements the respondent actually reached appear here. Data whose element has since been deleted appears in `unresolved[]` instead.
    ResponseEmbeddedDatum:
      type: object
      description: |
        One piece of non-answer data carried by the response. Survey **variables**, **hidden fields** and **auto-captured context** are one concept here rather than three parallel ones: they all have a key, a provenance, a declared type and a label, and consumers treat them alike.

        Auto-captured (`reserved`) entries are drawn from the Embedded Data field catalog, which declares a privacy policy per field (`keep` / `drop` / `redactQuery`). Two of those act **before** this API sees the response, and one is a rule this API adds:

        - `drop` is an **ingest-time** policy, not a filter applied here: when the survey has "Anonymize
          responses" enabled the field is never captured, so it is absent from the response for every
          consumer. With anonymization off it is captured and appears here normally.

        - `redactQuery` is applied on **every** read, anonymization or not — `url` and `pageReferrer` carry
          their query string stripped.

        - `ipAddress` is **never** projected by this API, in any view. That is a v3 rule rather than a
          catalog behaviour: the catalog reads the field, and the dashboard shows it. Do not infer the same
          suppression for the other `drop` fields.
      required:
        - key
        - kind
        - type
        - label
        - value
      properties:
        key:
          type: string
          description: |
            Stable key. Unique within `embeddedData`.

            Uniqueness is a guarantee this API makes rather than one the stored data provides: a survey may declare a hidden field or variable whose name collides with a catalog field (`country`, `url` and `language` are all declarable on surveys created before the reserved names were enforced). Where that happens the **declared** entry wins and the `reserved` one is omitted, matching how recall and logic already resolve the same name.

            `reserved` keys are the catalog's own names, which are camelCase — `deviceType`, `utmSource`, `pagePath` — not snake_case.
        kind:
          type: string
          enum:
            - ingested
            - computed
            - reserved
          description: |
            Provenance of the value:

            - `ingested` — supplied by the caller or the embedding page (hidden fields).
            - `computed` — derived during the submission by survey logic (variables).
            - `reserved` — auto-captured context from the submission environment (for example `country`,
              `deviceType`), drawn from the Embedded Data field catalog.
        type:
          type: string
          enum:
            - string
            - number
            - boolean
            - date
          description: Declared type of `value`, so a consumer need not infer it. `computed` entries are only ever `string` or `number`, because survey variables are typed that narrowly.
        label:
          type: string
          description: Human-readable name for the key, in the resolved language where one exists.
        value:
          oneOf:
            - type: string
            - type: number
            - type: boolean
            - type: array
              items:
                type: string
            - type: 'null'
          description: The value, matching `type`. `date` values are ISO-8601 strings. An **array of string** occurs when a hidden field was ingested with multiple values — the stored map permits it, so the payload must be able to carry it rather than silently dropping the key. `null` when the key was declared for this survey but carries no value on this response.
      additionalProperties: false
    ResponseUnresolvedEntry:
      type: object
      description: |
        Stored data whose element no longer exists in the survey definition. Deleting an element leaves its answers behind on already-collected responses and nothing cleans them up, so the payload reports them here instead of dropping them silently or faking them into `answers[]` without a type or a label. Consumers doing analysis can ignore this array; consumers doing export or migration should not.
      required:
        - key
        - rawValue
        - reason
      properties:
        key:
          type: string
          description: The key as stored on the response — usually a former element id or hidden-field key.
        rawValue:
          description: The stored value, returned verbatim and untyped because nothing describes it any more.
          oneOf:
            - type: string
            - type: number
            - type: array
              items:
                type: string
            - type: object
              additionalProperties:
                type: string
        reason:
          type: string
          enum:
            - elementNotInSurvey
            - hiddenFieldNotInSurvey
            - variableNotInSurvey
            - valueShapeMismatch
          description: |
            Why the entry could not be resolved:

            - `elementNotInSurvey` — no element with this id exists in the current definition.
            - `hiddenFieldNotInSurvey` — the key is not among the survey's declared hidden fields.
            - `variableNotInSurvey` — no variable with this id exists in the current definition.
            - `valueShapeMismatch` — the element exists, but the stored value's shape cannot be read as an
              answer of that element's type (for example a string where the element expects a selection
              list). Signals element-type churn rather than deletion.
      additionalProperties: false
    ResponseTag:
      type: object
      description: |
        A tag applied to a response, as a lightweight reference. Deliberately **not** the full `TagResource`: that shape carries a `count` of how many responses hold the tag, which would mean an extra aggregate per tag on every row of every page. Read tags in full — with counts and timestamps — from `GET /api/v3/tags`.
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: cuid2
        name:
          type: string
          description: Tag label as shown in the app.
      additionalProperties: false
    ResponseBase:
      type: object
      description: |
        Fields shared by both response views. Self-describing: `answers[]` carries each element's id, label, type and value, so a consumer can read a response without also fetching the survey.

        Deliberately open — `ResponseListItem` and `ResponseResource` compose this and close themselves, so that the detailed view can add fields without the base rejecting them.
      required:
        - id
        - surveyId
        - surveyName
        - workspaceId
        - createdAt
        - updatedAt
        - finished
        - endingId
        - language
        - resolution
        - answers
        - embeddedData
        - unresolved
        - tags
      properties:
        id:
          readOnly: true
          type: string
          format: cuid2
          description: Response identifier.
        surveyId:
          type: string
          format: cuid2
          description: The survey this response belongs to.
        surveyName:
          readOnly: true
          type: string
          description: The survey's current name, denormalized into the payload so a consumer listing responses need not resolve survey names separately.
        workspaceId:
          readOnly: true
          type: string
          format: cuid2
          description: The owning workspace, resolved through the survey. Responses carry no workspace column of their own; this is a derived field.
        createdAt:
          readOnly: true
          type: string
          format: date-time
          description: |
            When the response was created. **Server-owned** — it cannot be supplied on create or changed by a patch. This is the AIP-148 output-only convention, and it is deliberate on two counts: monthly response metering counts rows by `(surveyId, createdAt)`, and a client-chosen `createdAt` can insert rows into the middle of another consumer's already-paginated stream. Backdating remains available on v1/v2; a dedicated import path is future work.
        updatedAt:
          readOnly: true
          type: string
          format: date-time
          description: When the response was last modified. Server-owned. Neither filterable nor sortable — it has no index, and being mutable it cannot anchor a pagination cursor.
        finished:
          type: boolean
          description: Whether the respondent reached an ending.
        endingId:
          type:
            - string
            - 'null'
          description: The ending card the respondent reached. `null` for unfinished responses.
        language:
          type:
            - string
            - 'null'
          description: The survey language this response was collected in, as a survey language code (not necessarily a BCP-47 locale — `default` is a legitimate value). `null` when the survey is single-language or no language was stamped.
        durationSeconds:
          readOnly: true
          type: number
          minimum: 0
          description: Total seconds the respondent spent, summed from per-element timing. Replaces the synthetic `_total` bucket the stored representation keeps alongside real element ids. Absent when the submission carried no timing.
        resolution:
          readOnly: true
          $ref: '#/components/schemas/ResponseResolution'
        answers:
          readOnly: true
          type: array
          description: One entry per element the respondent reached, in survey order. Empty for a response that recorded no answers.
          items:
            $ref: '#/components/schemas/ResponseAnswer'
        embeddedData:
          readOnly: true
          type: array
          description: Hidden fields, variables and auto-captured context, as one collection. Empty when the response carries none.
          items:
            $ref: '#/components/schemas/ResponseEmbeddedDatum'
        unresolved:
          readOnly: true
          type: array
          description: Stored data whose element or key no longer exists in the survey definition. Empty in the normal case.
          items:
            $ref: '#/components/schemas/ResponseUnresolvedEntry'
        tags:
          type: array
          description: Tags applied to this response, as `{ id, name }` references. Empty when the response is untagged.
          items:
            $ref: '#/components/schemas/ResponseTag'
    ResponseListItem:
      allOf:
        - $ref: '#/components/schemas/ResponseBase'
      unevaluatedProperties: false
      description: |
        A survey response as returned by the list endpoint. Self-describing: `answers[]` carries each element's id, label, type and value, so a consumer can read a response without also fetching the survey.

        `answers[]` and `embeddedData[]` ship on the list view as well as the detailed view — they are the point of the resource, and withholding them from the list would force consumers into an N+1 of item reads. The list view omits only the identity and provenance fields: `contact`, `displayId` and `singleUseId`. See `ResponseResource` for those.
    ResponseDataMap:
      type: object
      description: |
        Answers in their **stored** form: a map keyed by element id (and hidden-field key). The value shape depends on the element type, and it is not uniform — these are the four shapes that actually occur:

        - **`string`** — `openText` (always a string, even when `inputType` is `number`), `date`
          (`YYYY-MM-DD`), and the single-token answers `consent` (`accepted`), `cta` (`clicked`) and `cal`
          (`booked`). A single-choice answer is also a bare string.

        - **`number`** — the numeric scales `nps`, `rating`, `csat` and `ces`.
        - **`array of string`** — three different things: choice **labels** in the respondent's language
          for `multipleChoiceMulti` and `ranking` (rank order); choice **ids** for `pictureSelection`;
          private-storage URLs for `fileUpload`; and, for `address` and `contactInfo`, a **positional,
          fixed-length list of sub-field values** — `address` is 6 slots
          (`addressLine1`, `addressLine2`, `city`, `state`, `zip`, `country`) and `contactInfo` is 5
          (`firstName`, `lastName`, `email`, `phone`, `company`), with blanks carried as `""` so the slots
          stay aligned.

        - **`object`** — `matrix` only, and it is keyed by the **localized row label** with the
          **localized column label** as the value. Not by row and column id.


        Writes take this map, and the detailed read returns it unchanged as `data` on `ResponseResource` — so the simplest correction is to read, edit one entry and `PATCH` it straight back. The list view omits it deliberately. The typed `answers[]` array is offered **alongside** rather than instead, and is a lossless superset — every stored key and value comes back verbatim in `rawValue`, `rawKey`, `valueText`, `valueDate`, `fileUrls` or a composite slot — so even a client holding only a list row can rebuild this map without refetching the survey. See the round-trip note on `GET /api/v3/responses/{responseId}`.
      additionalProperties:
        oneOf:
          - type: string
          - type: number
          - type: array
            items:
              type: string
          - type: object
            additionalProperties:
              type: string
    ResponseVariablesMap:
      type: object
      description: Survey variable values in their stored form, keyed by variable id. Variables are typed as string or number only.
      additionalProperties:
        oneOf:
          - type: string
          - type: number
    ResponseTtcMap:
      type: object
      description: |
        Per-element time-to-complete, keyed by element id, in **milliseconds**. Accepted on create so that a caller replaying a real submission can carry its timing; reads report the same information as `durationSeconds` in seconds, on each answer and summed at the top level.

        This is client-reported telemetry, not a measurement the server can vouch for, so each value is clamped into `[0, 86400000]` (24 hours per element) rather than rejected — a noisy timing value should never cost you the response. Any finite number is therefore accepted, which is why no bounds are declared here. Do not send a `_total` key: the total is derived on read.
      additionalProperties:
        type: number
    ResponseMetaInput:
      type: object
      description: |
        Submission context, on the narrow subset a caller can legitimately supply. A management-API create has no browser behind it, so unlike a client-side submission there is nothing for the server to auto-capture — if these are not sent they are simply absent, which is why the API accepts them at all rather than treating all context as server-derived.

        Deliberately **not** accepted here: `ipAddress` (server-derived when the survey captures it, and never projected by v3 on read), and the derived `userAgent`, `country` and `device` family — those describe a real browser session and would be fiction on an API-created response. Reads surface what is stored as `reserved` entries in `embeddedData[]`, governed by the Embedded Data field catalog's privacy policy.
      properties:
        source:
          type: string
          maxLength: 512
          description: Where the submission came from — the integration or channel name. The field most worth setting on an API create, since nothing else can distinguish an imported or integration-created response from an organic one.
        url:
          type: string
          maxLength: 2048
          description: The page or context the response was collected from.
        action:
          type: string
          maxLength: 512
          description: The action or trigger that produced the submission, when one applies.
      additionalProperties: false
    CreateResponseRequest:
      type: object
      description: |
        Creates a survey response. **This is a real submission**: it runs the full response pipeline — webhooks, integrations, follow-ups, quota evaluation, and Hub ingestion once the response is finished — and it counts against metered monthly responses, exactly as a v1/v2 management create does today. It is not an import primitive; a dedicated import path is future work.

        The workspace is resolved from `surveyId`, so unlike `POST /api/v3/surveys` there is no `workspaceId` in the body — the caller cannot choose which scope it is authorized against.

        Unsupported fields are rejected rather than ignored. Absent by design, each for its own reason:

        - `createdAt` and `updatedAt` are **server-owned** — see `ResponseListItem.createdAt`. This is the
          one capability v3 does not carry over from v2, and it is why bulk historical loading still
          belongs on v2 until a dedicated import path exists.

        - `userId` is not accepted: a contact `userId` is a non-unique **attribute**, not a column, so it
          cannot safely identify who to attribute a response to. Link the contact explicitly with
          `contactId`.

        - `contactAttributes` is not accepted, and never was writable — v1/v2 snapshot it from the linked
          contact. v3 does not expose the snapshot at all; `contact` covers the need.

        - `meta.ipAddress`, and the derived `userAgent` / `country` / `device` family, are not accepted;
          see `ResponseMetaInput` for what is.
      required:
        - surveyId
        - finished
        - data
      properties:
        surveyId:
          type: string
          format: cuid2
          description: The survey to record the response against. Immutable after creation.
        finished:
          type: boolean
          description: 'Whether this response is complete. Creating with `finished: true` fires the finish side of the pipeline immediately, including Hub ingestion.'
        data:
          $ref: '#/components/schemas/ResponseDataMap'
        variables:
          $ref: '#/components/schemas/ResponseVariablesMap'
        ttc:
          $ref: '#/components/schemas/ResponseTtcMap'
        meta:
          $ref: '#/components/schemas/ResponseMetaInput'
        tags:
          type: array
          uniqueItems: true
          description: Tag ids to apply, so a tagged response can be created in one call rather than a create followed by a patch. Tags must already exist in the same workspace — create them via `POST /api/v3/tags`. Applied in the same transaction as the response.
          items:
            type: string
            format: cuid2
        endingId:
          type:
            - string
            - 'null'
          description: The ending card the respondent reached. Must exist in the survey definition.
        language:
          type:
            - string
            - 'null'
          description: Survey language code to stamp on the response. Must be a language the survey has enabled. Omit for single-language surveys.
        contactId:
          type: string
          format: cuid2
          description: Contact to attribute the response to. **Create-only** — a response cannot later be re-linked to a different contact. Must be a contact in the same workspace.
        displayId:
          type: string
          description: Display (survey impression) this response answers. Create-only. Each display can back at most one response.
        singleUseId:
          type: string
          description: Single-use link id, for surveys configured with single-use links. Create-only, and unique per survey.
      additionalProperties: false
    ResponseContact:
      type: object
      description: |
        The contact that submitted the response, when the response is identified. Present on the detailed view only — the list view omits it. `null` for anonymous (link-survey) responses.
      required:
        - id
      properties:
        id:
          type: string
          format: cuid2
          description: Contact identifier.
        userId:
          type:
            - string
            - 'null'
          description: The contact's `userId` attribute — the id your application knows the person by. This is a contact **attribute**, not a column, and it is not guaranteed unique within a workspace, so it identifies the person for display but must not be used as a lookup key. `null` when the contact has no `userId` attribute set.
      additionalProperties: false
    ResponseResource:
      allOf:
        - $ref: '#/components/schemas/ResponseBase'
        - type: object
          required:
            - contact
            - displayId
            - singleUseId
            - data
            - variables
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/ResponseDataMap'
              description: |
                Answers in their **stored** form — byte-for-byte the same map `POST /api/v3/responses` and `PATCH /api/v3/responses/{responseId}` accept. Returned so that a read can be edited and written straight back: take this map, change what you need, and `PATCH` it. Without it a client wanting to correct one answer would have to rebuild the map from `answers[]`, which is possible but is work the server can simply not impose.

                `answers[]` remains the field to read — it is typed, labelled and ordered, and it separates answers from hidden fields. This is the same data in the shape the write side speaks, offered alongside rather than instead.

                Present on the detailed view only. The list view omits it deliberately: on a page of 250 it would carry every answer twice, and a bulk reader is not editing.
            variables:
              allOf:
                - $ref: '#/components/schemas/ResponseVariablesMap'
              description: Survey variable values in their stored form, as the write side accepts them. Same rationale as `data`; read `embeddedData[]` for the typed, labelled view.
            contact:
              anyOf:
                - $ref: '#/components/schemas/ResponseContact'
                - type: 'null'
              description: The contact that submitted the response, or `null` when the response is anonymous. Present on the detailed view only.
            displayId:
              type:
                - string
                - 'null'
              description: The display (survey impression) this response was submitted against, when one was recorded.
            singleUseId:
              type:
                - string
                - 'null'
              description: The single-use link id this response was submitted through, when the survey uses single-use links.
      unevaluatedProperties: false
      description: |
        A survey response in the detailed view, as returned by `GET /api/v3/responses/{responseId}` and by the write endpoints. Everything in `ResponseListItem`, plus the identity and provenance fields the list view omits.

        It also carries `data` and `variables` — the resource's **writable state**, returned unchanged, so a client can read a response, edit an answer and send it straight back. That is the property v1/v2 had for free by being symmetric, and the one OpenAPI 3.1.1 argues for directly: its "Validating `readOnly` and `writeOnly`" section notes that making clients strip fields before a write is "burdensome for clients, particularly when the JSON data is complex or deeply nested".

        Note which fields carry `readOnly` here and which do not, because it is the opposite of what an "echo" framing would suggest. `readOnly` means a value is managed exclusively by the server, so it marks the **derived** views — `answers[]`, `embeddedData[]`, `unresolved[]`, `resolution`, the denormalized `surveyName` and `workspaceId`, the timestamps, `durationSeconds` and `id`. `data` and `variables` are *not* read-only: they are exactly what the write endpoints accept, and leaving them unmarked is what makes this representation round-trippable rather than merely informative.

        To correct one answer, read this resource, take `data`, change the entry you want and `PATCH` `{ "data": … }`. Send only the fields you are changing — `PATCH` rejects unknown and non-patchable keys, so passing the whole representation back verbatim is not the intended flow; passing `data` back is.

        **Never exposed on this resource, in either view:** the respondent's IP address, and the `contactAttributes` snapshot that v1/v2 return. That snapshot is copied from the contact at submission time and never updated after, so it is stale PII by construction — `contact` covers the legitimate need to know who answered.
    ValidateResponseCreateRequest:
      type: object
      required:
        - operation
        - data
      properties:
        operation:
          type: string
          enum:
            - create
        data:
          description: Intended create payload. Invalid documents are allowed so the endpoint can return repairable validation errors.
          anyOf:
            - $ref: '#/components/schemas/CreateResponseRequest'
            - type: object
              additionalProperties: true
      additionalProperties: false
    PatchResponseRequest:
      type: object
      description: |
        Partially updates a response. Strict at the top level: unknown keys return **400** rather than being ignored, and at least one patchable field must be present.

        `data` and `variables` are **replaced wholesale**, not deep-merged — send the complete map you want stored. A patch that sets `finished` to `true` fires the finish side of the response pipeline.

        Not patchable, and rejected if sent: `createdAt`, `updatedAt`, `surveyId`, `contactId`, `displayId`, `singleUseId`, `contactAttributes`, and the create-only `ttc` and `meta` — timing and submission context describe the original submission event, so they are set once and not revised. `contactId` is create-only deliberately — re-attributing an existing response to a different person is a capability only v2 offers, and it is not carried forward.
      minProperties: 1
      properties:
        finished:
          type: boolean
        endingId:
          type:
            - string
            - 'null'
        language:
          type:
            - string
            - 'null'
        data:
          $ref: '#/components/schemas/ResponseDataMap'
        variables:
          $ref: '#/components/schemas/ResponseVariablesMap'
        tags:
          type: array
          description: Complete set of tag ids for this response, replacing whatever is currently applied. Tags must already exist in the same workspace — create them via `POST /api/v3/tags`.
          items:
            type: string
            format: cuid2
      additionalProperties: false
    ValidateResponsePatchRequest:
      type: object
      required:
        - operation
        - responseId
        - data
      properties:
        operation:
          type: string
          enum:
            - patch
        responseId:
          type: string
          format: cuid2
        data:
          description: Intended patch payload. Invalid documents are allowed so the endpoint can return repairable validation errors.
          anyOf:
            - $ref: '#/components/schemas/PatchResponseRequest'
            - type: object
              additionalProperties: true
      additionalProperties: false
    ValidateResponseRequest:
      oneOf:
        - $ref: '#/components/schemas/ValidateResponseCreateRequest'
        - $ref: '#/components/schemas/ValidateResponsePatchRequest'
      discriminator:
        propertyName: operation
        mapping:
          create: '#/components/schemas/ValidateResponseCreateRequest'
          patch: '#/components/schemas/ValidateResponsePatchRequest'
    ResponseValidationEffects:
      type: object
      description: |
        What a successful write **would** do, reported without doing it. This mirrors the detail that makes `POST /api/v3/surveys/validate` useful: it reports effects, not just a verdict, so a caller can see the consequences of a payload before committing thousands of them.

        Present only when `valid` is `true`.
      required:
        - language
        - firesPipeline
        - countsTowardMeteredResponses
      properties:
        language:
          type:
            - string
            - 'null'
          description: The survey language code that would be stamped on the response. `null` means the response would be stored **without** a language — the case worth catching before a bulk write, since language-less responses cannot later be told apart by language.
        contactId:
          type:
            - string
            - 'null'
          description: The contact that would be linked, or `null` if the response would be anonymous.
        displayId:
          type:
            - string
            - 'null'
          description: The display that would be linked, or `null` if none.
        firesPipeline:
          type: boolean
          description: Whether a real write would run the response pipeline — webhooks, integrations, follow-ups, and Hub ingestion. True for a create, and for a patch that transitions the response to finished.
        countsTowardMeteredResponses:
          type: boolean
          description: Whether a real write would consume one metered monthly response.
        quotas:
          type: array
          description: Quotas this response would count against, and whether it would fill them. Empty when the survey defines no quotas or the plan does not include them.
          items:
            type: object
            required:
              - quotaId
              - quotaName
              - wouldCount
            properties:
              quotaId:
                type: string
                format: cuid2
              quotaName:
                type: string
              wouldCount:
                type: boolean
                description: Whether this response matches the quota's criteria.
              wouldFill:
                type: boolean
                description: Whether counting this response would take the quota to its limit. Absent when `wouldCount` is `false`.
            additionalProperties: false
        tagsToApply:
          type: array
          description: Tag ids that would end up applied to the response. Patch operations only.
          items:
            type: string
            format: cuid2
      additionalProperties: false
    ResponseValidationResult:
      type: object
      description: |
        Outcome of a dry-run validation. Deliberately the same shape as `SurveyValidationResult` — the value of this endpoint is that the two behave alike, so a client can treat validation uniformly.

        Answers are checked against the survey's own validation rules (`SurveyValidationRule`) rather than a parallel rule set, so a payload this endpoint accepts is a payload the real write accepts.
      required:
        - valid
        - operation
        - invalid_params
      properties:
        valid:
          type: boolean
          description: Whether the submitted payload would be accepted by the real operation.
        operation:
          type: string
          enum:
            - create
            - patch
        invalid_params:
          type: array
          description: Repairable validation errors, using paths relative to the submitted `data` document.
          items:
            $ref: '#/components/schemas/InvalidParam'
        effects:
          $ref: '#/components/schemas/ResponseValidationEffects'
      additionalProperties: false
    BatchDeleteResponsesRequest:
      type: object
      description: |
        Ids to delete. A POST custom method rather than a `DELETE` on the collection: a collection-level `DELETE` that loses its filters degrades into erasing every response in scope, and a distinct path cannot be reached by accident. AIP-165 blesses this shape and v3 already uses POST-based batch operations elsewhere.
      required:
        - ids
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          description: Response ids to delete, at most 100 per call.
          items:
            type: string
            format: cuid2
      additionalProperties: false
    WorkflowStatus:
      type: string
      enum:
        - draft
        - enabled
        - disabled
        - archived
      description: |
        Workflow lifecycle state. `draft` workflows are editable and inert. `enabled` workflows
        respond to trigger events. `disabled` workflows keep their configuration but are inert.
        `archived` workflows are soft-deleted: read-only, excluded from default list reads, and
        restorable via unarchive.

        Status only changes through lifecycle endpoints. Valid transitions: `draft` → `enabled`,
        `enabled` ↔ `disabled`, `enabled`/`disabled` → `draft`, any non-archived state → `archived`
        (archive), and `archived` → `draft` (unarchive).
    WorkflowRunStatus:
      type: string
      enum:
        - queued
        - running
        - completed
        - failed
        - canceled
      description: |
        Workflow run lifecycle state. `completed`, `failed`, and `canceled` are terminal. Valid
        transitions: `queued` → `running`, `running` → `queued` (retry/backoff), `queued` →
        `canceled`, and `running` → `completed`/`failed`/`canceled`. Retries do not introduce a
        separate status; retry state is exposed via `attempt` and `nextAttemptAt`.
    WorkflowRunSummary:
      type: object
      description: |
        Slim run shape embedded as `lastRun` in workflow resources. The runs list (`GET /api/v3/workflows/runs`)
        returns `WorkflowRunListItem`, which extends this with `workflowName`. Excludes `triggerPayload`, `data`, and `logs`.
      required:
        - id
        - workflowId
        - workspaceId
        - workflowVersionId
        - status
        - isDryRun
        - triggerType
        - surveyId
        - responseId
        - error
        - attempt
        - createdAt
        - updatedAt
        - startedAt
        - finishedAt
      properties:
        id:
          type: string
          format: cuid2
        workflowId:
          type: string
          format: cuid2
        workspaceId:
          type: string
          format: cuid2
        workflowVersionId:
          type:
            - string
            - 'null'
          format: cuid2
          description: |
            Immutable workflow version snapshot the run executes against. `null` for dry runs of
            workflows that have never been enabled. Version contents are not readable through the
            v3 API in Scope 1.
        status:
          $ref: '#/components/schemas/WorkflowRunStatus'
        isDryRun:
          type: boolean
          description: '`true` for runs created by `POST /api/v3/workflows/{workflowId}/test`.'
        triggerType:
          type: string
          enum:
            - response.completed
        surveyId:
          type:
            - string
            - 'null'
          format: cuid2
        responseId:
          type:
            - string
            - 'null'
          format: cuid2
          description: Survey response that triggered the run. `null` for synthesized dry-run data or when the response was deleted.
        error:
          type:
            - string
            - 'null'
          description: Terminal or most recent failure reason. `null` while the run is healthy.
        attempt:
          type: integer
          minimum: 0
          description: Retry attempt counter. `0` on the first execution; retries increment it without changing `status`.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        startedAt:
          type:
            - string
            - 'null'
          format: date-time
        finishedAt:
          type:
            - string
            - 'null'
          format: date-time
    WorkflowListItem:
      type: object
      description: |
        Slim workflow shape returned by `GET /api/v3/workflows`. `triggerType` and `surveyId` are
        derived read-only projections of `definition.trigger`, so list consumers can render and
        filter without loading full definitions. Serialized dates are ISO 8601 strings.
      required:
        - id
        - workspaceId
        - name
        - description
        - status
        - triggerType
        - surveyId
        - createdBy
        - creator
        - createdAt
        - updatedAt
        - lastRun
        - runCount
      properties:
        id:
          type: string
          format: cuid2
        workspaceId:
          type: string
          format: cuid2
        name:
          type: string
        description:
          type:
            - string
            - 'null'
        status:
          $ref: '#/components/schemas/WorkflowStatus'
        triggerType:
          type: string
          enum:
            - response.completed
          description: Derived from `definition.trigger.triggerType`.
        surveyId:
          type: string
          format: cuid2
          description: Derived from `definition.trigger.config.surveyId`.
        createdBy:
          type:
            - string
            - 'null'
          format: cuid2
          description: User id that created the workflow. `null` when the creating user was deleted.
        creator:
          type:
            - object
            - 'null'
          required:
            - name
          properties:
            name:
              type: string
          description: Creating user's name. `null` when the creating user was deleted.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastRun:
          anyOf:
            - $ref: '#/components/schemas/WorkflowRunSummary'
            - type: 'null'
          description: Most recent run summary (dry runs included). `null` when the workflow has never run.
        runCount:
          type: integer
          minimum: 0
          description: Total number of runs (dry runs included) for this workflow.
    CursorPaginationMeta:
      type: object
      required:
        - limit
        - nextCursor
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100
        nextCursor:
          type:
            - string
            - 'null'
          description: Opaque cursor for the next page. `null` when there are no more results.
      additionalProperties: false
    WorkflowNodeUi:
      type: object
      description: Builder-only UI metadata that does not affect workflow execution. Additional keys are preserved.
      properties:
        position:
          type: object
          required:
            - x
            - 'y'
          properties:
            x:
              type: number
            'y':
              type: number
          additionalProperties: false
        collapsed:
          type: boolean
      additionalProperties: true
    WorkflowResponseCompletedTriggerNode:
      type: object
      required:
        - id
        - type
        - triggerType
        - config
      properties:
        id:
          type: string
          minLength: 1
        type:
          type: string
          enum:
            - trigger
        triggerType:
          type: string
          enum:
            - response.completed
        label:
          type: string
          minLength: 1
          maxLength: 120
          description: Optional display label shown in the builder.
        config:
          type: object
          required:
            - surveyId
          properties:
            surveyId:
              type: string
              format: cuid2
              description: Survey whose completed responses trigger the workflow. Must exist in the workspace.
            endingCardIds:
              type: array
              items:
                type: string
                format: cuid2
              default: []
              description: Ending card ids that should trigger the workflow. Empty or omitted means every ending matches.
          additionalProperties: false
        ui:
          $ref: '#/components/schemas/WorkflowNodeUi'
      additionalProperties: false
    WorkflowSendEmailActionConfig:
      type: object
      description: |-
        Send-email action with 1:1 field parity to survey Follow-ups (`ZSurveyFollowUpAction`).

        `to`, `subject` and `body` accept an empty string on create and update, so an author can save an unfinished draft. Completeness is enforced when the workflow has to run: enabling it returns **422** `workflow_not_executable` naming each blank field, and the dry run reports them as problems.
      required:
        - to
        - from
        - replyTo
        - subject
        - body
        - attachResponseData
      properties:
        to:
          type: string
          description: |
            Recipient: either a literal email address (e.g. a teammate) or the element id of a
            survey question / hidden field whose answer contains the respondent's email address
            (contact-info elements resolve index [2]) — the same semantics as the Follow-ups `to` field.

            A **literal** address must belong to someone who can access this workspace — an organization owner or manager, or a member of a team the
            workspace is shared with. Enabling a workflow whose literal recipient cannot access the workspace returns **422** `workflow_not_executable`, the
            dry run reports a `recipient_not_allowed` problem, and the runner refuses to send to it — so a
            workflow cannot forward response data to an arbitrary external inbox. An element-id `to`
            resolves to the respondent's own address and is never allowlist-checked.
        from:
          type: string
          format: email
        replyTo:
          type: array
          items:
            type: string
            format: email
        subject:
          type: string
          maxLength: 998
          description: |
            Email subject. Used verbatim (recall tokens are not expanded in the subject), the same as Follow-ups. Capped at RFC 5322's maximum line length.
        body:
          type: string
          maxLength: 100000
          description: |
            Email body as HTML with recall tokens (`#recall:[elementId]/fallback:x#`). Recall tokens
            are expanded against the response, the result is sanitized to a narrow HTML allowlist,
            and it is wrapped in the branded Follow-ups email template — identical rendering to survey Follow-ups.
        attachResponseData:
          type: boolean
        includeVariables:
          type: boolean
          default: false
        includeHiddenFields:
          type: boolean
          default: false
      additionalProperties: false
    WorkflowSendEmailActionNode:
      type: object
      description: 'Send-email action node. Renders 1:1 with survey Follow-ups: recall-token body, question/hidden-field `to` resolution, and the branded Follow-ups email template.'
      required:
        - id
        - type
        - actionType
        - config
      properties:
        id:
          type: string
          minLength: 1
        type:
          type: string
          enum:
            - action
        actionType:
          type: string
          enum:
            - send_email
        label:
          type: string
          minLength: 1
          maxLength: 120
          description: Optional display label shown in the builder.
        config:
          $ref: '#/components/schemas/WorkflowSendEmailActionConfig'
        ui:
          $ref: '#/components/schemas/WorkflowNodeUi'
      additionalProperties: false
    WorkflowEdge:
      type: object
      required:
        - id
        - source
        - target
      properties:
        id:
          type: string
          minLength: 1
        source:
          type: string
          minLength: 1
          description: Node id the edge starts from.
        target:
          type: string
          minLength: 1
          description: Node id the edge points to.
        sourceHandle:
          type: string
          minLength: 1
          description: Builder handle identifier on the source node. Reserved for branch nodes (`then`/`else`) in future scopes.
        targetHandle:
          type: string
          minLength: 1
          description: Builder handle identifier on the target node.
      additionalProperties: false
    WorkflowDefinition:
      type: object
      description: |
        Scope 1 workflow JSON document, mirroring `ZWorkflowDefinition` in `packages/workflows`. The
        definition is the public source of truth for the builder and API clients. Scope 1
        intentionally excludes user-authored if/else branches, webhook actions, schedules, delays,
        loops, and AI/MCP-assisted creation; future node types extend `nodes` additively.

        Graph rules enforced on every write (**400** with `invalid_params` on violation):
        node ids are unique across `trigger` and `nodes`; every edge references existing node ids;
        the trigger has at most one outgoing edge; `entryNodeId` equals `trigger.id`. Trigger-only
        drafts (no `nodes`, no `edges`) are valid persisted documents. Executability rules (exactly
        one outgoing trigger edge, acyclic graph, every node reachable from the trigger) are
        additionally enforced by `enable` and `test` with **422** `workflow_not_executable`.
      required:
        - trigger
        - entryNodeId
      properties:
        schemaVersion:
          type: integer
          enum:
            - 1
          default: 1
          description: Definition schema version. Optional on writes (defaults to the current version); always present in responses.
        trigger:
          $ref: '#/components/schemas/WorkflowResponseCompletedTriggerNode'
        nodes:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/WorkflowSendEmailActionNode'
          description: Child nodes of the graph. The trigger lives in `trigger`, not in this array. Scope 1 accepts `send_email` action nodes only. Optional on writes (defaults to empty for trigger-only drafts); always present in responses.
        edges:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/WorkflowEdge'
          description: Optional on writes (defaults to empty for trigger-only drafts); always present in responses.
        entryNodeId:
          type: string
          minLength: 1
          description: Workflow entry point. Must equal `trigger.id`.
      additionalProperties: false
    CreateWorkflowRequest:
      type: object
      required:
        - workspaceId
        - name
        - definition
      properties:
        workspaceId:
          type: string
          format: cuid2
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type:
            - string
            - 'null'
          maxLength: 500
        status:
          type: string
          enum:
            - draft
          description: New workflows are created as drafts in Scope 1.
        definition:
          $ref: '#/components/schemas/WorkflowDefinition'
      additionalProperties: false
    WorkflowResource:
      description: |
        Full workflow shape returned by detail, create, update, duplicate, and lifecycle endpoints:
        the list-item fields plus the complete `definition` document.
      allOf:
        - $ref: '#/components/schemas/WorkflowListItem'
        - type: object
          required:
            - definition
          properties:
            definition:
              $ref: '#/components/schemas/WorkflowDefinition'
    WorkflowRunListItem:
      description: |
        Run-list row returned by `GET /api/v3/workflows/runs`: the slim run summary plus the resolved
        `workflowName`, joined so the workspace-wide runs table can label each row. Distinct from the
        `lastRun` summary embedded in workflow resources, which omits the name (the parent workflow
        already carries it). Excludes `triggerPayload`, `data`, and `logs`.
      allOf:
        - $ref: '#/components/schemas/WorkflowRunSummary'
        - type: object
          required:
            - workflowName
          properties:
            workflowName:
              type: string
              description: Name of the workflow this run belongs to, joined for the runs-list display.
    WorkflowTriggerPayload:
      type: object
      description: |
        Trigger payload snapshot captured when a run is created, mirroring
        `ZWorkflowTriggerRunPayload`. Additional runner keys may be present.
      required:
        - type
        - workspaceId
        - surveyId
        - responseId
        - triggeredAt
      properties:
        type:
          type: string
          enum:
            - response.completed
        workspaceId:
          type: string
          format: cuid2
        surveyId:
          type: string
          format: cuid2
        responseId:
          type: string
          format: cuid2
          description: For dry runs without a `responseId` input, this references the synthesized sample response.
        endingCardId:
          type: string
          format: cuid2
          description: Ending card the respondent reached, when the survey uses ending cards.
        data:
          type: object
          description: Response data snapshot used by the runner.
        triggeredAt:
          type: string
          format: date-time
      additionalProperties: true
    WorkflowRunLogStatus:
      type: string
      enum:
        - pending
        - running
        - succeeded
        - failed
        - skipped
      description: Status of one executed (or skipped) workflow step within a run.
    WorkflowRunStepResult:
      type: object
      description: In-document result for one workflow step, mirroring `ZWorkflowStepResult`.
      required:
        - stepId
        - stepType
        - status
      properties:
        stepId:
          type: string
          minLength: 1
          description: Node id of the executed step.
        stepType:
          type: string
          minLength: 1
          description: Node/step type, e.g. `response.completed` or `send_email`.
        status:
          $ref: '#/components/schemas/WorkflowRunLogStatus'
        input:
          type: object
          description: Step input snapshot.
        output:
          type: object
          description: Step output snapshot, or the mocked output for dry runs.
        error:
          type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
      additionalProperties: false
    WorkflowRunData:
      type: object
      description: |
        Run execution data persisted with the run, mirroring `ZWorkflowRunData`. Scope 1 exposes
        this as a debug-oriented JSON dump. Additional runner keys may be present.
      required:
        - steps
      properties:
        trigger:
          allOf:
            - $ref: '#/components/schemas/WorkflowTriggerPayload'
          description: Optional duplicate of the trigger payload snapshot kept inside the run data document.
        steps:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowRunStepResult'
      additionalProperties: true
    WorkflowRunLog:
      type: object
      description: Persisted trace entry for one workflow run step, mirroring the `WorkflowRunLog` table row.
      required:
        - id
        - runId
        - sequence
        - stepId
        - stepType
        - status
        - input
        - output
        - error
        - startedAt
        - finishedAt
      properties:
        id:
          type: string
          format: cuid2
        runId:
          type: string
          format: cuid2
        sequence:
          type: integer
          minimum: 0
          description: Order of the entry within the run.
        stepId:
          type: string
          minLength: 1
        stepType:
          type: string
          minLength: 1
        status:
          $ref: '#/components/schemas/WorkflowRunLogStatus'
        input:
          type: object
          description: Step input snapshot. Empty object when nothing was recorded.
        output:
          type: object
          description: Step output snapshot (mocked for dry runs). Empty object when nothing was recorded.
        error:
          type:
            - string
            - 'null'
        startedAt:
          type:
            - string
            - 'null'
          format: date-time
        finishedAt:
          type:
            - string
            - 'null'
          format: date-time
      additionalProperties: false
    WorkflowRunResource:
      description: |
        Full run shape returned by `GET /api/v3/workflows/runs/{runId}` and
        `POST /api/v3/workflows/{workflowId}/test`: the summary fields plus the captured trigger
        payload, per-step results, the persisted log trace, and retry/idempotency metadata.
      allOf:
        - $ref: '#/components/schemas/WorkflowRunSummary'
        - type: object
          required:
            - triggerPayload
            - data
            - logs
            - idempotencyKey
            - nextAttemptAt
            - lastErrorAt
          properties:
            triggerPayload:
              $ref: '#/components/schemas/WorkflowTriggerPayload'
            data:
              $ref: '#/components/schemas/WorkflowRunData'
            logs:
              type: array
              items:
                $ref: '#/components/schemas/WorkflowRunLog'
              description: Persisted step-by-step trace, ordered by `sequence`. Empty while the run is still `queued`.
            idempotencyKey:
              type:
                - string
                - 'null'
              description: Deduplication key for this run, unique per workflow. Set from the `Idempotency-Key` header on dry runs or from trigger-event deduplication.
            nextAttemptAt:
              type:
                - string
                - 'null'
              format: date-time
              description: When the next retry attempt is scheduled. `null` when no retry is pending.
            lastErrorAt:
              type:
                - string
                - 'null'
              format: date-time
    PatchWorkflowRequest:
      type: object
      description: |
        Partial workflow update. `name` and `description` are accepted in any state except
        `archived`; `definition` is only accepted while the workflow is `draft` or `disabled`.
        `status` is intentionally not patchable — use the lifecycle endpoints.
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type:
            - string
            - 'null'
          maxLength: 500
        definition:
          $ref: '#/components/schemas/WorkflowDefinition'
      additionalProperties: false
    DuplicateWorkflowRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Optional name for the duplicate. If omitted, the server chooses a non-conflicting copy name.
      additionalProperties: false
    WorkflowTestResult:
      type: object
      description: |
        Result of dry-running (testing) a workflow: whether it would execute and, if not, why not. No run is created and no side effects occur.
      required:
        - workflowId
        - ok
        - problems
      properties:
        workflowId:
          type: string
          format: cuid2
          example: clworkflow0000000000000000
        ok:
          type: boolean
          description: |
            True when the definition is executable, every trigger reference resolves, and every literal `send_email` recipient can access this workspace.
        problems:
          type: array
          description: Every problem found, so all issues can be fixed at once. Empty when `ok` is true.
          items:
            type: object
            required:
              - code
              - field
              - message
            properties:
              code:
                type: string
                enum:
                  - definition_not_executable
                  - survey_not_found
                  - ending_card_not_found
                  - recipient_not_allowed
                description: Machine-readable problem category.
              field:
                type: string
                description: |
                  Dotted path to the offending field, e.g. `definition.trigger.config.surveyId`.
              message:
                type: string
                description: Human-readable explanation of the problem.
    ActionClassResource:
      type: object
      description: A workspace action class that can be referenced from an app-survey trigger.
      required:
        - id
        - name
        - description
        - type
        - key
      properties:
        id:
          type: string
          format: cuid2
          description: Use this value as `distribution.triggers[].actionClassId` on an app survey.
        name:
          type: string
        description:
          type:
            - string
            - 'null'
        type:
          type: string
          enum:
            - code
            - noCode
        key:
          type:
            - string
            - 'null'
          description: Code-action key for code-type action classes; null for no-code actions.
      additionalProperties: false
    ContactAttributeKeyResource:
      type: object
      description: |
        A workspace contact-attribute key. Use `key` as `targeting.filters[].root.contactAttributeKey` on an app survey; `dataType` indicates which operators apply (e.g. `number`/`date` attributes support arithmetic/date operators).
      required:
        - id
        - key
        - name
        - description
        - type
        - dataType
      properties:
        id:
          type: string
          format: cuid2
        key:
          type: string
          description: The attribute key used in targeting filters (e.g. `plan`, `role`).
        name:
          type:
            - string
            - 'null'
          description: Human-readable display name, or null.
        description:
          type:
            - string
            - 'null'
        type:
          type: string
          enum:
            - default
            - custom
          description: Whether this is a built-in (`default`) or workspace-defined (`custom`) attribute.
        dataType:
          type: string
          enum:
            - string
            - number
            - date
      additionalProperties: false
    TagResource:
      type: object
      required:
        - id
        - name
        - workspaceId
        - createdAt
        - updatedAt
        - count
      properties:
        id:
          type: string
          format: cuid2
        name:
          type: string
          description: Tag label as shown in the app. Unique within a workspace.
        workspaceId:
          type: string
          format: cuid2
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        count:
          type: integer
          minimum: 0
          description: Responses currently carrying this tag. `0` when the tag exists but has never been applied.
  responses:
    V3BadRequest:
      description: Bad Request — malformed JSON, invalid query/body/params, duplicate name, or unsupported field.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request correlation ID
        Cache-Control:
          schema:
            type: string
          example: private, no-store
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    V3Unauthorized:
      description: Not authenticated (no valid session or API key).
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request correlation ID
        Cache-Control:
          schema:
            type: string
          example: private, no-store
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    V3Forbidden:
      description: Forbidden — no workspace access, or resource does not exist (404 not used; avoids existence leak).
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request correlation ID
        Cache-Control:
          schema:
            type: string
          example: private, no-store
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    V3TooManyRequests:
      description: Rate limit exceeded.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request correlation ID
        Cache-Control:
          schema:
            type: string
          example: private, no-store
        Retry-After:
          schema:
            type: integer
          description: Seconds until the current rate-limit window resets.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    V3InternalServerError:
      description: Internal Server Error.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request correlation ID
        Cache-Control:
          schema:
            type: string
          example: private, no-store
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    V3UnprocessableContent:
      description: Unprocessable Content — semantic validation failed or the requested lifecycle transition is invalid.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request correlation ID
        Cache-Control:
          schema:
            type: string
          example: private, no-store
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    WorkflowResourceResponse:
      description: Workflow returned successfully
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request correlation ID
        Cache-Control:
          schema:
            type: string
          example: private, no-store
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                $ref: '#/components/schemas/WorkflowResource'
    V3Conflict:
      description: Conflict — an `Idempotency-Key` retry arrived while the original request was still being processed (IETF `draft-ietf-httpapi-idempotency-key-header` semantics). Retry after the original request completes to receive its stored result.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request correlation ID
        Cache-Control:
          schema:
            type: string
          example: private, no-store
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  parameters:
    WorkspaceIdQuery:
      in: query
      name: workspaceId
      required: true
      schema:
        type: string
        format: cuid2
      description: Workspace identifier. This is the canonical container ID for v3 APIs.
    LimitQuery:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 250
        default: 20
      description: Page size. A value above the maximum is rejected with **400** rather than silently reduced to it — v3 rejects unusable input instead of substituting its own, the same way it rejects unrecognized query parameters. The server may still return fewer items than requested, so treat `meta.nextCursor` as the only end-of-collection signal rather than comparing the page length against `limit`.
    CursorQuery:
      in: query
      name: cursor
      schema:
        type: string
      description: Opaque cursor returned as `meta.nextCursor` from the previous page. Omit on the first request.
    CreatedAtGteQuery:
      in: query
      name: filter[createdAt][gte]
      schema:
        type: string
        format: date-time
      description: Only records created at or after this instant (**inclusive**). Mutually exclusive with `filter[createdAt][gt]` — sending both is a **400**.
    CreatedAtGtQuery:
      in: query
      name: filter[createdAt][gt]
      schema:
        type: string
        format: date-time
      description: Only records created strictly after this instant (**exclusive**). Paired with `filter[createdAt][lt]` this is a fully open `(start, end)` window. For a half-open `[start, end)` window — the one whose consecutive pages tile without dropping a record that sits exactly on a boundary instant — use `filter[createdAt][gte]` with `filter[createdAt][lt]`. Mutually exclusive with `filter[createdAt][gte]` — sending both is a **400**.
    CreatedAtLteQuery:
      in: query
      name: filter[createdAt][lte]
      schema:
        type: string
        format: date-time
      description: Only records created at or before this instant (**inclusive**). Mutually exclusive with `filter[createdAt][lt]` — sending both is a **400**.
    CreatedAtLtQuery:
      in: query
      name: filter[createdAt][lt]
      schema:
        type: string
        format: date-time
      description: Only records created strictly before this instant (**exclusive**). The upper bound of a half-open `[start, end)` window, which is what makes consecutive windows tile without overlapping or dropping a record on the boundary. Mutually exclusive with `filter[createdAt][lte]` — sending both is a **400**.
    ResponseIdPath:
      in: path
      name: responseId
      required: true
      schema:
        type: string
        format: cuid2
      description: Response identifier.
    WorkflowRunIdPath:
      in: path
      name: runId
      required: true
      schema:
        type: string
        format: cuid2
      description: Workflow run identifier.
    WorkflowIdPath:
      in: path
      name: workflowId
      required: true
      schema:
        type: string
        format: cuid2
      description: Workflow identifier.
