        Moves every response tagged `{tagId}` onto `newTagId`, then deletes `{tagId}`.

        Both tags must belong to the same workspace — a cross-workspace merge answers `403`, since it would
        move responses across a tenant boundary. Same authorization as rename.

        Merging a tag into itself answers `400`.
      tags:
        - V3 Tags
      parameters:
        - in: path
          name: tagId
          required: true
          schema:
            type: string
            format: cuid2
          description: The tag being merged away.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - newTagId
              properties:
                newTagId:
                  type: string
                  format: cuid2
                  description: The surviving tag.
      responses:
        '200':
          description: Tags merged successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - id
                    properties:
                      id:
                        type: string
                        format: cuid2
                        description: The surviving tag's id.
        '400':
          $ref: '#/components/responses/V3BadRequest'
        '401':
          $ref: '#/components/responses/V3UnauthorizedSession'
        '403':
          $ref: '#/components/responses/V3Forbidden'
        '429':
          $ref: '#/components/responses/V3TooManyRequests'
        '500':
          $ref: '#/components/responses/V3InternalServerError'
      security:
        - sessionAuth: []
  /api/v3/feedbackRecords:
    get:
      operationId: listFeedbackRecordsV3
      summary: List feedback records
      description: |
        Lists the feedback records of one dataset, newest first, with optional filters and keyset
        pagination. Served by the API gateway, which authorizes the call against `tenant_id` and
        forwards it to the feedback store — see the introduction for how the two layers answer.

        Requires an API key with **read** permission (or higher) on a workspace the dataset is assigned
        to. The organization must hold the Unify Feedback entitlement.

        Multi-value filters are OR-ed within a parameter and AND-ed across parameters. Repeat the
        parameter to pass several values (`?field_type=text&field_type=rating`); comma-separated values
        are **not** split. Filters on enrichment members (`sentiment`, `emotions`, `sentiment_score_*`)
        never match records that have not been enriched — use `has_sentiment=false` / `has_emotions=false`
        to find those.
      tags:
        - V3 Feedback Records
      parameters:
        - $ref: '#/components/parameters/FeedbackRecordsTenantIdQuery'
        - in: query
          name: submission_id
          style: form
          explode: true
          schema:
            type: array
            maxItems: 100
            items:
              type: string
              maxLength: 255
          description: Records belonging to any of these logical submissions (e.g. response ids).
        - in: query
          name: source_type
          style: form
          explode: true
          schema:
            type: array
            maxItems: 100
            items:
              type: string
              maxLength: 255
          description: Records from any of these source types, e.g. `survey`, `review`.
        - in: query
          name: source_id
          style: form
          explode: true
          schema:
            type: array
            maxItems: 100
            items:
              type: string
              maxLength: 255
          description: Records from any of these sources (e.g. survey ids).
        - in: query
          name: source_name
          style: form
          explode: true
          schema:
            type: array
            maxItems: 100
            items:
              type: string
              maxLength: 255
          description: 'Records whose source display name is any of these. Prefer `source_id` where records carry one: a name can be edited or translated, the id is stable.'
        - in: query
          name: field_id
          style: form
          explode: true
          schema:
            type: array
            maxItems: 100
            items:
              type: string
              maxLength: 255
          description: Every answer to any of these questions.
        - in: query
          name: field_group_id
          style: form
          explode: true
          schema:
            type: array
            maxItems: 100
            items:
              type: string
              maxLength: 255
          description: Records in any of these field groups (ranking / matrix questions).
        - in: query
          name: field_type
          style: form
          explode: true
          schema:
            type: array
            maxItems: 9
            items:
              $ref: '#/components/schemas/FeedbackRecordFieldType'
          description: Records of any of these field types. An empty value is ignored, so `?field_type=` equals omitting the filter.
        - in: query
          name: value_id
          style: form
          explode: true
          schema:
            type: array
            maxItems: 100
            items:
              type: string
              maxLength: 255
          description: Records whose selected option id is any of these (e.g. every pick of one survey choice).
        - in: query
          name: user_id
          style: form
          explode: true
          schema:
            type: array
            maxItems: 100
            items:
              type: string
              maxLength: 255
          description: Everything any of these end users submitted.
        - in: query
          name: language
          style: form
          explode: true
          schema:
            type: array
            maxItems: 100
            items:
              type: string
              maxLength: 10
          description: Records given in any of these languages (ISO codes).
        - in: query
          name: since
          schema:
            type: string
            format: date-time
          description: '`collected_at >= since` (ISO 8601, inclusive). Must be between 1970-01-01 and 2080-12-31.'
        - in: query
          name: until
          schema:
            type: string
            format: date-time
          description: '`collected_at <= until` (ISO 8601, inclusive).'
        - in: query
          name: created_since
          schema:
            type: string
            format: date-time
          description: '`created_at >= created_since` (ISO 8601, inclusive). `created_at` is when the record was stored; `collected_at` (see `since`) is when the feedback was given. They diverge on a historical re-import, so this is the filter for "what did this import bring in".'
        - in: query
          name: created_until
          schema:
            type: string
            format: date-time
          description: '`created_at <= created_until` (ISO 8601, inclusive).'
        - in: query
          name: value_number_min
          schema:
            type: number
            format: double
          description: '`value_number >= value_number_min` (inclusive), e.g. NPS promoters with `value_number_min=9`. Records without a numeric answer are excluded. A max below the min answers **400**.'
        - in: query
          name: value_number_max
          schema:
            type: number
            format: double
          description: '`value_number <= value_number_max` (inclusive). Paired with the min it selects a band: `9..10` promoters, `0..6` detractors.'
        - in: query
          name: value_date_min
          schema:
            type: string
            format: date-time
          description: '`value_date >= value_date_min` (inclusive) — bounds the answer to a date question, not when the feedback was collected.'
        - in: query
          name: value_date_max
          schema:
            type: string
            format: date-time
          description: '`value_date <= value_date_max` (inclusive).'
        - in: query
          name: sentiment
          style: form
          explode: true
          schema:
            type: array
            maxItems: 6
            items:
              $ref: '#/components/schemas/FeedbackRecordSentiment'
          description: Records carrying any of these sentiment labels. An empty value is ignored.
        - in: query
          name: emotions
          style: form
          explode: true
          schema:
            type: array
            maxItems: 6
            items:
              $ref: '#/components/schemas/FeedbackRecordEmotion'
          description: 'Records tagged with **any** of these emotions: a record tagged `{joy}` and one tagged `{joy, anger}` both match `?emotions=joy&emotions=anger`. There is no "all of them" form.'
        - in: query
          name: sentiment_score_min
          schema:
            type: number
            format: double
            minimum: -1
            maximum: 1
          description: '`sentiment_score >= sentiment_score_min` (inclusive). The score is continuous where the label is bucketed, so this is the filter for "the most negative feedback".'
        - in: query
          name: sentiment_score_max
          schema:
            type: number
            format: double
            minimum: -1
            maximum: 1
          description: '`sentiment_score <= sentiment_score_max` (inclusive).'
        - in: query
          name: has_sentiment
          schema:
            type: boolean
          description: '`true` selects enriched records (a sentiment label is present), `false` the not-yet-enriched ones. Omit for no constraint.'
        - in: query
          name: has_emotions
          schema:
            type: boolean
          description: '`true` selects records carrying emotion labels, `false` those without. Note `false` covers both "not yet classified" and "classified, no emotion detected".'
        - in: query
          name: has_translation
          schema:
            type: boolean
          description: '`true` selects translated records, `false` untranslated ones. Omit for no constraint.'
        - in: query
          name: sort
          schema:
            type: string
            enum:
              - collected_at
              - created_at
            default: collected_at
          description: 'Column to order by. Only columns that are non-null and immutable after insert are offered: a mutable sort key would let a row move across the cursor between pages and be skipped.'
        - in: query
          name: order
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
          description: Sort direction. Rows tied on the sort column are ordered by `id` ascending.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
          description: 'Page size. Out-of-range and non-numeric values are rejected — `-5` and `1001` answer **400** — with one exception: `limit=0` is indistinguishable from omitting the parameter, so it is accepted and the default of `100` applies. Send no `limit` rather than `0` if you are computing it. The search operations behave differently again: they clamp instead of rejecting.'
        - in: query
          name: cursor
          schema:
            type: string
          description: 'Opaque keyset cursor returned as `next_cursor` by the previous page. Omit on the first request. A cursor is a position within one specific ordering: presenting it with a different `sort` or `order` answers **400** — restart without a cursor instead.'
      responses:
        '200':
          description: Feedback records retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackRecordList'
              examples:
                basic:
                  summary: One page of two records
                  value:
                    data:
                      - id: 018e1234-5678-7abc-8ef0-123456789abc
                        tenant_id: ph7zv3w2u1x5k9d8m4q6c0bn
                        collected_at: '2026-08-15T10:30:00Z'
                        created_at: '2026-08-15T10:30:02Z'
                        updated_at: '2026-08-15T10:30:02Z'
                        source_type: survey
                        source_id: cm2k7q9x00003v8h1a2b3c4d5
                        source_name: Post-match survey
                        submission_id: cm2k7qa1z0007v8h1e6f7g8h9
                        field_id: q1
                        field_label: How satisfied were you with the stadium experience?
                        field_type: rating
                        value_number: 4
                        user_id: fan-8813
                        language: en
                      - id: 018e1234-5678-7abc-8ef0-123456789abd
                        tenant_id: ph7zv3w2u1x5k9d8m4q6c0bn
                        collected_at: '2026-08-15T10:30:00Z'
                        created_at: '2026-08-15T10:30:02Z'
                        updated_at: '2026-08-15T10:31:40Z'
                        source_type: survey
                        source_id: cm2k7q9x00003v8h1a2b3c4d5
                        source_name: Post-match survey
                        submission_id: cm2k7qa1z0007v8h1e6f7g8h9
                        field_id: q2
                        field_label: What could we improve?
                        field_type: text
                        value_text: Queues at the north gate were far too long.
                        user_id: fan-8813
                        language: en
                        sentiment: negative
                        sentiment_score: -0.62
                        emotions:
                          - anger
                    limit: 100
                    next_cursor: eyJ0IjoiMjAyNi0wOC0xNVQxMDozMDowMFoiLCJpIjoiMDE4ZTEyMzQtNTY3OC03YWJjLThlZjAtMTIzNDU2Nzg5YWJkIn0=
        '400':
          $ref: '#/components/responses/FeedbackRecordsBadRequest'
        '401':
          $ref: '#/components/responses/FeedbackRecordsUnauthorized'
        '403':
          $ref: '#/components/responses/FeedbackRecordsForbidden'
        '500':
          $ref: '#/components/responses/FeedbackRecordsInternalServerError'
        '503':
          $ref: '#/components/responses/FeedbackRecordsServiceUnavailable'
      security:
        - apiKeyAuth: []
    post:
      operationId: createFeedbackRecordV3
      summary: Create a feedback record
      description: |
        Stores one feedback record in the dataset named by `tenant_id` in the body. The gateway reads
        `tenant_id` from the JSON body to authorize the call — a body that is not JSON, or has no
        `tenant_id`, answers **400** before anything is stored.

        Requires an API key with **write** permission (or higher) on a workspace the dataset is
        assigned to. Creating is allowed on shared datasets (it is ordinary workspace work, like a CSV
        import); only changing and deleting existing records is restricted to unshared ones.

        Ingestion is idempotent per (`tenant_id`, `submission_id`, `field_id`): a second record with the
        same triple answers **409** rather than creating a duplicate. Send exactly one `value_*` member,
        matching `field_type`. A `text` record is enriched asynchronously — `sentiment`, `emotions` and
        the translation members appear on the record once enrichment completes, and it becomes
        searchable once embedded.
      tags:
        - V3 Feedback Records
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFeedbackRecordRequest'
            examples:
              rating:
                summary: A rating answer
                value:
                  tenant_id: ph7zv3w2u1x5k9d8m4q6c0bn
                  source_type: survey
                  source_id: cm2k7q9x00003v8h1a2b3c4d5
                  source_name: Post-match survey
                  submission_id: cm2k7qa1z0007v8h1e6f7g8h9
                  field_id: q1
                  field_label: How satisfied were you with the stadium experience?
                  field_type: rating
                  value_number: 4
                  user_id: fan-8813
                  language: en
              text:
                summary: A free-text answer (enriched and embedded)
                value:
                  tenant_id: ph7zv3w2u1x5k9d8m4q6c0bn
                  source_type: call_notes
                  source_id: crm-account-4471
                  source_name: Quarterly review call
                  submission_id: call-2026-08-15-4471
                  field_id: verbatim
                  field_label: Customer verbatim
                  field_type: text
                  value_text: The new reporting module saved us a full day each week.
                  user_id: contact-9a1f
                  language: en
                  metadata:
                    channel: call
                    plan: enterprise
              categorical:
                summary: A choice answer with a stable option id
                value:
                  tenant_id: ph7zv3w2u1x5k9d8m4q6c0bn
                  source_type: survey
                  source_id: cm2k7q9x00003v8h1a2b3c4d5
                  submission_id: cm2k7qa1z0007v8h1e6f7g8h9
                  field_id: q3
                  field_label: Which stand were you in?
                  field_type: categorical
                  value_text: North stand
                  value_id: opt_north
                  user_id: fan-8813
      responses:
        '201':
          description: Feedback record created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackRecord'
              examples:
                created:
                  summary: The stored record
                  value:
                    id: 018e1234-5678-7abc-8ef0-123456789abc
                    tenant_id: ph7zv3w2u1x5k9d8m4q6c0bn
                    collected_at: '2026-08-15T10:30:00Z'
                    created_at: '2026-08-15T10:30:02Z'
                    updated_at: '2026-08-15T10:30:02Z'
                    source_type: survey
                    source_id: cm2k7q9x00003v8h1a2b3c4d5
                    source_name: Post-match survey
                    submission_id: cm2k7qa1z0007v8h1e6f7g8h9
                    field_id: q1
                    field_label: How satisfied were you with the stadium experience?
                    field_type: rating
                    value_number: 4
                    user_id: fan-8813
                    language: en
        '400':
          $ref: '#/components/responses/FeedbackRecordsBadRequest'
        '401':
          $ref: '#/components/responses/FeedbackRecordsUnauthorized'
        '403':
          $ref: '#/components/responses/FeedbackRecordsForbidden'
        '409':
          $ref: '#/components/responses/FeedbackRecordsConflict'
        '413':
          $ref: '#/components/responses/FeedbackRecordsPayloadTooLarge'
        '500':
          $ref: '#/components/responses/FeedbackRecordsInternalServerError'
        '503':
          $ref: '#/components/responses/FeedbackRecordsServiceUnavailable'
      security:
        - apiKeyAuth: []
    delete:
      operationId: deleteFeedbackRecordsByUserV3
      summary: Delete a user's feedback records
      description: |
        Permanently deletes every record in the dataset whose `user_id` matches — the erasure operation
        for GDPR Article 17 requests. Derived embeddings are removed with the records. Idempotent:
        repeating the call answers `deleted_count: 0`.

        `tenant_id` is **required**: the gateway scopes erasure to one dataset. (The underlying store
        can erase a user across every dataset when `tenant_id` is omitted; that form is not reachable
        through this API.) Records written without a `user_id` cannot be reached this way — delete them
        individually.

        Deletion is unrecoverable, so it requires an API key with **manage** permission on a workspace
        the dataset is assigned to, and the dataset must be assigned to **exactly one** workspace: on a
        shared dataset no workspace permission can say whose records these are, so API-key mutations
        are refused with **403**.
      tags:
        - V3 Feedback Records
      parameters:
        - in: query
          name: user_id
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
          description: The end-user identifier whose records to delete.
        - $ref: '#/components/parameters/FeedbackRecordsTenantIdQuery'
      responses:
        '200':
          description: Records deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteFeedbackRecordsByUserResult'
              examples:
                deleted:
                  summary: A user with records
                  value:
                    deleted_count: 42
                    message: Successfully deleted 42 feedback records
                nothingLeft:
                  summary: Repeated call
                  value:
                    deleted_count: 0
                    message: Successfully deleted 0 feedback records
        '400':
          $ref: '#/components/responses/FeedbackRecordsBadRequest'
        '401':
          $ref: '#/components/responses/FeedbackRecordsUnauthorized'
        '403':
          $ref: '#/components/responses/FeedbackRecordsForbidden'
        '409':
          $ref: '#/components/responses/FeedbackRecordsWriteConflict'
        '500':
          $ref: '#/components/responses/FeedbackRecordsInternalServerError'
        '503':
          $ref: '#/components/responses/FeedbackRecordsServiceUnavailable'
      security:
        - apiKeyAuth: []
  /api/v3/feedbackRecords/search/semantic:
    post:
      operationId: searchFeedbackRecordsV3
      summary: Search feedback records semantically
      description: |
        Embeds `query` and returns the ids of the records in the dataset whose text is closest to it,
        with cosine similarity scores. Only records with a non-empty `value_text` are embedded, so only
        those can match. The gateway reads `tenant_id` from the JSON body to authorize the call.
        Requires an API key with **read** permission (or higher) on a workspace the dataset is
        assigned to.

        Results carry ids and the embedded text only — fetch a match with
        `GET /api/v3/feedbackRecords/{id}` for the full record. Answers **503** on instances without
        an embedding model configured.
      tags:
        - V3 Feedback Records
      parameters:
        - $ref: '#/components/parameters/SimilarityLimitQuery'
        - $ref: '#/components/parameters/SimilarityCursorQuery'
        - $ref: '#/components/parameters/MinScoreQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRecordSemanticSearchRequest'
            example:
              query: complaints about waiting times at the gates
              tenant_id: ph7zv3w2u1x5k9d8m4q6c0bn
      responses:
        '200':
          description: Matches retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackRecordSimilarityResult'
              examples:
                matches:
                  summary: Two matches above the threshold
                  value:
                    data:
                      - feedback_record_id: 018e1234-5678-7abc-8ef0-123456789abd
                        score: 0.71
                        field_label: What could we improve?
                        value_text: Queues at the north gate were far too long.
                      - feedback_record_id: 018e1234-5678-7abc-8ef0-1234567890aa
                        score: 0.64
                        field_label: Anything else?
                        value_text: Took 40 minutes to get in. Please open more turnstiles.
                    limit: 10
        '400':
          $ref: '#/components/responses/FeedbackRecordsBadRequest'
        '401':
          $ref: '#/components/responses/FeedbackRecordsUnauthorized'
        '403':
          $ref: '#/components/responses/FeedbackRecordsForbidden'
        '413':
          $ref: '#/components/responses/FeedbackRecordsPayloadTooLarge'
        '500':
          $ref: '#/components/responses/FeedbackRecordsInternalServerError'
        '503':
          $ref: '#/components/responses/FeedbackRecordsServiceUnavailable'
      security:
        - apiKeyAuth: []
  /api/v3/feedbackRecords/{id}:
    get:
      operationId: getFeedbackRecordV3
      summary: Get a feedback record
      description: |
        Returns one feedback record by id. The gateway looks the record up to learn its dataset and
        authorizes against that, so no `tenant_id` is sent. Requires an API key with **read**
        permission (or higher) on a workspace the record's dataset is assigned to.

        An unknown id, or one in a dataset you cannot read, answers **403** rather than 404, so ids
        cannot be probed. The exception is the minute after a delete: the gateway still has the
        record's dataset cached, authorizes the call, and the store answers **404**.
      tags:
        - V3 Feedback Records
      parameters:
        - $ref: '#/components/parameters/FeedbackRecordIdPath'
      responses:
        '200':
          description: Feedback record retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackRecord'
              examples:
                enriched:
                  summary: A text record after enrichment
                  value:
                    id: 018e1234-5678-7abc-8ef0-123456789abd
                    tenant_id: ph7zv3w2u1x5k9d8m4q6c0bn
                    collected_at: '2026-08-15T10:30:00Z'
                    created_at: '2026-08-15T10:30:02Z'
                    updated_at: '2026-08-15T10:31:40Z'
                    source_type: survey
                    source_id: cm2k7q9x00003v8h1a2b3c4d5
                    source_name: Post-match survey
                    submission_id: cm2k7qa1z0007v8h1e6f7g8h9
                    field_id: q2
                    field_label: What could we improve?
                    field_type: text
                    value_text: Queues at the north gate were far too long.
                    user_id: fan-8813
                    language: en
                    sentiment: negative
                    sentiment_score: -0.62
                    emotions:
                      - anger
                    value_text_translated: Die Warteschlangen am Nordtor waren viel zu lang.
                    translation_lang_key: de
        '400':
          $ref: '#/components/responses/FeedbackRecordsBadRequest'
        '401':
          $ref: '#/components/responses/FeedbackRecordsUnauthorized'
        '403':
          $ref: '#/components/responses/FeedbackRecordsForbidden'
        '404':
          $ref: '#/components/responses/FeedbackRecordsRecordNotFound'
        '500':
          $ref: '#/components/responses/FeedbackRecordsInternalServerError'
        '503':
          $ref: '#/components/responses/FeedbackRecordsServiceUnavailable'
      security:
        - apiKeyAuth: []
    patch:
      operationId: updateFeedbackRecordV3
      summary: Update a feedback record
      description: |
        Changes the answer, `language`, `user_id` or `metadata` of one record. Only the members sent
        are changed; provenance (`tenant_id`, `source_*`, `field_*`, `submission_id`, `collected_at`)
        is immutable. Requires an API key with **write** permission (or higher) on a workspace the
        record's dataset is assigned to, and the dataset must be assigned to **exactly one** workspace
        — see the delete operation for why.

        Two behaviours are silent and worth knowing: `metadata` is **replaced**, not merged; and
        changing `value_text` clears the enrichment members (`sentiment`, `sentiment_score`,
        `emotions`, `value_text_translated`, `translation_lang_key`) and queues re-enrichment and
        re-embedding — the response shows them absent until that completes. Changing `language` clears
        and re-queues the translation pair only.
      tags:
        - V3 Feedback Records
      parameters:
        - $ref: '#/components/parameters/FeedbackRecordIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFeedbackRecordRequest'
            examples:
              correctText:
                summary: Correct a text answer
                value:
                  value_text: Queues at the north gate were far too long on match day.
              replaceMetadata:
                summary: Replace the metadata object
                value:
                  metadata:
                    channel: survey
                    stand: north
                    priority: high
      responses:
        '200':
          description: Feedback record updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackRecord'
              examples:
                updated:
                  summary: After correcting the text — enrichment members are cleared pending re-enrichment
                  value:
                    id: 018e1234-5678-7abc-8ef0-123456789abd
                    tenant_id: ph7zv3w2u1x5k9d8m4q6c0bn
                    collected_at: '2026-08-15T10:30:00Z'
                    created_at: '2026-08-15T10:30:02Z'
                    updated_at: '2026-08-16T09:02:11Z'
                    source_type: survey
                    source_id: cm2k7q9x00003v8h1a2b3c4d5
                    source_name: Post-match survey
                    submission_id: cm2k7qa1z0007v8h1e6f7g8h9
                    field_id: q2
                    field_label: What could we improve?
                    field_type: text
                    value_text: Queues at the north gate were far too long on match day.
                    user_id: fan-8813
                    language: en
        '400':
          $ref: '#/components/responses/FeedbackRecordsBadRequest'
        '401':
          $ref: '#/components/responses/FeedbackRecordsUnauthorized'
        '403':
          $ref: '#/components/responses/FeedbackRecordsForbidden'
        '404':
          $ref: '#/components/responses/FeedbackRecordsRecordNotFound'
        '409':
          $ref: '#/components/responses/FeedbackRecordsWriteConflict'
        '413':
          $ref: '#/components/responses/FeedbackRecordsPayloadTooLarge'
        '500':
          $ref: '#/components/responses/FeedbackRecordsInternalServerError'
        '503':
          $ref: '#/components/responses/FeedbackRecordsServiceUnavailable'
      security:
        - apiKeyAuth: []
    delete:
      operationId: deleteFeedbackRecordV3
      summary: Delete a feedback record
      description: |
        Permanently deletes one record and its derived embedding. Unrecoverable, so it requires an API
        key with **manage** permission on a workspace the record's dataset is assigned to, and the
        dataset must be assigned to **exactly one** workspace: on a shared dataset no workspace
        permission can say whose record this is, so API-key mutations are refused with **403**.
      tags:
        - V3 Feedback Records
      parameters:
        - $ref: '#/components/parameters/FeedbackRecordIdPath'
      responses:
        '204':
          description: Feedback record deleted
        '400':
          $ref: '#/components/responses/FeedbackRecordsBadRequest'
        '401':
          $ref: '#/components/responses/FeedbackRecordsUnauthorized'
        '403':
          $ref: '#/components/responses/FeedbackRecordsForbidden'
        '404':
          $ref: '#/components/responses/FeedbackRecordsRecordNotFound'
        '409':
          $ref: '#/components/responses/FeedbackRecordsWriteConflict'
        '500':
          $ref: '#/components/responses/FeedbackRecordsInternalServerError'
        '503':
          $ref: '#/components/responses/FeedbackRecordsServiceUnavailable'
      security:
        - apiKeyAuth: []
  /api/v3/feedbackRecords/{id}/similar:
    get:
      operationId: getSimilarFeedbackRecordsV3
      summary: Find similar feedback records
      description: |
        Returns the records in the same dataset whose embedded text is closest to the given record's,
        with cosine similarity scores. The anchor record itself is excluded. The gateway looks the
        record up to learn its dataset and authorizes against that. Requires an API key with **read**
        permission (or higher) on a workspace the record's dataset is assigned to.

        Answers **403** for an unknown or inaccessible id. Answers **404** when the record exists but has
        no embedding — it has no text, or was created moments ago and is not embedded yet. Answers
        **503** on instances without an embedding model configured.
      tags:
        - V3 Feedback Records
      parameters:
        - $ref: '#/components/parameters/FeedbackRecordIdPath'
        - $ref: '#/components/parameters/SimilarityLimitQuery'
        - $ref: '#/components/parameters/SimilarityCursorQuery'
        - $ref: '#/components/parameters/MinScoreQuery'
      responses:
        '200':
          description: Similar records retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackRecordSimilarityResult'
              examples:
                matches:
                  summary: One neighbour above the threshold
                  value:
                    data:
                      - feedback_record_id: 018e1234-5678-7abc-8ef0-1234567890aa
                        score: 0.83
                        field_label: Anything else?
                        value_text: Took 40 minutes to get in. Please open more turnstiles.
                    limit: 10
        '400':
          $ref: '#/components/responses/FeedbackRecordsBadRequest'
        '401':
          $ref: '#/components/responses/FeedbackRecordsUnauthorized'
        '403':
          $ref: '#/components/responses/FeedbackRecordsForbidden'
        '404':
          $ref: '#/components/responses/FeedbackRecordsNotFound'
        '500':
          $ref: '#/components/responses/FeedbackRecordsInternalServerError'
        '503':
          $ref: '#/components/responses/FeedbackRecordsServiceUnavailable'
      security:
        - apiKeyAuth: []
components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: next-auth.session-token
      description: |
        NextAuth session JWT cookie. **Development:** often `next-auth.session-token`.
        **Production (HTTPS):** often `__Secure-next-auth.session-token`. Send the cookie your browser receives after sign-in.
    apiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: |
        Management API key; must include **workspaceId** as an allowed workspace with read, write, or manage permission.
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        The same management API key, presented as `Authorization: Bearer <key>` instead of `x-api-key`. Equivalent in every way — same key, same workspace permissions — and offered because it is what most HTTP clients and SDK generators reach for by default.
        A **401** from any operation that accepts it carries `WWW-Authenticate: Bearer realm="formbricks"`. Session-only operations accept neither this nor `x-api-key`.
  schemas:
    SurveyListItem:
      type: object
      description: |
        Shape returned by `GET /api/v3/surveys`. Serialized dates are ISO 8601 strings.
        The v3 overview contract intentionally omits internal fields such as `_count`.
        Legacy DB rows may include survey **type** values `website` or `web` (see Prisma); filter **type** only accepts `link` | `app`.
      required:
        - id
        - name
        - workspaceId
        - type
        - status
        - publishOn
        - createdAt
        - updatedAt
        - archivedAt
        - responseCount
        - completedResponseCount
        - creator
      properties:
        id:
          type: string
        name:
          type: string
        workspaceId:
          type: string
        type:
          type: string
          enum:
            - link
            - app
            - website
            - web
        status:
          type: string
          enum:
            - draft
            - inProgress
            - paused
            - completed
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        archivedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: Soft-delete/archive marker (ISO 8601); `null` when the survey is active.
        publishOn:
          type:
            - string
            - 'null'
          format: date-time
          description: Scheduled publish time (ISO 8601), or null if not scheduled.
        responseCount:
          type: integer
          description: Number of responses, including partial ones.
        completedResponseCount:
          type: integer
          description: Number of responses the respondent finished.
        creator:
          type:
            - object
            - 'null'
          description: The user who created the survey, or null for API-key/system-created surveys.
          required:
            - name
          properties:
            name:
              type: string
          additionalProperties: false
    InvalidParam:
      type: object
      description: |
        Field-level validation error. `name` and `reason` are always intended for humans.
        Optional machine-readable fields are included when the API can identify the semantic error,
        especially for survey locale, identifier, and reference validation used by MCP and agent clients.
      required:
        - name
        - reason
      properties:
        name:
          type: string
          description: Dot-path to the invalid request field.
        reason:
          type: string
          description: Human-readable repair guidance.
        code:
          type: string
          enum:
            - dangling_reference
            - duplicate_identifier
            - duplicate_locale
            - forbidden_identifier
            - immutable_identifier
            - invalid_locale
            - invalid_reference
            - missing_required_field
            - missing_translation
            - unsupported_field
            - unsupported_locale
          description: |
            Machine-readable validation category, when available.

            This is the shared error shape every v3 operation returns, so it lists what the API can emit today and nothing more — `INVALID_PARAM_CODES` in `app/api/v3/lib/response.ts` is the registry, and a code absent from it is dropped before the response is built. Categories for operations that do not exist yet are added with the code that emits them, not ahead of it.
        identifier:
          type: string
          description: Identifier involved in the validation failure, when available. For language errors, this can be the normalized language code.
        referenceType:
          type: string
          enum:
            - block
            - element
            - ending
            - hiddenField
            - language
            - variable
            - variableName
            - recall
          description: 'Identifier namespace involved in the validation failure. Same rule as `code`: these are the namespaces the API emits today, and more arrive with the operations that emit them.'
        missingId:
          type: string
          description: Referenced id that does not exist in the submitted survey document.
        firstUsedAt:
          type: string
          description: Dot-path where a duplicate identifier was first used.
        conflictsWith:
          type: string
          description: Dot-path to the existing identifier that conflicts with this field.
      additionalProperties: false
    Problem:
      type: object
      description: |-
        RFC 9457 Problem Details for HTTP APIs (`application/problem+json`). Responses typically include a machine-readable `code` field alongside `title`, `status`, `detail`, and `requestId`.

        Branch on `code`, not on `detail` or `title`: `code` is stable and locale-independent, whereas `detail` is prose that may be reworded. No problem sets `type`, so per RFC 9457 §4.2.1 `title` is always the HTTP reason phrase for `status` and carries no information of its own.

        Member naming is frozen as published, mixed conventions included (`requestId` alongside `invalid_params` and `details.resource_type`): renaming any of them would break every client that reads them.
      required:
        - title
        - status
        - detail
        - requestId
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          enum:
            - ai_features_not_enabled
            - ai_generated_payload_invalid
            - ai_instance_not_configured
            - ai_output_too_long
            - ai_smart_tools_disabled
            - bad_gateway
            - bad_request
            - conflict
            - forbidden
            - internal_server_error
            - invalid_workflow_state
            - not_authenticated
            - not_found
            - payload_too_large
            - service_unavailable
            - too_many_requests
            - unprocessable_content
            - workflow_not_executable
        requestId:
          type: string
        details:
          type: object
        invalid_params:
          type: array
          items:
            $ref: '#/components/schemas/InvalidParam'
    TranslatableTextMap:
      type: object
      description: Multilingual text map keyed by the emitted `languages[].code` values for this survey.
      propertyNames:
        type: string
        description: Survey language code/tag, for example `en-US`, `de-DE`, or `zh-Hans-CN`.
      additionalProperties:
        type: string
    TranslatableText:
      allOf:
        - $ref: '#/components/schemas/TranslatableTextMap'
      description: |
        Survey authoring text. `GET /api/v3/surveys/{surveyId}` always returns maps keyed by the emitted
        `languages[].code` values for this survey. Use `?lang=` to filter which language keys are included.
        The internal storage key `default` is never exposed by v3.
      examples:
        - en-US: What should we improve?
          de-DE: Was sollten wir verbessern?
    SurveyMetadata:
      type: object
      description: |
        Arbitrary JSON survey context for customer- or operation-specific metadata. v3 preserves
        arbitrary metadata values as-is. If present, `title` and `description` are treated as
        translatable text maps and returned with real locale-code keys.
      properties:
        title:
          $ref: '#/components/schemas/TranslatableText'
        description:
          $ref: '#/components/schemas/TranslatableText'
      additionalProperties: true
    LocaleCode:
      type: string
      pattern: ^[a-z]{2}(?:-[A-Z][a-z]{3})?-[A-Z]{2}$
