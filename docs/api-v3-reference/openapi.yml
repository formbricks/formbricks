servers:
  - url: https://app.formbricks.com
    description: Formbricks Cloud. Paths in this spec already include the `/api/v3` prefix; self-hosted instances substitute their own origin.
paths:
  /api/v3/surveys:
    get:
      operationId: getSurveysV3
      summary: List surveys
      description: |
        Returns surveys for the workspace. Session cookie or x-api-key.
      tags:
        - V3 Surveys
      parameters:
        - in: query
          name: workspaceId
          required: true
          schema:
            type: string
            format: cuid2
          description: |
            Workspace identifier. This is the canonical container ID for v3 APIs.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 250
            default: 20
          description: Page size (max 250)
        - in: query
          name: cursor
          schema:
            type: string
          description: |
            Opaque cursor returned as `meta.nextCursor` from the previous page. Omit on the first request.
        - in: query
          name: includeTotalCount
          schema:
            type: boolean
            default: true
          description: |
            Whether to calculate `meta.totalCount` for this request. Set to `false` on cursor-pagination follow-up requests to skip the extra count query; in that case `meta.totalCount` is `null`.
        - in: query
          name: filter[name][contains]
          schema:
            type: string
            maxLength: 512
          description: Case-insensitive substring match on survey name (same as in-app list filters).
        - in: query
          name: filter[status][in]
          schema:
            type: array
            items:
              type: string
              enum:
                - draft
                - inProgress
                - paused
                - completed
                - archived
          style: form
          explode: true
          description: |
            Survey status filter. Repeat the parameter (`filter[status][in]=draft&filter[status][in]=inProgress`) or use comma-separated values (`filter[status][in]=draft,inProgress`). Invalid values → **400**.
            `archived` is a pseudo-status: it does not match a real survey status but includes archived (soft-deleted) surveys in the result set. Archived surveys are otherwise excluded from the default list.
        - in: query
          name: filter[type][in]
          schema:
            type: array
            items:
              type: string
              enum:
                - link
                - app
          style: form
          explode: true
          description: Survey type filter (`link` / `app`). Same repeat-or-comma rules as `filter[status][in]`.
        - in: query
          name: sortBy
          schema:
            type: string
            enum:
              - createdAt
              - updatedAt
              - name
              - relevance
          description: Sort order. Defaults to `updatedAt`. The `cursor` token is bound to the selected sort order.
      responses:
        '200':
          description: Surveys retrieved successfully
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Request correlation ID
            Cache-Control:
              schema:
                type: string
              example: private, no-store
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SurveyListItem'
                  meta:
                    type: object
                    required:
                      - limit
                      - nextCursor
                      - totalCount
                      - hasArchived
                    properties:
                      limit:
                        type: integer
                      nextCursor:
                        type:
                          - string
                          - 'null'
                        description: Opaque cursor for the next page. `null` when there are no more results.
                      totalCount:
                        type:
                          - integer
                          - 'null'
                        minimum: 0
                        description: Total number of surveys matching the current filters across all pages. `null` when `includeTotalCount=false`.
                      hasArchived:
                        type:
                          - boolean
                          - 'null'
                        description: '`true` when the workspace has at least one archived (soft-deleted) survey. Computed only on the first page (same gate as `totalCount`); `null` when `includeTotalCount=false`.'
        '400':
          $ref: '#/components/responses/V3BadRequest'
        '401':
          $ref: '#/components/responses/V3Unauthorized'
        '403':
          $ref: '#/components/responses/V3Forbidden'
        '429':
          $ref: '#/components/responses/V3TooManyRequests'
        '500':
          $ref: '#/components/responses/V3InternalServerError'
      security:
        - sessionAuth: []
        - apiKeyAuth: []
    post:
      operationId: createSurveyV3
      summary: Create a survey
      description: |
        Creates a block-based survey template from one strict survey document. The endpoint accepts
        multilingual authoring maps keyed by real locale codes and converts them to Formbricks'
        internal default-language representation. Non-default locale keys in translated content
        must be declared in `languages`; undeclared locale keys return `unsupported_locale` in
        `invalid_params` instead of silently mutating workspace languages.

        `blocks[].id` and `variables[].id` are stable public identifiers. They may be omitted on
        create, in which case the server generates cuid2 ids. If the same create request needs to
        reference a block or variable from logic, provide explicit valid ids and use those references
        consistently.

        For normal sequential surveys, omit `logic` and `logicFallback`. `logicFallback` is only valid
        when the same block has at least one `logic` rule; otherwise the API returns
        `invalid_reference`.

        `type` may be omitted or set to `link` or `app`. App surveys additionally accept the `distribution` (display options + triggers) and `targeting` (contact segment filters) objects; both are rejected for link surveys. Trigger ids must reference existing workspace action classes (discover them via `GET /api/v3/action-classes`), and `targeting.filters` references (contact-attribute keys and segments) must exist in the workspace. Unsupported fields are rejected instead of ignored.
      tags:
        - V3 Surveys
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSurveyRequest'
            examples:
              productFeedback:
                summary: Create a multilingual block-based survey
                value:
                  workspaceId: clxx1234567890123456789012
                  name: Product Feedback Survey
                  status: draft
                  defaultLanguage: en-US
                  metadata:
                    cx_operation: enterprise_onboarding
                    title:
                      en-US: Product Feedback
                      de-DE: Produktfeedback
                  languages:
                    - code: de-DE
                      enabled: true
                  welcomeCard:
                    enabled: true
                    headline:
                      en-US: Welcome
                      de-DE: Willkommen
                  blocks:
                    - name: Main Block
                      elements:
                        - id: satisfaction
                          type: openText
                          headline:
                            en-US: What should we improve?
                            de-DE: Was sollen wir verbessern?
                          required: true
                  endings: []
                  hiddenFields:
                    enabled: false
                  variables: []
              appSurvey:
                summary: Create an in-app (app) survey with distribution and triggers
                description: |
                  App surveys are shown inside your web or mobile app. `distribution` controls display behavior and the action classes that trigger the survey (by id — discover ids via `GET /api/v3/action-classes`). `targeting.filters` scopes the audience; an empty array targets everyone. `type` is immutable after creation.
                value:
                  workspaceId: clxx1234567890123456789012
                  name: In-App Onboarding Feedback
                  type: app
                  status: draft
                  defaultLanguage: en-US
                  blocks:
                    - name: Onboarding
                      elements:
                        - id: onboarding_feedback
                          type: openText
                          headline:
                            en-US: How was your setup experience?
                          required: false
                  endings: []
                  hiddenFields:
                    enabled: false
                  variables: []
                  distribution:
                    displayOption: respondMultiple
                    recontactDays: 7
                    delay: 5
                    triggers:
                      - actionClassId: clyy1234567890123456789012
                  targeting:
                    filters:
                      - id: clf0aaaaaaaaaaaaaaaaaaaa01
                        connector: null
                        resource:
                          id: clf1aaaaaaaaaaaaaaaaaaaa01
                          root:
                            type: attribute
                            contactAttributeKey: plan
                          qualifier:
                            operator: equals
                          value: pro
                      - id: clf2aaaaaaaaaaaaaaaaaaaa01
                        connector: and
                        resource:
                          - id: clf3aaaaaaaaaaaaaaaaaaaa01
                            connector: null
                            resource:
                              id: clf4aaaaaaaaaaaaaaaaaaaa01
                              root:
                                type: attribute
                                contactAttributeKey: role
                              qualifier:
                                operator: equals
                              value: admin
                          - id: clf5aaaaaaaaaaaaaaaaaaaa01
                            connector: or
                            resource:
                              id: clf6aaaaaaaaaaaaaaaaaaaa01
                              root:
                                type: attribute
                                contactAttributeKey: role
                              qualifier:
                                operator: equals
                              value: owner
              sequentialProductSurvey:
                summary: Create a richer sequential survey without logicFallback
                description: |
                  Multi-block survey with generated block and variable ids. Sequential surveys should
                  omit `logic` and `logicFallback`; blocks are shown in array order.
                value:
                  workspaceId: clxx1234567890123456789012
                  name: Sequential Product Survey
                  defaultLanguage: en-US
                  languages:
                    - code: de-DE
                      enabled: true
                  metadata:
                    cx_operation: product_feedback
                    title:
                      en-US: Sequential Product Survey
                      de-DE: Sequenzielle Produktumfrage
                  welcomeCard:
                    enabled: true
                    headline:
                      en-US: Help us improve the product
                      de-DE: Hilf uns, das Produkt zu verbessern
                  hiddenFields:
                    enabled: true
                    fieldIds:
                      - account_id
                      - plan
                  variables:
                    - name: feedback_score
                      type: number
                      value: 0
                  blocks:
                    - name: Satisfaction
                      elements:
                        - id: overall_rating
                          type: rating
                          headline:
                            en-US: How satisfied are you with the product?
                            de-DE: Wie zufrieden bist du mit dem Produkt?
                          required: true
                          range: 5
                          scale: smiley
                        - id: product_area
                          type: multipleChoiceSingle
                          headline:
                            en-US: Which area should we improve first?
                            de-DE: Welchen Bereich sollten wir zuerst verbessern?
                          required: true
                          choices:
                            - id: onboarding
                              label:
                                en-US: Onboarding
                                de-DE: Onboarding
                            - id: analytics
                              label:
                                en-US: Analytics
                                de-DE: Analysen
                    - name: Feedback
                      elements:
                        - id: free_text_feedback
                          type: openText
                          headline:
                            en-US: What is one thing we should change?
                            de-DE: Was sollten wir ändern?
                          required: false
                          longAnswer: true
                  endings:
                    - id: cmpsequentialend0000000000
                      type: endScreen
                      headline:
                        en-US: Thanks for your feedback!
                        de-DE: Danke für dein Feedback!
      responses:
        '201':
          description: Survey created successfully
          headers:
            Location:
              schema:
                type: string
              description: Relative URL of the created survey resource.
              example: /api/v3/surveys/clsv1234567890123456789012
            X-Request-Id:
              schema:
                type: string
              description: Request correlation ID
            Cache-Control:
              schema:
                type: string
              example: private, no-store
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/SurveyResource'
        '400':
          description: |
            Bad Request — the document failed schema validation, i.e. any rule checkable from the request body alone, without consulting stored state. Covers: invalid JSON; unknown or unsupported fields (including `distribution`/`targeting` sent on a `link` survey, which are `app`-only); missing required fields; wrong types or out-of-range values; bad enum values; malformed multilingual maps; and intra-document field-combination rules — notably `displayLimit` is required (must be >= 1) when `displayOption` is `displaySome`. Cross-reference failures that need stored state to detect return **422** instead. Every offending field is itemized in `invalid_params`. Unknown or forbidden fields carry `code: unsupported_field` (e.g. `distribution` on a link survey); omissions carry `code: missing_required_field` (e.g. `displayLimit` when `displayOption` is `displaySome`). Bare type, range, enum, and malformed-locale-map violations report the field `name` with a human-readable `reason` and no machine `code`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/V3Unauthorized'
        '403':
          description: Forbidden — no write access, missing external URL permission, missing Contacts entitlement for app-survey targeting, or workspace does not exist (404 not used; avoids existence leak)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 'Unprocessable Content — the document passed schema validation but failed a cross-reference check that requires stored state to detect: duplicate stable ids, dangling logic/jump references, undeclared locale keys used in content, invalid media URLs, a `distribution.triggers[].actionClassId` referencing an action class that does not exist in the workspace (discover valid ids via `GET /api/v3/action-classes`), or a `targeting.filters` entry that cannot resolve in the workspace — an unknown contact-attribute key or segment, an unsupported person identifier, or an unknown device value. Also returned when the document passes this endpoint''s request schema but is rejected by the stricter validation the survey service applies on write — for example a CTA `buttonUrl` whose scheme the service does not accept. The `invalid_params` array pinpoints each issue (e.g. `code: invalid_reference` with the offending `identifier`).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/V3TooManyRequests'
        '500':
          $ref: '#/components/responses/V3InternalServerError'
      security:
        - sessionAuth: []
        - apiKeyAuth: []
  /api/v3/surveys/generate:
    post:
      operationId: generateSurveyV3
      summary: Create a survey draft payload with AI
      description: |
        Creates a strict v3 `POST /api/v3/surveys` create payload from a creator prompt and returns
        validation metadata. This endpoint is single-purpose: it does **not** persist the survey.
        Clients should validate the returned payload with `/api/v3/surveys/validate` or use the
        embedded validation metadata, then create the draft through `POST /api/v3/surveys`.

        The generated payload always sets `status: draft`. Both `type: link` and `type: app` are
        supported; for `app`, the payload includes a default `distribution` (display once, no triggers,
        no targeting) that you finish configuring in the editor or via the create request.

        Prompt privacy: prompt text is sent to the configured AI provider to create the payload, but
        this endpoint does not store prompts and server logs should use request ids and failure
        categories instead of raw prompt content.
      tags:
        - V3 Surveys
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateSurveyRequest'
            examples:
              onboarding:
                summary: Create a link survey draft
                value:
                  workspaceId: clxx1234567890123456789012
                  type: link
                  language: en-US
                  prompt: Understand why new users stop during onboarding and what would help them finish setup.
      responses:
        '200':
          description: Survey create payload generated successfully. The survey has not been created yet.
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Request correlation ID
            Cache-Control:
              schema:
                type: string
              example: private, no-store
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/GenerateSurveyResult'
              examples:
                generated:
                  summary: Generated draft create payload
                  value:
                    data:
                      language: en-US
                      payload:
                        workspaceId: clxx1234567890123456789012
                        type: link
                        name: Onboarding Completion Survey
                        status: draft
                        defaultLanguage: en-US
                        languages:
                          - code: en-US
                            default: true
                            enabled: true
                        metadata:
                          title:
                            en-US: Onboarding Completion Survey
                        welcomeCard:
                          enabled: false
                        blocks:
                          - id: clbk1234567890123456789012
                            name: Main
                            elements:
                              - id: q_1_example
                                type: openText
                                headline:
                                  en-US: What made onboarding hard to complete?
                                required: false
                                isDraft: true
                                inputType: text
                                longAnswer: false
                                charLimit:
                                  enabled: false
                        endings:
                          - id: clen1234567890123456789012
                            type: endScreen
                            headline:
                              en-US: Thanks for your feedback
                        hiddenFields:
                          enabled: false
                        variables: []
                      validation:
                        valid: true
                        invalid_params: []
                        languages:
                          - code: en-US
                            default: true
                            enabled: true
        '400':
          description: Malformed body or a prompt that is too short or underspecified
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                shortPrompt:
                  summary: Prompt needs more detail
                  value:
                    title: Bad Request
                    status: 400
                    detail: Prompt needs more detail
                    code: bad_request
                    requestId: req_123
                    invalid_params:
                      - name: prompt
                        reason: Describe the survey goal, audience, or topic in a sentence so the AI can create a useful draft.
        '401':
          $ref: '#/components/responses/V3Unauthorized'
        '403':
          description: Forbidden — no write access, workspace does not exist, AI is not in plan, or AI smart tools are disabled
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                noWorkspaceWriteAccess:
                  summary: No workspace write access
                  value:
                    title: Forbidden
                    status: 403
                    detail: You are not authorized to access this resource
                    code: forbidden
                    requestId: req_123
                aiDisabled:
                  summary: AI smart tools disabled
                  value:
                    title: AI Unavailable
                    status: 403
                    detail: AI smart tools are disabled for this organization.
                    code: ai_smart_tools_disabled
                    requestId: req_123
                aiNotInPlan:
                  summary: AI features not enabled for the plan
                  value:
                    title: AI Unavailable
                    status: 403
                    detail: AI features are not enabled for this organization's plan.
                    code: ai_features_not_enabled
                    requestId: req_123
        '422':
          description: AI generated an invalid payload after schema and v3 create validation, or the generation stopped because the output token limit was reached
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                invalidGeneratedPayload:
                  summary: Invalid generated payload
                  value:
                    title: Unprocessable Content
                    status: 422
                    detail: 'Generated survey payload is invalid: generatedSurvey.blocks: Too small'
                    code: ai_generated_payload_invalid
                    requestId: req_123
                    invalid_params:
                      - name: generatedSurvey.blocks
                        reason: Too small
                aiOutputTooLong:
                  summary: Output token limit reached
                  value:
                    title: Unprocessable Content
                    status: 422
                    detail: The generated survey exceeded the AI output token limit. Simplify the prompt or split it into smaller surveys.
                    code: ai_output_too_long
                    requestId: req_123
        '429':
          $ref: '#/components/responses/V3TooManyRequests'
        '500':
          $ref: '#/components/responses/V3InternalServerError'
        '502':
          description: The configured AI provider failed or could not produce a valid draft
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                providerFailed:
                  summary: AI provider failed
                  value:
                    title: Bad Gateway
                    status: 502
                    detail: The AI provider could not generate a valid survey draft. Try again or add more detail.
                    code: bad_gateway
                    requestId: req_123
        '503':
          description: AI is not configured on this Formbricks instance
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                instanceNotConfigured:
                  summary: AI instance configuration missing
                  value:
                    title: AI Unavailable
                    status: 503
                    detail: AI is not configured for this Formbricks instance.
                    code: ai_instance_not_configured
                    requestId: req_123
      security:
        - sessionAuth: []
        - apiKeyAuth: []
  /api/v3/surveys/validate:
    post:
      operationId: validateSurveyV3
      summary: Validate a survey document
      description: |
        Validates a future create or patch survey payload without writing data, creating languages,
        or creating survey versions. Invalid survey documents return `200` with `data.valid=false`
        so agents and MCP clients can repair payloads from structured `invalid_params`.

        Use `400` only for malformed validation envelopes, unsupported operations, invalid `surveyId`,
        or unsupported query parameters.
      tags:
        - V3 Surveys
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateSurveyRequest'
            examples:
              createValidation:
                summary: Validate a create payload
                value:
                  operation: create
                  data:
                    workspaceId: clxx1234567890123456789012
                    name: Product Feedback Survey
                    defaultLanguage: en-US
                    blocks:
                      - id: clbk1234567890123456789012
                        name: Main Block
                        elements:
                          - id: satisfaction
                            type: openText
                            headline:
                              en-US: What should we improve?
                            required: true
              patchValidation:
                summary: Validate a patch payload
                value:
                  operation: patch
                  surveyId: clsv1234567890123456789012
                  data:
                    blocks:
                      - id: clbk1234567890123456789012
                        name: Main Block
                        elements:
                          - id: satisfaction
                            type: openText
                            headline:
                              en-US: What should we improve?
                            required: true
      responses:
        '200':
          description: Validation completed. The survey document may still be invalid.
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Request correlation ID
            Cache-Control:
              schema:
                type: string
              example: private, no-store
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/SurveyValidationResult'
              examples:
                invalid:
                  summary: Invalid survey document
                  value:
                    data:
                      valid: false
                      operation: create
                      invalid_params:
                        - name: blocks.0.elements.0.buttonUrl
                          reason: Unsupported field 'buttonUrl' for element type 'openText'. Allowed fields...
                valid:
                  summary: Valid survey document
                  value:
                    data:
                      valid: true
                      operation: create
                      invalid_params: []
                      languages:
                        - code: en-US
                          default: true
                          enabled: true
                          writeBehavior: connect_or_create
        '400':
          description: Malformed validation envelope, invalid route/query data, or unsupported operation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/V3Unauthorized'
        '403':
          $ref: '#/components/responses/V3Forbidden'
        '429':
          $ref: '#/components/responses/V3TooManyRequests'
        '500':
          $ref: '#/components/responses/V3InternalServerError'
      security:
        - sessionAuth: []
        - apiKeyAuth: []
  /api/v3/surveys/{surveyId}:
    get:
      operationId: getSurveyV3
      summary: Retrieve a survey
      description: |
        Returns the public v3 survey management resource for one survey. By default, translatable
        fields are returned as stable multilingual maps keyed by the language codes emitted in
        `languages[].code`. Use `lang` to filter those maps to one or more requested language selectors.
      tags:
        - V3 Surveys
      parameters:
        - in: path
          name: surveyId
          required: true
          schema:
            type: string
            format: cuid2
          description: Survey identifier.
        - in: query
          name: lang
          required: false
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
            examples:
              - - de-DE
              - - de-DE
                - pt-PT
              - - de
              - - zh-Hans
              - - zh-Hans-CN
          description: |
            Comma-separated language selector filter for translatable fields, for example `?lang=de-DE,pt-PT`.
            The response shape stays stable: translatable fields are always maps, never strings, and response
            keys match the emitted `languages[].code` values for this survey.
            For compatibility with existing Formbricks surveys, GET accepts language tags such as `de`,
            `de-DE`, `zh-Hans`, and `zh-Hans-CN`, accepts `_` or `-` separators, is case-insensitive, and
            accepts configured workspace aliases such as `english`. Bare language selectors are resolved
            against the survey's configured languages and return `400` if ambiguous, for example if both
            `en-US` and `en-GB` are configured.
            Disabled-but-configured languages are readable in the management API so unfinished translations can
            be completed.
      responses:
        '200':
          description: Survey retrieved successfully
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Request correlation ID
            Cache-Control:
              schema:
                type: string
              example: private, no-store
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/SurveyResource'
              examples:
                multilingual:
                  summary: Multilingual authoring resource
                  value:
                    data:
                      id: clseedsurveycsat000000
                      workspaceId: clseedworkspace000000000
                      createdAt: '2026-05-18T09:24:54.014Z'
                      updatedAt: '2026-05-18T09:24:54.014Z'
                      archivedAt: null
                      name: CSAT Survey
                      type: link
                      status: inProgress
                      metadata: {}
                      defaultLanguage: en-US
                      languages:
                        - code: en-US
                          default: true
                          enabled: true
                        - code: de-DE
                          alias: german
                          default: false
                          enabled: false
                      welcomeCard:
                        enabled: false
                      blocks:
                        - id: e0tfwzqk63op37y14z95qq3k
                          name: Main Block
                          elements:
                            - id: nzte4cm8836hgjw63pesziht
                              type: rating
                              range: 5
                              scale: smiley
                              headline:
                                en-US: How satisfied are you with our product?
                                de-DE: Wie zufrieden sind Sie mit unserem Produkt?
                              required: true
                      endings: []
                      hiddenFields:
                        enabled: false
                      variables: []
                filtered:
                  summary: Language-filtered projection with ?lang=de-DE
                  value:
                    data:
                      id: clseedsurveycsat000000
                      workspaceId: clseedworkspace000000000
                      createdAt: '2026-05-18T09:24:54.014Z'
                      updatedAt: '2026-05-18T09:24:54.014Z'
                      archivedAt: null
                      name: CSAT Survey
                      type: link
                      status: inProgress
                      metadata: {}
                      defaultLanguage: en-US
                      languages:
                        - code: en-US
                          default: true
                          enabled: true
                        - code: de-DE
                          alias: german
                          default: false
                          enabled: false
                      welcomeCard:
                        enabled: false
                      blocks:
                        - id: e0tfwzqk63op37y14z95qq3k
                          name: Main Block
                          elements:
                            - id: nzte4cm8836hgjw63pesziht
                              type: rating
                              range: 5
                              scale: smiley
                              headline:
                                de-DE: Wie zufrieden sind Sie mit unserem Produkt?
                              required: true
                      endings: []
                      hiddenFields:
                        enabled: false
                      variables: []
        '400':
          description: Invalid survey id, unsupported query parameter, unknown language, or unsupported legacy survey shape
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/V3Unauthorized'
        '403':
          $ref: '#/components/responses/V3Forbidden'
        '429':
          $ref: '#/components/responses/V3TooManyRequests'
        '500':
          $ref: '#/components/responses/V3InternalServerError'
      security:
        - sessionAuth: []
        - apiKeyAuth: []
    patch:
      operationId: patchSurveyV3
      summary: Update a survey
      description: |
        Updates a survey through a strict top-level partial document. Omitted top-level fields are
        preserved. Provided top-level objects and arrays replace that whole subtree; this endpoint
        does not deep-merge nested objects and does not implement JSON Patch.

        This write endpoint accepts the canonical multilingual authoring document only. Translatable
        fields must be locale-code maps, not strings. `PATCH ?lang=...` and `?version=...` are not
        supported in Scope 1.

        For MCP and AI-agent workflows, fetch the current survey first, modify only the intended
        top-level fields, call `/api/v3/surveys/validate` with `operation: patch` for preflight, then
        submit the same patch here. Missing ids in replaced arrays are treated as deletions. Variable
        name renames are allowed but may be destructive for downstream exports or integrations.
        Element id changes are rejected once the survey and element are no longer drafts.

        Optimistic concurrency (`ETag`, `If-Match`, or revision tokens) is future work; until then,
        overlapping writes are last-write-wins.
      tags:
        - V3 Surveys
      parameters:
        - in: path
          name: surveyId
          required: true
          schema:
            type: string
            format: cuid2
          description: Survey identifier.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchSurveyRequest'
            examples:
              renameSurvey:
                summary: Rename a survey
                value:
                  name: Updated Product Feedback
              replaceMetadata:
                summary: Replace metadata
                value:
                  metadata:
                    title:
                      en-US: Product Feedback
                      de-DE: Produktfeedback
                    cx_operation: product_feedback
              replaceBlocks:
                summary: Replace survey blocks
                value:
                  blocks:
                    - id: clbk1234567890123456789012
                      name: Main Block
                      elements:
                        - id: satisfaction
                          type: rating
                          headline:
                            en-US: How satisfied are you?
                            de-DE: Wie zufrieden sind Sie?
                          required: true
                          range: 5
                          scale: smiley
      responses:
        '200':
          description: Survey updated successfully
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Request correlation ID
            Cache-Control:
              schema:
                type: string
              example: private, no-store
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/SurveyResource'
        '400':
          description: |
            Bad Request — the patch failed schema validation, i.e. any rule checkable from the request body alone, without consulting stored state. Covers: malformed JSON; an unsupported query parameter; unknown, unsupported, or immutable fields (`type` cannot be changed after creation, and `distribution`/`targeting` are `app`-only — sending them when patching a `link` survey is rejected); wrong types or out-of-range values; bad enum values; malformed multilingual maps; and intra-document field-combination rules — notably `displayLimit` is required (must be >= 1) when `displayOption` is `displaySome`. Cross-reference failures that need stored state to detect return **422** instead. Every offending field is itemized in `invalid_params`. Unknown, forbidden, immutable, or wrongly-combined fields carry `code: unsupported_field` (e.g. `type`, or `distribution`/`targeting` on a link survey); omissions carry `code: missing_required_field`. Bare type, range, enum, and malformed-locale-map violations report the field `name` with a human-readable `reason` and no machine `code`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/V3Unauthorized'
        '403':
          description: Forbidden — no write access, missing external URL permission, missing Contacts entitlement for app-survey targeting, or survey does not exist (404 not used; avoids existence leak)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: |-
            Unprocessable Content — the request cannot be processed against stored state. Two cases:
            1. The target survey is archived (soft-deleted) and therefore read-only; restore it before editing. The `invalid_params` entry reports `name: archivedAt` with the reason `This survey is archived. Restore it before editing.`
            2. The patched document passed schema validation but failed a cross-reference check that requires stored state to detect: an undeclared locale key used in content, a duplicate stable id, an immutable element-id change on a published survey, a dangling logic/jump reference, an invalid media URL, a `distribution.triggers[].actionClassId` referencing an action class that does not exist in the workspace (discover valid ids via `GET /api/v3/action-classes`), or a `targeting.filters` entry that cannot resolve in the workspace — an unknown contact-attribute key or segment, an unsupported person identifier, or an unknown device value. The `invalid_params` array pinpoints each issue (e.g. `code: invalid_reference` with the offending `identifier`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                archived:
                  summary: Survey is archived (restore before editing)
                  value:
                    type: about:blank
                    title: Unprocessable Content
                    status: 422
                    detail: Survey is archived
                    code: unprocessable_content
                    requestId: req_clsv1234567890123456789012
                    invalid_params:
                      - name: archivedAt
                        reason: This survey is archived. Restore it before editing.
                invalidReference:
                  summary: Cross-reference validation failed
                  value:
                    type: about:blank
                    title: Unprocessable Content
                    status: 422
                    detail: Survey document failed validation
                    code: unprocessable_content
                    requestId: req_clsv1234567890123456789012
                    invalid_params:
                      - name: blocks[0].logic[0].target
                        reason: References a block that does not exist in the survey.
                        code: invalid_reference
                        identifier: e0tfwzqk63op37y14z95qq3k
        '429':
          $ref: '#/components/responses/V3TooManyRequests'
        '500':
          $ref: '#/components/responses/V3InternalServerError'
      security:
        - sessionAuth: []
        - apiKeyAuth: []
    delete:
      operationId: deleteSurveyV3
      summary: Delete a survey
      description: Deletes a survey by id. Session cookie or x-api-key.
      tags:
        - V3 Surveys
      parameters:
        - in: path
          name: surveyId
          required: true
          schema:
            type: string
            format: cuid2
          description: Survey identifier.
      responses:
        '204':
          description: Survey deleted successfully
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Request correlation ID
            Cache-Control:
              schema:
                type: string
              example: private, no-store
        '400':
          $ref: '#/components/responses/V3BadRequest'
        '401':
          $ref: '#/components/responses/V3Unauthorized'
        '403':
          $ref: '#/components/responses/V3Forbidden'
        '429':
          $ref: '#/components/responses/V3TooManyRequests'
        '500':
          $ref: '#/components/responses/V3InternalServerError'
      security:
        - sessionAuth: []
        - apiKeyAuth: []
  /api/v3/surveys/{surveyId}/archive:
    post:
      operationId: archiveSurveyV3
      summary: Archive a survey
      description: |
        Archives (soft-deletes) a survey by id. Archived surveys are hidden from the default list, stop collecting responses, and become read-only until restored — a subsequent `PATCH` returns **422**. Works on any survey, including legacy question-based surveys, so this endpoint returns a minimal lifecycle acknowledgement rather than the full survey resource. Session cookie or x-api-key.
      tags:
        - V3 Surveys
      parameters:
        - in: path
          name: surveyId
          required: true
          schema:
            type: string
            format: cuid2
          description: Survey identifier.
      responses:
        '200':
          description: Survey archived successfully
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Request correlation ID
            Cache-Control:
              schema:
                type: string
              example: private, no-store
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - id
                      - status
                      - archivedAt
                    properties:
                      id:
                        type: string
                        description: Survey identifier.
                      status:
                        type: string
                        enum:
                          - draft
                          - inProgress
                          - paused
                          - completed
                        description: Current survey status.
                      archivedAt:
                        type:
                          - string
                          - 'null'
                        format: date-time
                        description: Soft-delete/archive marker (ISO 8601). A timestamp after archiving; `null` when the survey is active.
              examples:
                archived:
                  summary: Survey archived
                  value:
                    data:
                      id: clsv1234567890123456789012
                      status: paused
                      archivedAt: '2026-05-18T09:24:54.014Z'
        '400':
          $ref: '#/components/responses/V3BadRequest'
        '401':
          $ref: '#/components/responses/V3Unauthorized'
        '403':
          $ref: '#/components/responses/V3Forbidden'
        '429':
          $ref: '#/components/responses/V3TooManyRequests'
        '500':
          $ref: '#/components/responses/V3InternalServerError'
      security:
        - sessionAuth: []
        - apiKeyAuth: []
  /api/v3/surveys/{surveyId}/restore:
    post:
      operationId: restoreSurveyV3
      summary: Restore a survey
      description: |
        Restores a previously archived (soft-deleted) survey by id, clearing its archive marker so it reappears in the default list and becomes editable again. Works on any survey, including legacy question-based surveys, so this endpoint returns a minimal lifecycle acknowledgement rather than the full survey resource. Session cookie or x-api-key.
      tags:
        - V3 Surveys
      parameters:
        - in: path
          name: surveyId
          required: true
          schema:
            type: string
            format: cuid2
          description: Survey identifier.
      responses:
        '200':
          description: Survey restored successfully
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Request correlation ID
            Cache-Control:
              schema:
                type: string
              example: private, no-store
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - id
                      - status
                      - archivedAt
                    properties:
                      id:
                        type: string
                        description: Survey identifier.
                      status:
                        type: string
                        enum:
                          - draft
                          - inProgress
                          - paused
                          - completed
                        description: Current survey status.
                      archivedAt:
                        type:
                          - string
                          - 'null'
                        format: date-time
                        description: Soft-delete/archive marker (ISO 8601). `null` after restoring; a timestamp while the survey is archived.
              examples:
                restored:
                  summary: Survey restored
                  value:
                    data:
                      id: clsv1234567890123456789012
                      status: paused
                      archivedAt: null
        '400':
          $ref: '#/components/responses/V3BadRequest'
        '401':
          $ref: '#/components/responses/V3Unauthorized'
        '403':
          $ref: '#/components/responses/V3Forbidden'
        '429':
          $ref: '#/components/responses/V3TooManyRequests'
        '500':
          $ref: '#/components/responses/V3InternalServerError'
      security:
        - sessionAuth: []
        - apiKeyAuth: []
  /api/v3/responses:
    get:
      operationId: getResponsesV3
      summary: List responses
      description: |
        Returns responses for a workspace, newest first. Session cookie or x-api-key with read access.

        **Scoping.** `workspaceId` is required, as on every v3 collection read. Add `surveyId` to narrow to one survey — the common case, and the one the storage layer is indexed for (`(surveyId, createdAt)`). A workspace-wide list has to reach responses through their surveys and is correspondingly slower, so pass `surveyId` whenever you know it. `contactId` narrows to one respondent.

        **Pagination is keyset**, on `(createdAt, id)`. The `cursor` is opaque and bound to the sort order and the filter set it was issued for; changing either invalidates it. `meta.nextCursor` being `null` is the only end-of-collection signal — do not infer the end from a short page.

        `id` is there purely as a tie-breaker, and it makes the order **total**, so no row is ever skipped or repeated across pages. What it is not is a finer-grained clock: `createdAt` is stored to millisecond precision, so responses sharing a millisecond — everything written in one bulk insert, for instance — come back in an order that is stable and repeatable but is not their true creation order. Do not read the sequence within a millisecond as meaningful.

        **Filters are allow-listed**, and each one on its own is either served by an index or bounded by one. `filter[finished][eq]` and `filter[language][in]` additionally require `surveyId` or `contactId`, because both are heap residuals that are only bounded when the scan is anchored to one survey or one contact; sending either without such a scope returns **400**.

        Be aware that **combining** a `filter[createdAt]` bound with `filter[finished][eq]` is the one case no single index covers: the ordered scan uses `(surveyId, createdAt)` and `finished` stays a heap residual, so a page whose matches are sparse reads far more rows than it returns. Prefer narrowing by `surveyId` and a tight `createdAt` window, and treat that combination as the slow path until a covering index exists.

        **What this endpoint deliberately does not filter on:** individual answers, hidden-field values, submission metadata (`source`, `url`, `country`, `browser`, `os`, `device`), contact attributes, quotas, and tags. Each is a JSON path or an unindexed join on the largest table in the database, where the honest outcome is a timeout rather than a slow query. The in-app dashboard does offer these, so this endpoint is knowingly behind it; closing the gap needs index work and is tracked separately rather than quietly omitted.
      tags:
        - V3 Responses
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/CursorQuery'
        - in: query
          name: surveyId
          schema:
            type: string
            format: cuid2
          description: 'Optional survey scoping. Single-valued deliberately: an `[in]` form would defeat the ordered index scan that makes this the fast path.'
        - in: query
          name: contactId
          schema:
            type: string
            format: cuid2
          description: Optional contact scoping. Returns only responses submitted by this contact.
        - in: query
          name: includeTotalCount
          schema:
            type: boolean
            default: false
          description: |
            Whether to compute `meta.totalCount`. Defaults to **`false`** here, unlike the survey list, because responses are the highest-cardinality table in the product and the extra count is not free at that size. When `false`, both `meta.totalCount` and `meta.totalCountRelation` are `null`.

            When `true`, the count is capped at 10 000 and `meta.totalCountRelation` says whether the figure is exact (`eq`) or a lower bound (`gte`). If all you need is the count, use `GET /api/v3/responses/count` rather than fetching a page to get it — and if you need an exact figure beyond the cap, that endpoint takes an explicit `precision=exact`.
        - $ref: '#/components/parameters/CreatedAtGteQuery'
        - $ref: '#/components/parameters/CreatedAtGtQuery'
        - $ref: '#/components/parameters/CreatedAtLteQuery'
        - $ref: '#/components/parameters/CreatedAtLtQuery'
        - in: query
          name: filter[finished][eq]
          schema:
            type: boolean
          description: Completed (`true`) or partial (`false`) responses only. Omit for both. Requires `surveyId` or `contactId`.
        - in: query
          name: filter[language][in]
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: |
            Survey language codes to include. Repeat the parameter or use comma-separated values. Values are survey language codes rather than BCP-47 locales — `default` is legitimate. Requires `surveyId` or `contactId`.
        - in: query
          name: filter[id][in]
          schema:
            type: array
            maxItems: 100
            items:
              type: string
              format: cuid2
          style: form
          explode: true
          description: Fetch a specific set of responses by id, at most 100 per call. Ids outside the requested scope are simply absent from the result rather than erroring, so this cannot be used to probe whether an id exists elsewhere.
        - in: query
          name: sortBy
          schema:
            type: string
            enum:
              - '-createdAt'
              - createdAt
            default: '-createdAt'
          description: |
            Sort order. `-createdAt` (newest first) is the default; `createdAt` sorts oldest first, which is what a consumer doing an incremental backfill wants. The leading `-` marks descending.

            `updatedAt` is not offered: it has no index, no product usage, and being mutable it cannot anchor a keyset cursor.
      responses:
        '200':
          description: Responses retrieved successfully
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Request correlation ID
            Cache-Control:
              schema:
                type: string
              example: private, no-store
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ResponseListItem'
                  meta:
                    type: object
                    required:
                      - limit
                      - nextCursor
                      - totalCount
                      - totalCountRelation
                    properties:
                      limit:
                        type: integer
                        minimum: 1
                        description: The page size actually applied. Carries no `maximum` — it echoes what the server used rather than bounding what may be asked for.
                      nextCursor:
                        type:
                          - string
                          - 'null'
                        description: 'Opaque cursor for the next page. `null` when there are no more results — the only reliable end-of-collection signal. Pass it back verbatim: the encoding is deliberately unspecified and may change without notice, so a client that decodes or constructs one is relying on something this contract does not promise.'
                      totalCount:
                        type:
                          - integer
                          - 'null'
                        minimum: 0
                        description: |
                          Responses matching the current scope and filters across all pages, **counted only up to 10 000**. Exact below that; at the cap the value is exactly `10000` and means "at least 10 000", which `totalCountRelation` states explicitly. `null` unless `includeTotalCount=true`.

                          The cap is not timidity — an exact count over this table grows superlinearly with the data while a capped one stays flat, so an uncapped total is the one part of a page whose cost is unbounded. Read `totalCountRelation` rather than testing for the magic number.
                      totalCountRelation:
                        type:
                          - string
                          - 'null'
                        enum:
                          - eq
                          - gte
                          - null
                        description: |
                          How to read `totalCount`: `eq` when it is exact, `gte` when the 10 000 cap was reached and it is a lower bound, `null` when `includeTotalCount=false`. This is the same eq/gte convention Elasticsearch uses for `hits.total.relation`, so a consumer can render "10,000+" honestly instead of claiming a precise figure it does not have.
                    additionalProperties: false
              examples:
                page:
                  summary: One page of responses, exercising several answer types
                  value:
                    data:
                      - id: clrs1234567890123456789012
                        surveyId: clsv1234567890123456789012
                        surveyName: Q3 Product Feedback
                        workspaceId: clws1234567890123456789012
                        createdAt: '2026-08-27T09:14:03.417Z'
                        updatedAt: '2026-08-27T09:17:41.902Z'
                        finished: true
                        endingId: cmpthankyou00000000000000
                        language: de
                        durationSeconds: 218.4
                        resolution:
                          labelPolicy: currentSurveyDefinition
                          labelsLanguage: de
                          surveyUpdatedAt: '2026-08-20T11:02:55.000Z'
                        answers:
                          - position: 1
                            elementId: nps_score
                            elementType: nps
                            elementLabel: Wie wahrscheinlich ist es, dass Sie uns weiterempfehlen?
                            valueNumber: 9
                            range:
                              min: 0
                              max: 10
                            durationSeconds: 12.1
                          - position: 2
                            elementId: what_could_be_better
                            elementType: openText
                            elementLabel: Was koennten wir besser machen?
                            valueText: Die Suche ist zu langsam.
                            inputType: text
                            durationSeconds: 64.8
                          - position: 3
                            elementId: channels
                            elementType: multipleChoiceMulti
                            elementLabel: Wie haben Sie von uns erfahren?
                            selections:
                              - optionId: ch_2f8a
                                optionLabel: Ein Freund
                                rawValue: Ein Freund
                                match: label
                              - optionId: other
                                optionLabel: Andere
                                rawValue: Podcast
                                match: other
                              - optionId: null
                                optionLabel: null
                                rawValue: Twitter
                                match: unmatched
                            durationSeconds: 31
                          - position: 4
                            elementId: consent_terms
                            elementType: consent
                            elementLabel: Ich stimme den Bedingungen zu
                            valueBoolean: true
                            rawValue: accepted
                        embeddedData:
                          - key: plan
                            kind: ingested
                            type: string
                            label: Plan
                            value: enterprise
                          - key: score
                            kind: computed
                            type: number
                            label: Score
                            value: 12
                          - key: country
                            kind: reserved
                            type: string
                            label: Country
                            value: DE
                        unresolved:
                          - key: old_question_id
                            rawValue: some answer
                            reason: elementNotInSurvey
                        tags:
                          - id: cltg1234567890123456789012
                            name: vip
                    meta:
                      limit: 20
                      totalCountRelation: null
                      nextCursor: eyJ2ZXJzaW9uIjoxLCJraW5kIjoicmVzcG9uc2VzIiwic29ydEJ5IjoiLWNyZWF0ZWRBdCIsImZwIjoiZTNpT0pQNkN4V0p0TEZTOSIsInZhbHVlIjoiMjAyNi0wOC0yN1QwOToxNDowMy40MTdaIiwiaWQiOiJjbHJzMTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMiJ9
                      totalCount: null
        '400':
          description: |
            Bad Request — invalid or unrecognized query parameters. Covers an unknown `filter[...]` key, a filter value of the wrong type, `filter[id][in]` over 100 ids, a `cursor` that does not match the requested sort order or filter set, and `filter[finished][eq]` or `filter[language][in]` sent without `surveyId` or `contactId`.

            Date bounds are also validated as a pair: at most **one lower bound** (`gte` xor `gt`) and at most **one upper bound** (`lte` xor `lt`), and the lower bound must not fall after the upper one. Sending both forms of the same bound is rejected rather than resolved by a precedence rule nobody can guess.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/V3Unauthorized'
        '403':
          $ref: '#/components/responses/V3Forbidden'
        '429':
          $ref: '#/components/responses/V3TooManyRequests'
        '500':
          $ref: '#/components/responses/V3InternalServerError'
      security:
        - sessionAuth: []
        - apiKeyAuth: []
    post:
      operationId: createResponseV3
      summary: Create a response
      description: |
        Records a survey response. Requires read-write access to the workspace, which is resolved from `surveyId` rather than supplied by the caller.

        **This performs a real submission.** It runs the full response pipeline — webhooks, integrations, follow-ups, quota evaluation, and Hub ingestion once the response is finished — and it consumes one metered monthly response. That is the same power a v1/v2 management create has today, and the same power an API key with write access already carries; it is called out because an agent holding that key can create genuine submissions. Use `POST /api/v3/responses/validate` to check a payload without any of that happening.

        `createdAt` cannot be supplied. Bulk historical loading is therefore not what this endpoint is for — see `ResponseListItem.createdAt` for why, and use v2 while a dedicated import path is outstanding.
      tags:
        - V3 Responses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateResponseRequest'
            examples:
              finishedResponse:
                summary: A complete response with answers, hidden fields and a variable
                value:
                  surveyId: clsv1234567890123456789012
                  finished: true
                  endingId: cmpthankyou00000000000000
                  language: de
                  data:
                    nps_score: 9
                    what_could_be_better: Die Suche ist zu langsam.
                    channels:
                      - ch_2f8a
                      - Podcast
                    plan: enterprise
                  variables:
                    score: 12
              partialResponse:
                summary: A partial response, still open
                value:
                  surveyId: clsv1234567890123456789012
                  finished: false
                  data:
                    nps_score: 7
              integrationResponse:
                summary: A response created by an integration, with timing, tags and source
                description: |
                  `ttc` carries per-element timing in milliseconds and reads back as `durationSeconds` in seconds. `meta.source` is worth setting on any API-created response — nothing else can distinguish it from an organic submission. `tags` are applied in the same transaction, so no follow-up patch is needed.
                value:
                  surveyId: clsv1234567890123456789012
                  finished: true
                  language: de
                  data:
                    nps_score: 9
                    what_could_be_better: Die Suche ist zu langsam.
                  ttc:
                    nps_score: 12100
                    what_could_be_better: 64800
                  meta:
                    source: zendesk-integration
                    url: https://support.example.com/tickets/4821
                  tags:
                    - cltg1234567890123456789012
              identifiedResponse:
                summary: A response attributed to a known contact
                description: |
                  `contactId` is create-only — a response cannot later be re-attributed to a different person. The contact must already exist in the same workspace.
                value:
                  surveyId: clsv1234567890123456789012
                  finished: true
                  contactId: clct1234567890123456789012
                  data:
                    nps_score: 10
      responses:
        '201':
          description: Response created successfully
          headers:
            Location:
              schema:
                type: string
              description: Relative URL of the created response.
              example: /api/v3/responses/clrs1234567890123456789012
            X-Request-Id:
              schema:
                type: string
              description: Request correlation ID
            Cache-Control:
              schema:
                type: string
              example: private, no-store
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/ResponseResource'
        '400':
          description: |
            Bad Request — the body failed schema validation: invalid JSON, a missing required field, a value of the wrong type, or an unsupported field. Sending a server-owned or create-forbidden field (`createdAt`, `updatedAt`, `contactAttributes`, `userId`, or a `meta` member outside the accepted `source` / `url` / `action` — notably `meta.ipAddress` and the derived `userAgent` / `country` / `device` family) is rejected here with `code: unsupported_field` rather than being silently dropped. Failures that need stored state to detect return **422** instead.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/V3Unauthorized'
        '403':
          $ref: '#/components/responses/V3Forbidden'
        '422':
          description: |
            Unprocessable Content — the body is well-formed but conflicts with stored state: `surveyId` does not resolve, `endingId` is not an ending of that survey, `language` is not enabled on it, `contactId` is not a contact in the same workspace, `displayId` already backs another response, `singleUseId` is already used for this survey, or an answer violates the survey's own validation rules. Each is itemized in `invalid_params`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/V3TooManyRequests'
        '500':
          $ref: '#/components/responses/V3InternalServerError'
      security:
        - sessionAuth: []
        - apiKeyAuth: []
  /api/v3/responses/count:
    get:
      operationId: countResponsesV3
      summary: Count responses
      description: |
        Returns how many responses match a scope and filter set, without fetching any of them.

        This exists as its own operation because "how many match this?" is the question asked most often and it should not require paging through data to answer — particularly for agent clients, where a page of payloads to obtain a single integer is pure waste. It takes the same scope and filter parameters as `GET /api/v3/responses`, minus pagination and sorting, so a count and a page are always answering the same question.

        The list endpoint's `meta.totalCount` covers the other case: a caller already paging that also wants the total. That one is opt-in; this one is the direct route.
      tags:
        - V3 Responses
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdQuery'
        - in: query
          name: surveyId
          schema:
            type: string
            format: cuid2
          description: Optional survey scoping.
        - in: query
          name: contactId
          schema:
            type: string
            format: cuid2
          description: Optional contact scoping.
        - $ref: '#/components/parameters/CreatedAtGteQuery'
        - $ref: '#/components/parameters/CreatedAtGtQuery'
        - $ref: '#/components/parameters/CreatedAtLteQuery'
        - $ref: '#/components/parameters/CreatedAtLtQuery'
        - in: query
          name: filter[finished][eq]
          schema:
            type: boolean
          description: Completed (`true`) or partial (`false`) responses only. Requires `surveyId` or `contactId`, for the same reason as on the list endpoint.
        - in: query
          name: filter[language][in]
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: Survey language codes to include. Requires `surveyId` or `contactId`.
        - in: query
          name: filter[id][in]
          schema:
            type: array
            maxItems: 100
            items:
              type: string
              format: cuid2
          style: form
          explode: true
          description: Count a specific set of responses by id, at most 100 per call. Ids outside the requested scope are simply not counted rather than erroring, so this cannot be used to probe whether an id exists elsewhere.
        - in: query
          name: precision
          schema:
            type: string
            enum:
              - capped
              - exact
            default: capped
          description: |
            How hard to count. `capped` (the default) stops at 10 000 and reports `relation: gte` at the cap — flat cost, safe to call on anything. `exact` counts every matching row and reports `relation: eq` always.

            `exact` is the deliberate slow path: cost grows superlinearly with the matching set, so on a large or loosely-filtered scope it is markedly more expensive than a page of data. Ask for it when a person needs a precise figure, not on a dashboard poll. It exists so that the capped default is a sensible default rather than a limitation, and so the cap cannot be sidestepped by accident.
      responses:
        '200':
          description: Count retrieved successfully
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Request correlation ID
            Cache-Control:
              schema:
                type: string
              example: private, no-store
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - count
                      - relation
                    properties:
                      count:
                        type: integer
                        minimum: 0
                        description: Responses matching the scope and filters. With `precision=capped` this stops at 10 000; read `relation` before presenting it as a total.
                      relation:
                        type: string
                        enum:
                          - eq
                          - gte
                        description: '`eq` when `count` is exact, `gte` when the 10 000 cap was reached and `count` is a lower bound. Always `eq` when `precision=exact`. Same convention as `meta.totalCountRelation` on the list endpoint.'
                    additionalProperties: false
        '400':
          description: |
            Bad Request — invalid or unrecognized query parameters, including `filter[finished][eq]` or `filter[language][in]` without `surveyId` or `contactId`.

            Date bounds follow the same pairing rule as the list endpoint: at most one lower bound (`gte` xor `gt`), at most one upper bound (`lte` xor `lt`), and the lower bound must not fall after the upper one.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/V3Unauthorized'
        '403':
          $ref: '#/components/responses/V3Forbidden'
        '429':
          $ref: '#/components/responses/V3TooManyRequests'
        '500':
          $ref: '#/components/responses/V3InternalServerError'
      security:
        - sessionAuth: []
        - apiKeyAuth: []
  /api/v3/responses/validate:
    post:
      operationId: validateResponseV3
      summary: Validate a response payload
      description: |
        Checks a create or patch payload and reports what a real write would do — **without writing anything**. Never has side effects: no response is created, no pipeline fires, nothing is metered.

        Deliberately the same shape as `POST /api/v3/surveys/validate`: same dual auth, a request discriminated on `operation` carrying the body the real call would take, and a result of `valid`, `operation` and `invalid_params` with document-relative paths. The value is that the two endpoints behave alike, so a client can validate uniformly. Answers are checked against the survey's own validation rules, so a payload this endpoint accepts is one the real write accepts.

        **It reports effects, not just a verdict.** When `valid` is `true`, `effects` names the language that would be stamped, the contact and display that would be linked, the quotas that would count, whether the pipeline would fire, and whether the write would be metered. The language is the field that motivated this endpoint: an importer can see that a payload produces language-less responses *before* writing thousands of them.

        Authorization is the same as the operation being validated — read-write for `create` and `patch` — so this cannot be used as a cheaper cross-tenant existence probe than the write itself. An inaccessible `responseId` on a patch validation answers **403**, as the patch would.

        **What it does not do:** an endpoint lets a caller check; it cannot stop a caller writing a bad record anyway. Consistency across the write paths comes from all of them calling the same validator — this endpoint is that validator's public face, not a gate in front of it.
      tags:
        - V3 Responses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateResponseRequest'
            examples:
              validateCreate:
                summary: Validate an intended create
                value:
                  operation: create
                  data:
                    surveyId: clsv1234567890123456789012
                    finished: true
                    language: de
                    data:
                      nps_score: 9
                      what_could_be_better: Die Suche ist zu langsam.
              validatePatch:
                summary: Validate an intended patch
                value:
                  operation: patch
                  responseId: clrs1234567890123456789012
                  data:
                    finished: true
                    endingId: cmpthankyou00000000000000
      responses:
        '200':
          description: Validation completed. A `200` means the check ran, **not** that the payload is valid — read `valid`.
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Request correlation ID
            Cache-Control:
              schema:
                type: string
              example: private, no-store
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/ResponseValidationResult'
              examples:
                valid:
                  summary: Payload is valid, with the effects a write would have
                  value:
                    data:
                      valid: true
                      operation: create
                      invalid_params: []
                      effects:
                        language: de
                        contactId: null
                        displayId: null
                        firesPipeline: true
                        countsTowardMeteredResponses: true
                        quotas: []
                invalid:
                  summary: Payload is invalid, with repairable errors
                  value:
                    data:
                      valid: false
                      operation: create
                      invalid_params:
                        - name: data.nps_score
                          reason: Value 12 is outside the element's 0–10 range.
                        - name: language
                          reason: Language "fr" is not enabled on this survey.
                          code: unsupported_locale
                          identifier: fr
                          referenceType: language
        '400':
          description: 'Bad Request — the envelope itself is malformed: missing or unknown `operation`, missing `data`, or a `patch` without `responseId`. Problems *inside* `data` are the point of this endpoint and come back as `200` with `valid: false`, not as a 400.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/V3Unauthorized'
        '403':
          $ref: '#/components/responses/V3Forbidden'
        '429':
          $ref: '#/components/responses/V3TooManyRequests'
        '500':
          $ref: '#/components/responses/V3InternalServerError'
      security:
        - sessionAuth: []
        - apiKeyAuth: []
  /api/v3/responses/batch-delete:
    post:
      operationId: batchDeleteResponsesV3
      summary: Delete responses in bulk
      description: |
        Deletes up to 100 responses in one transaction. Requires `manage` access to the workspace.

        **A POST custom method, not a `DELETE` on the collection.** A collection-level `DELETE` that loses its filters — through a client bug, a proxy stripping a query string, a copied curl command — degrades into erasing every response in scope. A distinct path cannot be reached by accident. AIP-165 blesses `batchDelete` for exactly this reason.

        **It scope-filters rather than rejecting.** Ids belonging to another workspace, and ids that no longer exist, are ignored; the ids in the caller's own workspace are deleted and `deleted` reports how many that was. Rejecting the whole call on a foreign id would do two bad things at once: leak that the id exists somewhere, and break retries — after a partially-applied call, an already-deleted id is indistinguishable from a foreign one. Scope-filtering is idempotent and leaks nothing, so a client can safely retry the same batch.

        Because `deleted` can therefore be lower than the number of ids sent — or zero — do not treat a shortfall as an error. Deletion cascades to uploaded files and to the Hub, exactly as the single-response delete does.

        **`workspaceId` is the scope, and it is required.** Unlike the single-response delete — which resolves the workspace *from* the response so a caller cannot pair someone else's id with a scope it happens to hold — a batch has no single response to resolve from, and scope-filtering is only meaningful against a known workspace. Supplying it is safe here because the same value is both what `manage` is checked against and what the delete is filtered by: the two cannot diverge, so a foreign id matches nothing rather than being deleted under a scope the caller does hold.
      tags:
        - V3 Responses
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdQuery'
