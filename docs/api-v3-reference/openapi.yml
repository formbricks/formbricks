    patch:
      operationId: updateResponseV3
      summary: Update a response
      description: |
        Partially updates a response. Requires read-write access; the workspace is resolved from the response. An unknown or inaccessible `responseId` answers **403**.

        `PATCH` is the only update verb — there is no `PUT`. Within it, `data` and `variables` are replaced wholesale rather than deep-merged, so send the complete map. Unknown top-level keys are rejected with **400** rather than ignored.

        Setting `finished` to `true` fires the finish side of the response pipeline, including Hub ingestion. Updates otherwise emit `responseUpdated`.
      tags:
        - V3 Responses
      parameters:
        - $ref: '#/components/parameters/ResponseIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchResponseRequest'
            examples:
              finishResponse:
                summary: Mark a partial response finished
                value:
                  finished: true
                  endingId: cmpthankyou00000000000000
              replaceAnswers:
                summary: Replace the stored answers wholesale
                description: |
                  `data` is not merged. Anything omitted from this map is removed from the response.
                value:
                  data:
                    nps_score: 8
                    what_could_be_better: Etwas schneller wäre gut.
              retagResponse:
                summary: Replace the response's tags
                value:
                  tags:
                    - cltg1234567890123456789012
      responses:
        '200':
          description: Response updated successfully
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Request correlation ID
            Cache-Control:
              schema:
                type: string
              example: private, no-store
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/ResponseResource'
        '400':
          description: |
            Bad Request — the body failed schema validation, or it carried a field that is not patchable. `createdAt`, `updatedAt`, `surveyId`, `contactId`, `displayId`, `singleUseId`, `contactAttributes` and `meta` are all rejected here with `code: unsupported_field`. An empty body is also a 400.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/V3Unauthorized'
        '403':
          $ref: '#/components/responses/V3Forbidden'
        '422':
          description: 'Unprocessable Content — the body is well-formed but conflicts with stored state: `endingId` is not an ending of the response''s survey, `language` is not enabled on it, a tag id does not resolve in the same workspace, or an answer violates the survey''s validation rules.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/V3TooManyRequests'
        '500':
          $ref: '#/components/responses/V3InternalServerError'
      security:
        - sessionAuth: []
        - apiKeyAuth: []
    delete:
      operationId: deleteResponseV3
      summary: Delete a response
      description: |
        Permanently deletes a response. Requires `manage` access; the workspace is resolved from the response, and an unknown or inaccessible `responseId` answers **403**.

        Deletion cascades: any files uploaded with the response are removed from storage, and the corresponding record is deleted from the Hub. No `responseDeleted` webhook is emitted — no such trigger exists.
