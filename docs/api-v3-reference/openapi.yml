        '429':
          $ref: '#/components/responses/V3TooManyRequests'
        '500':
          $ref: '#/components/responses/V3InternalServerError'
      security:
        - sessionAuth: []
        - apiKeyAuth: []
    patch:
      operationId: updateResponseV3
      summary: Update a response
      description: |
        Partially updates a response. Requires read-write access; the workspace is resolved from the response. An unknown or inaccessible `responseId` answers **403**.

        `PATCH` is the only update verb — there is no `PUT`. Within it, `data` is replaced wholesale rather than deep-merged, so send the complete answer map; `embeddedData` merges by field name. Unknown top-level keys are rejected with **400** rather than ignored.

        Setting `finished` to `true` fires the finish side of the response pipeline, including Hub ingestion. Updates otherwise emit `responseUpdated`.
      tags:
        - V3 Responses
      parameters:
        - $ref: '#/components/parameters/ResponseIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchResponseRequest'
            examples:
              finishResponse:
                summary: Mark a partial response finished
                value:
                  finished: true
                  endingId: cmpthankyou00000000000000
              replaceAnswers:
                summary: Replace the stored answers wholesale
                description: |
                  `data` is not merged. Anything omitted from this map is removed from the response.
                value:
                  data:
                    nps_score: 8
                    what_could_be_better: Etwas schneller wäre gut.
              retagResponse:
                summary: Replace the response's tags
                value:
                  tags:
                    - cltg1234567890123456789012
      responses:
        '200':
          description: Response updated successfully
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Request correlation ID
            Cache-Control:
              schema:
                type: string
              example: private, no-store
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/ResponseResource'
        '400':
          description: |
            Bad Request — the body failed schema validation, or it carried a field that is not patchable. `createdAt`, `updatedAt`, `surveyId`, `contactId`, `displayId`, `singleUseId`, `contactAttributes` and `meta` are all rejected here with `code: unsupported_field`. An empty body is also a 400.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/V3Unauthorized'
        '403':
          $ref: '#/components/responses/V3Forbidden'
        '422':
          description: 'Unprocessable Content — the body is well-formed but conflicts with stored state: `endingId` is not an ending of the response''s survey, `language` is not enabled on it, a tag id does not resolve in the same workspace, or an answer violates the survey''s validation rules.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/V3TooManyRequests'
        '500':
          $ref: '#/components/responses/V3InternalServerError'
      security:
        - sessionAuth: []
        - apiKeyAuth: []
    delete:
      operationId: deleteResponseV3
      summary: Delete a response
      description: |
        Permanently deletes a response. Requires `manage` access; the workspace is resolved from the response, and an unknown or inaccessible `responseId` answers **403**.

        Deletion cascades to any files uploaded with the response, which are removed from storage after the row is committed. No `responseDeleted` webhook is emitted — no such trigger exists.

        **The Hub copy is not removed.** A submission forwarded to the Hub stays there and stays searchable through the feedback-record endpoints after this returns 204. That cascade is ENG-2855 and lands after the Hub release; until then, an erasure workflow has to delete the feedback record itself. Stated because a caller cannot cheaply verify deletion semantics on a destructive endpoint.
      tags:
        - V3 Responses
      parameters:
        - $ref: '#/components/parameters/ResponseIdPath'
      responses:
        '204':
          description: Response deleted successfully. No body.
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Request correlation ID
            Cache-Control:
              schema:
                type: string
              example: private, no-store
        '400':
          $ref: '#/components/responses/V3BadRequest'
        '401':
          $ref: '#/components/responses/V3Unauthorized'
        '403':
          $ref: '#/components/responses/V3Forbidden'
        '429':
          $ref: '#/components/responses/V3TooManyRequests'
        '500':
          $ref: '#/components/responses/V3InternalServerError'
      security:
        - sessionAuth: []
        - apiKeyAuth: []
  /api/v3/workflows:
    get:
      operationId: listWorkflowsV3
      summary: List workflows
      description: |
        Returns workflow list items for a workspace, sorted by `sortBy` (default `updatedAt`,
        newest first). Workflows are workspace-scoped and exposed through the same v3
        session-or-API-key authorization model as surveys.

        List items are intentionally slim: they include the derived `triggerType` and `surveyId`
        plus a `lastRun` summary, but not the full `definition`. Use
        `GET /api/v3/workflows/{workflowId}` to read the definition.

        `archived` workflows are excluded unless explicitly requested with
        `filter[status][in]=archived`.
      tags:
        - V3 Workflows
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdQuery'
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: 'Page size (max 100). v3 has three list maxima rather than one norm: 250 on responses, surveys and the reference lists, 1000 on `feedbackRecords`, and 100 here. The workflows bound lives in the shared `packages/workflows` contracts, owned alongside the feature rather than by this spec, which is why it did not move with the others. Documented at the value actually enforced; tracked separately.'
        - $ref: '#/components/parameters/CursorQuery'
        - in: query
          name: filter[name][contains]
          schema:
            type: string
            maxLength: 512
          description: Case-insensitive substring match on workflow name (same semantics as the survey list filter).
        - in: query
          name: filter[status][in]
          schema:
            type: array
            items:
              $ref: '#/components/schemas/WorkflowStatus'
          style: form
          explode: true
          description: |
            Workflow lifecycle-state filter. Repeat the parameter (`filter[status][in]=draft&filter[status][in]=disabled`)
            or use comma-separated values (`filter[status][in]=draft,disabled`). Omitting the filter returns
            every status except `archived`. Invalid values → **400**.
        - in: query
          name: sortBy
          schema:
            type: string
            enum:
              - createdAt
              - updatedAt
              - name
          description: Sort order. Defaults to `updatedAt` (newest first). The `cursor` token is bound to the selected sort order.
      responses:
        '200':
          description: Workflows retrieved successfully
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Request correlation ID
            Cache-Control:
              schema:
                type: string
              example: private, no-store
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkflowListItem'
                  meta:
                    $ref: '#/components/schemas/CursorPaginationMeta'
        '400':
          $ref: '#/components/responses/V3BadRequest'
        '401':
          $ref: '#/components/responses/V3Unauthorized'
        '403':
          $ref: '#/components/responses/V3Forbidden'
        '429':
          $ref: '#/components/responses/V3TooManyRequests'
        '500':
          $ref: '#/components/responses/V3InternalServerError'
      security:
        - sessionAuth: []
        - apiKeyAuth: []
        - bearerAuth: []
    post:
      operationId: createWorkflowV3
      summary: Create a workflow
      description: |
        Creates a `draft` workflow. The workflow definition is the public source of truth used by
        the dashboard and external clients, following the document-first pattern established by the
        v3 Survey API. Runtime persistence, revision creation, and version snapshotting are
        implementation details behind this contract.

        Workflows are always created as drafts; use `POST /api/v3/workflows/{workflowId}/enable` to
        make them respond to trigger events. Graph reference failures (duplicate node ids, edges
        pointing at missing nodes, `entryNodeId` not referencing the trigger, unknown `surveyId` or
        `endingCardIds` in the workspace) are rejected with **400** and structured `invalid_params`.
      tags:
        - V3 Workflows
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkflowRequest'
            examples:
              responseCompletedEmail:
                summary: Create a response-completed email workflow
                value:
                  workspaceId: clworkspace000000000000000
                  name: Notify team after CSAT completion
                  description: Sends an internal email when a respondent reaches the negative CSAT ending.
                  status: draft
                  definition:
                    schemaVersion: 1
                    trigger:
                      id: trigger
                      type: trigger
                      triggerType: response.completed
                      label: CSAT survey completed
                      config:
                        surveyId: clsurvey000000000000000000
                        endingCardIds:
                          - clending000000000000000000
                    nodes:
                      - id: send-email
                        type: action
                        actionType: send_email
                        label: Notify support team
                        config:
                          to: support@example.com
                          from: noreply@example.com
                          replyTo:
                            - support@example.com
                          subject: Thanks for your feedback
                          body: We saw your feedback and will follow up soon.
                          attachResponseData: true
                          includeVariables: true
                          includeHiddenFields: false
                        ui:
                          position:
                            x: 260
                            'y': 120
                    edges:
                      - id: edge-trigger-email
                        source: trigger
                        target: send-email
                    entryNodeId: trigger
      responses:
        '201':
          description: Workflow created successfully
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Request correlation ID
            Cache-Control:
              schema:
                type: string
              example: private, no-store
            Location:
              schema:
                type: string
              example: /api/v3/workflows/clworkflow000000000000000
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/WorkflowResource'
        '400':
          $ref: '#/components/responses/V3BadRequest'
        '401':
          $ref: '#/components/responses/V3Unauthorized'
        '403':
          $ref: '#/components/responses/V3Forbidden'
        '422':
          $ref: '#/components/responses/V3UnprocessableContent'
        '429':
          $ref: '#/components/responses/V3TooManyRequests'
        '500':
          $ref: '#/components/responses/V3InternalServerError'
      security:
        - sessionAuth: []
        - apiKeyAuth: []
        - bearerAuth: []
  /api/v3/workflows/runs:
    get:
      operationId: listWorkflowRunsV3
      summary: List workflow runs
      description: |
        Returns workflow run summaries for a workspace, newest first (`createdAt` descending). Use
        `workflowId` to narrow the list to one workflow, or `responseId` to find the runs a specific
        survey response produced.

        List items are summaries without `triggerPayload`, `data`, or `logs`; fetch
        `GET /api/v3/workflows/runs/{runId}` for the full debug-oriented payload. This keeps
        response-level data out of list reads by default.
      tags:
        - V3 Workflows
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdQuery'
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Page size (max 100). The workflows endpoints have not yet moved to the v3-wide maximum of 250 — their bound lives in the shared `packages/workflows` contracts, which are owned alongside the workflows feature rather than by this spec. Documented at the value actually enforced rather than at the platform norm; tracked separately.
        - $ref: '#/components/parameters/CursorQuery'
        - in: query
          name: workflowId
          schema:
            type: string
            format: cuid2
          description: Optional workflow scoping. Returns only runs of this workflow.
        - in: query
          name: responseId
          schema:
            type: string
            format: cuid2
          description: Optional response scoping. Returns only runs triggered by this survey response.
        - in: query
          name: filter[status][in]
          schema:
            type: array
            items:
              $ref: '#/components/schemas/WorkflowRunStatus'
          style: form
          explode: true
          description: |
            Run lifecycle-state filter. Repeat the parameter or use comma-separated values
            (`filter[status][in]=failed,canceled`). Invalid values → **400**.
        - in: query
          name: filter[isDryRun][eq]
          schema:
            type: boolean
          description: |
            Filter for dry runs created by `POST /api/v3/workflows/{workflowId}/test` (`true`) or
            for real trigger-initiated runs only (`false`). Omit to return both.
      responses:
        '200':
          description: Workflow runs retrieved successfully
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Request correlation ID
            Cache-Control:
              schema:
                type: string
              example: private, no-store
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkflowRunListItem'
                  meta:
                    $ref: '#/components/schemas/CursorPaginationMeta'
        '400':
          $ref: '#/components/responses/V3BadRequest'
        '401':
          $ref: '#/components/responses/V3Unauthorized'
        '403':
          $ref: '#/components/responses/V3Forbidden'
        '429':
          $ref: '#/components/responses/V3TooManyRequests'
        '500':
          $ref: '#/components/responses/V3InternalServerError'
      security:
        - sessionAuth: []
        - apiKeyAuth: []
        - bearerAuth: []
  /api/v3/workflows/runs/{runId}:
    get:
      operationId: getWorkflowRunV3
      summary: Retrieve a workflow run
      description: |
        Returns one workflow run by globally unique run id, including the full debug payload: the
        captured `triggerPayload`, the run `data` (per-step results), the persisted `logs` trace,
        and retry metadata (`attempt`, `nextAttemptAt`, `lastErrorAt`). Scope 1 deliberately exposes
        these as JSON dumps so users and agents can understand exactly what happened in a run.

        Poll this endpoint after `POST /api/v3/workflows/{workflowId}/test`: runs execute
        asynchronously and transition `queued` → `running` → `completed`/`failed`/`canceled`.

        Unknown or inaccessible run ids return `403` rather than `404` to avoid leaking
        cross-workspace resource existence.
