        endpoint does not implement JSON Patch.

        `name` and `description` can be updated in any state except `archived`. The `definition`
        can only be updated while the workflow is `draft` or `disabled`: the live version of an
        `enabled` workflow is an immutable snapshot, so definition changes require disabling (or
        moving to draft) first and re-enabling afterwards. Violations return **422** with code
        `invalid_workflow_state`. A structurally invalid definition returns **400** with structured `invalid_params`; the referenced survey and ending cards are not verified here — that existence check runs when the workflow is enabled.
      tags:
        - V3 Workflows
      parameters:
        - $ref: '#/components/parameters/WorkflowIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchWorkflowRequest'
      responses:
        '200':
          description: Workflow updated successfully
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Request correlation ID
            Cache-Control:
              schema:
                type: string
              example: private, no-store
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/WorkflowResource'
        '400':
          $ref: '#/components/responses/V3BadRequest'
        '401':
          $ref: '#/components/responses/V3Unauthorized'
        '403':
          $ref: '#/components/responses/V3Forbidden'
        '422':
          $ref: '#/components/responses/V3UnprocessableContent'
        '429':
          $ref: '#/components/responses/V3TooManyRequests'
        '500':
          $ref: '#/components/responses/V3InternalServerError'
      security:
        - sessionAuth: []
        - apiKeyAuth: []
    delete:
      operationId: deleteWorkflowV3
      summary: Delete a workflow
      description: |
        Permanently deletes a workflow by id. Deletion cascades to the workflow's versions, runs,
        and run logs so no response-derived data is left behind (GDPR requirement). This is
        irreversible; use `POST /api/v3/workflows/{workflowId}/archive` for a reversible
        soft-delete that keeps history. Returns `204 No Content`.
      tags:
        - V3 Workflows
      parameters:
        - $ref: '#/components/parameters/WorkflowIdPath'
      responses:
        '204':
          description: Workflow deleted successfully
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Request correlation ID
            Cache-Control:
              schema:
                type: string
              example: private, no-store
        '400':
          $ref: '#/components/responses/V3BadRequest'
        '401':
          $ref: '#/components/responses/V3Unauthorized'
        '403':
          $ref: '#/components/responses/V3Forbidden'
        '429':
          $ref: '#/components/responses/V3TooManyRequests'
        '500':
          $ref: '#/components/responses/V3InternalServerError'
      security:
        - sessionAuth: []
        - apiKeyAuth: []
  /api/v3/workflows/{workflowId}/duplicate:
    post:
      operationId: duplicateWorkflowV3
      summary: Duplicate a workflow
      description: |
        Creates a new `draft` workflow by copying an existing workflow's definition, name (or the
        provided override), and description. The duplicate receives its own id and timestamps and
        starts with empty run and version history; the source workflow is unchanged. Archived
        workflows can be duplicated (the copy starts as a normal draft).
      tags:
        - V3 Workflows
      parameters:
        - $ref: '#/components/parameters/WorkflowIdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DuplicateWorkflowRequest'
      responses:
        '201':
          description: Workflow duplicated successfully
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Request correlation ID
            Cache-Control:
              schema:
                type: string
              example: private, no-store
            Location:
              schema:
                type: string
              example: /api/v3/workflows/clworkflowcopy000000000
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/WorkflowResource'
        '400':
          $ref: '#/components/responses/V3BadRequest'
        '401':
          $ref: '#/components/responses/V3Unauthorized'
        '403':
          $ref: '#/components/responses/V3Forbidden'
        '422':
          $ref: '#/components/responses/V3UnprocessableContent'
        '429':
          $ref: '#/components/responses/V3TooManyRequests'
        '500':
          $ref: '#/components/responses/V3InternalServerError'
      security:
        - sessionAuth: []
        - apiKeyAuth: []
  /api/v3/workflows/{workflowId}/enable:
    post:
      operationId: enableWorkflowV3
      summary: Enable a workflow
      description: |
        Moves a workflow from `draft` or `disabled` to `enabled`. Only enabled workflows respond to
        trigger events.

        Enabling validates that the definition is executable — the trigger has exactly one outgoing
        edge (trigger-only drafts cannot be enabled), the graph is acyclic, every node is
        reachable from the trigger, only Scope 1 node types are present, the referenced survey
        and ending cards still exist, and every `send_email` action addressing a *literal* email address
        targets someone who can access this workspace (an element-id `to` resolves to the respondent's own
        address and is exempt) — and then snapshots an immutable workflow version. Runs
        reference that snapshot via `workflowVersionId`, so later draft edits never change what an
        enabled workflow executes. Validation failures return **422** with code
        `workflow_not_executable` and structured `invalid_params`; calling enable in a state other
        than `draft` or `disabled` returns **422** with code `invalid_workflow_state`. Two concurrent enable requests race to publish the next version; the loser is rejected with **409** code `conflict` and can safely retry.
      tags:
        - V3 Workflows
      parameters:
        - $ref: '#/components/parameters/WorkflowIdPath'
      responses:
        '200':
          $ref: '#/components/responses/WorkflowResourceResponse'
        '400':
          $ref: '#/components/responses/V3BadRequest'
        '401':
          $ref: '#/components/responses/V3Unauthorized'
        '403':
          $ref: '#/components/responses/V3Forbidden'
        '409':
          $ref: '#/components/responses/V3Conflict'
        '422':
          $ref: '#/components/responses/V3UnprocessableContent'
        '429':
          $ref: '#/components/responses/V3TooManyRequests'
        '500':
          $ref: '#/components/responses/V3InternalServerError'
      security:
        - sessionAuth: []
        - apiKeyAuth: []
  /api/v3/workflows/{workflowId}/disable:
    post:
      operationId: disableWorkflowV3
      summary: Disable a workflow
      description: |
        Moves an `enabled` workflow to `disabled`. Disabled workflows keep their configuration but
        do not respond to trigger events; runs that are already queued or running are not canceled.
        Calling disable in any other state returns **422** with code `invalid_workflow_state`.
      tags:
        - V3 Workflows
      parameters:
        - $ref: '#/components/parameters/WorkflowIdPath'
      responses:
        '200':
          $ref: '#/components/responses/WorkflowResourceResponse'
        '400':
          $ref: '#/components/responses/V3BadRequest'
        '401':
          $ref: '#/components/responses/V3Unauthorized'
        '403':
          $ref: '#/components/responses/V3Forbidden'
        '422':
          $ref: '#/components/responses/V3UnprocessableContent'
        '429':
          $ref: '#/components/responses/V3TooManyRequests'
        '500':
          $ref: '#/components/responses/V3InternalServerError'
      security:
        - sessionAuth: []
        - apiKeyAuth: []
  /api/v3/workflows/{workflowId}/archive:
    post:
      operationId: archiveWorkflowV3
      summary: Archive a workflow
      description: |
        Soft-deletes a workflow by moving it from any non-archived state to `archived`. Archived
        workflows stop responding to trigger events immediately, become read-only, and are excluded
        from list responses unless requested with `filter[status][in]=archived`. Their runs, version
        history, and definition are preserved, and the workflow can be restored with
        `POST /api/v3/workflows/{workflowId}/unarchive`. Archiving an already archived workflow
        returns **422** with code `invalid_workflow_state`.
      tags:
        - V3 Workflows
      parameters:
        - $ref: '#/components/parameters/WorkflowIdPath'
      responses:
        '200':
          $ref: '#/components/responses/WorkflowResourceResponse'
        '400':
          $ref: '#/components/responses/V3BadRequest'
        '401':
          $ref: '#/components/responses/V3Unauthorized'
        '403':
          $ref: '#/components/responses/V3Forbidden'
        '422':
          $ref: '#/components/responses/V3UnprocessableContent'
        '429':
          $ref: '#/components/responses/V3TooManyRequests'
        '500':
          $ref: '#/components/responses/V3InternalServerError'
      security:
        - sessionAuth: []
        - apiKeyAuth: []
  /api/v3/workflows/{workflowId}/unarchive:
    post:
      operationId: unarchiveWorkflowV3
      summary: Unarchive a workflow
      description: |
        Restores an `archived` workflow to `draft`. Unarchiving never re-enables a workflow
        automatically: re-enable explicitly with `POST /api/v3/workflows/{workflowId}/enable`, which
        re-validates the definition (the referenced survey or ending cards may have changed while
        the workflow was archived). Calling unarchive on a non-archived workflow returns **422**
        with code `invalid_workflow_state`.
      tags:
        - V3 Workflows
      parameters:
        - $ref: '#/components/parameters/WorkflowIdPath'
      responses:
        '200':
          $ref: '#/components/responses/WorkflowResourceResponse'
        '400':
          $ref: '#/components/responses/V3BadRequest'
        '401':
          $ref: '#/components/responses/V3Unauthorized'
        '403':
          $ref: '#/components/responses/V3Forbidden'
        '422':
          $ref: '#/components/responses/V3UnprocessableContent'
        '429':
          $ref: '#/components/responses/V3TooManyRequests'
        '500':
          $ref: '#/components/responses/V3InternalServerError'
      security:
        - sessionAuth: []
        - apiKeyAuth: []
  /api/v3/workflows/{workflowId}/test:
    post:
      operationId: testWorkflowV3
      summary: Dry-run (validate) a workflow
      description: |
        Validates a workflow without running it or causing any side effect. It checks that the workflow's current definition is executable, that the trigger's referenced survey and ending cards still exist in the workspace, and that every `send_email` action addressing a *literal* email address targets someone who can access this workspace. **No** workflow run is created and **no** email or webhook is sent.

        The response is always `200` with `{ data: { workflowId, ok, problems } }`. `data.ok` is `true` when the workflow would execute; otherwise `data.problems` lists every issue found — each with a machine-readable `code` and the offending `field` — so they can be fixed in a single pass.

        Drafts are testable — validating the setup before going live is the point of a dry run. Only an `archived` workflow is rejected, with **422** and code `invalid_workflow_state`.
      tags:
        - V3 Workflows
      parameters:
        - $ref: '#/components/parameters/WorkflowIdPath'
      responses:
        '200':
          description: |
            Validation result. The request succeeded; inspect `data.ok` to see whether the workflow is ready, and `data.problems` for any issues.
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Request correlation ID
            Cache-Control:
              schema:
                type: string
              example: private, no-store
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/WorkflowTestResult'
              examples:
                ok:
                  summary: Workflow is valid and ready to enable
                  value:
                    data:
                      workflowId: clworkflow0000000000000000
                      ok: true
                      problems: []
                problems:
                  summary: Workflow has unresolved trigger references
                  value:
                    data:
                      workflowId: clworkflow0000000000000000
                      ok: false
                      problems:
                        - code: survey_not_found
                          field: definition.trigger.config.surveyId
                          message: The referenced survey does not exist in this workspace.
                        - code: ending_card_not_found
                          field: definition.trigger.config.endingCardIds
                          message: Ending card clending000000000000000000 does not exist on the survey.
                recipientNotAllowed:
                  summary: A send_email action addresses a literal recipient without workspace access
                  value:
                    data:
                      workflowId: clworkflow0000000000000000
                      ok: false
                      problems:
                        - code: recipient_not_allowed
                          field: definition.nodes.config.to
                          message: Recipient outsider@external.example cannot access this workspace. A send_email action may only address someone with access to this workspace or a respondent field.
        '401':
          $ref: '#/components/responses/V3Unauthorized'
        '403':
          $ref: '#/components/responses/V3Forbidden'
        '422':
          $ref: '#/components/responses/V3UnprocessableContent'
        '429':
          $ref: '#/components/responses/V3TooManyRequests'
        '500':
          $ref: '#/components/responses/V3InternalServerError'
      security:
        - sessionAuth: []
        - apiKeyAuth: []
  /api/v3/action-classes:
    get:
      operationId: listActionClassesV3
      summary: List action classes
      description: |
        Returns the action classes (user actions that can trigger an app survey) for a workspace. Use
        the returned ids as `distribution.triggers[].actionClassId` when creating or updating app
        surveys. Read-only: this v3 endpoint lists action classes but does not create them — action
        classes are managed in the Formbricks app (Actions settings) or via the v1/v2 management API.

        An empty `data` array means the workspace has no action classes yet. Triggers are optional, so
        you can still create an app survey with `distribution.triggers: []` (or omit `distribution`
        entirely) and attach triggers later via `PATCH` once an action class exists. Session cookie or
        x-api-key.
      tags:
        - V3 Action Classes
      parameters:
        - in: query
          name: workspaceId
          required: true
          schema:
            type: string
            format: cuid2
          description: |
            Workspace identifier. This is the canonical container ID for v3 APIs.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 250
            default: 50
          description: Page size (max 250).
        - in: query
          name: cursor
          schema:
            type: string
          description: |
            Opaque cursor returned as `meta.nextCursor` from the previous page. Omit on the first request.
      responses:
        '200':
          description: Action classes retrieved successfully
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Request correlation ID
            Cache-Control:
              schema:
                type: string
              example: private, no-store
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ActionClassResource'
                  meta:
                    type: object
                    required:
                      - limit
                      - nextCursor
                    properties:
                      limit:
                        type: integer
                      nextCursor:
                        type:
                          - string
                          - 'null'
                        description: Opaque cursor for the next page. `null` when there are no more results.
        '400':
          $ref: '#/components/responses/V3BadRequest'
        '401':
          $ref: '#/components/responses/V3Unauthorized'
        '403':
          $ref: '#/components/responses/V3Forbidden'
        '429':
          $ref: '#/components/responses/V3TooManyRequests'
        '500':
          $ref: '#/components/responses/V3InternalServerError'
      security:
        - sessionAuth: []
        - apiKeyAuth: []
  /api/v3/contact-attribute-keys:
