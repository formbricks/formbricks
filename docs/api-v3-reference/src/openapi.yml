# V3 API source of truth — multi-file spec (hand-maintained; not generated by generate-api-specs).
# Edit files under docs/api-v3-reference/src/, then run `pnpm api:v3:bundle` to regenerate ../openapi.yml
# (the self-contained artifact Mintlify and other single-file consumers read). CI gate: `pnpm api:v3:check`.
# Survey implementation: apps/web/app/api/v3/surveys/. Workflow contract: Scope 1 for ENG-1101.
openapi: 3.1.1
info:
  title: Formbricks API v3
  description: >
    **Surveys**: **GET /api/v3/surveys**, **POST /api/v3/surveys**, **POST
    /api/v3/surveys/generate**, **POST /api/v3/surveys/validate**, **GET
    /api/v3/surveys/{surveyId}**, **PATCH /api/v3/surveys/{surveyId}**, and
    **DELETE /api/v3/surveys/{surveyId}**.


    **Responses**: **GET /api/v3/responses**, **GET /api/v3/responses/count**, **POST
    /api/v3/responses/validate**, **POST /api/v3/responses/batch-delete**, **GET
    /api/v3/responses/{responseId}**, **POST /api/v3/responses**, **PATCH
    /api/v3/responses/{responseId}**, and **DELETE /api/v3/responses/{responseId}**.


    **Workflows extension**: **GET /api/v3/workflows**, **POST
    /api/v3/workflows**, **GET /api/v3/workflows/{workflowId}**, **PATCH
    /api/v3/workflows/{workflowId}**, **DELETE /api/v3/workflows/{workflowId}**,
    **POST /api/v3/workflows/{workflowId}/duplicate**, **POST
    /api/v3/workflows/{workflowId}/enable**, **POST
    /api/v3/workflows/{workflowId}/disable**, **POST
    /api/v3/workflows/{workflowId}/archive**, **POST
    /api/v3/workflows/{workflowId}/unarchive**, **POST
    /api/v3/workflows/{workflowId}/test**, **GET /api/v3/workflows/runs**, and
    **GET /api/v3/workflows/runs/{runId}**.


    Authenticate all management endpoints with **session cookie** or
    **`x-api-key`** (management key with access to the workspace).


    **Spec location:** source of truth is the multi-file tree at
    `docs/api-v3-reference/src/` (root `openapi.yml` plus one file per path and
    component); `docs/api-v3-reference/openapi.yml` is the generated
    single-file bundle (alongside v2 at `docs/api-v2-reference/openapi.yml`).


    **workspaceId**

    `workspaceId` is the canonical container identifier for this API. It is a
    **required query parameter on collection read endpoints** (`GET
    /api/v3/surveys`, `GET /api/v3/action-classes`, `GET
    /api/v3/contact-attribute-keys`) because those operate within a workspace.
    **`POST /api/v3/surveys` instead requires `workspaceId` in the request
    body**, not as a query parameter. Single-resource endpoints
    (`GET`/`PATCH`/`DELETE /api/v3/surveys/{surveyId}`) locate the resource by
    its globally-unique id and resolve the workspace from it, so they do **not**
    accept a `workspaceId` query parameter — sending one returns **400**
    (`Unrecognized key: "workspaceId"`).


    **Auth**

    Authenticate with either a session cookie or **`x-api-key`**. In dual-auth
    mode, V3 checks the API key first when the header is present, otherwise it
    uses the session path. Unauthenticated callers get **401** before query
    validation.


    **Pagination**

    Cursor-based pagination with **limit** + opaque **cursor** token. Responses
    return `meta.nextCursor`; pass that value back as `cursor` to fetch the next
    page. Survey list responses also include `meta.totalCount`, the total number
    of surveys matching the current filters across all pages. Workflow list
    responses do not require total counts in Scope 1. There is no `offset` in
    this contract.

    The page-size **maximum is 250** for responses, surveys, action classes and contact attribute
    keys; only the *default* varies by resource (20 for surveys, 50 for the workspace reference
    lists). **The workflows and workflow-run lists remain at 100** — their bound lives in the
    `packages/workflows` contracts and moves with that package, so each documents the value it
    actually enforces. A `limit` above an endpoint's maximum is rejected with **400** rather than
    silently reduced, consistent with v3 rejecting unrecognized query parameters instead of ignoring
    them. Callers should not infer the end of a collection from a page shorter than `limit`;
    `meta.nextCursor` of `null` is the only end-of-collection signal. Note that array-valued *input*
    bounds are a separate concern and stay at 100 — `filter[id][in]` and the batch-delete id list
    are bounded by write and payload risk, not by page cost.


    **Strictness**

    A query parameter that an operation does not declare returns **400**, with the offending key
    reported in `invalid_params[].name` — including on operations that declare no query parameters at
    all. Unknown parameters are rejected rather than ignored on purpose: a silently-dropped filter
    returns *more* data than the caller believes they asked for, and a typo in a filter name is
    indistinguishable from no filter at all. The same applies to request bodies, where unsupported
    fields are rejected instead of stripped.

    Unrecognized **headers** are tolerated, as gateways and proxies legitimately add them; strictness
    is about parameters and body fields, not transport metadata.

    This is the rule for the surveys, responses, tags and workspace reference-list operations. The
    workflows family does not enforce it today, so treat parameter strictness there as unspecified
    rather than guaranteed.

    **Filtering**

    Filters use explicit operator-style query parameters under the
    **`filter[...]` family**. The survey list supports `filter[name][contains]`,
    `filter[status][in]`, and `filter[type][in]`. The workflow list supports
    `filter[name][contains]` and `filter[status][in]`; the workflow run list
    supports `filter[status][in]` and `filter[isDryRun][eq]`. Resource-scoping
    identifiers (`workspaceId`, `workflowId`, `responseId`) stay plain query
    parameters. Multi-value filters use repeated keys or comma-separated values
    (e.g. `filter[status][in]=draft&filter[status][in]=inProgress` or
    `filter[status][in]=draft,inProgress`). Sorting remains a flat `sortBy`
    query parameter.


    **Responses**

    The response resource is **self-describing**. Answers come back as a typed `answers[]` array in
    which each entry carries the element's id, label, type and value, rather than as a map keyed by
    element id — so a consumer holding only a response can read it without fetching the survey and
    joining. Hidden fields, survey variables and auto-captured context are one `embeddedData[]`
    collection rather than three parallel concepts, each entry declaring a `kind` and a `type`. Data
    whose element has since been deleted is reported in `unresolved[]` instead of being dropped
    silently. Labels are resolved at read time against the current survey definition, and the
    `resolution` object discloses that policy along with the survey's `updatedAt` so a consumer can
    detect wording drift.

    Writes take answers in the **stored map form** (`data`, `variables`) while reads return the typed
    array. Resolving ids into labelled answers is unambiguous; the reverse would mean matching
    caller-supplied labels back onto option ids, so the write side keeps the stored shape. To stop
    that costing round-trippability, the **detailed read echoes `data` and `variables` back** as
    `readOnly` fields — so a single-response read can be edited and passed straight back into a
    `PATCH`, and the typed `answers[]` array is an addition rather than a replacement. The list view
    omits the echo, since a page of 250 would otherwise carry every answer twice.
    `POST /api/v3/responses/validate` exists so a caller can see what a map would produce, and what
    a write would do, before committing to it.

    `createdAt` and `updatedAt` are **server-owned** on this resource: they cannot be supplied on
    create or changed by a patch. Response metering counts rows by `(surveyId, createdAt)`, and a
    client-chosen `createdAt` also lets rows be inserted into the middle of another consumer's
    already-paginated stream. Backdating stays available on v2 until a dedicated import path exists.
    The respondent's IP address and the `contactAttributes` snapshot that v1/v2 expose are not part
    of this resource in any view; that snapshot is copied from the contact at submission time and
    never refreshed, so it is stale PII by construction.

    Response filtering is allow-listed and index-backed: `filter[createdAt][gte|lte]`,
    `filter[finished][eq]`, `filter[language][in]` and `filter[id][in]`. `filter[finished][eq]` and
    `filter[language][in]` require `surveyId` or `contactId` as well, because both are heap residuals
    bounded only by an anchored index range. Per-answer, hidden-field, submission-metadata,
    contact-attribute, quota and tag filters are **not** offered; each is a JSON path or an unindexed
    join on the largest table in the product. The in-app dashboard does offer them, so this API is
    knowingly behind the dashboard here — closing the gap requires index work and is tracked
    separately rather than quietly omitted.

    `GET /api/v3/responses/count` answers "how many match?" directly. The list endpoint's
    `meta.totalCount` covers a caller that is already paging and is **opt-in** via
    `includeTotalCount` (default `false`, unlike the survey list) because responses are the
    highest-cardinality table in the product. Both response counts are **capped at 10 000** and
    carry an exactness flag — `meta.totalCountRelation` on the list, `data.relation` on `/count` —
    reading `eq` when the figure is exact and `gte` when the cap was reached and it is a lower bound.
    An exact count over this table grows superlinearly with the data while a capped one stays flat,
    so an uncapped total would be the only part of a response whose cost is unbounded. `/count`
    accepts `precision=exact` for the cases that genuinely need a precise figure, documented as the
    deliberate slow path. The survey list's `totalCount` stays exact and uncapped: surveys are
    low-cardinality and that count has a covering index built for it.

    Bulk deletion is `POST /api/v3/responses/batch-delete`, a custom method rather than a
    collection-level `DELETE`, so a call that loses its filters cannot degrade into erasing
    everything in scope. It scope-filters rather than rejecting: foreign and already-deleted ids are
    ignored and the call reports how many rows it removed, which keeps it both leak-free and safe to
    retry.

    **Security**

    Missing/forbidden workspace returns **403** with a generic message (not
    **404**) so resource existence is not leaked. Workflow and workflow-run
    detail endpoints also return **403** for unknown IDs or inaccessible IDs to
    avoid IDOR leaks. List responses use `private, no-store`.


    **AI survey creation**

    `POST /api/v3/surveys/generate` returns a draft `POST /api/v3/surveys`
    payload plus validation metadata. It does not create a survey. It generates
    survey content for both `link` and `app` surveys; for `app` it seeds a
    default `distribution` (display once, no triggers, no targeting) that you
    finish configuring before publishing.

    Prompt text is sent to the configured AI provider for generation, but it is
    not stored by this endpoint, not logged by default, and not included in
    audit data.


    **OpenAPI**

    This spec is **not** produced by `pnpm generate-api-specs` (that script only
    builds v2 → `docs/api-v2-reference/openapi.yml`). When the route contract
    changes, edit the files under `docs/api-v3-reference/src/`, then run
    `pnpm api:v3:bundle` to regenerate the committed single-file bundle.
    `pnpm api:v3:lint` lints the source tree; `pnpm api:v3:check` (CI) fails
    when the bundle is stale.


    **Workflows Scope 1**

    Workflows are a follow-up extension of the existing v3 Survey API work. The
    Survey API establishes API-first survey authoring; Workflows build on that
    same v3 style to automate actions around survey responses through
    workspace-scoped JSON definitions. Scope 1 models the existing Follow-ups
    capability as workflows: one `response.completed` trigger with an optional
    `endingCardIds` filter, and `send_email` actions with Follow-up email field
    parity. The definition and run shapes mirror the shared Zod schemas in
    `packages/workflows` (ENG-1100), which are the implementation source of
    truth for this contract.


    Workflows use `draft`, `enabled`, and `disabled` lifecycle states plus an
    `archived` soft-delete state. Status only changes through the lifecycle
    endpoints (`enable`, `disable`, `archive`, `unarchive`); it is not writable
    via `POST` or `PATCH`. Enabling validates that the definition is executable
    and snapshots an immutable workflow version; runs reference that snapshot
    via `workflowVersionId`. `POST .../test` is a dry run: it validates the
    definition and resolves the trigger's references synchronously, creating no
    run and sending no email, and returns `{ workflowId, ok, problems }`
    directly. Real runs execute asynchronously and are polled via
    `GET /api/v3/workflows/runs/{runId}`.


    **Overview migration note**

    The v3-backed survey overview page intentionally removes actions that are
    not yet exposed by this contract: `Created by` filtering, `Duplicate`,
    `Copy...`, `Preview`, and `Copy link`.


    **Next steps (out of scope for this spec)**

    Additional v3 survey update endpoints, optional ETag/304, field selection,
    translation-specific writes, and survey version history.
