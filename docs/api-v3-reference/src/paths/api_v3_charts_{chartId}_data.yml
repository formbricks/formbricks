get:
  operationId: getChartDataV3
  summary: Get a chart's data
  description: |
    Runs a saved chart and returns its rows — the endpoint every dashboard widget loads its data
    from. A date range given here replaces the chart's own range on `FeedbackRecords.collectedAt`,
    exactly as a dashboard's date filter does, so the numbers match what a person sees on a
    dashboard filtered the same way. `dateRange=all-time` removes the range; without a date range
    the chart's saved range applies. Every range is read in the organization's display time zone;
    a `timezone` parameter is refused with 400. For a chart grouped by time alone, a requested
    range that spans more than 10,000 buckets of its granularity answers 422 `limit_exceeded` on
    `dateRange`: request a shorter range, or use a chart with a coarser granularity.

    Needs read access to the chart's workspace and to its Feedback Dataset. Counts against the
    chart-query budget (600 per minute, 20 at once, per user or API key), not the v3 default.
  tags:
    - V3 Charts
  parameters:
    - $ref: ../components/parameters/ChartIdPath.yml
    - in: query
      name: dateRange
      schema:
        type: string
        maxLength: 64
      description: >-
        A date preset from the field catalog's `datePresets`, or `all-time`. Not together with
        `from`/`to`.
      example: last 7 days
    - in: query
      name: from
      schema:
        type: string
        format: date
      description: First day of a custom range (inclusive). Requires `to`.
    - in: query
      name: to
      schema:
        type: string
        format: date
      description: Last day of a custom range (inclusive). Requires `from`.
  responses:
    "200":
      description: The chart's rows
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request correlation ID
        Cache-Control:
          schema:
            type: string
          example: private, no-store
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                $ref: ../components/schemas/ChartData.yml
    "400":
      $ref: ../components/responses/V3BadRequest.yml
    "401":
      $ref: ../components/responses/V3Unauthorized.yml
    "403":
      $ref: ../components/responses/V3DashboardsForbidden.yml
    "422":
      $ref: ../components/responses/V3UnprocessableContent.yml
    "429":
      $ref: ../components/responses/V3ChartQueryTooManyRequests.yml
    "500":
      $ref: ../components/responses/V3InternalServerError.yml
    "502":
      $ref: ../components/responses/V3ChartQueryFailed.yml
  security:
    - sessionAuth: []
    - apiKeyAuth: []
    - bearerAuth: []
