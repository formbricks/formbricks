get:
  operationId: listTagsV3
  # Session-only by design, so an API-key caller reading the published reference would only ever get a
  # 401. Excluded from the generated docs pages until ENG-2533 decides between dropping the paths
  # and opening them to API keys; the operation stays in the bundle for the contract tests.
  x-excluded: true
  summary: List tags
  description: |
    Returns a workspace's response tags, each with the number of responses currently carrying it.

    Session cookie only. Tags are managed from the Formbricks app (Workspace settings → Tags); these
    endpoints back that screen, so they do not accept `x-api-key`.
  tags:
    - V3 Tags
  parameters:
    - in: query
      name: workspaceId
      required: true
      schema:
        type: string
        format: cuid2
      description: |
        Workspace identifier. This is the canonical container ID for v3 APIs.
  responses:
    "200":
      description: Tags retrieved successfully
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request correlation ID
        Cache-Control:
          schema:
            type: string
          example: private, no-store
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                type: array
                items:
                  $ref: ../components/schemas/TagResource.yml
    "400":
      $ref: ../components/responses/V3BadRequest.yml
    "401":
      $ref: ../components/responses/V3UnauthorizedSession.yml
    "403":
      $ref: ../components/responses/V3Forbidden.yml
    "429":
      $ref: ../components/responses/V3TooManyRequests.yml
    "500":
      $ref: ../components/responses/V3InternalServerError.yml
  security:
    - sessionAuth: []
