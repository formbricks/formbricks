get:
  operationId: listTaxonomyNodeRecordsV3
  summary: List a taxonomy node's records
  description: |
    Returns a capped sample of the feedback records classified under a node and its visible descendants.
    There is no cursor and no total: use the record-counts operation for how many there are.

    Requires read access to the workspace and an Enterprise license that includes Unify Feedback (otherwise **403**). Session cookie, `x-api-key`, or a Bearer token.

    Answers **404** for a node that does not exist in the given dataset.
  tags:
    - V3 Taxonomy
  parameters:
    - in: path
      name: nodeId
      required: true
      schema:
        type: string
        format: uuid
    - $ref: ../components/parameters/WorkspaceIdQuery.yml
    - $ref: ../components/parameters/TaxonomyDirectoryIdQuery.yml
    - in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 100
      description: >-
        Size of the sample. A value above the maximum is rejected with **400**; `meta.limit` reports the cap
        the feedback service applied.
  responses:
    "200":
      description: Records sampled
      content:
        application/json:
          schema:
            type: object
            required:
              - data
              - meta
            properties:
              data:
                type: array
                items:
                  $ref: ../components/schemas/FeedbackRecord.yml
              meta:
                type: object
                required:
                  - limit
                properties:
                  limit:
                    type: integer
    "400":
      $ref: ../components/responses/V3BadRequest.yml
    "401":
      $ref: ../components/responses/V3Unauthorized.yml
    "403":
      $ref: ../components/responses/V3Forbidden.yml
    "404":
      $ref: ../components/responses/V3NotFound.yml
    "429":
      $ref: ../components/responses/V3TooManyRequests.yml
    "500":
      $ref: ../components/responses/V3InternalServerError.yml
    "502":
      $ref: ../components/responses/V3BadGateway.yml
    "503":
      $ref: ../components/responses/V3ServiceUnavailable.yml
  security:
    - sessionAuth: []
    - apiKeyAuth: []
    - bearerAuth: []
