get:
  operationId: getFeedbackRecordV3
  summary: Get a feedback record
  description: |
    Returns one feedback record by id. The gateway looks the record up to learn its dataset and
    authorizes against that, so no `tenant_id` is sent. Requires an API key with **read**
    permission (or higher) on a workspace the record's dataset is assigned to.

    An unknown id, or one in a dataset you cannot read, answers **403** — never **404**.
  tags:
    - V3 Feedback Records
  parameters:
    - $ref: ../components/parameters/FeedbackRecordIdPath.yml
  responses:
    "200":
      description: Feedback record retrieved
      content:
        application/json:
          schema:
            $ref: ../components/schemas/FeedbackRecord.yml
          examples:
            enriched:
              summary: A text record after enrichment
              value:
                id: 018e1234-5678-7abc-8ef0-123456789abd
                tenant_id: ph7zv3w2u1x5k9d8m4q6c0bn
                collected_at: 2026-08-15T10:30:00Z
                created_at: 2026-08-15T10:30:02Z
                updated_at: 2026-08-15T10:31:40Z
                source_type: survey
                source_id: cm2k7q9x00003v8h1a2b3c4d5
                source_name: Post-match survey
                submission_id: cm2k7qa1z0007v8h1e6f7g8h9
                field_id: q2
                field_label: What could we improve?
                field_type: text
                value_text: Queues at the north gate were far too long.
                user_id: fan-8813
                language: en
                sentiment: negative
                sentiment_score: -0.62
                emotions:
                  - anger
                value_text_translated: Die Warteschlangen am Nordtor waren viel zu lang.
                translation_lang_key: de
    "400":
      $ref: ../components/responses/FeedbackRecordsBadRequest.yml
    "401":
      $ref: ../components/responses/FeedbackRecordsUnauthorized.yml
    "403":
      $ref: ../components/responses/FeedbackRecordsForbidden.yml
    "500":
      $ref: ../components/responses/FeedbackRecordsInternalServerError.yml
    "503":
      $ref: ../components/responses/FeedbackRecordsServiceUnavailable.yml
  security:
    - apiKeyAuth: []
patch:
  operationId: updateFeedbackRecordV3
  summary: Update a feedback record
  description: |
    Changes the answer, `language`, `user_id` or `metadata` of one record. Only the members sent
    are changed; provenance (`tenant_id`, `source_*`, `field_*`, `submission_id`, `collected_at`)
    is immutable. Requires an API key with **write** permission (or higher) on a workspace the
    record's dataset is assigned to, and the dataset must be assigned to **exactly one** workspace
    — see the delete operation for why.

    Two behaviours are silent and worth knowing: `metadata` is **replaced**, not merged; and
    changing `value_text` clears the enrichment members (`sentiment`, `sentiment_score`,
    `emotions`, `value_text_translated`, `translation_lang_key`) and queues re-enrichment and
    re-embedding — the response shows them absent until that completes. Changing `language` clears
    and re-queues the translation pair only.
  tags:
    - V3 Feedback Records
  parameters:
    - $ref: ../components/parameters/FeedbackRecordIdPath.yml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/UpdateFeedbackRecordRequest.yml
        examples:
          correctText:
            summary: Correct a text answer
            value:
              value_text: Queues at the north gate were far too long on match day.
          replaceMetadata:
            summary: Replace the metadata object
            value:
              metadata:
                channel: survey
                stand: north
                priority: high
  responses:
    "200":
      description: Feedback record updated
      content:
        application/json:
          schema:
            $ref: ../components/schemas/FeedbackRecord.yml
          examples:
            updated:
              summary: After correcting the text — enrichment members are cleared pending re-enrichment
              value:
                id: 018e1234-5678-7abc-8ef0-123456789abd
                tenant_id: ph7zv3w2u1x5k9d8m4q6c0bn
                collected_at: 2026-08-15T10:30:00Z
                created_at: 2026-08-15T10:30:02Z
                updated_at: 2026-08-16T09:02:11Z
                source_type: survey
                source_id: cm2k7q9x00003v8h1a2b3c4d5
                source_name: Post-match survey
                submission_id: cm2k7qa1z0007v8h1e6f7g8h9
                field_id: q2
                field_label: What could we improve?
                field_type: text
                value_text: Queues at the north gate were far too long on match day.
                user_id: fan-8813
                language: en
    "400":
      $ref: ../components/responses/FeedbackRecordsBadRequest.yml
    "401":
      $ref: ../components/responses/FeedbackRecordsUnauthorized.yml
    "403":
      $ref: ../components/responses/FeedbackRecordsForbidden.yml
    "409":
      $ref: ../components/responses/FeedbackRecordsConflict.yml
    "413":
      $ref: ../components/responses/FeedbackRecordsPayloadTooLarge.yml
    "500":
      $ref: ../components/responses/FeedbackRecordsInternalServerError.yml
    "503":
      $ref: ../components/responses/FeedbackRecordsServiceUnavailable.yml
  security:
    - apiKeyAuth: []
delete:
  operationId: deleteFeedbackRecordV3
  summary: Delete a feedback record
  description: |
    Permanently deletes one record and its derived embedding. Unrecoverable, so it requires an API
    key with **manage** permission on a workspace the record's dataset is assigned to, and the
    dataset must be assigned to **exactly one** workspace: on a shared dataset no workspace
    permission can say whose record this is, so API-key mutations are refused with **403**.
  tags:
    - V3 Feedback Records
  parameters:
    - $ref: ../components/parameters/FeedbackRecordIdPath.yml
  responses:
    "204":
      description: Feedback record deleted
    "400":
      $ref: ../components/responses/FeedbackRecordsBadRequest.yml
    "401":
      $ref: ../components/responses/FeedbackRecordsUnauthorized.yml
    "403":
      $ref: ../components/responses/FeedbackRecordsForbidden.yml
    "409":
      $ref: ../components/responses/FeedbackRecordsConflict.yml
    "500":
      $ref: ../components/responses/FeedbackRecordsInternalServerError.yml
    "503":
      $ref: ../components/responses/FeedbackRecordsServiceUnavailable.yml
  security:
    - apiKeyAuth: []
