get:
  operationId: listWorkflowSamplesV3
  summary: List a workflow's samples
  description: >
    Returns the samples a workflow keeps, one per source: the Webhook trigger's
    Sample payload (`source: trigger`) and each HTTP request step's last Test
    request response (`source` is the step id). The editor reads them to offer
    an HTTP request's response fields as Variables to later steps.


    Samples can hold customer data and API responses, so this requires
    **write** access to the workspace (`readWrite` or `manage`); read-only
    callers get **403**. A workflow with no samples answers an empty list.
  tags:
    - V3 Workflows
  parameters:
    - $ref: ../components/parameters/WorkflowIdPath.yml
  responses:
    "200":
      description: The workflow's samples.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request correlation ID
        Cache-Control:
          schema:
            type: string
          example: private, no-store
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                type: array
                items:
                  $ref: ../components/schemas/WorkflowSampleListItem.yml
          examples:
            httpStep:
              value:
                data:
                  - source: call_crm
                    sample:
                      status: 200
                      contentType: application/json
                      body:
                        tier: gold
                    updatedAt: "2026-11-13T09:31:12.000Z"
    "400":
      $ref: ../components/responses/V3BadRequest.yml
    "401":
      $ref: ../components/responses/V3Unauthorized.yml
    "403":
      $ref: ../components/responses/V3Forbidden.yml
    "429":
      $ref: ../components/responses/V3TooManyRequests.yml
    "500":
      $ref: ../components/responses/V3InternalServerError.yml
  security:
    - sessionAuth: []
    - apiKeyAuth: []
    - bearerAuth: []
