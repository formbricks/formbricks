get:
  operationId: countFeedbackRecordsV3
  summary: Count feedback records
  description: |
    Counts the feedback records matching the same filters `GET /api/v3/feedback-records` accepts, so
    a count can never describe a different set than the list. Requires an API key with **read**
    permission (or higher) on the workspace.

    Ordering and pagination do not apply, so `sortBy`, `limit` and `cursor` are not accepted.
  tags:
    - V3 Feedback Records
  parameters:
    - $ref: ../components/parameters/WorkspaceIdQuery.yml
    - $ref: ../components/parameters/FeedbackDatasetIdQuery.yml
    - $ref: ../components/parameters/FeedbackRecordFilterSubmissionIdIn.yml
    - $ref: ../components/parameters/FeedbackRecordFilterSourceTypeIn.yml
    - $ref: ../components/parameters/FeedbackRecordFilterSourceIdIn.yml
    - $ref: ../components/parameters/FeedbackRecordFilterSourceNameIn.yml
    - $ref: ../components/parameters/FeedbackRecordFilterFieldIdIn.yml
    - $ref: ../components/parameters/FeedbackRecordFilterFieldGroupIdIn.yml
    - $ref: ../components/parameters/FeedbackRecordFilterLanguageIn.yml
    - $ref: ../components/parameters/FeedbackRecordFilterFieldTypeIn.yml
    - $ref: ../components/parameters/FeedbackRecordFilterValueIdIn.yml
    - $ref: ../components/parameters/FeedbackRecordFilterUserIdIn.yml
    - $ref: ../components/parameters/FeedbackRecordFilterCollectedAtGte.yml
    - $ref: ../components/parameters/FeedbackRecordFilterCollectedAtLte.yml
    - $ref: ../components/parameters/FeedbackRecordFilterCreatedAtGte.yml
    - $ref: ../components/parameters/FeedbackRecordFilterCreatedAtLte.yml
    - $ref: ../components/parameters/FeedbackRecordFilterValueNumberGte.yml
    - $ref: ../components/parameters/FeedbackRecordFilterValueNumberLte.yml
    - $ref: ../components/parameters/FeedbackRecordFilterValueDateGte.yml
    - $ref: ../components/parameters/FeedbackRecordFilterValueDateLte.yml
    - $ref: ../components/parameters/FeedbackRecordFilterSentimentScoreGte.yml
    - $ref: ../components/parameters/FeedbackRecordFilterSentimentScoreLte.yml
    - $ref: ../components/parameters/FeedbackRecordFilterSentimentIn.yml
    - $ref: ../components/parameters/FeedbackRecordFilterEmotionsIn.yml
    - $ref: ../components/parameters/FeedbackRecordFilterHasSentimentEq.yml
    - $ref: ../components/parameters/FeedbackRecordFilterHasEmotionsEq.yml
    - $ref: ../components/parameters/FeedbackRecordFilterHasTranslationEq.yml
  responses:
    "200":
      description: Count retrieved
      content:
        application/json:
          schema:
            $ref: ../components/schemas/FeedbackRecordCountEnvelope.yml
          examples:
            counted:
              summary: Matching records
              value:
                data:
                  count: 1284
    "400":
      $ref: ../components/responses/V3BadRequest.yml
    "401":
      $ref: ../components/responses/V3Unauthorized.yml
    "403":
      $ref: ../components/responses/V3Forbidden.yml
    "429":
      $ref: ../components/responses/V3TooManyRequests.yml
    "500":
      $ref: ../components/responses/V3InternalServerError.yml
    "503":
      $ref: ../components/responses/FeedbackRecordsServiceUnavailable.yml
  security:
    - apiKeyAuth: []
