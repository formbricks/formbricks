post:
  operationId: regenerateWorkflowWebhookV3
  summary: Regenerate a workflow's Webhook Secret URL
  description: >
    Replaces the workflow's Webhook Secret URL with a new one and returns it.
    The old URL stops working at once: its next call answers **404**. The
    workflow itself, its status and its runs are unchanged. Recorded in the
    audit log as `webhookUrlRegenerated`.


    Requires **write** access. A workflow whose trigger is not a Webhook
    trigger, or an archived workflow, answers **422** `invalid_workflow_state`.
  tags:
    - V3 Workflows
  parameters:
    - $ref: ../components/parameters/WorkflowIdPath.yml
  responses:
    "200":
      description: The new Webhook Secret URL, last call and Sample payload.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request correlation ID
        Cache-Control:
          schema:
            type: string
          example: private, no-store
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                $ref: ../components/schemas/WorkflowWebhookResource.yml
    "400":
      $ref: ../components/responses/V3BadRequest.yml
    "401":
      $ref: ../components/responses/V3Unauthorized.yml
    "403":
      $ref: ../components/responses/V3Forbidden.yml
    "422":
      $ref: ../components/responses/V3UnprocessableContent.yml
    "429":
      $ref: ../components/responses/V3TooManyRequests.yml
    "500":
      $ref: ../components/responses/V3InternalServerError.yml
  security:
    - sessionAuth: []
    - apiKeyAuth: []
    - bearerAuth: []
