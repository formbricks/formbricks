get:
  operationId: listFeedbackRecordsV3
  summary: List feedback records
  description: |
    Lists feedback records in a workspace's dataset, newest first. Requires an API key with **read**
    permission (or higher) on the workspace.

    Scope is required, as it is on every v3 list: pass `workspaceId`. A workspace reaches at most one
    active dataset, so that is normally enough; pass `datasetId` as well to name one explicitly. Use
    `GET /api/v3/feedback-datasets` to discover the ids.

    Pagination is keyset: pass the response's `meta.nextCursor` back as `cursor`, keeping `sortBy`
    unchanged. The cursor is bound to the sort order.
  tags:
    - V3 Feedback Records
  parameters:
    - $ref: ../components/parameters/WorkspaceIdQuery.yml
    - $ref: ../components/parameters/FeedbackDatasetIdQuery.yml

    # --- identity and provenance filters -------------------------------------------------------
    - in: query
      name: filter[submissionId][in]
      style: form
      explode: true
      schema:
        type: array
        maxItems: 100
        items:
          type: string
          maxLength: 255
      description: Records belonging to any of these logical submissions (e.g. response ids).
    - in: query
      name: filter[sourceType][in]
      style: form
      explode: true
      schema:
        type: array
        maxItems: 20
        items:
          type: string
          maxLength: 255
      description: Records from any of these source types, e.g. `survey`, `review`.
    - in: query
      name: filter[sourceId][in]
      style: form
      explode: true
      schema:
        type: array
        maxItems: 100
        items:
          type: string
          maxLength: 255
      description: Records from any of these specific sources.
    - in: query
      name: filter[sourceName][in]
      style: form
      explode: true
      schema:
        type: array
        maxItems: 20
        items:
          type: string
          maxLength: 255
      description: Records from any of these source names.
    - in: query
      name: filter[fieldId][in]
      style: form
      explode: true
      schema:
        type: array
        maxItems: 100
        items:
          type: string
          maxLength: 255
      description: Records for any of these question / field ids.
    - in: query
      name: filter[fieldGroupId][in]
      style: form
      explode: true
      schema:
        type: array
        maxItems: 100
        items:
          type: string
          maxLength: 255
      description: Records in any of these field groups (ranking, matrix and grid questions).
    - in: query
      name: filter[fieldType][in]
      style: form
      explode: true
      schema:
        type: array
        maxItems: 9
        items:
          $ref: ../components/schemas/FeedbackRecordFieldType.yml
      description: >-
        Records of any of these field types. An empty value is ignored, so
        `?filter[fieldType][in]=` equals omitting the filter.
    - in: query
      name: filter[valueId][in]
      style: form
      explode: true
      schema:
        type: array
        maxItems: 100
        items:
          type: string
          maxLength: 255
      description: Records whose answer carries any of these source-system option ids.
    - in: query
      name: filter[userId][in]
      style: form
      explode: true
      schema:
        type: array
        maxItems: 100
        items:
          type: string
          maxLength: 255
      description: Records attributed to any of these end users.
    - in: query
      name: filter[language][in]
      style: form
      explode: true
      schema:
        type: array
        maxItems: 20
        items:
          type: string
          maxLength: 35
      description: Records given in any of these languages.

    # --- range filters -------------------------------------------------------------------------
    - in: query
      name: filter[collectedAt][gte]
      schema:
        type: string
        format: date-time
      description: Records collected at or after this instant. Bounded to 1970-2080.
    - in: query
      name: filter[collectedAt][lte]
      schema:
        type: string
        format: date-time
      description: Records collected at or before this instant. Bounded to 1970-2080.
    - in: query
      name: filter[createdAt][gte]
      schema:
        type: string
        format: date-time
      description: Records stored at or after this instant. Bounded to 1970-2080.
    - in: query
      name: filter[createdAt][lte]
      schema:
        type: string
        format: date-time
      description: Records stored at or before this instant. Bounded to 1970-2080.
    - in: query
      name: filter[valueNumber][gte]
      schema:
        type: number
        format: double
      description: Records whose numeric answer is at least this value.
    - in: query
      name: filter[valueNumber][lte]
      schema:
        type: number
        format: double
      description: Records whose numeric answer is at most this value.
    - in: query
      name: filter[valueDate][gte]
      schema:
        type: string
        format: date-time
      description: Records whose date answer is at or after this instant.
    - in: query
      name: filter[valueDate][lte]
      schema:
        type: string
        format: date-time
      description: Records whose date answer is at or before this instant.
    - in: query
      name: filter[sentimentScore][gte]
      schema:
        type: number
        format: double
        minimum: -1
        maximum: 1
      description: Records whose sentiment score is at least this value.
    - in: query
      name: filter[sentimentScore][lte]
      schema:
        type: number
        format: double
        minimum: -1
        maximum: 1
      description: >-
        Records whose sentiment score is at most this value. An inverted range (a `gte` above the
        `lte`) answers **400**.

    # --- enrichment filters --------------------------------------------------------------------
    - in: query
      name: filter[sentiment][in]
      style: form
      explode: true
      schema:
        type: array
        maxItems: 6
        items:
          $ref: ../components/schemas/FeedbackRecordSentiment.yml
      description: Records carrying any of these sentiment labels. An empty value is ignored.
    - in: query
      name: filter[emotions][in]
      style: form
      explode: true
      schema:
        type: array
        maxItems: 6
        items:
          $ref: ../components/schemas/FeedbackRecordEmotion.yml
      description: Records carrying any of these emotion labels. An empty value is ignored.
    - in: query
      name: filter[hasSentiment][eq]
      schema:
        type: boolean
      description: >-
        `true` selects records carrying a sentiment label, `false` those without. A presence filter
        on a member rather than a member of the record itself.
    - in: query
      name: filter[hasEmotions][eq]
      schema:
        type: boolean
      description: >-
        `true` selects records carrying emotion labels, `false` those without. Note `false` covers
        both "not yet classified" and "classified, no emotion detected".
    - in: query
      name: filter[hasTranslation][eq]
      schema:
        type: boolean
      description: "`true` selects records carrying a translation, `false` those without."

    # --- ordering and pagination ---------------------------------------------------------------
    - in: query
      name: sortBy
      schema:
        type: string
        enum:
          - collectedAt
          - -collectedAt
          - createdAt
          - -createdAt
        default: -collectedAt
      description: >-
        Sort order; a leading `-` is descending. Only columns that are non-null and immutable after
        insert are offered: a mutable sort key would let a row move across the cursor between pages
        and be skipped. Rows tied on the sort column are ordered by `id` ascending. The `cursor`
        token is bound to the selected sort order.
    - in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
      description: >-
        Page size. Higher than the v3 default of 100 because this surface is built for bulk
        ingestion and export. Out-of-range and non-numeric values are rejected — `-5`, `1001` and
        `abc` all answer **400** — with one exception: `limit=0` is indistinguishable from omitting
        the parameter, so it is accepted and the default applies. Send no `limit` rather than `0` if
        you are computing it.
    - $ref: ../components/parameters/CursorQuery.yml
  responses:
    "200":
      description: Feedback records retrieved
      content:
        application/json:
          schema:
            $ref: ../components/schemas/FeedbackRecordList.yml
          examples:
            onePage:
              summary: One page of two records
              value:
                data:
                  - id: 018e1234-5678-7abc-8ef0-123456789abc
                    datasetId: ph7zv3w2u1x5k9d8m4q6c0bn
                    collectedAt: "2026-08-15T10:30:00Z"
                    createdAt: "2026-08-15T10:30:02Z"
                    updatedAt: "2026-08-15T10:31:40Z"
                    sourceType: survey
                    sourceName: Post-match survey
                    submissionId: cm2k7qa1z0007v8h1e6f7g8h9
                    fieldId: q2
                    fieldLabel: What could we improve?
                    fieldType: text
                    valueText: Queues at the north gate were far too long.
                    userId: fan-8813
                    language: en
                    sentiment: negative
                    sentimentScore: -0.62
                    emotions:
                      - anger
                  - id: 018e1234-5678-7abc-8ef0-123456789abd
                    datasetId: ph7zv3w2u1x5k9d8m4q6c0bn
                    collectedAt: "2026-08-15T10:29:11Z"
                    createdAt: "2026-08-15T10:29:12Z"
                    updatedAt: "2026-08-15T10:29:12Z"
                    sourceType: survey
                    submissionId: cm2k7qa1z0007v8h1e6f7g8h8
                    fieldId: q1
                    fieldType: nps
                    valueNumber: 9
                meta:
                  limit: 100
                  nextCursor: eyJjb2xsZWN0ZWRBdCI6IjIwMjYtMDgtMTVUMTA6Mjk6MTFaIn0
    "400":
      $ref: ../components/responses/V3BadRequest.yml
    "401":
      $ref: ../components/responses/V3Unauthorized.yml
    "403":
      $ref: ../components/responses/V3Forbidden.yml
    "500":
      $ref: ../components/responses/V3InternalServerError.yml
    "503":
      $ref: ../components/responses/FeedbackRecordsServiceUnavailable.yml
  security:
    - apiKeyAuth: []

post:
  operationId: createFeedbackRecordV3
  summary: Create a feedback record
  description: |
    Stores one feedback record. Requires an API key with **write** permission (or higher) on the
    workspace.

    Records are unique per (`datasetId`, `submissionId`, `fieldId`); re-posting the same triple
    answers **409**. Send a `valueText` and the record is queued for enrichment — sentiment,
    emotions and a translation appear on later reads rather than in this response.
  tags:
    - V3 Feedback Records
  parameters:
    - $ref: ../components/parameters/WorkspaceIdQuery.yml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/CreateFeedbackRecordRequest.yml
        examples:
          rating:
            summary: A rating answer
            value:
              datasetId: ph7zv3w2u1x5k9d8m4q6c0bn
              sourceType: survey
              sourceId: cm2k7q9x00003v8h1a2b3c4d5
              submissionId: cm2k7qa1z0007v8h1e6f7g8h9
              fieldId: q1
              fieldType: nps
              valueNumber: 9
          freeText:
            summary: A free-text answer (enriched and embedded)
            value:
              datasetId: ph7zv3w2u1x5k9d8m4q6c0bn
              sourceType: review
              sourceName: App Store
              submissionId: appstore-review-88213
              fieldId: review_body
              fieldLabel: Review
              fieldType: text
              valueText: Crashes every time I open the settings screen.
              userId: appstore-user-4471
              language: en
          choice:
            summary: A choice answer with a stable option id
            value:
              datasetId: ph7zv3w2u1x5k9d8m4q6c0bn
              sourceType: survey
              submissionId: cm2k7qa1z0007v8h1e6f7g8h9
              fieldId: q3
              fieldType: categorical
              valueId: choice_2f8a
              valueText: A friend
  responses:
    "201":
      description: Feedback record created
      content:
        application/json:
          schema:
            $ref: ../components/schemas/FeedbackRecordEnvelope.yml
          examples:
            created:
              summary: The stored record
              value:
                data:
                  id: 018e1234-5678-7abc-8ef0-123456789abc
                  datasetId: ph7zv3w2u1x5k9d8m4q6c0bn
                  collectedAt: "2026-08-15T10:30:00Z"
                  createdAt: "2026-08-15T10:30:02Z"
                  updatedAt: "2026-08-15T10:30:02Z"
                  sourceType: review
                  sourceName: App Store
                  submissionId: appstore-review-88213
                  fieldId: review_body
                  fieldLabel: Review
                  fieldType: text
                  valueText: Crashes every time I open the settings screen.
                  userId: appstore-user-4471
                  language: en
    "400":
      $ref: ../components/responses/V3BadRequest.yml
    "401":
      $ref: ../components/responses/V3Unauthorized.yml
    "403":
      $ref: ../components/responses/V3Forbidden.yml
    "409":
      $ref: ../components/responses/V3Conflict.yml
    "413":
      $ref: ../components/responses/V3PayloadTooLarge.yml
    "500":
      $ref: ../components/responses/V3InternalServerError.yml
    "503":
      $ref: ../components/responses/FeedbackRecordsServiceUnavailable.yml
  security:
    - apiKeyAuth: []
