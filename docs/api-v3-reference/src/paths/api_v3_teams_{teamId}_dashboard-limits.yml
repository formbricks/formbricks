get:
  operationId: getTeamDashboardLimitsV3
  summary: Get a team's dashboard limits
  description: |
    The dashboards the team's Dashboard Viewer members open in the team's workspaces; an empty list
    means all of them. Owners and Managers, or an API key with Access Control read; needs Access Control
    and Dashboards.
  tags:
    - V3 Dashboard Access
  parameters:
    - $ref: ../components/parameters/TeamIdPath.yml
  responses:
    "200":
      description: The team's dashboard limits
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                $ref: ../components/schemas/TeamDashboardLimitsResource.yml
    "400":
      $ref: ../components/responses/V3BadRequest.yml
    "401":
      $ref: ../components/responses/V3Unauthorized.yml
    "403":
      $ref: ../components/responses/V3DashboardAccessForbidden.yml
    "429":
      $ref: ../components/responses/V3TooManyRequests.yml
    "500":
      $ref: ../components/responses/V3InternalServerError.yml
  security:
    - sessionAuth: []
    - apiKeyAuth: []
    - bearerAuth: []
put:
  operationId: replaceTeamDashboardLimitsV3
  summary: Replace a team's dashboard limits
  description: |
    Replaces the dashboards the team's Dashboard Viewer members open; an empty list opens every
    dashboard of the team's workspaces. Each dashboard must be in a workspace the team is granted
    (**422** otherwise). Losing a workspace grant removes the team's limits there. Owners and Managers,
    or an API key with Access Control write; needs Access Control and Dashboards. Audited.
  tags:
    - V3 Dashboard Access
  parameters:
    - $ref: ../components/parameters/TeamIdPath.yml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - dashboardIds
          properties:
            dashboardIds:
              type: array
              maxItems: 200
              items:
                type: string
                format: cuid2
          additionalProperties: false
  responses:
    "200":
      description: The replaced dashboard limits
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                $ref: ../components/schemas/TeamDashboardLimitsResource.yml
    "400":
      $ref: ../components/responses/V3BadRequest.yml
    "401":
      $ref: ../components/responses/V3Unauthorized.yml
    "403":
      $ref: ../components/responses/V3DashboardAccessForbidden.yml
    "422":
      $ref: ../components/responses/V3UnprocessableContent.yml
    "429":
      $ref: ../components/responses/V3TooManyRequests.yml
    "500":
      $ref: ../components/responses/V3InternalServerError.yml
  security:
    - sessionAuth: []
    - apiKeyAuth: []
    - bearerAuth: []
