get:
  operationId: getDashboardChartDataV3
  summary: Get a chart's data through its dashboard
  description: |
    Runs a chart that is a widget on this dashboard and returns its rows — the endpoint every
    dashboard widget loads its data from. The body is the chart data body (`GET
    /api/v3/charts/{chartId}/data`) plus `unfilterableFilters`.

    Both narrow the chart's saved query and never widen it:

    - **Date range.** `dateRange`, or `from` and `to`, is ANDed with the chart's own range on
      `FeedbackRecords.collectedAt`: a chart saved for the last 30 days read for the last 12 months
      still shows the last 30 days, and ranges that do not overlap answer an empty chart.
    - **Filter picks.** Each `picks[<filterId>]` is ANDed onto the chart's saved filters; a saved
      rule on the same field is kept, at any depth. A pick on a field the chart's Feedback Dataset
      lacks answers empty `rows` and names the filter in `unfilterableFilters`.

    A chart that is not a widget on the dashboard answers 404, whether it exists elsewhere or not.
    Needs read access to the dashboard's workspace and to the chart's Feedback Dataset. Counts
    against the chart-query budget (600 per minute, 20 at once, per user or API key), not the v3
    default.
  tags:
    - V3 Dashboards
  parameters:
    - $ref: ../components/parameters/DashboardIdPath.yml
    - $ref: ../components/parameters/ChartIdPath.yml
    - $ref: ../components/parameters/DashboardDateRangeQuery.yml
    - $ref: ../components/parameters/DashboardDateFromQuery.yml
    - $ref: ../components/parameters/DashboardDateToQuery.yml
    - $ref: ../components/parameters/DashboardFilterPicksQuery.yml
  responses:
    "200":
      description: The chart's rows, narrowed by the dashboard date range and the picks
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request correlation ID
        Cache-Control:
          schema:
            type: string
          example: private, no-store
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                $ref: ../components/schemas/DashboardChartData.yml
    "400":
      $ref: ../components/responses/V3BadRequest.yml
    "401":
      $ref: ../components/responses/V3Unauthorized.yml
    "403":
      $ref: ../components/responses/V3DashboardsForbidden.yml
    "404":
      description: >-
        Not Found — the chart is not a widget on this dashboard. Answered only to a caller who may
        read the dashboard.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request correlation ID
        Cache-Control:
          schema:
            type: string
          example: private, no-store
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/Problem.yml
          example:
            title: Not Found
            status: 404
            detail: Chart not found
            code: not_found
            requestId: 6f1f7f3e-3b0e-4a1a-9f0a-7c9a1d2b3c4d
    "422":
      $ref: ../components/responses/V3UnprocessableContent.yml
    "429":
      $ref: ../components/responses/V3ChartQueryTooManyRequests.yml
    "500":
      $ref: ../components/responses/V3InternalServerError.yml
    "502":
      $ref: ../components/responses/V3ChartQueryFailed.yml
  security:
    - sessionAuth: []
    - apiKeyAuth: []
    - bearerAuth: []
