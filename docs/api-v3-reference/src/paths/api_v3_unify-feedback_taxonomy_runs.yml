post:
  operationId: startTaxonomyRunV3
  summary: Start a taxonomy run
  description: |
    Starts, or resumes, topic generation for a scope. Idempotent per scope: when a run is already going,
    `inProgress` is `true` and that run is returned. Poll `GET /api/v3/unify-feedback/taxonomy/runs/{runId}`
    until `status` is `succeeded`, `failed` or `canceled`, then read the tree from
    `GET /api/v3/unify-feedback/taxonomy/state`.

    Changing a dataset's topics is limited to organization owners and managers for a person, and for an
    API key to one with write access to a workspace that is the dataset's only owner: a dataset shared by
    several workspaces answers **403** to an API key, because its topics belong to the dataset, not to a
    workspace. Requires an Enterprise license that includes Unify Feedback. Session cookie, `x-api-key`, or a
    Bearer token.

    Answers **503** when the taxonomy service or an embedding model is not configured on the deployment.
  tags:
    - V3 Taxonomy
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          required:
            - workspaceId
            - directoryId
          properties:
            workspaceId:
              type: string
              format: cuid2
            directoryId:
              type: string
              format: cuid2
              description: Feedback dataset (directory) assigned to `workspaceId`.
            scopeType:
              type: string
              enum: [field, directory]
              default: field
              description: >-
                `field` requires `sourceType` and `fieldId`; `directory` covers all text feedback in the
                dataset and accepts neither.
            sourceType:
              type: string
              minLength: 1
              maxLength: 255
            sourceId:
              type: string
              maxLength: 255
              description: May be the empty string, which addresses feedback with no attributed source.
            fieldId:
              type: string
              minLength: 1
              maxLength: 255
            fieldLabel:
              type: string
              maxLength: 1000
              description: Field scope only. Display label for the field.
  responses:
    "200":
      description: Run started or already in progress
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                type: object
                required:
                  - run
                  - inProgress
                properties:
                  run:
                    $ref: ../components/schemas/TaxonomyRun.yml
                  inProgress:
                    type: boolean
    "400":
      $ref: ../components/responses/V3BadRequest.yml
    "401":
      $ref: ../components/responses/V3Unauthorized.yml
    "403":
      $ref: ../components/responses/V3Forbidden.yml
    "429":
      $ref: ../components/responses/V3TooManyRequests.yml
    "500":
      $ref: ../components/responses/V3InternalServerError.yml
    "502":
      $ref: ../components/responses/V3BadGateway.yml
    "503":
      $ref: ../components/responses/V3ServiceUnavailable.yml
  security:
    - sessionAuth: []
    - apiKeyAuth: []
    - bearerAuth: []
