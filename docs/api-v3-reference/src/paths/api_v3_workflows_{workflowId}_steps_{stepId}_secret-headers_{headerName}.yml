put:
  operationId: replaceWorkflowSecretHeaderV3
  summary: Replace a secret header's value
  description: >
    Stores a new value for one secret header of an HTTP request step, for example to rotate a leaked
    or expired API key. The value is stored encrypted and never returned.


    The value is overwritten in place, so it is used from the next run on, **also by the enabled
    workflow**: there is no need to disable the workflow or enable it again, and no other draft
    change goes live with it. This is the one change that reaches an enabled workflow without
    **Enable** (ADR 0043). A header that has no stored value yet gets one in the draft only; an
    enabled workflow uses it once the draft is enabled.


    Recorded in the audit log as `secretHeaderReplaced` (or `secretHeaderSet` when the header had no
    value yet) with the step and header name, never the value.


    Requires **write** access. The step must be an HTTP request step with a secret header of this
    name (case-insensitive) in the draft or the enabled version, else **404**. An archived workflow
    answers **422** `invalid_workflow_state`.
  tags:
    - V3 Workflows
  parameters:
    - $ref: ../components/parameters/WorkflowIdPath.yml
    - name: stepId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
      description: The HTTP request step's id in the workflow definition.
    - name: headerName
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
      description: The secret header's name, matched case-insensitively.
      example: Authorization
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/ReplaceWorkflowSecretHeaderRequest.yml
  responses:
    "204":
      description: The value was stored.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request correlation ID
        Cache-Control:
          schema:
            type: string
          example: private, no-store
    "400":
      $ref: ../components/responses/V3BadRequest.yml
    "401":
      $ref: ../components/responses/V3Unauthorized.yml
    "403":
      $ref: ../components/responses/V3Forbidden.yml
    "404":
      description: The step is not an HTTP request step, or has no secret header of this name.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request correlation ID
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/Problem.yml
    "422":
      $ref: ../components/responses/V3UnprocessableContent.yml
    "429":
      $ref: ../components/responses/V3TooManyRequests.yml
    "500":
      $ref: ../components/responses/V3InternalServerError.yml
  security:
    - sessionAuth: []
    - apiKeyAuth: []
    - bearerAuth: []
