get:
  operationId: getDashboardViewerAccessV3
  summary: Get a Feedback Dataset's Dashboard Viewer access
  description: |
    Which records of the dataset a Dashboard Viewer sees: its conditions, in order, and whether all or
    any of them must hold. Owners and Managers, or an API key with Access Control read; needs Access
    Control and Dashboards.
  tags:
    - V3 Dashboard Access
  parameters:
    - $ref: ../components/parameters/DatasetIdPath.yml
  responses:
    "200":
      description: The Dashboard Viewer access
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                $ref: ../components/schemas/DashboardViewerAccessResource.yml
    "400":
      $ref: ../components/responses/V3BadRequest.yml
    "401":
      $ref: ../components/responses/V3Unauthorized.yml
    "403":
      $ref: ../components/responses/V3DashboardAccessForbidden.yml
    "429":
      $ref: ../components/responses/V3TooManyRequests.yml
    "500":
      $ref: ../components/responses/V3InternalServerError.yml
  security:
    - sessionAuth: []
    - apiKeyAuth: []
    - bearerAuth: []
put:
  operationId: replaceDashboardViewerAccessV3
  summary: Replace a Feedback Dataset's Dashboard Viewer access
  description: |
    Replaces the join and every condition (at most 10). Send the `updatedAt` from your read as
    `expectedUpdatedAt`: if the dataset changed since, the request answers **409** and nothing is
    written. A field that is not a Feedback Record string field or `ed:<key>`, or a Member attribute of
    another organization, answers **422**. A condition that repeats an earlier one (the same field
    and the same Member attribute) answers **400**. Owners and Managers, or an API key with Access Control write;
    needs Access Control and Dashboards. Audited.
  tags:
    - V3 Dashboard Access
  parameters:
    - $ref: ../components/parameters/DatasetIdPath.yml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/DashboardViewerAccessReplaceRequest.yml
  responses:
    "200":
      description: The replaced Dashboard Viewer access
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                $ref: ../components/schemas/DashboardViewerAccessResource.yml
    "400":
      $ref: ../components/responses/V3BadRequest.yml
    "401":
      $ref: ../components/responses/V3Unauthorized.yml
    "403":
      $ref: ../components/responses/V3DashboardAccessForbidden.yml
    "409":
      $ref: ../components/responses/V3Conflict.yml
    "422":
      $ref: ../components/responses/V3UnprocessableContent.yml
    "429":
      $ref: ../components/responses/V3TooManyRequests.yml
    "500":
      $ref: ../components/responses/V3InternalServerError.yml
  security:
    - sessionAuth: []
    - apiKeyAuth: []
    - bearerAuth: []
