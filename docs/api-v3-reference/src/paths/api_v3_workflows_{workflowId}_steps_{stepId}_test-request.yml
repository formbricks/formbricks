post:
  operationId: sendWorkflowTestRequestV3
  summary: Send a test request for an HTTP request step
  description: >
    Makes one real call of an HTTP request step, from its saved or draft settings, so the author sees
    the real response. It is not a run: no later step runs and nothing is billed. The call goes
    through the same address checks as a run (HTTPS, no private addresses, no redirects followed),
    times out after 10 s and is not retried. A target that answers with an error status still
    returns **200**: the request itself succeeded.


    When an answer came, it is saved as the step's sample (up to 64 KB). Recorded in the audit log as
    `testRequestSent` with the host and status.


    Requires **write** access and is limited to 30 calls per minute per user or API key (**429**).
    A step that is not an HTTP request answers **404**; an archived workflow **422**
    `invalid_workflow_state`; settings that can't be sent (no URL, a secret header with no value, a
    body that is not JSON) **400**.
  tags:
    - V3 Workflows
  parameters:
    - $ref: ../components/parameters/WorkflowIdPath.yml
    - name: stepId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
      description: The HTTP request step's id in the workflow definition.
  requestBody:
    required: true
    description: Send `{}` to call the saved step with the default Variables.
    content:
      application/json:
        schema:
          $ref: ../components/schemas/SendWorkflowTestRequestRequest.yml
  responses:
    "200":
      description: The request that was sent and the answer it got.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request correlation ID
        Cache-Control:
          schema:
            type: string
          example: private, no-store
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                $ref: ../components/schemas/WorkflowTestRequestResult.yml
    "400":
      $ref: ../components/responses/V3BadRequest.yml
    "401":
      $ref: ../components/responses/V3Unauthorized.yml
    "403":
      $ref: ../components/responses/V3Forbidden.yml
    "404":
      description: The workflow has no HTTP request step with this id.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request correlation ID
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/Problem.yml
    "422":
      $ref: ../components/responses/V3UnprocessableContent.yml
    "429":
      $ref: ../components/responses/V3TooManyRequests.yml
    "500":
      $ref: ../components/responses/V3InternalServerError.yml
  security:
    - sessionAuth: []
    - apiKeyAuth: []
    - bearerAuth: []
