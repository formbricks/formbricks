put:
  operationId: setWorkflowExpectedResponseV3
  summary: Set an HTTP request step's expected response body
  description: >
    Sets the expected response body of an HTTP request step — the JSON body its API
    answers with — and returns it with the Variables inferred from it. Later
    steps use those Variables as `steps.<stepId>.body.*`, and a Test run's "Wait
    and use it" answers with this body (status 200). Send test request never
    changes it: its answer is kept apart, and the editor offers it to use. The
    body must be a JSON object of at most 100 KB nested at most 10 levels: a
    larger one answers **413** `payload_too_large`, a deeper one or a non-object
    **400**.


    Requires **write** access. A step that isn't an HTTP request in the
    workflow's definition answers **404**; an archived workflow **422**
    `invalid_workflow_state`. Recorded in the audit log as an update of the
    workflow, with the step id and never the body.
  tags:
    - V3 Workflows
  parameters:
    - $ref: ../components/parameters/WorkflowIdPath.yml
    - name: stepId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
      description: The HTTP request step's id in the workflow definition.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/SetWorkflowExpectedResponseRequest.yml
        examples:
          ticket:
            value:
              body:
                ticket:
                  id: tk_1042
                  status: open
  responses:
    "200":
      description: The expected response body and its Variables.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request correlation ID
        Cache-Control:
          schema:
            type: string
          example: private, no-store
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                $ref: ../components/schemas/WorkflowExpectedResponseResource.yml
    "400":
      $ref: ../components/responses/V3BadRequest.yml
    "401":
      $ref: ../components/responses/V3Unauthorized.yml
    "403":
      $ref: ../components/responses/V3Forbidden.yml
    "404":
      description: The workflow has no HTTP request step with this id.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request correlation ID
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/Problem.yml
    "413":
      description: The body is over 100 KB.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request correlation ID
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/Problem.yml
    "422":
      $ref: ../components/responses/V3UnprocessableContent.yml
    "429":
      $ref: ../components/responses/V3TooManyRequests.yml
    "500":
      $ref: ../components/responses/V3InternalServerError.yml
  security:
    - sessionAuth: []
    - apiKeyAuth: []
    - bearerAuth: []
