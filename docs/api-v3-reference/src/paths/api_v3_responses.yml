get:
  operationId: getResponsesV3
  summary: List responses
  description: >
    Returns responses for a workspace, newest first. Session cookie or x-api-key with read access.


    **Scoping.** `workspaceId` is required, as on every v3 collection read. Add `surveyId` to narrow
    to one survey — the common case, and the one the storage layer is indexed for
    (`(surveyId, createdAt)`). A workspace-wide list has to reach responses through their surveys and
    is correspondingly slower, so pass `surveyId` whenever you know it. `contactId` narrows to one
    respondent.


    **Pagination is keyset**, on `(createdAt, id)`. The `cursor` is opaque and bound to the sort order
    and the filter set it was issued for; changing either invalidates it. `meta.nextCursor` being
    `null` is the only end-of-collection signal — do not infer the end from a short page.


    **Filters are allow-listed** and every one of them is index-backed. `filter[finished][eq]` and
    `filter[language][in]` additionally require `surveyId` or `contactId`, because both are heap
    residuals that are only bounded when the scan is anchored to one survey or one contact; sending
    either without such a scope returns **400**.


    **What this endpoint deliberately does not filter on:** individual answers, hidden-field values,
    submission metadata (`source`, `url`, `country`, `browser`, `os`, `device`), contact attributes,
    quotas, and tags. Each is a JSON path or an unindexed join on the largest table in the database,
    where the honest outcome is a timeout rather than a slow query. The in-app dashboard does offer
    these, so this endpoint is knowingly behind it; closing the gap needs index work and is tracked
    separately rather than quietly omitted.
  tags:
    - V3 Responses
  parameters:
    - $ref: ../components/parameters/WorkspaceIdQuery.yml
    - $ref: ../components/parameters/LimitQuery.yml
    - $ref: ../components/parameters/CursorQuery.yml
    - in: query
      name: surveyId
      schema:
        type: string
        format: cuid2
      description: >-
        Optional survey scoping. Single-valued deliberately: an `[in]` form would defeat the ordered
        index scan that makes this the fast path.
    - in: query
      name: contactId
      schema:
        type: string
        format: cuid2
      description: Optional contact scoping. Returns only responses submitted by this contact.
    - in: query
      name: includeTotalCount
      schema:
        type: boolean
        default: false
      description: >
        Whether to compute `meta.totalCount`. Defaults to **`false`** here, unlike the survey list,
        because responses are the highest-cardinality table in the product and the extra count is not
        free at that size. When `false`, `meta.totalCount` is `null`. If all you need is the count,
        use `GET /api/v3/responses/count` instead of fetching a page to get it.
    - in: query
      name: filter[createdAt][gte]
      schema:
        type: string
        format: date-time
      description: Only responses created at or after this instant (inclusive).
    - in: query
      name: filter[createdAt][lte]
      schema:
        type: string
        format: date-time
      description: Only responses created at or before this instant (inclusive).
    - in: query
      name: filter[finished][eq]
      schema:
        type: boolean
      description: >-
        Completed (`true`) or partial (`false`) responses only. Omit for both. Requires `surveyId` or
        `contactId`.
    - in: query
      name: filter[language][in]
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
      description: >
        Survey language codes to include. Repeat the parameter or use comma-separated values. Values
        are survey language codes rather than BCP-47 locales — `default` is legitimate. Requires
        `surveyId` or `contactId`.
    - in: query
      name: filter[id][in]
      schema:
        type: array
        maxItems: 100
        items:
          type: string
          format: cuid2
      style: form
      explode: true
      description: >-
        Fetch a specific set of responses by id, at most 100 per call. Ids outside the requested scope
        are simply absent from the result rather than erroring, so this cannot be used to probe
        whether an id exists elsewhere.
    - in: query
      name: sortBy
      schema:
        type: string
        enum:
          - "-createdAt"
          - createdAt
        default: "-createdAt"
      description: >
        Sort order. `-createdAt` (newest first) is the default; `createdAt` sorts oldest first, which
        is what a consumer doing an incremental backfill wants. The leading `-` marks descending.


        `updatedAt` is not offered: it has no index, no product usage, and being mutable it cannot
        anchor a keyset cursor.
  responses:
    "200":
      description: Responses retrieved successfully
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request correlation ID
        Cache-Control:
          schema:
            type: string
          example: private, no-store
      content:
        application/json:
          schema:
            type: object
            required:
              - data
              - meta
            properties:
              data:
                type: array
                items:
                  $ref: ../components/schemas/ResponseListItem.yml
              meta:
                type: object
                required:
                  - limit
                  - nextCursor
                  - totalCount
                properties:
                  limit:
                    type: integer
                    minimum: 1
                    description: >-
                      The page size actually applied. Carries no `maximum` — it echoes what the
                      server used rather than bounding what may be asked for.
                  nextCursor:
                    type:
                      - string
                      - "null"
                    description: >-
                      Opaque cursor for the next page. `null` when there are no more results — the
                      only reliable end-of-collection signal.
                  totalCount:
                    type:
                      - integer
                      - "null"
                    minimum: 0
                    description: >-
                      Total responses matching the current scope and filters across all pages. `null`
                      unless `includeTotalCount=true`.
                additionalProperties: false
          examples:
            page:
              summary: One page of responses, exercising several answer types
              value:
                data:
                  - id: clrs1234567890123456789012
                    surveyId: clsv1234567890123456789012
                    surveyName: Q3 Product Feedback
                    workspaceId: clws1234567890123456789012
                    createdAt: 2026-08-27T09:14:03.417Z
                    updatedAt: 2026-08-27T09:17:41.902Z
                    finished: true
                    endingId: cmpthankyou00000000000000
                    language: de
                    durationSeconds: 218.4
                    resolution:
                      labelPolicy: currentSurveyDefinition
                      labelsLanguage: de
                      surveyUpdatedAt: 2026-08-20T11:02:55.000Z
                    answers:
                      - position: 1
                        elementId: nps_score
                        elementType: nps
                        elementLabel: Wie wahrscheinlich ist es, dass Sie uns weiterempfehlen?
                        valueNumber: 9
                        range:
                          min: 0
                          max: 10
                        durationSeconds: 12.1
                      - position: 2
                        elementId: what_could_be_better
                        elementType: openText
                        elementLabel: Was koennten wir besser machen?
                        valueText: Die Suche ist zu langsam.
                        inputType: text
                        durationSeconds: 64.8
                      - position: 3
                        elementId: channels
                        elementType: multipleChoiceMulti
                        elementLabel: Wie haben Sie von uns erfahren?
                        selections:
                          - optionId: ch_2f8a
                            optionLabel: Ein Freund
                            rawValue: Ein Freund
                            match: exact
                          - optionId: other
                            optionLabel: Andere
                            rawValue: Podcast
                            match: other
                          - optionId: null
                            optionLabel: null
                            rawValue: Twitter
                            match: unmatched
                        durationSeconds: 31.0
                      - position: 4
                        elementId: consent_terms
                        elementType: consent
                        elementLabel: Ich stimme den Bedingungen zu
                        valueBoolean: true
                        rawValue: accepted
                    embeddedData:
                      - key: plan
                        kind: ingested
                        type: string
                        label: Plan
                        value: enterprise
                      - key: score
                        kind: computed
                        type: number
                        label: Score
                        value: 12
                      - key: country
                        kind: reserved
                        type: string
                        label: Country
                        value: DE
                    unresolved:
                      - key: old_question_id
                        rawValue: some answer
                        reason: elementNotInSurvey
                    tags:
                      - id: cltg1234567890123456789012
                        name: vip
                meta:
                  limit: 20
                  nextCursor: eyJjcmVhdGVkQXQiOiIyMDI2LTA4LTI3VDA5OjE0OjAzLjQxN1oifQ
                  totalCount: null
    "400":
      description: >
        Bad Request — invalid or unrecognized query parameters. Covers an unknown `filter[...]` key, a
        filter value of the wrong type, `filter[id][in]` over 100 ids, a `cursor` that does not match
        the requested sort order or filter set, and `filter[finished][eq]` or `filter[language][in]`
        sent without `surveyId` or `contactId`.
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/Problem.yml
    "401":
      $ref: ../components/responses/V3Unauthorized.yml
    "403":
      $ref: ../components/responses/V3Forbidden.yml
    "429":
      $ref: ../components/responses/V3TooManyRequests.yml
    "500":
      $ref: ../components/responses/V3InternalServerError.yml
  security:
    - sessionAuth: []
    - apiKeyAuth: []
post:
  operationId: createResponseV3
  summary: Create a response
  description: >
    Records a survey response. Requires read-write access to the workspace, which is resolved from
    `surveyId` rather than supplied by the caller.


    **This performs a real submission.** It runs the full response pipeline — webhooks, integrations,
    follow-ups, quota evaluation, and Hub ingestion once the response is finished — and it consumes
    one metered monthly response. That is the same power a v1/v2 management create has today, and the
    same power an API key with write access already carries; it is called out because an agent holding
    that key can create genuine submissions. Use `POST /api/v3/responses/validate` to check a payload
    without any of that happening.


    `createdAt` cannot be supplied. Bulk historical loading is therefore not what this endpoint is
    for — see `ResponseListItem.createdAt` for why, and use v2 while a dedicated import path is
    outstanding.
  tags:
    - V3 Responses
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/CreateResponseRequest.yml
        examples:
          finishedResponse:
            summary: A complete response with answers, hidden fields and a variable
            value:
              surveyId: clsv1234567890123456789012
              finished: true
              endingId: cmpthankyou00000000000000
              language: de
              data:
                nps_score: 9
                what_could_be_better: Die Suche ist zu langsam.
                channels:
                  - ch_2f8a
                  - Podcast
                plan: enterprise
              variables:
                score: 12
          partialResponse:
            summary: A partial response, still open
            value:
              surveyId: clsv1234567890123456789012
              finished: false
              data:
                nps_score: 7
          identifiedResponse:
            summary: A response attributed to a known contact
            description: >
              `contactId` is create-only — a response cannot later be re-attributed to a different
              person. The contact must already exist in the same workspace.
            value:
              surveyId: clsv1234567890123456789012
              finished: true
              contactId: clct1234567890123456789012
              data:
                nps_score: 10
  responses:
    "201":
      description: Response created successfully
      headers:
        Location:
          schema:
            type: string
          description: Relative URL of the created response.
          example: /api/v3/responses/clrs1234567890123456789012
        X-Request-Id:
          schema:
            type: string
          description: Request correlation ID
        Cache-Control:
          schema:
            type: string
          example: private, no-store
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                $ref: ../components/schemas/ResponseResource.yml
    "400":
      description: >
        Bad Request — the body failed schema validation: invalid JSON, a missing required field, a
        value of the wrong type, or an unsupported field. Sending a server-owned or create-forbidden
        field (`createdAt`, `updatedAt`, `contactAttributes`, `meta`, `userId`) is rejected here with
        `code: unsupported_field` rather than being silently dropped. Failures that need stored state
        to detect return **422** instead.
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/Problem.yml
    "401":
      $ref: ../components/responses/V3Unauthorized.yml
    "403":
      $ref: ../components/responses/V3Forbidden.yml
    "422":
      description: >
        Unprocessable Content — the body is well-formed but conflicts with stored state: `surveyId`
        does not resolve, `endingId` is not an ending of that survey, `language` is not enabled on
        it, `contactId` is not a contact in the same workspace, `displayId` already backs another
        response, `singleUseId` is already used for this survey, or an answer violates the survey's
        own validation rules. Each is itemized in `invalid_params`.
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/Problem.yml
    "429":
      $ref: ../components/responses/V3TooManyRequests.yml
    "500":
      $ref: ../components/responses/V3InternalServerError.yml
  security:
    - sessionAuth: []
    - apiKeyAuth: []
