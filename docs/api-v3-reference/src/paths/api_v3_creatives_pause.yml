post:
  operationId: pauseCreativesV3
  summary: Pause every creative that opens a survey
  description: >
    Pauses, in one request, every creative whose Destination is `surveyId` and whose `status` is
    `inProgress`, however many there are. Each one's `status` becomes `paused`, set by its author, so it
    stays paused whatever the survey does until it is resumed; nothing else about it changes. Drafts,
    creatives already paused or closed, archived creatives and the creatives of other surveys are left
    as they are, and so is a creative whose schedule has ended (it shows as closed, and nothing brings it
    back). The survey screens call it before resuming a survey whose creatives the author keeps paused.


    Read/write access to `workspaceId`, the same access pausing one creative needs; an unknown
    `surveyId`, or one in another workspace, answers **403**. Allowed in wind-down, like pausing one
    creative. A survey with nothing to pause answers **200** with `paused: 0`. Each paused creative is
    audited as an update of its `status`.
  tags:
    - V3 Creatives
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/PauseCreativesRequest.yml
        examples:
          pauseSurveyCreatives:
            summary: Pause the creatives that open a survey
            value:
              workspaceId: clws1234567890123456789012
              surveyId: clsv1234567890123456789012
  responses:
    "200":
      description: The survey's In progress creatives are paused.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request correlation ID
        Cache-Control:
          schema:
            type: string
          example: private, no-store
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                $ref: ../components/schemas/PausedCreatives.yml
          examples:
            paused:
              summary: Two creatives paused
              value:
                data:
                  paused: 2
                  creativeIds:
                    - clcr1234567890123456789012
                    - clcr2234567890123456789012
    "400":
      $ref: ../components/responses/V3BadRequest.yml
    "401":
      $ref: ../components/responses/V3Unauthorized.yml
    "403":
      $ref: ../components/responses/V3CreativesForbidden.yml
    "429":
      $ref: ../components/responses/V3TooManyRequests.yml
    "500":
      $ref: ../components/responses/V3InternalServerError.yml
  security:
    - sessionAuth: []
    - apiKeyAuth: []
    - bearerAuth: []
