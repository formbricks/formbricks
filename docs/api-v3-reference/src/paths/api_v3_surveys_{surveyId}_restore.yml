post:
  operationId: restoreSurveyV3
  summary: Restore a survey
  description: >
    Restores a previously archived (soft-deleted) survey by id, clearing its archive marker so it
    reappears in the default list and becomes editable again. Works on any survey, including legacy
    question-based surveys, so this endpoint returns a minimal lifecycle acknowledgement rather than
    the full survey resource. Session cookie or x-api-key.
  tags:
    - V3 Surveys
  parameters:
    - in: path
      name: surveyId
      required: true
      schema:
        type: string
        format: cuid2
      description: Survey identifier.
  responses:
    "200":
      description: Survey restored successfully
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request correlation ID
        Cache-Control:
          schema:
            type: string
          example: private, no-store
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                type: object
                required:
                  - id
                  - status
                  - archivedAt
                properties:
                  id:
                    type: string
                    description: Survey identifier.
                  status:
                    type: string
                    enum:
                      - draft
                      - inProgress
                      - paused
                      - completed
                    description: Current survey status.
                  archivedAt:
                    type:
                      - string
                      - "null"
                    format: date-time
                    description: >-
                      Soft-delete/archive marker (ISO 8601). `null` after restoring; a timestamp
                      while the survey is archived.
          examples:
            restored:
              summary: Survey restored
              value:
                data:
                  id: clsv1234567890123456789012
                  status: paused
                  archivedAt: null
    "400":
      $ref: ../components/responses/V3BadRequest.yml
    "401":
      $ref: ../components/responses/V3Unauthorized.yml
    "403":
      $ref: ../components/responses/V3Forbidden.yml
    "429":
      $ref: ../components/responses/V3TooManyRequests.yml
    "500":
      $ref: ../components/responses/V3InternalServerError.yml
  security:
    - sessionAuth: []
    - apiKeyAuth: []
