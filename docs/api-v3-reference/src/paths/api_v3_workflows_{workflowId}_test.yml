post:
  operationId: testWorkflowV3
  summary: Dry-run (validate) a workflow
  description: >
    Validates a workflow without running it or causing any side effect. It checks that the
    workflow's current definition is executable, that the trigger's referenced survey and ending
    cards still exist in the workspace, and that every `send_email` action addressing a *literal*
    email address targets someone who can access this workspace, and that every `send_email` survey
    link points to a link survey in this workspace. **No** workflow run is created and **no** email
    or webhook is sent.


    The response is always `200` with `{ data: { workflowId, ok, problems, warnings } }`. `data.ok` is
    `true` when the workflow would execute; otherwise `data.problems` lists every issue found — each
    with a machine-readable `code` and the offending `field` — so they can be fixed in a single pass.
    `data.warnings` lists things that don't stop a run, such as survey link Embedded Data keys the
    linked survey doesn't accept.


    Drafts are testable — validating the setup before going live is the point of a dry run. Only an
    `archived` workflow is rejected, with **422** and code `invalid_workflow_state`.
  tags:
    - V3 Workflows
  parameters:
    - $ref: ../components/parameters/WorkflowIdPath.yml
  responses:
    "200":
      description: >
        Validation result. The request succeeded; inspect `data.ok` to see whether the workflow is
        ready, and `data.problems` for any issues.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request correlation ID
        Cache-Control:
          schema:
            type: string
          example: private, no-store
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                $ref: ../components/schemas/WorkflowTestResult.yml
          examples:
            ok:
              summary: Workflow is valid and ready to enable
              value:
                data:
                  workflowId: clworkflow0000000000000000
                  ok: true
                  problems: []
                  warnings: []
            surveyLinkKeyNotAccepted:
              summary: Ready, but the linked survey drops one Embedded Data key
              value:
                data:
                  workflowId: clworkflow0000000000000000
                  ok: true
                  problems: []
                  warnings:
                    - code: survey_link_key_not_accepted
                      field: definition.nodes.0.config.surveyLink.embeddedData.1.key
                      message: >-
                        The linked survey has no passed-in Embedded Data field call_id, so the link
                        leaves it off. Add the field to the survey to keep this value.
            problems:
              summary: Workflow has unresolved trigger references
              value:
                data:
                  workflowId: clworkflow0000000000000000
                  ok: false
                  problems:
                    - code: survey_not_found
                      field: definition.trigger.config.surveyId
                      message: The referenced survey does not exist in this workspace.
                    - code: ending_card_not_found
                      field: definition.trigger.config.endingCardIds
                      message: Ending card clending000000000000000000 does not exist on the survey.
                  warnings: []
            recipientNotAllowed:
              summary: A send_email action addresses a literal recipient without workspace access
              value:
                data:
                  workflowId: clworkflow0000000000000000
                  ok: false
                  problems:
                    - code: recipient_not_allowed
                      field: definition.nodes.config.to
                      message: >-
                        Recipient outsider@external.example cannot access this workspace. A
                        send_email action may only address someone with access to this workspace or
                        a respondent field.
                  warnings: []
    "401":
      $ref: ../components/responses/V3Unauthorized.yml
    "403":
      $ref: ../components/responses/V3Forbidden.yml
    "422":
      $ref: ../components/responses/V3UnprocessableContent.yml
    "429":
      $ref: ../components/responses/V3TooManyRequests.yml
    "500":
      $ref: ../components/responses/V3InternalServerError.yml
  security:
    - sessionAuth: []
    - apiKeyAuth: []
    - bearerAuth: []
