in: query
name: minScore
schema:
  type: number
  format: float
  minimum: 0
  maximum: 1
  default: 0.5
description: >-
  Only matches with `score >= minScore` are returned, from `0` (unrelated) to `1` (identical). Like
  `limit`, out-of-range and non-numeric values are **rejected with 400** rather than coerced. Raise
  it for stricter matches; lower it when a good query returns nothing. Score distributions differ
  per embedding model, so treat the default as a starting point rather than a guarantee — the
  applied value is echoed back as `meta.minScore`.
