in: query
name: limit
schema:
  type: integer
  default: 10
description: >-
  Page size, at most 100. Unlike the `limit` on `GET /api/v3/feedbackRecords`, this one is never
  rejected: the search endpoints **clamp** instead of answering 400. A value above 100 is reduced to
  100, and `0`, a negative number or a non-numeric value falls back to the default of 10. Read the
  `limit` in the response to see what was actually applied.
