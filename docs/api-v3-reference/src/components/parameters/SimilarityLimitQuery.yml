in: query
name: limit
schema:
  type: integer
  minimum: 1
  maximum: 100
  default: 10
description: >-
  Page size, from 1 to 100. Out-of-range and non-numeric values are **rejected with 400** — the
  bounds are enforced here rather than passed to the vector store, which coerces a bad value to its
  own default instead of complaining, so `limit=999` would otherwise quietly return something other
  than what was asked for.
