in: query
name: tenant_id
required: true
schema:
  type: string
  format: cuid2
description: >-
  The feedback dataset to operate on (the dataset id, as shown by the MCP `list_feedback_datasets`
  tool). **Required by the gateway on this operation**: a missing or malformed value answers **400**
  before the request reaches the feedback store, and a dataset the API key's workspace is not
  assigned to answers **403**. The two `POST` operations take the same value in the request body
  instead, and the single-record operations derive it from the record.
