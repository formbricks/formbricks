in: query
name: picks
style: deepObject
explode: true
schema:
  type: object
  maxProperties: 10
  additionalProperties:
    type: array
    minItems: 1
    maxItems: 100
    items:
      type: string
      maxLength: 1000
description: >-
  Values for the request's filters, as `picks[<id>]=value` for each `filter[<id>]`; repeat the parameter
  for several values of a list filter (any of). A filter takes one typed value otherwise. Each pick is
  ANDed onto every chart's saved query; picks for a filter the request does not name are ignored.
  All values together may take at most 4000 characters percent-encoded
  (`MAX_DASHBOARD_FILTER_PICKS_CHARS`); more answers 422 naming `picks`.
example:
  f1:
    - Web
