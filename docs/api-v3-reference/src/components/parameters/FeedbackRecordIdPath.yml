in: path
name: id
required: true
schema:
  type: string
  format: uuid
description: >-
  Feedback record id (UUID). The dataset is resolved from the record itself, so the caller cannot
  choose which dataset it is authorized against. An id that is not a UUID answers **400**, and an
  id whose dataset the API key cannot reach answers **403** rather than 404, so ids cannot be
  probed. The gateway caches the record→dataset lookup for 60 seconds, so for up to a minute after
  a delete the id is still authorized and the store answers **404**; after that the same id answers
  **403**.
