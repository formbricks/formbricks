in: path
name: feedbackRecordId
required: true
schema:
  type: string
  format: uuid
description: >-
  Feedback record id (UUID). The dataset is resolved from the record itself, so the caller cannot
  choose which dataset it is authorized against. An id that is not a UUID answers **400**. A
  nonexistent id and an id in a dataset the API key cannot reach are deliberately
  indistinguishable: both answer **403** with the same body, so existence cannot be probed. This
  API never answers **404** on a record id.
