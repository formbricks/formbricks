in: query
name: filter[fieldType][in]
style: form
explode: true
schema:
  type: array
  maxItems: 9
  items:
    $ref: ../schemas/FeedbackRecordFieldType.yml
description: >-
  Records of any of these field types. Repeat the parameter for several values. An empty value is
  **rejected** rather than ignored: a filter that silently disappears widens the result set instead
  of narrowing it, and the caller cannot tell it happened.
