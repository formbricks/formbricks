description: >-
  Conflict — non-archived creatives open this survey (code `survey_has_linked_creatives`).
  `details.creatives` lists them. Delete them, then retry: pausing or closing a creative keeps it linked.
  Archived creatives never block: they are unlinked with the survey.
headers:
  X-Request-Id:
    schema:
      type: string
    description: Request correlation ID
  Cache-Control:
    schema:
      type: string
    example: private, no-store
content:
  application/problem+json:
    schema:
      $ref: ../schemas/LinkedCreativesProblem.yml
    example:
      title: Conflict
      status: 409
      detail: Delete the creatives that open this survey before deleting it
      code: survey_has_linked_creatives
      requestId: req_01j8z5
      details:
        creatives:
          - id: clcr1234567890123456789012
            name: Feedback tab
