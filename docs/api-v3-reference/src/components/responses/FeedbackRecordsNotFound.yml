description: >-
  Not Found from the feedback store (`application/problem+json`, `code: not_found`), for one of two
  reasons. Usually the record exists but has **no embedding** for the current model: it has no text,
  or was created moments ago and is not embedded yet. It can also mean the record itself is **gone**
  — deleted after the gateway authorized the call against its cached dataset (see the `id`
  parameter).
content:
  application/problem+json:
    schema:
      $ref: ../schemas/HubProblem.yml
