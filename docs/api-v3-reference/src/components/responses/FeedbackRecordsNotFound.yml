description: >-
  Not Found. On `/{id}/similar` the record exists but has no embedding yet — it has no text, or was
  created moments ago. On the single-record operations it means the record is gone: the dataset
  lookup is cached briefly, so for a short window after a delete the call is still authorized and
  the store no longer has the record. Treat both as "not available to you".
headers:
  X-Request-Id:
    schema:
      type: string
    description: Request correlation ID
content:
  application/problem+json:
    schema:
      $ref: ../schemas/Problem.yml
