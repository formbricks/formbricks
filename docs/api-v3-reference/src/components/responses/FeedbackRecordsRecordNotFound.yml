description: >-
  Not Found from the feedback store (`application/problem+json`, `code: not_found`). The record was
  deleted after the gateway resolved its dataset: that lookup is cached for 60 seconds, so for up to
  a minute after a delete the call is still authorized and reaches the store, which no longer has
  the record. Once the cache entry expires the same id answers **403** instead. Treat both as "this
  record is not available to you".
content:
  application/problem+json:
    schema:
      $ref: ../schemas/HubProblem.yml
