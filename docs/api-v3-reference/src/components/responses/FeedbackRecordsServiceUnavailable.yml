description: >-
  Service Unavailable. From the **gateway** (`text/plain`): the record's dataset could not be
  resolved because the feedback store did not answer, the authorization service itself was
  unreachable, or the record's stored `tenant_id` is not a dataset id this API can address. From the
  **feedback store** (`application/problem+json`, `code: service_unavailable`): the operation needs
  a capability that is not configured on this instance — semantic search and similar records require
  an embedding model.
content:
  text/plain:
    schema:
      type: string
    example: Feedback record lookup failed
  application/problem+json:
    schema:
      $ref: ../schemas/HubProblem.yml
