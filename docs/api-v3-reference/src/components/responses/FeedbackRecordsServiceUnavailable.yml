description: >-
  Service Unavailable — the operation needs a capability this instance does not have configured.
  Semantic search and similar-record lookups require an embedding model; without one they answer
  this rather than an empty result, so a caller can tell "nothing matched" from "the feature is
  off". Also returned when the feedback store itself is unreachable.
headers:
  X-Request-Id:
    schema:
      type: string
    description: Request correlation ID
content:
  application/problem+json:
    schema:
      $ref: ../schemas/Problem.yml
