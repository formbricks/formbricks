description: >-
  Forbidden. `code: forbidden` when the caller has no access to the workspace, the Feedback Dataset
  or the resource (which may also not exist; 404 is not used, to avoid leaking existence).
  `code: dashboards_plan_required` when the caller is authorized but the organization does not have
  the Dashboards add-on or a license that includes it — checked after authorization, so a caller
  without access never learns the organization's plan.
headers:
  X-Request-Id:
    schema:
      type: string
    description: Request correlation ID
  Cache-Control:
    schema:
      type: string
    example: private, no-store
content:
  application/problem+json:
    schema:
      $ref: ../schemas/Problem.yml
