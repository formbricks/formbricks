description: >-
  Conflict (`code: conflict`) — the request clashes with the current state: a chart or dashboard
  name already used in the workspace, a chart already on the dashboard, a dashboard already holding
  its 250 widgets, or a dashboard changed since the `expectedUpdatedAt` the caller sent.
headers:
  X-Request-Id:
    schema:
      type: string
    description: Request correlation ID
  Cache-Control:
    schema:
      type: string
    example: private, no-store
content:
  application/problem+json:
    schema:
      $ref: ../schemas/Problem.yml
