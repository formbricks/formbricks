description: >-
  Conflict (`code: conflict`) — the chart's embedded-data fields were refused before the query ran.
  Either it uses rarely used fields of more than one group, which cannot be combined in one chart
  (remove one of them), or it uses fields so new they are not available to charts yet (retry in a few
  minutes). `detail` says which, and names no field.
headers:
  X-Request-Id:
    schema:
      type: string
    description: Request correlation ID
  Cache-Control:
    schema:
      type: string
    example: private, no-store
content:
  application/problem+json:
    schema:
      $ref: ../schemas/Problem.yml
