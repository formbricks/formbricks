description: >-
  Forbidden. Answered by the gateway as `text/plain` whenever the request cannot be authorized:
  the dataset does not exist, is archived, or is not assigned to a workspace the API key has the
  required permission on; the organization lacks the Unify Feedback entitlement; a mutation was
  attempted with an API key on a dataset shared by more than one workspace; or the record id does
  not exist. Existence is not leaked: an unknown dataset or record is refused here rather than
  with a 404. The single-record operations are the one exception, and only for a minute after a
  delete — see their `404`.
content:
  text/plain:
    schema:
      type: string
    example: Forbidden
