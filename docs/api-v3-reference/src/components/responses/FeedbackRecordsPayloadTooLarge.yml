description: >-
  Payload Too Large. The gateway buffers the request body in order to authorize it, and the proxy
  in front of it stops reading at 1 MiB — Envoy's `maxRequestBytes` on Formbricks Cloud, Traefik's
  `maxbodysize` in the Docker install. The refusal is therefore generated by that proxy rather than
  by the application, so neither its media type nor its body is part of this contract; branch on the
  status alone.
