type: object
description: >-
  What the reader's Dashboard Viewer access leaves them on this dashboard: `unrestricted` (every
  record: Owners, Managers, Members, API keys, and Dashboard Viewers of datasets without conditions),
  `restricted` (only records matching the conditions of the Feedback Datasets on the pages they can
  open), or `unmatched` (a condition needs a Member attribute the reader has no value for, so they see
  no records). One chip per condition; conditions joined with "any" are one chip whose labels are
  joined with " or ".
required:
  - status
  - chips
properties:
  status:
    type: string
    enum:
      - unrestricted
      - restricted
      - unmatched
  chips:
    type: array
    maxItems: 100
    items:
      type: object
      required:
        - label
        - values
        - attributeLabel
      properties:
        label:
          type: string
          description: The dataset field the condition matches, as people read it.
        values:
          type: array
          description: The reader's values the field must equal. Empty when they have none.
          maxItems: 50
          items:
            type: string
        attributeLabel:
          type: string
          description: The Member attribute the values come from; `Email` for the built-in one.
      additionalProperties: false
additionalProperties: false
