allOf:
  - $ref: ./ResponseAnswerBase.yml
  - type: object
    required:
      - imageUrl
    properties:
      elementType:
        type: string
        enum:
          - signature
      imageUrl:
        type: string
        description: >
          The signature image (a PNG), **as stored** — a workspace-relative private storage path
          (`/storage/{workspaceId}/private/surveys/{surveyId}/elements/{elementId}/…`), not an absolute
          URL, and neither resolved nor signed. A signature is one image, so this is a single string
          where `fileUpload` has an array of `fileUrls`.


          A deliberate choice, the same as for `fileUpload`: `answers[]` promises verbatim values a
          client can write straight back, and an absolute URL is neither what is stored nor what a
          write accepts. The v1 and v2 management APIs, webhooks, CSV and Excel exports, and
          integrations resolve the stored path to an absolute URL instead; v3 does not. This field
          identifies the image, it does not serve it: prefix your Formbricks origin to fetch it.


          Not publicly fetchable. The request must carry a signed-in session or an API key with read
          access to the workspace (and, for a restricted survey, to the survey), and deleting the
          response deletes the image.
unevaluatedProperties: false
description: >-
  Signature answer. A `signature` element the respondent skipped is still returned, with an empty `imageUrl`, like an unchecked consent or an unfilled Other: `answers[]` carries every stored value, so a client can write it straight back.
