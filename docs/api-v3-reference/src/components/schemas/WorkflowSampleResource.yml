type: object
description: >
  A workflow's Sample payload — the last payload its Webhook Secret URL
  received, or one pasted in — and the Variables it offers. Variables are
  detected for the first 500 paths; lists are reported as not supported yet.
required:
  - workflowId
  - source
  - payload
  - variables
  - updatedAt
properties:
  workflowId:
    type: string
    format: cuid2
  source:
    type: string
    enum:
      - trigger
  payload:
    type: object
    additionalProperties: true
    description: The Sample payload, a JSON object.
  variables:
    type: object
    required:
      - variables
      - notSupported
      - truncated
    properties:
      variables:
        type: array
        description: Variables the Sample payload offers, in document order.
        items:
          type: object
          required:
            - path
            - valueType
          properties:
            path:
              type: string
              minLength: 1
              example: payload.customer.email
            valueType:
              type: string
              enum:
                - object
                - string
                - number
                - boolean
                - "null"
          additionalProperties: false
      notSupported:
        type: array
        description: >-
          Paths that cannot be used as Variables: `list` (lists are not
          supported yet), `unsafe_segment` (`__proto__`, `prototype` or
          `constructor`) or `unreachable_key` (a key with characters other
          than letters, digits, `-` and `_`, such as a dot or a space, which a
          Variable path cannot carry).
        items:
          type: object
          required:
            - path
            - reason
          properties:
            path:
              type: string
              minLength: 1
            reason:
              type: string
              enum:
                - list
                - unsafe_segment
                - unreachable_key
          additionalProperties: false
      truncated:
        type: boolean
        description: True when only the first 500 paths were read.
    additionalProperties: false
  updatedAt:
    type: string
    format: date-time
additionalProperties: false
