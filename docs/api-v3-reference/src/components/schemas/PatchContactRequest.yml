type: object
description: At least one of `attributes` and `removeAttributeKeys`.
properties:
  attributes:
    allOf:
      - $ref: ./ContactAttributesInput.yml
    description: Attributes to set, merged into what the contact already has; omitted attributes stay.
  removeAttributeKeys:
    type: array
    minItems: 1
    maxItems: 150
    items:
      type: string
      minLength: 1
      maxLength: 100
    description: >-
      Attribute keys to remove from this contact. `userId`, `email`, `firstName` and `lastName` cannot be
      removed, and a key cannot also appear in `attributes`.
additionalProperties: false
