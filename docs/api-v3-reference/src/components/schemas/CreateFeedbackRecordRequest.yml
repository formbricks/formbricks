type: object
description: >-
  A new feedback record. Exactly one `value_*` member should carry the answer, matching
  `fieldType`. Strings must be valid UTF-8 without NULL bytes; violations answer **400**.
additionalProperties: false
required:
  - sourceType
  - fieldId
  - fieldType
  - submissionId
properties:
  sourceType:
    type: string
    minLength: 1
    maxLength: 255
    description: Type of feedback source, e.g. `survey`, `review`, `feedback_form`.
  sourceId:
    type: [string, "null"]
    maxLength: 255
    description: Reference to the survey / form / ticket the record came from.
  sourceName:
    type: [string, "null"]
    maxLength: 255
    description: Human-readable name of the source.
  submissionId:
    type: string
    minLength: 1
    maxLength: 255
    description: >-
      Identifier of the logical submission this record belongs to. Groups multi-field submissions
      and makes ingestion idempotent: records are unique per (`datasetId`, `submissionId`,
      `fieldId`) and a duplicate answers **409**. If a record has no logical submission, reuse
      `fieldId`.
  fieldId:
    type: string
    minLength: 1
    maxLength: 255
    description: Identifier of the question / field.
  fieldLabel:
    type: [string, "null"]
    maxLength: 2048
    description: The question text.
  fieldGroupId:
    type: string
    maxLength: 255
    description: Stable identifier grouping related fields (ranking, matrix and grid questions).
  fieldGroupLabel:
    type: [string, "null"]
    maxLength: 2048
    description: Human-readable question text for the group.
  fieldType:
    $ref: ./FeedbackRecordFieldType.yml
  language:
    type: string
    maxLength: 10
    description: ISO language code the feedback was given in.
  userId:
    type: string
    maxLength: 255
    description: >-
      End-user identifier (e.g. an anonymous id or an email hash). Set it on anything you may later
      have to erase: it is the only handle that finds one person's records again, via
      `filter[userId][in]` on `GET /api/v3/feedback-records`. There is no delete-by-user operation —
      erasure is a list followed by `DELETE /api/v3/feedback-records/{feedbackRecordId}` per record.
  collectedAt:
    type: string
    format: date-time
    description: When the feedback was given. Defaults to now. Must be between 1970-01-01 and 2080-12-31.
  valueText:
    type: [string, "null"]
    maxLength: 30000
    description: Text answer. The only member that feeds sentiment, emotion, translation and embedding enrichment.
  valueId:
    type: [string, "null"]
    maxLength: 255
    description: >-
      Stable id of the selected option in the source system (e.g. a survey choice id or matrix
      column id), stored alongside `valueText`. Opaque, not validated. Omit for free-text,
      "other" and non-choice answers.
  valueNumber:
    type: number
    format: double
    minimum: -1000000000000000
    maximum: 1000000000000000
    description: Numeric answer (ratings, NPS scores, numbers). Must be between -1e15 and +1e15.
  valueBoolean:
    type: boolean
    description: Yes / no answer.
  valueDate:
    type: string
    format: date-time
    description: Date answer. Must be between 1970-01-01 and 2080-12-31.
  metadata:
    type: [object, "null"]
    additionalProperties: {}
    description: >-
      Arbitrary context for this record, stored as JSON: the dimensions you want to slice a
      dashboard by, such as channel, device, country, campaign, plan or tags. Values may be strings,
      numbers, booleans, `null`, or nested objects and arrays. Use stable keys — a key
      is what a dashboard groups by. Numbers keep full precision in storage. Metadata is **not**
      sent to the enrichment providers, but it **is** included in the `feedback_record.created` /
      `feedback_record.updated` webhook payloads.
