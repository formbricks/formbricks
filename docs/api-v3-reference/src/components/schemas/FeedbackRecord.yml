type: object
description: >-
  One piece of feedback in the normalized Feedback Record shape. Optional members are **absent**
  (not `null`) when unset.
additionalProperties: false
required:
  - id
  - datasetId
  - collectedAt
  - createdAt
  - updatedAt
  - sourceType
  - submissionId
  - fieldId
  - fieldType
properties:
  id:
    type: string
    format: uuid
    description: UUIDv7 primary key.
  datasetId:
    type: string
    format: cuid2
    description: >-
      The feedback dataset this record belongs to. List the datasets a workspace can reach with
      `GET /api/v3/feedback-datasets`.
  collectedAt:
    type: string
    format: date-time
    description: When the feedback was given.
  createdAt:
    type: string
    format: date-time
    description: When the record was stored. Diverges from `collectedAt` on a historical re-import.
  updatedAt:
    type: string
    format: date-time
    description: When the record was last changed.
  sourceType:
    type: string
    description: Type of feedback source, e.g. `survey`, `review`, `feedback_form`.
  sourceId:
    type: string
    description: Reference to the survey / form / ticket the record came from.
  sourceName:
    type: string
    description: Human-readable name of the source.
  submissionId:
    type: string
    description: >-
      Identifier of the logical submission this record belongs to (e.g. a response id). Records are
      unique per (`datasetId`, `submissionId`, `fieldId`).
  fieldId:
    type: string
    description: Identifier of the question / field.
  fieldLabel:
    type: string
    description: The question text.
  fieldGroupId:
    type: string
    description: Stable identifier grouping related fields (ranking, matrix and grid questions).
  fieldGroupLabel:
    type: string
    description: Human-readable question text for the group.
  fieldType:
    $ref: ./FeedbackRecordFieldType.yml
  language:
    type: string
    description: ISO language code the feedback was given in.
  userId:
    type: string
    description: End-user identifier (e.g. an anonymous id or an email hash).
  valueText:
    type: string
    description: Text answer.
  valueId:
    type: string
    description: >-
      Stable id of the selected option in the source system (e.g. a survey choice id), stored
      alongside `valueText` so choice answers keep their identity across label edits and languages.
      Opaque. Absent for free-text and non-choice answers.
  valueNumber:
    type: number
    format: double
    description: Numeric answer (ratings, NPS scores, numbers).
  valueBoolean:
    type: boolean
    description: Yes / no answer.
  valueDate:
    type: string
    format: date-time
    description: Date answer.
  metadata:
    type: [object, array, string, number, boolean, "null"]
    items: {}
    description: >-
      Arbitrary context stored with the record and returned with equivalent values (key order and
      number formatting are normalized). Omitted when the record has no metadata; a record
      explicitly stored with a JSON `null` returns `null`. An object is the supported shape and the
      only one the write operations accept; the wider union exists so records written before that
      convention still deserialize.
  sentiment:
    $ref: ./FeedbackRecordSentiment.yml
  sentimentScore:
    type: number
    format: double
    minimum: -1
    maximum: 1
    description: >-
      Signed sentiment polarity from `-1.0` (very negative) to `1.0` (very positive). Read-only;
      absent until the record is enriched.
  emotions:
    type: array
    minItems: 1
    items:
      $ref: ./FeedbackRecordEmotion.yml
    description: >-
      Emotions inferred from `valueText`; multi-label from a fixed set. Read-only, and **never an
      empty array** — the member is either absent or has at least one label. Absent covers two
      different states: not yet classified, and classified with no emotion detected. Do not read
      absence as "not enriched yet" — `filter[hasEmotions][eq]=false` selects both states.
  valueTextTranslated:
    type: string
    description: >-
      `valueText` translated into the dataset's configured target language. Read-only; absent until
      the record is enriched.
  translationLangKey:
    type: string
    maxLength: 35
    description: >-
      BCP-47 locale that `valueTextTranslated` was produced in. Read-only; absent until the record
      is enriched.
