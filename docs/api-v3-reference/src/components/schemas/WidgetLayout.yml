type: object
description: >-
  A widget's position and size on the dashboard's 12-column grid, in whole grid units: `1 ≤ w ≤ 12`,
  `x + w ≤ 12`, `1 ≤ h ≤ 32`, `0 ≤ y ≤ 4000`. Widgets may not overlap; gaps are allowed and close
  upward when the dashboard is drawn. A unit of `y` and `h` is 24px, a quarter of the 96px a row
  occupied in earlier releases, so a height of 4 is what 1 used to be.
required:
  - x
  - y
  - w
  - h
properties:
  x:
    type: integer
    minimum: 0
    maximum: 11
  y:
    type: integer
    minimum: 0
    maximum: 4000
  w:
    type: integer
    minimum: 1
    maximum: 12
  h:
    type: integer
    minimum: 1
    maximum: 32
additionalProperties: false
