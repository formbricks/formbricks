type: object
description: >-
  Send a `layout`, a `chartId`, `content`, a `pageId`, or several. Repointing a chart widget shows
  another chart in its place — the way to give one dashboard its own copy of a shared chart. `content`
  changes an image or text block: the fields sent replace the stored ones, the rest stay, so an image
  keeps its file when only its settings change. `pageId` moves the widget to another page of the
  dashboard, into the first open slot there unless a `layout` is sent too.
minProperties: 1
properties:
  layout:
    $ref: ./WidgetLayout.yml
  chartId:
    type: string
    format: cuid2
    description: A chart in the dashboard's workspace that is not already on the widget's page.
  content:
    description: >-
      Fields of the block's content (`DashboardImageContent` or `DashboardTextContent`) to replace; the
      fields left out keep their stored values. The merged content must be valid for the block's kind,
      so a field of the other kind, or any unknown field, answers 422.
    anyOf:
      - type: object
        title: Image content fields
        properties:
          fileUrl:
            oneOf:
              - type: string
                maxLength: 2048
              - type: "null"
          fit:
            type: string
            enum:
              - fit
              - fill
          position:
            type: string
            enum:
              - left
              - center
              - right
          alt:
            type: string
            maxLength: 300
        additionalProperties: false
      - type: object
        title: Text content fields
        properties:
          headline:
            type: string
            maxLength: 200
          description:
            type: string
            maxLength: 2000
        additionalProperties: false
  pageId:
    type: string
    format: cuid2
additionalProperties: false
