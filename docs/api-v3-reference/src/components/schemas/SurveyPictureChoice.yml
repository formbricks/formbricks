type: object
required:
  - id
  - imageUrl
properties:
  id:
    type: string
    description: Stable picture choice id.
  imageUrl:
    type: string
  imageAltText:
    allOf:
      - $ref: ./TranslatableText.yml
    description: Text alternative for `imageUrl`, read by screen readers. Omit or leave empty for a decorative image (rendered as `alt=""`).
additionalProperties: false
