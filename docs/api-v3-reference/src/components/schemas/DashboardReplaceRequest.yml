type: object
description: >-
  The whole edited dashboard: its name, every widget's place and, optionally, its filters and default
  date range. A widget left out of `widgets` is removed (its chart is kept); without `filters` or
  `defaultDateRange` the saved ones are kept.
  `expectedUpdatedAt` is the dashboard's `updatedAt` from your read; if it changed since, nothing is
  saved.
required:
  - name
  - expectedUpdatedAt
  - widgets
properties:
  name:
    type: string
    minLength: 1
    maxLength: 255
  expectedUpdatedAt:
    type: string
    format: date-time
    description: The dashboard's `updatedAt` from your read.
  filters:
    type: array
    maxItems: 10
    description: >-
      Every dashboard filter, in top-bar order, replacing the saved ones. At most 10; each `field` must
      be a catalog dimension and `operator` one it allows (422 naming the filter otherwise), and each
      `id` may appear once.
    items:
      $ref: ./DashboardFilter.yml
  defaultDateRange:
    type:
      - string
      - "null"
    enum:
      - today
      - yesterday
      - last 24 hours
      - last 7 days
      - last 14 days
      - last 30 days
      - last 60 days
      - last 90 days
      - last 180 days
      - last 4 weeks
      - last 8 weeks
      - last 12 weeks
      - this month
      - last month
      - this quarter
      - last quarter
      - last 6 months
      - last 12 months
      - this year
      - last year
      - null
    description: >-
      The rolling date preset the dashboard opens with (400 for anything else); `null` clears it, so each
      chart keeps its own range.
    example: last 30 days
  widgets:
    type: array
    maxItems: 1000
    items:
      type: object
      required:
        - widgetId
        - layout
        - order
      properties:
        widgetId:
          type: string
          format: cuid2
        layout:
          $ref: ./WidgetLayout.yml
        order:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Sort key; any non-negative integer, in the order widgets should list.
      additionalProperties: false
additionalProperties: false
