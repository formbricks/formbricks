type: object
description: >-
  The whole edited dashboard: its name, every widget's place and, optionally, its filters. A widget left
  out of `widgets` is removed (its chart is kept); without `filters` the saved ones are kept.
  `expectedUpdatedAt` is the dashboard's `updatedAt` from your read; if it changed since, nothing is
  saved.
required:
  - name
  - expectedUpdatedAt
  - widgets
properties:
  name:
    type: string
    minLength: 1
    maxLength: 255
  expectedUpdatedAt:
    type: string
    format: date-time
    description: The dashboard's `updatedAt` from your read.
  filters:
    type: array
    maxItems: 10
    description: >-
      Every dashboard filter, in top-bar order, replacing the saved ones. At most 10; each `field` must
      be a catalog dimension and `operator` one it allows (422 naming the filter otherwise), and each
      `id` may appear once.
    items:
      $ref: ./DashboardFilter.yml
  widgets:
    type: array
    maxItems: 1000
    items:
      type: object
      required:
        - widgetId
        - layout
        - order
      properties:
        widgetId:
          type: string
          format: cuid2
        layout:
          $ref: ./WidgetLayout.yml
        order:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Sort key; any non-negative integer, in the order widgets should list.
      additionalProperties: false
additionalProperties: false
