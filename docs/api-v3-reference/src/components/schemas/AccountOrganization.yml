type: object
required:
  - id
  - name
  - role
  - canManage
  - canCreateWorkspace
  - pendingInviteCount
  - workspaceCount
  - workspacesTruncated
  - workspaces
properties:
  id:
    type: string
  name:
    type: string
  role:
    type:
      - string
      - "null"
    enum:
      - owner
      - manager
      - member
      - billing
      - null
    description: The caller's organization role. `null` for an API key, which has grants but no role.
  canManage:
    type: boolean
    description: The caller is an owner or manager of this organization.
  canCreateWorkspace:
    type: boolean
    description: The caller is an owner or manager and the plan's workspace limit is not yet reached.
  pendingInviteCount:
    type:
      - integer
      - "null"
    minimum: 0
    description: Pending invites. Only counted for an owner or manager, `null` otherwise.
  workspaceCount:
    type: integer
    minimum: 0
    description: >-
      How many workspaces the caller can reach in this organization. The real count, counted separately from
      the list, so it stays correct when `workspaces` is cut short.
  workspacesTruncated:
    type: boolean
    description: >-
      `true` when `workspaces` holds fewer entries than `workspaceCount` because the list is capped per
      organization. Only a pathologically large organization is ever cut.
  workspaces:
    type: array
    items:
      $ref: AccountWorkspace.yml
