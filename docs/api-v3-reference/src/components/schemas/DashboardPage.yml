type: object
description: >-
  A dashboard page: one tab of the dashboard. Every dashboard has at least one. `teamIds` limits which
  teams' Dashboard Viewers see the page; empty means every team that can open the dashboard. The limit
  binds Dashboard Viewers only: Owners, Managers, Members and API keys see every page.
required:
  - id
  - name
  - order
  - teamIds
properties:
  id:
    type: string
    format: cuid2
  name:
    type: string
    maxLength: 100
  order:
    type: integer
    minimum: 0
    description: Sort key of the tab, ascending.
  teamIds:
    type: array
    items:
      type: string
      format: cuid2
additionalProperties: false
