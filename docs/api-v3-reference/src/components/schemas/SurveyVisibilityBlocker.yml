type: object
description: >-
  An outbound connection that must be removed before the survey can become restricted. A `creative` is a
  non-archived creative whose Destination is this survey: relink it, switch it to a link, archive it or
  delete it.


  New `type` values may appear as Formbricks gains connection types (`creative` was added in 6.2). Treat a
  value you don't recognise as a generic connection: list it by `name`.
required:
  - type
  - id
  - name
properties:
  type:
    type: string
    enum:
      - webhook
      - integration
      - feedbackSource
      - dashboard
      - workflow
      - creative
  id:
    type: string
  name:
    type: string
    description: Display name of the connection, for the UI to list. Never empty; falls back to the type.
additionalProperties: false
