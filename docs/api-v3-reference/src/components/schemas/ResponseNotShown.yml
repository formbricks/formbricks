type: object
additionalProperties: false
description: >
  What the respondent was **not shown**: the parts of the survey a show-if, a hidden option or a
  question left with no options kept from them, by stable ids. The survey records it while the
  respondent answers, so it says what was decided at answer time; editing a show-if later never
  changes it. Anything not listed was shown, or never reached.


  An answer to an item that ended up hidden (after the respondent went back or changed an earlier
  answer) is removed from the response, so a listed element has no answer in `answers[]`. Read the
  base of a question as "everyone who reached it, minus those it lists".
properties:
  blocks:
    type: array
    items:
      type: string
    description: >-
      Blocks the survey passed over: their show-if failed, or every question on them was
      hidden. Every question of a listed block was not shown.
  elements:
    type: array
    items:
      type: string
    description: Questions hidden by their show-if, or skipped because none of their options were left.
  options:
    type: object
    additionalProperties:
      type: array
      items:
        type: string
    description: Question id → the ids of its options that were not shown.
  rows:
    type: object
    additionalProperties:
      type: array
      items:
        type: string
    description: Matrix question id → the ids of its rows that were not shown.
  columns:
    type: object
    additionalProperties:
      type: array
      items:
        type: string
    description: Matrix question id → the ids of its columns that were not shown.
example:
  blocks:
    - k2v8m1q0y3d7h5s9t4n6p0ra
  elements:
    - apple_reason
