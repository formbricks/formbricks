type: object
description: A dashboard as a list shows it — its widgets counted, not loaded.
required:
  - id
  - workspaceId
  - name
  - creator
  - widgetCount
  - createdAt
  - updatedAt
properties:
  id:
    type: string
    format: cuid2
  workspaceId:
    type: string
    format: cuid2
  name:
    type: string
  creator:
    $ref: ./DashboardCreator.yml
  widgetCount:
    type: integer
    minimum: 0
  createdAt:
    type: string
    format: date-time
  updatedAt:
    type: string
    format: date-time
    description: >-
      Changes on every rename, save and widget change. Send it back on a full update
      (`PUT /api/v3/dashboards/{dashboardId}`) to be told if the dashboard changed in between.
additionalProperties: false
