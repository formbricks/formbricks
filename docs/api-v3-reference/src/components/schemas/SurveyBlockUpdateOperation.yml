type: object
additionalProperties: false
description: Replace one existing block, addressed by id.
required:
  - op
  - id
  - block
properties:
  op:
    type: string
    enum:
      - update
  id:
    type: string
    maxLength: 128
    description: Block to replace.
  block:
    allOf:
      - $ref: CreateSurveyBlock.yml
    description: >
      Replaces the target block entirely — the same whole-subtree rule PATCH uses. `block.id` is
      optional and taken from `id` when omitted; if present it must equal `id`.
