type: object
additionalProperties: false
description: >-
  RFC 9457 problem details (`application/problem+json`) as produced by the feedback store behind
  the API gateway. Branch on the stable `code` member rather than on `title` or `type`. Note the
  member names differ from the rest of v3 (`request_id`, not `requestId`) — the payload is passed
  through unchanged.
required:
  - title
  - status
  - code
  - request_id
properties:
  type:
    type: string
    format: uri
    description: A URI reference identifying the problem type.
  title:
    type: string
    description: Short, human-readable summary of the problem type; stable across occurrences.
  status:
    type: integer
    description: HTTP status code.
  code:
    type: string
    description: >-
      Stable, machine-readable error code. `service_unavailable` means a feature or dependency is
      temporarily unavailable and the request may be retried later; `tenant_write_conflict` means
      the write collided with an in-progress dataset purge and may be retried unchanged. Every
      other code is terminal until the request itself changes.
    enum:
      - validation
      - bad_request
      - unauthorized
      - forbidden
      - not_found
      - conflict
      - tenant_write_conflict
      - method_not_allowed
      - content_too_large
      - service_unavailable
      - internal_server_error
  detail:
    type: string
    description: Human-readable explanation specific to this occurrence.
  instance:
    type: string
    description: >-
      URI reference identifying this occurrence — the request path **as the feedback store saw it**
      (`/v1/feedback-records/...`), not the `/api/v3/feedbackRecords/...` path you called.
  request_id:
    type: string
    description: Identifier for this request, also returned in the `X-Request-ID` response header; include it when reporting a problem.
  details:
    type: object
    additionalProperties: true
    description: Optional structured context, e.g. `resource_type` on a not-found problem.
  invalid_params:
    type: array
    maxItems: 100
    items:
      $ref: ./HubInvalidParam.yml
    description: Field-level validation failures. Present on `validation` problems.
