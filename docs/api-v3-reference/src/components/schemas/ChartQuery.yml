type: object
description: >-
  What a chart computes, in Cube's query format (ADR 0001): measures, dimensions, time dimensions,
  filters, order and limit over its Feedback Dataset's fields. Every field must come from the field
  catalog (`GET /api/v3/charts/fields`), named with its data-source prefix. Display settings are
  separate (`config`).


  Refused with **422** (`invalid_params` names each problem): a field that is not in the catalog;
  Cube options the app does not use (`ungrouped`, `segments`, `renewQuery`, `joinHints`, `total`,
  `compareDateRange`); a `timezone` (every range is read in the organization's display time zone);
  more than 15 fields across `measures`, `dimensions` and `timeDimensions`; more than 25 filter
  conditions or groups nested deeper than 3; a date range that is not a preset, `all-time` or two
  ISO calendar dates.
properties:
  measures:
    type: array
    maxItems: 10
    items:
      type: string
      description: A field of kind `measure`.
    example:
      - FeedbackRecords.npsScore
  dimensions:
    type: array
    maxItems: 5
    items:
      type: string
      description: A field of kind `dimension` or `timeDimension`.
    example:
      - FeedbackRecords.sourceName
  timeDimensions:
    type: array
    maxItems: 2
    items:
      type: object
      required:
        - dimension
      properties:
        dimension:
          type: string
          description: A field of kind `timeDimension`.
          example: FeedbackRecords.collectedAt
        granularity:
          type: string
          enum:
            - hour
            - day
            - week
            - month
            - quarter
            - year
        dateRange:
          $ref: ./ChartDateRange.yml
      additionalProperties: false
  filters:
    type: array
    maxItems: 25
    items:
      $ref: ./ChartQueryFilter.yml
  order:
    description: >-
      Sort order: `[field, direction]` pairs, or an object mapping a field to its direction. At
      most 10 entries.
    oneOf:
      - type: array
        maxItems: 10
        items:
          type: array
          minItems: 2
          maxItems: 2
          prefixItems:
            - type: string
            - type: string
              enum:
                - asc
                - desc
      - type: object
        maxProperties: 10
        additionalProperties:
          type: string
          enum:
            - asc
            - desc
  limit:
    type: integer
    minimum: 1
    maximum: 5000
  offset:
    type: integer
    minimum: 0
    maximum: 10000
additionalProperties: false
