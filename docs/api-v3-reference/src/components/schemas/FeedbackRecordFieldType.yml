type: string
description: >-
  The type of a feedback field, which determines which `value*` member carries the answer:
  `text` → `valueText` (the only enrichable type), `categorical` → `valueText` + `valueId`,
  `nps` / `csat` / `ces` / `rating` / `number` → `valueNumber`, `boolean` → `valueBoolean`,
  `date` → `valueDate`.
enum:
  - text
  - categorical
  - nps
  - csat
  - ces
  - rating
  - number
  - boolean
  - date
