type: object
description: >
  A tag applied to a response, as a lightweight reference. Deliberately **not** the full
  `TagResource`: that shape carries a `count` of how many responses hold the tag, which would mean an
  extra aggregate per tag on every row of every page. Read tags in full — with counts and timestamps
  — from `GET /api/v3/tags`.
required:
  - id
  - name
properties:
  id:
    type: string
    format: cuid2
  name:
    type: string
    description: Tag label as shown in the app.
additionalProperties: false
