type: object
description: >
  Block accepted by `POST /api/v3/surveys`. `id` may be omitted and will be
  generated by the

  server. Provide an explicit cuid2 id when logic in the same request needs to
  jump to this block.

  For normal sequential flow, omit `logic` and `logicFallback`. `logicFallback`
  is only valid

  when this same block has at least one `logic` rule.
required:
  - name
  - elements
properties:
  id:
    type: string
    format: cuid2
    description: Optional stable block id. Generated when omitted.
  name:
    type: string
    minLength: 1
  elements:
    type: array
    minItems: 1
    items:
      $ref: ./SurveyElement.yml
  logic:
    type: array
    items:
      $ref: ./SurveyBlockLogic.yml
  logicFallback:
    type: string
    format: cuid2
    description: >
      Block or ending id used when no logic condition matches. Only valid when
      this same block

      has at least one `logic` rule; omit it for normal sequential flow.
  showIf:
    allOf:
      - $ref: ./SurveyConditionGroup.yml
    description: >-
      Show-if: the block is shown only when this condition group matches. A block whose show-if
      fails is skipped, and its `logic` still runs as if the block were submitted with no answers.
      A block whose elements are all hidden by their show-if is skipped the same way. Conditions use
      the same operands and operators as `logic`. Reference rule: a block's show-if may use answers
      from earlier blocks only (plus hidden fields, variables and reserved fields); a violation fails
      with `misordered_reference` at the exact condition path. Omit it, or send an empty group, for
      a block that is always shown.
  buttonLabel:
    $ref: ./TranslatableText.yml
  backButtonLabel:
    $ref: ./TranslatableText.yml
additionalProperties: false
