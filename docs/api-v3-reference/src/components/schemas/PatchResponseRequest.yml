type: object
description: >
  Partially updates a response. Strict at the top level: unknown keys return **400** rather than
  being ignored, and at least one patchable field must be present.


  `data` is **replaced wholesale**, not deep-merged — send the complete answer map you want stored.
  `embeddedData` is the exception and merges by name: it addresses individual fields, so a field the
  payload omits keeps its value rather than being cleared.


  v3 replaces on purpose, where v1 and v2 merge: a merge makes it impossible to delete an answer,
  which a correction flow needs.


  **Every patch runs the response pipeline**, emitting `responseUpdated` — so webhooks, integrations
  and follow-ups fire for a correction as much as for a substantive edit. A patch that *transitions*
  the response to finished additionally emits `responseFinished`; one that patches an
  already-finished response does not re-emit it.


  Not patchable, and rejected if sent: `createdAt`, `updatedAt`, `surveyId`, `contactId`,
  `displayId`, `singleUseId`, `contactAttributes`, and the create-only `ttc` and `meta` — timing and
  submission context describe the original submission event, so they are set once and not revised. `contactId` is create-only deliberately —
  re-attributing an existing response to a different person is a capability only v2 offers, and it is
  not carried forward.
minProperties: 1
properties:
  finished:
    type: boolean
  endingId:
    type:
      - string
      - "null"
  language:
    type:
      - string
      - "null"
  data:
    $ref: ./ResponseDataMapInput.yml
  embeddedData:
    $ref: ./ResponseEmbeddedDataInput.yml
  tags:
    type: array
    maxItems: 100
    description: >-
      Complete set of tag ids for this response, replacing whatever is currently applied. Repeats are
      allowed and collapse, because the set is applied as a set. Tags must
      already exist in the same workspace — create them via `POST /api/v3/tags`.
    items:
      type: string
      format: cuid2
additionalProperties: false
