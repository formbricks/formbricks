type: object
description: >-
  Pre-selects an answer in a later question when the rule fires: the question's page opens with it
  already given, and the respondent can change it. The response stores only what the page submits, so a
  question on a page the respondent never sees (jumped over, or not shown) stores nothing. A question
  that already has an answer (the respondent came back, or a URL prefill gave it) keeps it. `target`
  is a `multipleChoiceSingle`, `multipleChoiceMulti` or `openText` element in a later block (any block
  when used in `startLogic`). For a select question, `value` is `{ type: choices, choiceIds }`: option
  ids, never labels, so one action works in every survey language; exactly one for a single select,
  not the `other` option, and `none` only on its own. For a free text question, `value` is `{ type: static, value }`, a number
  written as text when the question takes a number. It never writes Embedded Data; use `calculate` for
  that. A value that does not fit the question is rejected with a 422 naming the action's `value`.
required:
  - id
  - objective
  - target
  - value
properties:
  id:
    type: string
    format: cuid2
  objective:
    type: string
    enum:
      - preselectAnswer
  target:
    type: string
    minLength: 1
    description: Target element id.
  value:
    oneOf:
      - type: object
        description: Options of a single or multi select question, by id.
        required:
          - type
          - choiceIds
        properties:
          type:
            type: string
            enum:
              - choices
          choiceIds:
            type: array
            minItems: 1
            maxItems: 200
            items:
              type: string
              minLength: 1
              maxLength: 200
        additionalProperties: false
      - type: object
        description: The answer of a free text question.
        required:
          - type
          - value
        properties:
          type:
            type: string
            enum:
              - static
          value:
            type: string
            minLength: 1
            maxLength: 5000
        additionalProperties: false
additionalProperties: false
example:
  id: clact123456789012345678901
  objective: preselectAnswer
  target: inquiry_status
  value:
    type: choices
    choiceIds:
      - open_pending
