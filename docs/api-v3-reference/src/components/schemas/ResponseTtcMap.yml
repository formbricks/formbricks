type: object
description: >
  Per-element time-to-complete, keyed by element id, in **milliseconds**. Accepted on create so that
  a caller replaying a real submission can carry its timing; reads report the same information as
  `durationSeconds` in seconds, on each answer and summed at the top level.


  This is client-reported telemetry, not a measurement the server can vouch for, so each value is
  clamped into `[0, 86400000]` (24 hours per element) rather than rejected — a noisy timing value
  should never cost you the response. Any finite number is therefore accepted, which is why no
  bounds are declared here.


  **Do not send a `_total` key.** The server writes that bucket itself when the response is finished,
  by summing every value in this map — including a `_total` you supplied, which is then counted twice
  and permanently skews the stored total. `durationSeconds` on the read is computed from the real
  element entries and ignores the bucket entirely, so there is nothing to gain by sending one.
additionalProperties:
  type: number
