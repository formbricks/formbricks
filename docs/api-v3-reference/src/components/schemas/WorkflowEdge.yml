type: object
required:
  - id
  - source
  - target
properties:
  id:
    type: string
    minLength: 1
  source:
    type: string
    minLength: 1
    description: Node id the edge starts from.
  target:
    type: string
    minLength: 1
    description: Node id the edge points to.
  sourceHandle:
    type: string
    minLength: 1
    description: >-
      Builder handle identifier on the source node. `then` and `else` mark the
      two branches of an `if_else` node and are refused on any other node.
  targetHandle:
    type: string
    minLength: 1
    description: Builder handle identifier on the target node.
additionalProperties: false
