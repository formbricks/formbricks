type: object
required:
  - id
  - source
  - target
properties:
  id:
    type: string
    minLength: 1
  source:
    type: string
    minLength: 1
    description: Node id the edge starts from.
  target:
    type: string
    minLength: 1
    description: Node id the edge points to.
  sourceHandle:
    type: string
    minLength: 1
    description: >-
      Builder handle identifier on the source node. `then` and `else` mark the
      two branches of an `if_else` node; an edge leaving a `switch` node uses one of its case
      ids, or `default` for its Default branch. No other node uses `then` or `else`.
  targetHandle:
    type: string
    minLength: 1
    description: Builder handle identifier on the target node.
additionalProperties: false
