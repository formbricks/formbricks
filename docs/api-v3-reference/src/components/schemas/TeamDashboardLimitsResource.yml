type: object
description: >-
  A team's dashboard limits: the dashboards its members whose organization role is Dashboard Viewer
  open in the workspaces the team is granted. Empty means all of them. Other members are never limited.
required:
  - teamId
  - dashboardIds
properties:
  teamId:
    type: string
    format: cuid2
  dashboardIds:
    type: array
    maxItems: 200
    items:
      type: string
      format: cuid2
  dashboards:
    type: array
    description: >-
      Only on a read: the dashboards the limit can name, those of the workspaces the team is granted.
    maxItems: 1000
    items:
      type: object
      required:
        - id
        - name
        - workspaceId
        - workspaceName
      properties:
        id:
          type: string
          format: cuid2
        name:
          type: string
        workspaceId:
          type: string
          format: cuid2
        workspaceName:
          type: string
      additionalProperties: false
additionalProperties: false
