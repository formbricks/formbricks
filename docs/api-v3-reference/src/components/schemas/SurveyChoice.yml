type: object
required:
  - id
  - label
properties:
  id:
    type: string
    description: Stable choice id.
  label:
    $ref: ./TranslatableText.yml
  code:
    $ref: ./SurveyAnswerCode.yml
  showIf:
    allOf:
      - $ref: ./SurveyConditionGroup.yml
    description: >-
      Option show-if: the option (or matrix row or column) is offered only when this condition group
      matches, re-evaluated live as earlier answers change. It may use what its element's show-if may
      use: answers from earlier blocks and from elements above its element in the same block, never
      its own element or anything below (`misordered_reference` at the exact condition path). A
      question left with no option to offer is skipped and recorded as not shown. Omit it, or send an
      empty group, for an option that is always offered. Allowed on published surveys.
  hidden:
    type: boolean
    description: >-
      Hidden: the option is never offered, whatever its `showIf` says, and is recorded as not shown.
      Use it to retire an option on a published survey instead of deleting it (deleting an option that
      existed at launch is refused): it keeps its id, answer code and earlier answers, and stays in
      results labelled Hidden.
additionalProperties: false
