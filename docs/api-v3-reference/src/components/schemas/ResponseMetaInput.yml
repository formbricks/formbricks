type: object
description: >
  Submission context, on the narrow subset a caller can legitimately supply. A management-API create
  has no browser behind it, so unlike a client-side submission there is nothing for the server to
  auto-capture — if these are not sent they are simply absent, which is why the API accepts them at
  all rather than treating all context as server-derived.


  Deliberately **not** accepted here, because the routes derive them from the request itself and a
  caller-supplied value would be fiction: `country`, `userAgent` (the browser/OS/device breakdown is
  nested under it, there is no top-level `device` key) and `ipAddress`. `ipAddress` is additionally
  never projected by v3 on read, in any view.


  The stored `meta` is wider than this input. It also carries a block of browser-runtime context —
  `pagePath`, `pageReferrer`, the five `utm*` keys, the four screen/viewport dimensions, `timezone`
  and `locale` — which the SDK captures and which this endpoint does **not** currently accept, so
  sending one is a 400. That is a gap rather than a decision: an integration replaying a real
  submission can legitimately carry `utmSource` or `pagePath`, and those are live catalog entries
  that read back in `embeddedData[]`. Whether v3 create accepts them is open on the write ticket.


  Reads surface what is stored as `reserved` entries in `embeddedData[]`.
properties:
  source:
    type: string
    maxLength: 512
    description: >-
      Where the submission came from — the integration or channel name. The field most worth setting
      on an API create, since nothing else can distinguish an imported or integration-created
      response from an organic one.
  url:
    type: string
    maxLength: 2048
    description: The page or context the response was collected from.
  action:
    type: string
    maxLength: 512
    description: The action or trigger that produced the submission, when one applies.
additionalProperties: false
