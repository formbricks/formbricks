type: object
description: >-
  Up to 100 values a list dashboard filter offers, in order: the values the dashboard's charts let
  through under their saved filters and date ranges, narrowed by the dashboard date range and the
  other filters' picks.
required:
  - values
  - hasMore
properties:
  values:
    type: array
    maxItems: 100
    items:
      type: object
      required:
        - value
      properties:
        value:
          type: string
          description: The value as stored, which a pick names.
        label:
          type: string
          description: >-
            What the value is shown by, when it is an id a survey names: an answer option's label
            (`FeedbackRecords.valueId`), a survey's name (`FeedbackRecords.sourceId`), an ending's
            headline (`FeedbackRecords.metadataEndingId`). Absent for every other value.
      additionalProperties: false
  hasMore:
    type: boolean
    description: More values match than are listed; narrow them with `search`.
additionalProperties: false
