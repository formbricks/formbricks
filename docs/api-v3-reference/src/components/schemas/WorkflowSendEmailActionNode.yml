type: object
description: >-
  Send-email action node. Renders 1:1 with survey Follow-ups: recall-token body,
  question/hidden-field `to` resolution, and the branded Follow-ups email template.
required:
  - id
  - type
  - actionType
  - config
properties:
  id:
    type: string
    minLength: 1
    maxLength: 64
    pattern: "^[A-Za-z0-9_-]+$"
    description: >-
      Step id, unique in the definition: letters, digits, `_` and `-`, at most 64
      characters. It can't be `trigger`, start with `trigger_`, or be `__proto__`,
      `prototype` or `constructor`. Checked on writes and enable; a definition
      stored before the rule still loads and runs.
  type:
    type: string
    enum:
      - action
  actionType:
    type: string
    enum:
      - send_email
  label:
    type: string
    minLength: 1
    maxLength: 120
    description: Optional display label shown in the builder.
  config:
    $ref: ./WorkflowSendEmailActionConfig.yml
  ui:
    $ref: ./WorkflowNodeUi.yml
additionalProperties: false
