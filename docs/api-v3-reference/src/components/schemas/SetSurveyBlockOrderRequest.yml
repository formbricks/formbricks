type: object
additionalProperties: false
required:
  - order
properties:
  order:
    type: array
    minItems: 1
    maxItems: 1000
    items:
      type: string
      maxLength: 128
      minLength: 1
    description: >
      Every current block id, exactly once, in the desired order. Ids are trimmed before use, so an
      id that is empty or whitespace-only is a **400**, as is a list of more than 1000 ids. A missing,
      unknown or repeated id is a **422** — repeats are reported as `duplicate_identifier` rather
      than rejected by the schema, so the response names the offending entry, and a dropped block
      cannot pass unnoticed, which is what makes this safer than resending the blocks.
  expectedUpdatedAt:
    type: string
    format: date-time
    description: >
      Optimistic-concurrency precondition: the survey's `updatedAt` from your last read. If the
      survey changed since, the write is rejected with **409**.
