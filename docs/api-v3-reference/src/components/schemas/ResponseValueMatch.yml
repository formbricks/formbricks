type: string
enum:
  - exact
  - label
  - other
  - unmatched
description: >
  How a stored raw value was resolved against the current survey definition.
  Precedence is fixed and applied in this order:


  - `exact` — the stored value matched an option **id** in the current definition.

  - `label` — the stored value matched an option's **label text** (ids are stable, labels are
    editable and language-dependent, so a label match is weaker evidence).

  - `other` — no option resolves **and** the element offers an Other free-text input. Read it as
    "this element accepts write-ins and this is not one of its current options", not as proof the
    respondent typed it: nothing in storage marks a write-in, so a genuine one and an option renamed
    since collection are byte-identical. Every surface that reads these values concludes the same
    thing from the same bytes — the survey renderer decides it by this exact elimination — so the
    alternative is not more certainty, only a different guess.

  - `unmatched` — no option resolves and the element has **no** Other input, which makes a write-in
    impossible: the value is a renamed or deleted option. Returned verbatim rather than dropped.
