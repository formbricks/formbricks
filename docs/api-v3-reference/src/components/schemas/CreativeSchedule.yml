type: object
description: >-
  When a published creative shows, to the minute. Before `startAt` it is `scheduled`; from `endAt` on
  it is `closed`. `null` leaves that side open. `endAt` must be after `startAt`, or the write answers
  **422**.
required:
  - startAt
  - endAt
properties:
  startAt:
    type:
      - string
      - "null"
    format: date-time
  endAt:
    type:
      - string
      - "null"
    format: date-time
additionalProperties: false
example:
  startAt: "2026-11-01T02:00:00.000Z"
  endAt: "2026-11-01T04:00:00.000Z"
