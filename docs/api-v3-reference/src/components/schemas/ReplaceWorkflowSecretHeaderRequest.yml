type: object
description: The new value of a secret header. Stored encrypted and never returned.
required:
  - value
properties:
  value:
    type: string
    minLength: 1
    maxLength: 8192
    pattern: "^[^\\r\\n\\u2028\\u2029]*$"
    description: >-
      Sent exactly as written: a secret value can't insert Variables. At most 8 KB, no line breaks.
    example: Bearer sk_live_new
additionalProperties: false
