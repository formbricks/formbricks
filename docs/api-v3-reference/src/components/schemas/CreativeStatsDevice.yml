type: object
description: One device type's counts over the range.
required:
  - deviceType
  - impressions
  - clicks
  - clickRate
properties:
  deviceType:
    type: string
    enum:
      - phone
      - tablet
      - desktop
    description: The device type the SDK detected, as in the Show when `deviceType` condition.
  impressions:
    type: integer
    minimum: 0
  clicks:
    type: integer
    minimum: 0
  clickRate:
    type:
      - number
      - "null"
    minimum: 0
additionalProperties: false
