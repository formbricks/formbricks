type: object
description: >
  One of a workflow's samples. `source` is `trigger` for the Webhook trigger's
  Sample payload, or an HTTP request step's id for that step's last Test
  request response.
required:
  - source
  - sample
  - updatedAt
properties:
  source:
    type: string
    minLength: 1
    example: trigger
  sample:
    type: object
    additionalProperties: true
    description: >-
      The sample. For `trigger`, the Sample payload. For a step, its last Test
      request response: `status`, `contentType`, `body` (parsed JSON when it fits
      in 64 KB, else up to 64 KB of text) and `bodyTruncated`.
  updatedAt:
    type: string
    format: date-time
additionalProperties: false
