type: object
additionalProperties: false
required:
  - data
  - limit
properties:
  data:
    type: array
    maxItems: 100
    items:
      $ref: ./FeedbackRecordSimilarityItem.yml
    description: Matches ordered by descending `score`.
  limit:
    type: integer
    description: The page size that was applied.
  next_cursor:
    type: string
    description: >-
      Opaque keyset cursor for the next page. Present only when a full page was returned and there
      may be more results. Pass it back unchanged as `cursor`.
