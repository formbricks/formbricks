type: object
description: >-
  Reference to a workflow Variable, mirroring `ZWorkflowDataRef`. The path is a dot path whose
  first segment says where the value comes from: `payload.<path>` (Webhook trigger payload),
  `steps.<stepId>.<path>` (an earlier step's output) or `response.<questionId>` (a Response
  completed run's answer). Any other prefix is refused with **400**, as are the segments
  `__proto__`, `prototype` and `constructor`. Segments may contain letters, digits, `_` and `-`.
  Payload and step-output paths that go into or end at a list resolve as missing.
required:
  - path
properties:
  path:
    type: string
    minLength: 1
    maxLength: 512
    pattern: '^(payload|steps|response)(\.[A-Za-z0-9_-]+)+$'
    examples:
      - response.nps
      - steps.check-plan.branch
  fallback:
    type: string
    maxLength: 1000
    description: Used when the run has no value at the path.
additionalProperties: false
