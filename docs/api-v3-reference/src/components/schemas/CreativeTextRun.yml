type: object
description: >
  One stretch of banner text with the same formatting. Banner text is stored and delivered as runs,
  never as HTML, so it can't carry markup, scripts or images.


  `href` makes the run a link. Allowed: `https://` and `http://` URLs with a real host (the same rule
  as a link Destination's `url`, so `https://example.` is refused), `mailto:` and `tel:` links, and
  root-relative paths (`/open-enrollment`), which resolve on whichever site shows the banner.
required:
  - text
properties:
  text:
    type: string
    minLength: 1
    maxLength: 2000
  bold:
    type: boolean
  italic:
    type: boolean
  underline:
    type: boolean
  href:
    type: string
    maxLength: 2048
    pattern: '^(?:https?://(?:[^\s/?#@]+@)?(?:localhost|\d{1,3}(?:\.\d{1,3}){3}|\[[0-9A-Fa-f:.]+\]|(?:[^\s/\\?#@:.\[\]]+\.)+[^\s/\\?#@:.\[\]\d][^\s/\\?#@:.\[\]]+)(?::\d{1,5})?(?:[/?#]\S*)?|(?:mailto:|tel:|/(?!/))\S*)$'
additionalProperties: false
