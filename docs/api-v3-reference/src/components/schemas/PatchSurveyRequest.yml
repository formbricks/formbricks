type: object
minProperties: 1
description: >
  Patch payload shape. Top-level fields are partial; any provided nested object
  or array

  fully replaces that subtree. Omitted top-level fields are preserved.


  The server-owned fields `GET` returns — `id`, `workspaceId`, `type`, `createdAt`, `updatedAt`,
  `archivedAt`, `defaultLanguage` and `languages[].alias` — are accepted and verified, so a survey
  fetched with `GET` can be sent straight back. Echoing the value you were given is a no-op; changing
  one is a **422** `read_only_field`. A round-tripped `updatedAt` additionally acts as an
  optimistic-concurrency precondition, and a stale one is rejected with **409**. `questions`,
  analytics, styling and scripts remain rejected outright. App surveys (stored `type: app`) additionally accept `distribution` and
  `targeting`; both are rejected for link surveys, and changing `targeting` filters requires the
  Contacts entitlement.


  `metadata`, `languages`, `welcomeCard`, `blocks`, `endings`, `hiddenFields`,
  and `variables`

  replace their full top-level value when provided. Missing ids in replaced
  arrays are deletions.

  Non-default locale keys in translatable maps must be declared in `languages`;
  undeclared locale

  keys are rejected with `unsupported_locale`. To remove a language, remove it
  from both

  `languages` and every translatable map that contains that locale key.

  Use `/api/v3/surveys/validate` with `operation: patch` before committing
  automated or agentic

  changes.
properties:
  id:
    type: string
    description: Read-only echo. Must match the survey being patched.
  workspaceId:
    type: string
    description: Read-only echo. A survey cannot be moved between workspaces.
  type:
    type: string
    # link | app only — matches ZSurveyType. SurveyResource still lists `website`, which the runtime
    # does not accept; not copied here.
    enum:
      - link
      - app
    description: Read-only echo. Immutable after creation.
  createdAt:
    type: string
    format: date-time
    description: Read-only echo of the creation timestamp.
  updatedAt:
    type: string
    format: date-time
    description: >-
      Read-only echo, and an optimistic-concurrency precondition: the write is applied only if the
      survey has not changed since the read this value came from, and is otherwise a **409**.
  archivedAt:
    type:
      - string
      - "null"
    format: date-time
    description: Read-only echo. Use `/archive` and `/restore` to change it.
  defaultLanguage:
    type: string
    description: >-
      Read-only echo of the survey default language, in whatever shape `GET` returned — legacy
      surveys carry language-only codes, so this is not constrained to `LocaleCode`.
  name:
    type: string
    minLength: 1
  status:
    type: string
    enum:
      - draft
      - inProgress
      - paused
      - completed
  metadata:
    allOf:
      - $ref: ./SurveyMetadata.yml
  languages:
    type: array
    items:
      $ref: ./PatchSurveyLanguage.yml
    description: >
      Replaces the survey language configuration. The default language cannot be
      changed through

      PATCH; any `default: true` entry must match the existing default language.
      Languages referenced

      by `metadata`, `welcomeCard`, `blocks`, or `endings` translatable maps
      must be explicitly

      declared here, so remove the locale key from those maps as well when
      intentionally removing

      a language.
  welcomeCard:
    $ref: ./SurveyWelcomeCard.yml
  blocks:
    type: array
    minItems: 1
    items:
      $ref: ./SurveyBlock.yml
  endings:
    type: array
    items:
      $ref: ./SurveyEnding.yml
  hiddenFields:
    $ref: ./SurveyHiddenFields.yml
  variables:
    type: array
    items:
      $ref: ./SurveyVariable.yml
  distribution:
    allOf:
      - $ref: ./SurveyDistribution.yml
    description: >
      App-survey runtime/display settings. Only valid for stored `type: app`. Replaces the full
      distribution; omitted scalars reset to their defaults.
  targeting:
    allOf:
      - $ref: ./SurveyTargeting.yml
    description: App-survey contact targeting. Only valid for stored app surveys.
additionalProperties: false
