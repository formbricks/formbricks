type: object
# Deliberately NOT composed from `ListPaginationMeta`, alone among the v3 list metas. That base
# requires `limit`, and this operation takes no `limit` query parameter — there is nothing to echo.
# Composing it would mean inventing a page size for a collection that is never paged, which is a
# worse lie than the small duplication of one `nextCursor` block.
additionalProperties: false
required:
  - nextCursor
  - totalCount
properties:
  nextCursor:
    type:
      - string
      - "null"
    description: >-
      Always `null`. Datasets are not paginated — a workspace holds few enough that the set is
      returned whole — but the member is present so the envelope matches every other v3 list.
  totalCount:
    type: integer
    minimum: 0
    description: Number of datasets returned.
