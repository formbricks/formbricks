allOf:
  - $ref: ./ResponseDataMap.yml
  - type: object
    description: >
      The same map on the way in, with the cardinality bounds a v3 write enforces.


      At most 2,000 keys, and at most 1000 entries in a multi-select array or matrix object. A
      response holds one entry per element or hidden field, and a survey may have 1,000 blocks and 200
      hidden fields, so 2,000 keys covers a survey at that limit with one element per block; a
      multi-select answer holds one entry per choice. The bounds exist because every later reader pays
      per entry: the serializer's per-answer mapping, export columns, and the positional probe the
      "Other" response filter emits. Exceeding either is a **400** from the request schema, not a 422.


      Deliberately separate from `ResponseDataMap`, which the read returns. The v1 and v2 client
      writes and the v1 management write apply these bounds to each request, plus a total of 10,000
      entries in each request's `data` map, but a response built over several updates can still
      exceed them, the v2 management write does not apply them, and older responses predate them. A
      stored response may therefore exceed them, and the read schema must not claim otherwise.
    maxProperties: 2000
    # Deliberately says nothing about which value shapes are allowed — `ResponseDataMap` above owns
    # that, and restating its `oneOf` here would mean the write contract silently narrowed (or stopped
    # bounding) whenever the read union gained a shape. This branch only bounds the two shapes that
    # have a cardinality to bound, and is inert for every other one.
    additionalProperties:
      if:
        type: array
      then:
        maxItems: 1000
      else:
        if:
          type: object
        then:
          maxProperties: 1000
