type: object
description: >-
  If/else logic step: a run continues down the edge whose `sourceHandle` is `then` when the
  condition group holds, and down the `else` edge otherwise. Each branch has at most one edge; a
  branch with none ends the run on that side. The step's output (`branch`, `matched`, and each
  condition's result) is a Variable later steps can read as `steps.<id>.branch`.
required:
  - id
  - type
  - config
properties:
  id:
    type: string
    minLength: 1
    maxLength: 64
    pattern: "^[A-Za-z0-9_-]+$"
    description: >-
      Step id, unique in the definition: letters, digits, `_` and `-`, at most 64
      characters. It can't be `trigger`, start with `trigger_`, or be `__proto__`,
      `prototype` or `constructor`. Checked on writes and enable; a definition
      stored before the rule still loads and runs.
  type:
    type: string
    enum:
      - if_else
  label:
    type: string
    minLength: 1
    maxLength: 120
    description: Optional display label shown in the builder.
  config:
    type: object
    required:
      - condition
    properties:
      condition:
        $ref: ./WorkflowConditionGroup.yml
    additionalProperties: false
  ui:
    $ref: ./WorkflowNodeUi.yml
additionalProperties: false
