type: object
description: Dynamic reference to another value in the survey document.
required:
  - type
  - value
properties:
  type:
    type: string
    enum:
      - element
      - variable
      - hiddenField
      - reserved
  value:
    type: string
    description: >-
      Element id, variable id, hidden field id, or — for `reserved` — the name of an Embedded Data
      field-catalog entry (`country`, `deviceType`, `utmSource`, …). Reserved names are checked for
      non-emptiness only, deliberately not against the catalog, so a survey authored against a newer
      catalog still parses on an older self-hosted deployment.
  meta:
    type: object
    description: >-
      On a matrix row condition: `row`, the 0-based position of the row, and `rowId`, its id. The id
      is read first and wins when the two disagree, so the condition survives reordering; it must be a
      row of the matrix. Either may be sent alone: the other is filled in on write. Positions stay for
      the previous release, which reads them only.
    additionalProperties:
      type: string
additionalProperties: false
