allOf:
  - $ref: ./ResponseAnswerBase.yml
  - type: object
    required:
      - valueBoolean
      - rawValue
    properties:
      elementType:
        type: string
        enum:
          - consent
          - cta
      valueBoolean:
        type: boolean
        description: >-
          Whether the respondent accepted (`consent`) or clicked through (`cta`). Derived from the
          stored token, which is why `rawValue` is returned alongside it.
      rawValue:
        type: string
        description: >-
          The token as stored — conventionally `accepted` for `consent` and `clicked` for `cta`.
          Returned because the boolean is a derivation and this is the underlying fact.
unevaluatedProperties: false
description: >-
  Acknowledgement answer. Covers `consent` (accepted) and `cta` (clicked through).

  A skipped element usually has no entry in `answers[]` at all, because nothing was written for it.
  The exception is a legacy row: older clients recorded a skipped `cta` as the token `dismissed`
  rather than writing nothing, and an unchecked `consent` as `""`. Those are stored values, so they
  are returned — `valueBoolean: false` with the token on `rawValue` — rather than dropped to make the
  payload tidier.
