type: object
description: >-
  Conditions joined by `and` (all must hold) or `or` (any must hold), nested to any depth,
  mirroring `ZWorkflowConditionGroup`. An If/else holds at most 20 conditions in all, nested ones
  included (**400** on save).
required:
  - id
  - connector
  - conditions
properties:
  id:
    type: string
    minLength: 1
  connector:
    type: string
    enum:
      - and
      - or
  conditions:
    type: array
    minItems: 1
    items:
      anyOf:
        - $ref: ./WorkflowCondition.yml
        - $ref: ./WorkflowConditionGroup.yml
additionalProperties: false
