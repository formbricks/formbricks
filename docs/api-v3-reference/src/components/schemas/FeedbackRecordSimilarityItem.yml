type: object
additionalProperties: false
required:
  - feedbackRecordId
  - score
  - fieldLabel
  - valueText
properties:
  feedbackRecordId:
    type: string
    format: uuid
    description: The matching record. Fetch it with `GET /api/v3/feedback-records/{id}` for the full payload.
  score:
    type: number
    format: double
    minimum: 0
    maximum: 1
    description: Cosine similarity, `0` unrelated to `1` identical.
  fieldLabel:
    type: string
    description: The record's question text (part of what was embedded). Empty when the record has no label.
  valueText:
    type: string
    description: >-
      The record's text answer (the text that was embedded). Empty when it has since been cleared —
      only records with a non-empty `valueText` are embedded in the first place.
