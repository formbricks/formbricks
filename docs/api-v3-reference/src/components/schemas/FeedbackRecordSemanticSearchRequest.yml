type: object
additionalProperties: false
required:
  - query
properties:
  query:
    type: string
    minLength: 1
    maxLength: 2000
    description: >-
      Natural-language search text. It is embedded and compared to record embeddings by cosine
      similarity. Every search embeds its query, so this is a cost and a rate-limit input as well as
      a string.
