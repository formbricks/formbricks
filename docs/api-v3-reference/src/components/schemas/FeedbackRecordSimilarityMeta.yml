allOf:
  - $ref: ./ListPaginationMeta.yml
  - $ref: ./FeedbackDatasetContext.yml
  - type: object
    required:
      - minScore
    properties:
      minScore:
        type: number
        format: double
        description: >-
          The similarity threshold that was applied. Out-of-range and non-numeric values are rejected
          with a **400**, so this never disagrees with what a caller sent — it is echoed for the case
          where nothing was sent, since the server default is otherwise invisible.
unevaluatedProperties: false
description: >-
  The `meta` for both similarity searches — pagination, which dataset answered, and the threshold
  that was applied.
