type: object
description: >-
  HTTP request action node: calls an outside URL and passes the response to later steps as
  `steps.<id>.status` and `steps.<id>.body.<path>`.
required:
  - id
  - type
  - actionType
  - config
properties:
  id:
    type: string
    minLength: 1
    maxLength: 64
    pattern: "^[A-Za-z0-9_-]+$"
    description: >-
      Step id, unique in the definition: letters, digits, `_` and `-`, at most 64
      characters. It can't be `trigger`, start with `trigger_`, or be `__proto__`,
      `prototype` or `constructor`. Checked on writes and enable; a definition
      stored before the rule still loads and runs.
  type:
    type: string
    enum:
      - action
  actionType:
    type: string
    enum:
      - http_request
  label:
    type: string
    minLength: 1
    maxLength: 120
    description: Optional display label shown in the builder.
  config:
    $ref: ./WorkflowHttpRequestActionConfig.yml
  ui:
    $ref: ./WorkflowNodeUi.yml
additionalProperties: false
