type: object
description: >
  One piece of non-answer data carried by the response. Survey **variables**, **hidden fields** and
  **auto-captured context** are one concept here rather than three parallel ones: they all have a
  key, a provenance, a declared type and a label, and consumers treat them alike.


  Auto-captured (`reserved`) entries are governed by the Embedded Data field catalog, which declares
  a privacy policy per field (`keep` / `drop` / `redactQuery`). That single classification governs
  both the list and the detailed view, so the two cannot drift. Fields the catalog drops never
  appear here at all — notably the respondent's IP address, which is not exposed by this API in any
  view.
required:
  - key
  - kind
  - type
  - label
  - value
properties:
  key:
    type: string
    description: Stable key. Unique within `embeddedData`.
  kind:
    type: string
    enum:
      - ingested
      - computed
      - reserved
    description: >
      Provenance of the value:


      - `ingested` — supplied by the caller or the embedding page (hidden fields).

      - `computed` — derived during the submission by survey logic (variables).

      - `reserved` — auto-captured context from the submission environment (for example `country`,
        `device_type`), drawn from the Embedded Data field catalog.
  type:
    type: string
    enum:
      - string
      - number
      - boolean
      - date
    description: >-
      Declared type of `value`, so a consumer need not infer it. `computed` entries are only ever
      `string` or `number`, because survey variables are typed that narrowly.
  label:
    type: string
    description: Human-readable name for the key, in the resolved language where one exists.
  value:
    oneOf:
      - type: string
      - type: number
      - type: boolean
      - type: array
        items:
          type: string
      - type: "null"
    description: >-
      The value, matching `type`. `date` values are ISO-8601 strings. An **array of string** occurs
      when a hidden field was ingested with multiple values — the stored map permits it, so the
      payload must be able to carry it rather than silently dropping the key. `null` when the key was
      declared for this survey but carries no value on this response.
additionalProperties: false
