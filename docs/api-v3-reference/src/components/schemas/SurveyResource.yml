allOf:
  - type: object
    required:
      - id
      - workspaceId
      - createdAt
      - updatedAt
      - archivedAt
      - name
      - type
      - status
      - metadata
      - defaultLanguage
      - languages
      - showLanguageSwitch
      - autoSelectLanguage
      - welcomeCard
      - blocks
      - endings
      - hiddenFields
      - variables
    properties:
      id:
        type: string
      workspaceId:
        type: string
      createdAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time
      archivedAt:
        type:
          - string
          - "null"
        format: date-time
        description: >-
          Soft-delete/archive marker (ISO 8601); `null` when the survey is active.
      name:
        type: string
      type:
        type: string
        # link | app only — the Prisma `SurveyType` enum and `ZSurveyType` have exactly those two values.
        # `website` and `web` were both documented here; neither can appear in a response.
        enum:
          - link
          - app
      status:
        type: string
        enum:
          - draft
          - inProgress
          - paused
          - completed
      metadata:
        anyOf:
          - $ref: ./SurveyMetadata.yml
          - type: "null"
      defaultLanguage:
        type: string
        description: >-
          Emitted language code/tag for the survey default language. The internal
          `default` translation key is never exposed.
      languages:
        type: array
        items:
          $ref: ./SurveyLanguage.yml
      showLanguageSwitch:
        type:
          - boolean
          - "null"
        description: >-
          Show respondents a language switch on multi-language surveys. `null` and `false`
          both mean off.
      autoSelectLanguage:
        type:
          - boolean
          - "null"
        description: >-
          Open link and app surveys in the respondent's browser language when it matches
          an enabled survey language; otherwise the default language is used. `null` and
          `false` both mean off.
      welcomeCard:
        $ref: ./SurveyWelcomeCard.yml
      blocks:
        type: array
        items:
          $ref: ./SurveyBlock.yml
      endings:
        type: array
        items:
          $ref: ./SurveyEnding.yml
      hiddenFields:
        $ref: ./SurveyHiddenFields.yml
      variables:
        type: array
        items:
          $ref: ./SurveyVariable.yml
      distribution:
        allOf:
          - $ref: ./SurveyDistribution.yml
        description: App-survey runtime/display settings. Present only for app surveys; omitted for link surveys.
      targeting:
        allOf:
          - $ref: ./SurveyTargeting.yml
        description: App-survey contact targeting. Present only for app surveys; omitted for link surveys.
  - $ref: ./SurveyVisibilityFields.yml
