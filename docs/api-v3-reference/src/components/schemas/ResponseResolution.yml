type: object
description: >
  Receipt describing how `answers[]` and `embeddedData[]` labels were produced. It exists so a
  consumer can tell whether the labels it is reading are the wording the respondent actually saw.
required:
  - labelPolicy
  - labelsLanguage
  - surveyUpdatedAt
properties:
  labelPolicy:
    type: string
    enum:
      - currentSurveyDefinition
    description: >
      Where labels came from. Today the only value is `currentSurveyDefinition`: labels are resolved
      at **read time** against the survey as it stands now. Nothing about the survey is snapshotted
      when a response is written and there is no survey-version model, so a response collected under
      an older headline reads back under today's wording — text the respondent may never have seen.
      Typeform, SurveyMonkey, Qualtrics, Google Forms and Jotform all behave this way, so this is
      the industry norm rather than a shortcut. Compare `surveyUpdatedAt` against the response's
      `createdAt` to detect that the definition moved after collection. If a write-time label
      snapshot ever ships, a second value `asAsked` is added here and consumers branch on it —
      treat this as an open enum.
  labelsLanguage:
    type:
      - string
      - "null"
    description: >-
      The language the labels in this payload were resolved in. Follows the response's `language`
      whenever the survey still declares it, and the survey's default language otherwise.


      Deliberately **not** gated on whether that language is still enabled. `enabled` is a current
      authoring setting, not a property of the response: honouring it would silently re-language
      every historical response the day an author switches a translation off, and it would disagree
      with the display surfaces, which resolve the same labels without consulting it.


      `null` when the survey declares no default language.
  surveyUpdatedAt:
    type: string
    format: date-time
    description: >-
      When the survey definition was last modified. Later than the response's `createdAt` means the
      wording in `elementLabel` may have drifted from what was asked.
additionalProperties: false
