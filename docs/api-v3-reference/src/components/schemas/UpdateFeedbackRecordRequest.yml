type: object
description: >-
  A partial update. Only the members sent are changed; an empty body is accepted and changes
  nothing. Provenance (`datasetId`, `source_*`, `field_*`, `submissionId`, `collectedAt`) is
  immutable.
additionalProperties: false
properties:
  valueText:
    type: string
    maxLength: 30000
    description: >-
      New text answer. Changing it clears the server-generated enrichment members (`sentiment`,
      `sentimentScore`, `emotions`, `valueTextTranslated`, `translationLangKey`), queues
      re-enrichment and re-embedding, and the response reflects the cleared state.
  valueId:
    type: string
    maxLength: 255
    description: New stable option id for a choice answer. Opaque, not validated.
  valueNumber:
    type: number
    format: double
    minimum: -1000000000000000
    maximum: 1000000000000000
    description: New numeric answer. Must be between -1e15 and +1e15.
  valueBoolean:
    type: boolean
    description: New yes / no answer.
  valueDate:
    type: string
    format: date-time
    description: New date answer. Must be between 1970-01-01 and 2080-12-31.
  language:
    type: string
    maxLength: 10
    description: New ISO language code. Changing it clears and re-queues the translation pair only.
  userId:
    type: string
    maxLength: 255
    description: New end-user identifier.
  metadata:
    type: [object, "null"]
    additionalProperties: {}
    description: >-
      **Replaces** the stored metadata wholesale — it is not merged, so send every key you want to
      keep. Same value rules and **400** rejections as on create.
