oneOf:
  - $ref: ./SurveyCalculateAction.yml
  - $ref: ./SurveyRequireAnswerAction.yml
  - $ref: ./SurveyJumpToBlockAction.yml
  - $ref: ./SurveyMarkLowQualityAction.yml
  - $ref: ./SurveyPreselectAnswerAction.yml
description: >
  Logic action. Keep referenced ids stable: `calculate.variableId` points to a
  variable id,

  `requireAnswer.target` points to an element id, and `jumpToBlock.target`
  points to a block id

  or ending id. `markLowQuality` takes no target: it marks the response Low
  quality when the rule fires. `preselectAnswer.target` points to an element id, and its

  `value.choiceIds` to that element's option ids.
