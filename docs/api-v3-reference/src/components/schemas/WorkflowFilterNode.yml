type: object
description: >-
  Filter logic step (ADR 0056): an If/else with one way out. When the condition group holds, the run
  continues down the step's one edge (no `sourceHandle`); when it doesn't, the run ends there,
  completed, and the steps after it are not taken. Same condition group, operators and limits as
  `if_else`.
required:
  - id
  - type
  - config
properties:
  id:
    type: string
    minLength: 1
    maxLength: 64
    pattern: "^[A-Za-z0-9_-]+$"
    description: >-
      Step id, unique in the definition: letters, digits, `_` and `-`, at most 64
      characters. It can't be `trigger`, start with `trigger_`, or be `__proto__`,
      `prototype` or `constructor`. Checked on writes and enable; a definition
      stored before the rule still loads and runs.
  type:
    type: string
    enum:
      - filter
  label:
    type: string
    minLength: 1
    maxLength: 120
    description: Optional display label shown in the builder.
  config:
    type: object
    required:
      - condition
    properties:
      condition:
        $ref: ./WorkflowConditionGroup.yml
    additionalProperties: false
  ui:
    $ref: ./WorkflowNodeUi.yml
additionalProperties: false
