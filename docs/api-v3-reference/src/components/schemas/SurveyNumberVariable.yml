type: object
description: >
  Number variable. Used by `calculate` logic actions with numeric operators such
  as `add`,

  `subtract`, `multiply`, `divide`, or `assign`.
required:
  - id
  - name
  - type
  - value
properties:
  id:
    type: string
    format: cuid2
    description: Stable variable id referenced from logic.
  name:
    type: string
    pattern: ^[a-z0-9_]+$
    description: >-
      Unique variable name. `pattern` is the charset of a *stored* name; a newly declared one is held
      to more than that. It must match `^[a-z][a-z0-9_]*$` (so no leading digit or underscore), must
      not take an Embedded Data reserved name (`country`, `browser`, `language`, …), and must not
      collide case-insensitively with a hidden field id on the same survey. Names the survey already
      declares are grandfathered, so re-sending an existing document never trips this. A new name
      that breaks any of the three answers 400 `forbidden_identifier`.
  type:
    type: string
    enum:
      - number
  value:
    type: number
    description: Default numeric value.
additionalProperties: false
