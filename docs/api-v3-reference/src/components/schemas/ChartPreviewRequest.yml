type: object
required:
  - workspaceId
  - datasetId
  - type
  - query
properties:
  workspaceId:
    type: string
    format: cuid2
  datasetId:
    type: string
    format: cuid2
    description: The Feedback Dataset to read; needs read access to it from `workspaceId`.
  type:
    type: string
    enum:
      - area
      - bar
      - pie
      - big_number
      - matrix
    description: The chart type. A `big_number` shows one value, so its grouping is dropped.
  query:
    $ref: ./ChartQuery.yml
  dateRange:
    description: >-
      Narrows the query's date range on `FeedbackRecords.collectedAt` to where the two overlap: a
      preset, `all-time` (the query's own range applies), or `{ from, to }` ISO calendar dates. Ranges
      that do not overlap answer an empty chart. Read in the organization's display time zone.
    oneOf:
      - type: string
        example: last 7 days
      - type: object
        required:
          - from
          - to
        properties:
          from:
            type: string
            format: date
          to:
            type: string
            format: date
        additionalProperties: false
additionalProperties: false
