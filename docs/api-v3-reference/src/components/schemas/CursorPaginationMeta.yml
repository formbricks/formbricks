allOf:
  - $ref: ./ListPaginationMeta.yml
unevaluatedProperties: false
description: >-
  A list `meta` carrying pagination and nothing else — the shape for collections that do not report a
  total and have no domain context to echo.


  Adds nothing to `ListPaginationMeta`; the `allOf` wrapper is what closes it. It previously capped
  the `limit` echo at 100, alone among the v3 list metas, which said an out-of-range *echo* was a
  contract violation rather than an out-of-range *request*. The bound moved to where requests are
  bounded: the `limit` query parameter.
