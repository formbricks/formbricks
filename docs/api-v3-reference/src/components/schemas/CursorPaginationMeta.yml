type: object
required:
  - limit
  - nextCursor
properties:
  limit:
    type: integer
    minimum: 1
    description: >-
      The page size actually applied. Deliberately carries no `maximum`: this is an echo of what the
      server used, not a bound on what the caller may ask for. Constraining it here would make an
      out-of-range request fail output validation — a 500 — instead of being rejected as a 400 by
      the request schema.
  nextCursor:
    type:
      - string
      - "null"
    description: Opaque cursor for the next page. `null` when there are no more results.
additionalProperties: false
