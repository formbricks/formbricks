description: >-
  Full run shape returned by `GET /api/v3/workflows/runs/{runId}` and
  `POST /api/v3/workflows/{workflowId}/test-runs`: the summary fields plus the captured trigger
  payload, per-step results, the persisted log trace, run detail per step (`steps`) and
  retry/idempotency metadata.
allOf:
  - $ref: ./WorkflowRunSummary.yml
  - type: object
    required:
      - triggerPayload
      - data
      - logs
      - idempotencyKey
      - nextAttemptAt
      - lastErrorAt
      - callerIp
      - workflowVersionNumber
      - steps
    properties:
      triggerPayload:
        $ref: ./WorkflowTriggerPayload.yml
      data:
        $ref: ./WorkflowRunData.yml
      logs:
        type: array
        items:
          $ref: ./WorkflowRunLog.yml
        description: >-
          Persisted step-by-step trace, ordered by `sequence`. Empty while the
          run is still `queued`.
      idempotencyKey:
        type:
          - string
          - "null"
        description: >-
          Deduplication key for this run, unique per workflow. Set from the
          `Idempotency-Key` header on dry runs or from trigger-event
          deduplication.
      nextAttemptAt:
        type:
          - string
          - "null"
        format: date-time
        description: >-
          When the next retry attempt is scheduled. `null` when no retry is
          pending.
      lastErrorAt:
        type:
          - string
          - "null"
        format: date-time
      callerIp:
        type:
          - string
          - "null"
        description: >-
          The caller's IP for a run a Webhook Secret URL call started; null otherwise.
      workflowVersionNumber:
        type:
          - integer
          - "null"
        minimum: 1
        description: >-
          The number of the version the run executed; null for a Test run, which runs the
          draft.
      steps:
        type: array
        items:
          $ref: ./WorkflowRunStep.yml
        description: >-
          Run detail per step: the steps that ran, in order, then the steps on If/else branches
          the run did not take (`not_taken`).
