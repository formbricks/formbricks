description: >
  The Variables inferred from a payload, in document order. Read for the
  first 500 paths; lists are reported as not supported yet.
type: object
required:
  - variables
  - notSupported
  - truncated
properties:
  variables:
    type: array
    description: The Variables, in document order.
    items:
      type: object
      required:
        - path
        - valueType
      properties:
        path:
          type: string
          minLength: 1
          example: payload.customer.email
        valueType:
          type: string
          enum:
            - object
            - string
            - number
            - boolean
            - "null"
      additionalProperties: false
  notSupported:
    type: array
    description: >-
      Paths that cannot be used as Variables: `list` (lists are not
      supported yet), `unsafe_segment` (`__proto__`, `prototype` or
      `constructor`) or `unreachable_key` (a key with characters other
      than letters, digits, `-` and `_`, such as a dot or a space, which a
      Variable path cannot carry).
    items:
      type: object
      required:
        - path
        - reason
      properties:
        path:
          type: string
          minLength: 1
        reason:
          type: string
          enum:
            - list
            - unsafe_segment
            - unreachable_key
      additionalProperties: false
  truncated:
    type: boolean
    description: True when only the first 500 paths were read.
additionalProperties: false
