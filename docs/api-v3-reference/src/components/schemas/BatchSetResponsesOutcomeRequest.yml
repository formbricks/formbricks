type: object
description: >
  Responses to mark Low quality, or to restore. A POST custom method modelled on `batch-delete`, so
  one request is one transaction over at most 100 ids. `outcome` is required: leaving it out must not
  read as a restore.
required:
  - ids
  - outcome
properties:
  ids:
    type: array
    minItems: 1
    maxItems: 100
    uniqueItems: true
    description: Response ids to update, at most 100 per call.
    items:
      type: string
      format: cuid2
  outcome:
    type:
      - string
      - "null"
    enum:
      - lowQuality
      - null
    description: >-
      The outcome to set on every response. `lowQuality` marks, `null` clears the mark.
additionalProperties: false
