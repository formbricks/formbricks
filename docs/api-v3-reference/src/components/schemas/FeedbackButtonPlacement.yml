type: object
description: >-
  Where a feedback button sits: an edge of the page plus an offset along it, in percent, that places
  the button's centre. On the left and right edges the offset runs from the top; on the bottom edge,
  from the left. 50 centres the button on its edge. Near either end the button stops at the end of the
  edge instead, so it stays fully on screen: 0 puts its top (or left) end at the start of the edge and
  100 its bottom (or right) end at the end.
required:
  - edge
  - offset
properties:
  edge:
    type: string
    enum:
      - left
      - right
      - bottom
  offset:
    type: integer
    minimum: 0
    maximum: 100
additionalProperties: false
