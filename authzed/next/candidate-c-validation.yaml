validation:
  survey:draft#read:
    - "[user:bo] is <survey:draft#owner>"

  contact_directory:employees#view_contacts:
    - "[team:hr#member] is <contact_directory:employees#pii_team>"
    - "[user:hana] is <organization:acme#member>/<team:hr#contributor>"
    - "[user:mark] is <organization:acme#manager>"
    - "[user:olivia] is <organization:acme#owner>"

# INEXPRESSIBLE in candidate C
# ---------------------------
# S-P2.1c  "grant a team access to a body of work" — there is no body of work. The grant is
#          one relationship per survey, per dashboard, per workflow, re-applied on every
#          create. At BI scale (5-6k surveys) a single team grant is thousands of writes.
# S-N5.1   "a division-level grant reaches everything beneath it" — no parent edge exists.
#          Divisions can only be emulated by enumerating every descendant resource.
# S-N5.3   "a grant on a sub-unit does not leak upward" — vacuous; there is no hierarchy to
#          leak through, so the property cannot be asserted at all.
# S-N6.2   "a dataset assigned to two bodies of work is visible to the union of their
#          viewers" — the union has to be hand-maintained on the dataset. The assertion
#          above passes only because `team:analysts#member` was added to the dataset by hand;
#          nothing keeps it in step when the team's access to one of those bodies changes,
#          so the model cannot express the requirement, only imitate its current answer.
# S-N4.1c  Container-level tiering ("this group summarises everything here") has no target;
#          `summarizer` must be written per resource.
