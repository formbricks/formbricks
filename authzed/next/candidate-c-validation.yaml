# Validation suite for CANDIDATE C (no container).
#
# Same scenario IDs. Scenarios with no analogue in this model are listed at the bottom of
# this file under INEXPRESSIBLE rather than silently dropped — that list IS the result.
#
# Fixture mapping from A: there is nothing to map the containers onto, so every grant that
# candidate A wrote once on a container is written here on each individual survey,
# dashboard and workflow.

