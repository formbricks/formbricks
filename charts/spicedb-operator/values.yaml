image:
  repository: ghcr.io/authzed/spicedb-operator
  tag: v1.27.0
  digest: sha256:c4c64792cd8ab0222983ab5ffc1964687d4366f2e567ae204eb5223ae8c43a78
  pullPolicy: IfNotPresent

# A single operator release can watch one or more namespaces. If empty, only
# the Helm release namespace is watched.
watchNamespaces: []

replicaCount: 1

podAnnotations: {}
podLabels: {}

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 160Mi

service:
  annotations: {}
  port: 8080

serviceMonitor:
  enabled: false
  labels: {}
  interval: 30s

nodeSelector: {}
tolerations: []
affinity: {}

nameOverride: ""
fullnameOverride: ""
