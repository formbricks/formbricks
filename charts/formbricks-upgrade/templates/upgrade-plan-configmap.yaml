apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "formbricks-upgrade.planName" . }}
  labels:
    {{- include "formbricks-upgrade.labels" . | nindent 4 }}
immutable: true
data:
  targetRelease: {{ .Values.targetRelease | quote }}
  generation: {{ .Values.generation | quote }}
  protocolVersion: {{ .Values.protocolVersion | quote }}
  bridgeImage: {{ include "formbricks-upgrade.bridgeImage" . | quote }}
  bridgeManifestDigest: {{ .Values.images.bridge.manifestDigest | quote }}
  candidateImage: {{ include "formbricks-upgrade.candidateImage" . | quote }}
  candidateManifestDigest: {{ .Values.images.candidate.manifestDigest | quote }}
  candidateExecutionMode: external
  contractMigrationPhase: deferred
  {{- with .Values.schema.expectedCurrentDigest }}
  expectedCurrentSchemaDigest: {{ . | quote }}
  {{- end }}
