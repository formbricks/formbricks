# Formbricks owns the Envoy v1.8.4 controller and both CRD sets (Gateway API v1.5.1 Experimental).
formbricks:
  webappUrl: https://surveys.example.com
envoy:
  enabled: true
  controller:
    enabled: true
  crds:
    enabled: true
  config:
    envoyGateway:
      rateLimit:
        backend:
          type: Redis
          redis:
            url: "redis.example.internal:6379"
  formbricks:
    policies:
      enabled: true
envoyRedis:
  enabled: false
