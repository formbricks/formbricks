# A separate platform release owns Gateway API v1.5.1 and Envoy v1.8.4 CRDs.
# Formbricks owns the matching Envoy v1.8.4 controller.
formbricks:
  webappUrl: https://surveys.example.com
envoy:
  enabled: true
  controller:
    enabled: true
  crds:
    enabled: false
  config:
    envoyGateway:
      rateLimit:
        backend:
          type: Redis
          redis:
            url: "redis.example.internal:6379"
  formbricks:
    policies:
      enabled: true
envoyRedis:
  enabled: false
