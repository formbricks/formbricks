{{- if and .Values.hub.enabled .Values.hub.worker.enabled }}
{{- $preflight := .Values.hub.worker.embeddingPreflight -}}
{{- if and (ne $preflight.intervalSeconds nil) (ne $preflight.successTTLSeconds nil) (ge (int $preflight.intervalSeconds) (int $preflight.successTTLSeconds)) -}}
  {{- fail "hub.worker.embeddingPreflight.intervalSeconds must be less than successTTLSeconds" -}}
{{- end -}}
{{- if .Values.hub.worker.embeddingReadiness.enabled -}}
  {{- $readinessPath := .Values.hub.worker.embeddingReadiness.path -}}
  {{- if or (not (hasPrefix "/" $readinessPath)) (ne (clean $readinessPath) $readinessPath) (eq (dir $readinessPath) "/") -}}
    {{- fail "hub.worker.embeddingReadiness.path must be absolute and canonical with a directory below /" -}}
  {{- end -}}
  {{- /* Reject the known legacy Hub images when explicitly selected. */ -}}
  {{- $legacyDigests := list "sha256:967089f22585f3c3730e455b8b20885b0739f26b5ce5e034324658aa51d627f2" "sha256:3407fff46303c3c24091f2d0d0a3dbc94b8539ebd84a258575bcbf52bedda745" "sha256:0049b20fea8023b12dced414c731ba8dbf3d39aa7b3de738d5837222c9c7b2e0" -}}
  {{- $legacyTags := list "0.14.0" "0.14.1" "0.14.2" -}}
  {{- if or (has .Values.hub.image.digest $legacyDigests) (and (not .Values.hub.image.digest) (has .Values.hub.image.tag $legacyTags)) -}}
    {{- fail "hub.worker.embeddingReadiness.enabled requires a Hub image containing --check-embedding-readiness (hub#161); Hub 0.14.0 through 0.14.2 do not support it" -}}
  {{- end -}}
  {{- if or (hasKey .Values.hub.env "HUB_EMBEDDING_READINESS_FILE") (hasKey .Values.hub.worker.env "HUB_EMBEDDING_READINESS_FILE") -}}
    {{- fail "HUB_EMBEDDING_READINESS_FILE is managed by hub.worker.embeddingReadiness.path when readiness is enabled" -}}
  {{- end -}}
  {{- $readinessMountPath := dir .Values.hub.worker.embeddingReadiness.path -}}
  {{- range .Values.hub.extraVolumeMounts -}}
    {{- if eq (clean .mountPath) $readinessMountPath -}}
      {{- fail "hub.extraVolumeMounts conflicts with the embedding readiness mount; choose a different hub.worker.embeddingReadiness.path" -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "formbricks.hubWorkerName" . }}
  labels:
    helm.sh/chart: {{ include "formbricks.chart" . }}
    app.kubernetes.io/name: {{ include "formbricks.hubWorkerName" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: hub-worker
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: {{ .Values.partOfOverride | default (include "formbricks.name" .) }}
spec:
  {{- if not .Values.hub.worker.autoscaling.enabled }}
  replicas: {{ .Values.hub.worker.replicas | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "formbricks.hubWorkerName" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "formbricks.hubWorkerName" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: hub-worker
    spec:
      {{- with .Values.hub.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hub.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hub.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hub.worker.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.deployment.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.deployment.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- if .Values.hub.worker.waitForApi.enabled }}
      initContainers:
        - name: wait-for-hub-api
          image: {{ include "formbricks.hubImage" . }}
          imagePullPolicy: {{ .Values.hub.image.pullPolicy }}
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          command:
            - sh
            - -c
            - |
              attempts=0
              max_attempts={{ .Values.hub.worker.waitForApi.maxAttempts | default 120 }}
              until timeout 5 wget --no-verbose --tries=1 --timeout=5 --spider http://{{ include "formbricks.hubname" . }}:8080/health; do
                attempts=$((attempts+1))
                if [ "$attempts" -ge "$max_attempts" ]; then
                  echo "Hub API did not become healthy after $max_attempts attempt(s)"
                  exit 1
                fi
                echo "Waiting for Hub API migrations and health check (attempt $attempts/$max_attempts)..."
                sleep 5
              done
      {{- end }}
      containers:
        - name: hub-worker
          image: {{ include "formbricks.hubImage" . }}
          imagePullPolicy: {{ .Values.hub.image.pullPolicy }}
          command:
            - /app/hub-worker
          {{- if .Values.hub.worker.embeddingReadiness.enabled }}
          readinessProbe:
            exec:
              command:
                - /app/hub-worker
                - --check-embedding-readiness
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 1
          {{- end }}
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          envFrom:
            - secretRef:
                name: {{ include "formbricks.hubSecretName" . }}
          {{- $timings := list (dict "key" "EMBEDDING_PREFLIGHT_TIMEOUT_SECONDS" "value" $preflight.timeoutSeconds) (dict "key" "EMBEDDING_PREFLIGHT_INTERVAL_SECONDS" "value" $preflight.intervalSeconds) (dict "key" "EMBEDDING_PREFLIGHT_SUCCESS_TTL_SECONDS" "value" $preflight.successTTLSeconds) (dict "key" "EMBEDDING_PREFLIGHT_SNOOZE_SECONDS" "value" $preflight.snoozeSeconds) }}
          {{- $hasTimings := or (ne $preflight.timeoutSeconds nil) (ne $preflight.intervalSeconds nil) (ne $preflight.successTTLSeconds nil) (ne $preflight.snoozeSeconds nil) }}
          {{- if or .Values.hub.embeddings.enabled .Values.hub.embeddingClient.enabled .Values.hub.worker.embeddingReadiness.enabled $hasTimings (gt (len .Values.hub.env) 0) (gt (len .Values.hub.worker.env) 0) }}
          env:
            {{- if .Values.hub.worker.embeddingReadiness.enabled }}
            - name: HUB_EMBEDDING_READINESS_FILE
              value: {{ .Values.hub.worker.embeddingReadiness.path | quote }}
            {{- end }}
            {{- range $timings }}
            {{- if and (ne .value nil) (not (hasKey $.Values.hub.env .key)) (not (hasKey $.Values.hub.worker.env .key)) }}
            - name: {{ .key }}
              value: {{ .value | quote }}
            {{- end }}
            {{- end }}
            {{- $keepAliveKey := "EMBEDDING_HTTP_DISABLE_KEEP_ALIVES" }}
            {{- $embeddingWorkerEnv := mergeOverwrite (dict) (pick .Values.hub.env $keepAliveKey) (pick .Values.hub.worker.env $keepAliveKey) }}
            {{- include "formbricks.hubEmbeddingEnv" (dict "root" $ "env" $embeddingWorkerEnv "worker" true) | nindent 12 }}
            {{- if .Values.hub.embeddingClient.enabled }}
            {{- include "formbricks.hubEmbeddingClientEnv" (dict "root" $ "worker" true) | nindent 12 }}
            {{- end }}
            {{- range $key, $value := .Values.hub.env }}
            {{- if and (not (hasKey $.Values.hub.worker.env $key)) (not (and $.Values.hub.embeddings.enabled (include "formbricks.hubEmbeddingEnvManaged" (dict "key" $key)))) (not (and $.Values.hub.embeddingClient.enabled (include "formbricks.hubEmbeddingClientEnvManaged" (dict "root" $ "worker" true "key" $key)))) }}
            {{- include "formbricks.envVar" (dict "name" $key "value" $value "context" $) | nindent 12 }}
            {{- end }}
            {{- end }}
            {{- range $key, $value := .Values.hub.worker.env }}
            {{- if and (not (and $.Values.hub.embeddings.enabled (include "formbricks.hubEmbeddingEnvManaged" (dict "key" $key)))) (not (and $.Values.hub.embeddingClient.enabled (include "formbricks.hubEmbeddingClientEnvManaged" (dict "root" $ "worker" true "key" $key)))) }}
            {{- include "formbricks.envVar" (dict "name" $key "value" $value "context" $) | nindent 12 }}
            {{- end }}
            {{- end }}
          {{- end }}
          {{- if or .Values.hub.worker.embeddingReadiness.enabled .Values.hub.extraVolumeMounts }}
          volumeMounts:
            {{- if .Values.hub.worker.embeddingReadiness.enabled }}
            - name: hub-embedding-readiness
              mountPath: {{ dir .Values.hub.worker.embeddingReadiness.path | quote }}
            {{- end }}
            {{- with .Values.hub.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- if .Values.hub.worker.resources }}
          resources:
            {{- toYaml .Values.hub.worker.resources | nindent 12 }}
          {{- end }}
      {{- if or .Values.hub.worker.embeddingReadiness.enabled .Values.hub.extraVolumes }}
      volumes:
        {{- if .Values.hub.worker.embeddingReadiness.enabled }}
        - name: hub-embedding-readiness
          emptyDir: {}
        {{- end }}
        {{- with .Values.hub.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
{{- end }}
