{{- $serviceAccount := .Values.taxonomy.serviceAccount | default dict -}}
{{- if and .Values.taxonomy.enabled (get $serviceAccount "create") }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "formbricks.taxonomyServiceAccountName" . }}
  labels:
    helm.sh/chart: {{ include "formbricks.chart" . }}
    app.kubernetes.io/name: {{ include "formbricks.taxonomyName" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: taxonomy
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: {{ .Values.partOfOverride | default (include "formbricks.name" .) }}
    {{- with get $serviceAccount "additionalLabels" }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with get $serviceAccount "annotations" }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ get $serviceAccount "automountServiceAccountToken" | default false }}
{{- end }}
