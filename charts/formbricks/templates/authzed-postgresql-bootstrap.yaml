{{- $bundledBootstrap := and .Values.authzed.bundledPostgresqlBootstrap.enabled .Values.postgresql.enabled (not .Values.authzed.datastore.existingSecret) -}}
{{- $externalBootstrap := .Values.authzed.externalPostgresqlBootstrap.enabled -}}
{{- $postgresSecretName := .Values.postgresql.auth.existingSecret | default (include "formbricks.appSecretName" .) -}}
{{- if and .Values.authzed.enabled (eq .Values.authzed.mode "selfHosted") (or $bundledBootstrap $externalBootstrap) }}
{{- if and $externalBootstrap (not .Values.authzed.datastore.existingSecret) -}}
{{- fail "authzed.datastore.existingSecret is required for external PostgreSQL bootstrap" -}}
{{- end -}}
{{- if and $externalBootstrap (not .Values.authzed.externalPostgresqlBootstrap.adminSecretName) -}}
{{- fail "authzed.externalPostgresqlBootstrap.adminSecretName is required when external bootstrap is enabled" -}}
{{- end -}}
{{- $admin := .Values.authzed.bundledPostgresqlBootstrap -}}
{{- /*
  With every admin* value empty, the Job connects as the role the bundled server was initialised
  with: postgresql.auth.username, its database and its password. The bundled image is the official
  pgvector/pgvector image, not Bitnami's, and it creates only POSTGRES_USER, as a superuser; it ignores
  POSTGRES_POSTGRES_PASSWORD, so there is no `postgres` role to log in as (ENG-7044). A server whose
  data directory a Bitnami image initialised does have `postgres`, and there the application role is
  not a superuser, so the `postgres` superuser is rendered as a fallback the script switches to only
  when the first role cannot log in or is not a superuser.

  Setting any admin* value keeps the explicit configuration exactly as before: `postgres` on the
  `postgres` database with the bundled admin password, unless overridden.
*/ -}}
{{- $explicitAdmin := or $admin.adminUsername $admin.adminDatabase $admin.adminPasswordSecretName $admin.adminPasswordKey -}}
{{- $bundledAdminUsername := "" -}}
{{- $bundledAdminDatabase := "" -}}
{{- $bundledAdminSecret := "" -}}
{{- $bundledAdminKey := "" -}}
{{- $fallbackAdmin := dict -}}
{{- if and $bundledBootstrap (not $explicitAdmin) -}}
{{- $bundledAdminUsername = include "formbricks.postgresqlUsername" . -}}
{{- $bundledAdminDatabase = include "formbricks.postgresqlDatabase" . | default "postgres" -}}
{{- $bundledAdminSecret = include "formbricks.postgresqlSecretName" . -}}
{{- $bundledAdminKey = include "formbricks.postgresqlUserPasswordKey" . -}}
{{- if and .Values.postgresql.auth.enablePostgresUser (ne $bundledAdminUsername "postgres") -}}
{{- $fallbackAdmin = dict "username" "postgres" "database" "postgres" "secret" $bundledAdminSecret "key" (include "formbricks.postgresqlAdminPasswordKey" .) -}}
{{- end -}}
{{- else -}}
{{- $bundledAdminUsername = $admin.adminUsername | default "postgres" -}}
{{- $bundledAdminDatabase = $admin.adminDatabase | default "postgres" -}}
{{- $bundledAdminSecret = $admin.adminPasswordSecretName | default $postgresSecretName -}}
{{- $bundledAdminKey = $admin.adminPasswordKey | default .Values.postgresql.auth.secretKeys.adminPasswordKey -}}
{{- end -}}
{{- $isBundledSuperuserName := eq $bundledAdminUsername "postgres" -}}
{{- $reliesOnBundledAdminSecret := and $explicitAdmin $isBundledSuperuserName (not $admin.adminPasswordSecretName) -}}
{{- /*
  An explicit `adminUsername: postgres` that still relies on the bundled admin Secret is the old
  default, typically carried in a values file copied from an earlier chart. On the bundled pgvector
  image that role does not exist, so the application role is rendered as its fallback.
*/ -}}
{{- if and $bundledBootstrap $reliesOnBundledAdminSecret (ne (include "formbricks.postgresqlUsername" .) "postgres") -}}
{{- $fallbackAdmin = dict "username" (include "formbricks.postgresqlUsername" .) "database" (include "formbricks.postgresqlDatabase" . | default "postgres") "secret" (include "formbricks.postgresqlSecretName" .) "key" (include "formbricks.postgresqlUserPasswordKey" .) -}}
{{- end -}}
{{- /*
  enablePostgresUser only matters when this Job is relying on the subchart to *create* the superuser
  and hand over its password — that is, the default name AND the default Secret. Keying off the name
  alone would refuse an existing server whose privileged role happens to be called `postgres` and
  whose credentials the operator supplied explicitly, which is the same over-strict refusal that
  forced installations to disable bootstrap entirely (ENG-2390).
*/ -}}
{{- if and $bundledBootstrap $reliesOnBundledAdminSecret (not .Values.postgresql.auth.enablePostgresUser) -}}
{{- fail "Set authzed.bundledPostgresqlBootstrap.adminUsername (with adminPasswordSecretName and adminPasswordKey) to an existing role with CREATEROLE and CREATEDB, or enable postgresql.auth.enablePostgresUser, or disable authzed.bundledPostgresqlBootstrap.enabled" -}}
{{- end -}}
{{- if and $bundledBootstrap (not $bundledAdminKey) -}}
{{- fail "authzed.bundledPostgresqlBootstrap.adminPasswordKey (or postgresql.auth.secretKeys.userPasswordKey and adminPasswordKey) is required when bundled AuthZed PostgreSQL bootstrap is enabled" -}}
{{- end -}}
{{- if and $bundledBootstrap $explicitAdmin (not $isBundledSuperuserName) (not $admin.adminPasswordSecretName) -}}
{{- fail "authzed.bundledPostgresqlBootstrap.adminPasswordSecretName is required when adminUsername is not the bundled postgres superuser" -}}
{{- end -}}
{{- /*
  The key needs its own explicit requirement, not just the non-empty check above. `$bundledAdminKey`
  falls back to `postgresql.auth.secretKeys.adminPasswordKey`, which the subchart defaults to
  `POSTGRES_ADMIN_PASSWORD` — never empty — so that check cannot fire for a custom role. Without this,
  setting adminUsername and adminPasswordSecretName but forgetting the key renders happily and looks
  up the *subchart's* key name inside the *operator's own* Secret, which fails in-cluster as
  CreateContainerConfigError rather than at render. Fail-fast is the whole point of these guards.

  Keyed off the *credential source*, not the username: an existing administrator that happens to be
  called `postgres` still supplies its own Secret, and that Secret is no more likely to carry the
  subchart's key name than any other. Keying off the name left exactly that configuration rendering
  a dangling secretKeyRef.
*/ -}}
{{- if and $bundledBootstrap $explicitAdmin (not $reliesOnBundledAdminSecret) (not $admin.adminPasswordKey) -}}
{{- fail "authzed.bundledPostgresqlBootstrap.adminPasswordKey is required when the administrator password comes from an explicitly configured Secret" -}}
{{- end -}}
{{- $bootstrap := ternary .Values.authzed.bundledPostgresqlBootstrap .Values.authzed.externalPostgresqlBootstrap $bundledBootstrap -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "formbricks.authzedClusterName" . }}-database-bootstrap
  labels:
    {{- include "formbricks.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ $bootstrap.backoffLimit }}
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "formbricks.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: authzed-database-bootstrap
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: {{ $bootstrap.image | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 70
          env:
            {{- if $bundledBootstrap }}
            - name: PGHOST
              value: {{ include "formbricks.postgresqlPrimaryHost" . | quote }}
            - name: PGPORT
              value: {{ include "formbricks.postgresqlServicePort" . | quote }}
            - name: PGUSER
              value: {{ $bundledAdminUsername | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $bundledAdminSecret }}
                  key: {{ $bundledAdminKey }}
            - name: ADMIN_DATABASE_NAME
              value: {{ $bundledAdminDatabase | quote }}
            {{- if $fallbackAdmin }}
            - name: FALLBACK_PGUSER
              value: {{ $fallbackAdmin.username | quote }}
            # Optional so a Secret without this key never blocks the Job; the script then keeps the
            # first role.
            - name: FALLBACK_PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $fallbackAdmin.secret }}
                  key: {{ $fallbackAdmin.key }}
                  optional: true
            - name: FALLBACK_ADMIN_DATABASE_NAME
              value: {{ $fallbackAdmin.database | quote }}
            {{- end }}
            - name: SPICEDB_DATABASE_NAME
              value: spicedb
            - name: SPICEDB_DATABASE_USERNAME
              value: spicedb
            - name: SPICEDB_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "formbricks.authzedManagedSecretName" . }}
                  key: database_password
            {{- else }}
            - name: ADMIN_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.authzed.externalPostgresqlBootstrap.adminSecretName }}
                  key: {{ .Values.authzed.externalPostgresqlBootstrap.adminUrlKey }}
            - name: SPICEDB_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "formbricks.authzedDatastoreSecretName" . }}
                  key: {{ .Values.authzed.externalPostgresqlBootstrap.databaseNameKey }}
            - name: SPICEDB_DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "formbricks.authzedDatastoreSecretName" . }}
                  key: {{ .Values.authzed.externalPostgresqlBootstrap.databaseUsernameKey }}
            - name: SPICEDB_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "formbricks.authzedDatastoreSecretName" . }}
                  key: {{ .Values.authzed.externalPostgresqlBootstrap.databasePasswordKey }}
            {{- end }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              if [ -n "${ADMIN_DATABASE_URL:-}" ]; then
                case "$ADMIN_DATABASE_URL" in
                  *\?*) admin_database_query="${ADMIN_DATABASE_URL#*\?}" ;;
                  *)
                    echo "ADMIN_DATABASE_URL must explicitly enable TLS with sslmode=require, verify-ca, or verify-full" >&2
                    exit 1
                    ;;
                esac

                sslmode=""
                remaining_query="$admin_database_query"
                while [ -n "$remaining_query" ]; do
                  parameter="${remaining_query%%&*}"
                  if [ "$remaining_query" = "$parameter" ]; then
                    remaining_query=""
                  else
                    remaining_query="${remaining_query#*&}"
                  fi
                  case "$parameter" in
                    sslmode=*) sslmode="${parameter#sslmode=}" ;;
                  esac
                done

                case "$sslmode" in
                  require|verify-ca|verify-full) ;;
                  *)
                    echo "ADMIN_DATABASE_URL must explicitly enable TLS with sslmode=require, verify-ca, or verify-full" >&2
                    exit 1
                    ;;
                esac
                admin_database_url="$ADMIN_DATABASE_URL"
              else
                # Bundled mode connects through PGHOST/PGUSER/PGPASSWORD; this is the maintenance
                # database to attach to, which is not necessarily named `postgres` on an existing
                # server (ENG-2390). No shell-level default: this branch only runs for bundled
                # bootstrap, where the template always sets ADMIN_DATABASE_NAME, so a second
                # fallback here would just be a competing source of truth for the same default.
                admin_database_url="$ADMIN_DATABASE_NAME"
              fi
              readiness_attempt=1
              until pg_isready --dbname "$admin_database_url"; do
                if [ "$readiness_attempt" -ge 60 ]; then
                  echo "PostgreSQL did not become ready after 60 attempts" >&2
                  exit 1
                fi
                readiness_attempt=$((readiness_attempt + 1))
                sleep 2
              done
              # Bundled mode checks the role before any SQL runs. A superuser first role is always kept.
              # When the chart rendered a fallback (bundled credentials only, never a custom
              # administrator's), a non-superuser first role gives way to it if the fallback can log in:
              # a CREATEROLE/CREATEDB role cannot adopt a `spicedb` role another role created on
              # PostgreSQL 16+, and both fallback targets are superusers. Otherwise CREATEROLE and
              # CREATEDB are enough, and a first role without them stops here naming the credentials or
              # values that fix it instead of a SQL error.
              if [ -z "${ADMIN_DATABASE_URL:-}" ]; then
                first_login=t
                first_role="$(psql --dbname "$admin_database_url" --no-psqlrc --tuples-only --no-align \
                  --command "SELECT rolsuper, rolsuper OR (rolcreaterole AND rolcreatedb) FROM pg_roles WHERE rolname = current_user")" ||
                  first_login=f
                if [ "$first_role" != "t|t" ]; then
                  fallback_login=f
                  if [ -n "${FALLBACK_PGUSER:-}" ] && [ -n "${FALLBACK_PGPASSWORD:-}" ] &&
                    PGUSER="$FALLBACK_PGUSER" PGPASSWORD="$FALLBACK_PGPASSWORD" \
                      psql --dbname "$FALLBACK_ADMIN_DATABASE_NAME" --no-psqlrc --tuples-only --no-align \
                      --command "SELECT 1" >/dev/null; then
                    fallback_login=t
                  fi
                  if [ "$fallback_login" = "t" ]; then
                    echo "PostgreSQL role $PGUSER cannot log in or is not a superuser; connecting as $FALLBACK_PGUSER instead" >&2
                    PGUSER="$FALLBACK_PGUSER"
                    PGPASSWORD="$FALLBACK_PGPASSWORD"
                    export PGUSER PGPASSWORD
                    admin_database_url="$FALLBACK_ADMIN_DATABASE_NAME"
                  elif [ "$first_role" = "f|t" ]; then
                    if [ -n "${FALLBACK_PGUSER:-}" ]; then
                      echo "PostgreSQL role $FALLBACK_PGUSER could not log in; continuing as $PGUSER, which has CREATEROLE and CREATEDB" >&2
                    fi
                  elif [ "$first_login" = "f" ] && [ -n "${FALLBACK_PGUSER:-}" ]; then
                    # A wrong password for the first role would otherwise end on the fallback's login
                    # error, which on the bundled pgvector image (no `postgres` role) reads like the
                    # missing-`postgres` failure the fallback exists to avoid.
                    echo "Neither $PGUSER nor $FALLBACK_PGUSER could log in. $FALLBACK_PGUSER exists only on data a Bitnami image initialised; on the bundled pgvector image, check the password Secret and key for $PGUSER." >&2
                    exit 1
                  elif [ -n "${FALLBACK_PGUSER:-}" ]; then
                    echo "PostgreSQL role $PGUSER lacks CREATEROLE and CREATEDB, and $FALLBACK_PGUSER could not log in; check the password Secret and key for $FALLBACK_PGUSER." >&2
                    exit 1
                  else
                    echo "PostgreSQL role $PGUSER cannot log in or lacks CREATEROLE and CREATEDB, so it cannot create the SpiceDB role and database." >&2
                    echo "Set authzed.bundledPostgresqlBootstrap.adminUsername, adminPasswordSecretName and adminPasswordKey to a role that has them, enable postgresql.auth.enablePostgresUser on a server with a postgres superuser, or set authzed.bundledPostgresqlBootstrap.enabled=false and provision the SpiceDB role and database yourself." >&2
                    exit 1
                  fi
                fi
              fi
              psql --dbname "$admin_database_url" --set ON_ERROR_STOP=1 \
                --set database_name="$SPICEDB_DATABASE_NAME" \
                --set database_username="$SPICEDB_DATABASE_USERNAME" \
                --set database_password="$SPICEDB_DATABASE_PASSWORD" <<'SQL'
              SELECT format('CREATE ROLE %I LOGIN', :'database_username')
                WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'database_username') \gexec
              -- CREATE DATABASE ... OWNER requires the administrator to be able to SET ROLE to the
              -- owner, and merely holding CREATEROLE does not give that. PostgreSQL 16+ grants a
              -- role's creator ADMIN but SET FALSE; PostgreSQL 15 and older grant nothing at all. So
              -- a non-superuser administrator has to take the membership explicitly or the next
              -- statement fails with "must be able to SET ROLE" (16+) / "must be member of role"
              -- (15). Superusers already qualify and are skipped, so the bundled path is unchanged.
              SELECT format('GRANT %I TO CURRENT_USER', :'database_username')
                WHERE NOT (SELECT rolsuper FROM pg_roles WHERE rolname = CURRENT_USER) \gexec
              SELECT format('ALTER ROLE %I WITH LOGIN PASSWORD %L', :'database_username', :'database_password') \gexec
              SELECT format('CREATE DATABASE %I OWNER %I', :'database_name', :'database_username')
                WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'database_name') \gexec
              SQL
{{- end }}
