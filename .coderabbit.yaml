# CodeRabbit configuration — see https://docs.coderabbit.ai/reference/configuration
#
# Until this file existed, every review footer read "Configuration used: Repository UI" —
# the whole review configuration lived in the CodeRabbit dashboard, unversioned and
# unreviewable. The baseline here is the resolved configuration CodeRabbit itself emitted
# via `@coderabbitai generate configuration`, so it is what was already running rather
# than a hand-written guess. Three things are then deliberately different from that
# baseline: the docstring-coverage pre-merge check is off, `path_instructions` encode the
# repo rules a generic reviewer keeps getting wrong, and `path_filters` no longer hide
# `en-US.json`. See the comments at each of those keys.
#
# `inheritance: false` means every value is defined here; nothing is inherited from
# organisation-level settings. Keep it that way so the repo stays the source of truth.
language: en-US
# Max 250 characters — the schema enforces it.
tone_instructions: |
  Prettier and ESLint own formatting, import order and quote style; never comment on them.
  No docstring or JSDoc requests. One well-evidenced comment beats three speculative
  ones: if you cannot point at the line that breaks, say so or stay quiet.
early_access: true
enable_free_tier: true
inheritance: false

reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: false
  high_level_summary_instructions: ""
  high_level_summary_placeholder: "@coderabbitai summary"
  high_level_summary_in_walkthrough: false
  auto_title_placeholder: "@coderabbitai"
  auto_title_instructions: ""
  # On: this is the "review skipped" notice. With incremental review enabled,
  # `auto_pause_after_reviewed_commits` actually fires, and with this off a paused
  # review looks exactly like a clean one — silence must never stand in for a pass.
  review_status: true
  review_details: false
  review_progress: true
  commit_status: true
  fail_commit_status: false
  collapse_walkthrough: false
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  labeling_instructions: []
  mutually_exclusive_groups: {}
  auto_apply_labels: false
  suggested_reviewers: false
  auto_assign_reviewers: false
  suggested_reviewers_instructions: []
  in_progress_fortune: true
  poem: false
  enable_prompt_for_ai_agents: true
  path_filters:
    # Machine-generated by Lingo.dev from en-US.json. en-US.json itself is
    # hand-written and IS reviewed — later patterns win, so it is re-included.
    - "!apps/web/locales/**"
    - "apps/web/locales/en-US.json"
    - "!packages/surveys/locales/**"
    - "packages/surveys/locales/en-US.json"
    - "!**/i18n.lock"
    # Build output and generated artefacts. Note: openapi.yml and
    # docs/api-*-reference/openapi*.{yml,json} are deliberately NOT excluded —
    # oasdiff reviews them for breaking API changes.
    - "!apps/web/vendor/**"

  path_instructions:
    - path: "**/*.test.tsx"
      instructions: |
        AGENTS.md forbids React component unit tests in this repo — components are covered by
        Playwright specs in `apps/web/playwright/`. If this file is newly added, say so and ask for
        the coverage to move to a Playwright `.spec.ts` instead. Do not raise this on edits to the
        handful of `.test.tsx` files that already exist.

    - path: "**/*.tsx"
      instructions: |
        - Never suggest adding unit tests for `.tsx` files. AGENTS.md forbids them; UI behaviour is
          covered by Playwright specs in `apps/web/playwright/`. Suggesting an E2E spec is fine.
        - New client data flows go through an `/api/v3` route with TanStack Query, not a new Server
          Action. Server data lives in the query cache only — flag it being mirrored into
          `useState` or Jotai, and flag `router.refresh()` used as a data-refresh mechanism.
        - Component props must be `Readonly<>` (e.g. `({ children }: Readonly<Props>)`).
        - All user-facing strings must go through `t()` from `react-i18next` with lowercase
          dot-nested keys, never hardcoded text.
        - Dates and times must use the shared formatting helpers, never ad-hoc `date-fns`, `Intl`,
          or `toLocale*` calls, and never an implicit/`undefined` locale.
        - Don't ask for `useMemo`/`useCallback` unless there is a measured re-render problem.
        - Do scrutinise effects and closures. `apps/web/eslint.config.mjs` turns
          `react-hooks/set-state-in-effect`, `incompatible-library`, `error-boundaries`,
          `immutability` and `preserve-manual-memoization` off, and leaves `exhaustive-deps` at
          `warn` with no `--max-warnings 0`, so none of them can fail CI. Flag state set from an
          effect without a guard, missing or lying dependency arrays, stale closures over props
          or state, and effects that need cleanup and don't have it.

    - path: "**/*.test.ts"
      instructions: |
        Judge tests by confidence, not coverage (AGENTS.md "Testing Guidelines"):
        - Assert on inputs and outputs. Flag tests that lock implementation details, markup, or
          snapshots, and tests that cannot fail (no meaningful assertion, everything mocked).
        - Do not request extra tests purely to raise coverage, and do not request tests for `.tsx`.
        - Network and storage boundaries should be mocked via helpers from `@formbricks/*` and
          mocks placed in a `__mocks__` directory.

    - path: "apps/web/playwright/**/*.spec.ts"
      instructions: |
        - Flag timing hacks (`waitForTimeout`, arbitrary sleeps) and dependencies on data another
          spec created — these are the repo's main source of flake.
        - Specs must stay small and single-purpose; flag mega-specs. Slow suites need a `@slow` tag.

    - path: "**/actions.ts"
      instructions: |
        A **newly added** exported action is itself the finding: Server Actions are legacy here and
        no new ones should be added. New backend work belongs in an `/api/v3` route consumed from
        the client with TanStack Query. Raise that first, then apply the checks below.

        Server actions are the repo's authorization boundary. For every existing exported action
        that this PR touches, check that:
        - It goes through the shared action client (`authenticatedActionClient` /
          `checkAuthorizationUpdated`), and never trusts an id from the client as proof of access.
        - Input is validated with a zod schema before use.
        - Mutating actions apply `applyRateLimit` and are wrapped in `withAuditLogging`.
        - It returns the `{ data }` / `{ error }` shape consistently and does not leak internal
          error messages, stack traces, or other tenants' identifiers to the caller.
        - Every query is scoped to the caller's organization/workspace.

    - path: "apps/web/{lib/**,modules/**/lib/**}"
      instructions: |
        Data-access layer. Check that:
        - Every query is scoped by organization/workspace — this is a multi-tenant product and an
          unscoped `where` is a cross-tenant data leak, not a style issue.
        - Soft deletion is respected (`deletedAt` / `isActive` filters) where the model has it.
        - `skip`/`offset` is never passed to a `count()` call; only `where` is.
        - Count and data queries run in parallel via `Promise.all`, not sequentially.
        - Large datasets use cursor pagination rather than offset pagination.
        - `createdAt` filters are combined with an indexed column (e.g. `surveyId` + `createdAt`).
        - Caching uses `cache.withCache()` with a key from `createCacheKey.*`. Next.js
          `unstable_cache()` is banned, and cache keys are never built by string concatenation.

    - path: "packages/database/schema/*.prisma"
      instructions: |
        - Every tenant-owned model needs a workspace/organization scope column, and cross-model
          foreign keys between tenant-owned models should be composite (including the scope column)
          so the database — not the caller — enforces that both rows belong to the same tenant.
        - Flag indexes whose leading column is already the leading column of another index or
          unique constraint; a btree on `(a, b)` already serves lookups on `a`.
        - Check `onDelete` / `onUpdate` behaviour on new relations.

    - path: "packages/database/migration/**/migration.sql"
      instructions: |
        Migrations are append-only and run against a live multi-tenant Postgres. Check that:
        - The migration is idempotent and convergent — re-running it, or running it against a
          database created with `db:push`, must not fail.
        - `CREATE INDEX` on an existing large table uses `CONCURRENTLY`; a plain `CREATE INDEX`
          takes a write lock for the duration.
        - Adding a `NOT NULL` column supplies a default or backfills first, and column/table drops
          and renames are called out as breaking (they need the PR's breaking-change table).
        - Long-running `UPDATE`/`DELETE` over a whole table is batched.

    - path: "packages/database/migration/**/migration.ts"
      instructions: |
        Data migrations must be idempotent, batched (never load a whole table into memory), and
        safe to resume after a partial failure. Check transaction boundaries and timeouts.

    - path: "apps/web/app/api/v1/**"
      instructions: |
        API v1 is the legacy public contract used by self-hosted deployments and existing
        integrations. Treat any change to a request or response shape, status code, or default as
        breaking: it must be intentional, and the PR's "Breaking changes" table must document it.
        Prefer adding to v3 over changing v1.

    - path: "apps/web/{app/api/v2,modules/api/v2}/**"
      instructions: |
        Public API v2. Route handlers stay thin; logic lives in `apps/web/modules/api/v2/`. Any
        change to a request or response shape must be mirrored in the endpoint's `lib/openapi.ts`,
        or the published `openapi.yml` silently goes stale. Response-shape changes are breaking.

    - path: "apps/web/app/api/v3/**"
      instructions: |
        Public API v3 — the surface new backend work targets, so hold it to the strictest bar.
        - Handlers go through `withV3ApiWrapper` (`app/api/v3/lib/api-wrapper.ts`), which owns
          auth, input parsing, rate limiting and audit logging. A hand-rolled handler that skips
          it is a finding, not a style preference.
        - Authorization is `requireV3WorkspaceAccess` (`app/api/v3/lib/auth.ts`). Every query is
          scoped by the resolved workspace, never fetched by id alone.
        - Return **403, not 404**, for a resource the caller may not see — a 404 leaks existence.
        - Responses come from the RFC 9457 problem builders in `app/api/v3/lib/response.ts`. No
          invented error envelopes, and no internal or database types leaking into a public shape.
        - Any change to a request or response shape must be mirrored in the hand-authored spec
          under `docs/api-v3-reference/src/**/*.yml`, which CI bundles. A handler change with no
          spec change is a bug unless the shape is genuinely unchanged.
        - A `/v3` route with no public OpenAPI entry is internal by definition and belongs under
          `apps/web/app/api/(internal)/`. Shipping an internal route as public v3 is a finding.

    - path: "apps/web/app/api/(internal)/**"
      instructions: |
        Internal routes, not a public contract — they carry no OpenAPI entry and no compatibility
        promise. Check that they are unreachable without the expected internal authentication, and
        flag anything here that looks like it should have been a public `/api/v3` route instead.

    - path: "apps/web/modules/ee/**"
      instructions: |
        Enterprise Edition code under a separate licence (`apps/web/modules/ee/LICENSE`). Flag any
        change that moves EE code into OSS paths or makes OSS code import from `modules/ee` without
        going through the `license-check` gate, and any EE feature reachable without an
        entitlement check.

    - path: ".github/{workflows,actions}/**"
      instructions: |
        - `GITHUB_TOKEN` needs an explicit minimal `permissions:` block.
        - On `ubuntu-latest`, `step-security/harden-runner` must be the first step.
        - Third-party actions should be pinned to a commit SHA, not a tag.
        - Flag anything that interpolates untrusted input (PR title, body, branch name) directly
          into a `run:` block, and any workflow that exposes secrets to `pull_request_target`.

    - path: "docs/**/*.mdx"
      instructions: |
        Mintlify docs. Frontmatter needs `title`, `description`, and `icon`; the body must not start
        with an H1; headings are Camel Case with only the feature name capitalized. Enterprise-only
        features need the Enterprise note block. New pages must be added to `docs/docs.json` nav.

    - path: "charts/formbricks/**"
      instructions: |
        Helm chart consumed by self-hosters. Flag changes that alter a `values.yaml` key name or
        default, or that require manual action on upgrade, without a breaking-change entry. New
        values need a default that keeps existing installs working unchanged.

    - path: "apps/web/locales/en-US.json"
      instructions: |
        Source of truth for all translations — every other locale file is machine-generated by
        Lingo.dev from this one. Check key naming (lowercase, dot-nested) and placeholder
        consistency. Never suggest editing the other locale files by hand.

    - path: "packages/{surveys,js-core,survey-ui}/**"
      instructions: |
        Ships to end users' websites as an embedded bundle. Be strict about added dependencies and
        bundle size, browser compatibility, and anything that leaks respondent data. No Node-only
        APIs. Public SDK signatures are a compatibility contract — changes are breaking.
  abort_on_close: true
  disable_cache: false

  slop_detection:
    enabled: true

  auto_review:
    enabled: true
    description_keyword: ""
    # On, so the commits that fix a review round get reviewed too — with it off,
    # `auto_pause_after_reviewed_commits` below was dead config and someone had to
    # remember to type `@coderabbitai review`. The pause caps the volume at five
    # reviewed commits since the last pause.
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 5
    ignore_title_keywords: []
    labels: []
    drafts: false
    # Regex, not globs. The dashboard held `epic/*`, which as a regex is "epic"
    # followed by zero or more slashes, unanchored — it also matched branches
    # merely containing "epic", such as `feat/epicenter-cleanup`. The default
    # branch is always reviewed regardless of this list.
    base_branches:
      - "^epic/"
    ignore_usernames: []

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false
    # Off: both let the reviewer author commits on the branch — autofix through the
    # one-click checkboxes under each review comment, not just the chat command. With
    # incremental review on it would then review its own work, so that commit gets no
    # independent reviewer. Reviewers here are read-only on the code; the human who
    # merges owns the diff. Same reasoning as `chat.allow_non_org_members: false`.
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    # Kept: mechanical, and the resolution is visible in the diff like any other change.
    resolve_merge_conflict:
      enabled: true
    custom: []

  pre_merge_checks:
    override_requested_reviewers_only: false
    # Off, not lowered. The detector is unreliable here — it reports "No functions found in the
    # changed files" on PRs that plainly add functions — and the repo does not require docstrings,
    # so every result was ignored. Quoted because unquoted `off` is a boolean in YAML 1.1.
    docstrings:
      mode: "off"
      threshold: 80
    title:
      mode: warning
      requirements: |
        Conventional Commits: `type(optional-scope): summary`, where type is one of feat, fix,
        chore, docs, refactor, perf, test, build, ci, style, or revert. The summary must describe
        what the change does, in lower case, without a trailing period. A Linear ticket reference
        such as `(ENG-1234)` or `[ENG-1234]` may be appended.
    description:
      mode: warning
    issue_assessment:
      mode: warning
    # `pr-label-sync.yml` reads what the Breaking changes section says; these check whether
    # what it says is true of the diff, and whether the QA plan a release tester will be
    # handed is actually executable. Both are advisory — nothing here blocks a merge.
    custom_checks:
      - name: Breaking changes match the diff
        mode: warning
        instructions: |
          Compare the PR description's "## Breaking changes" section against the actual diff.

          Treat a change as breaking if the diff does any of the following:
          - Renames, removes, or retypes a field in an API request or response shape, or changes
            an emitted value (for example `EN` becoming `en-US`).
          - Removes or renames an endpoint or route, or changes a webhook payload.
          - Changes a default value, or removes or renames an environment variable or config key —
            including keys in `charts/formbricks/values.yaml` and `.env.example`. Adding one counts
            only when it is required, or has no default that keeps existing installs working.
          - Adds a database migration that needs manual action, drops or renames a column or
            table, or adds a NOT NULL column with no default and no backfill.
          - Changes an exported signature of the public SDK surface in `packages/js-core` or
            `packages/surveys`.

          FAIL if the diff contains at least one of the above and the "Breaking changes" section
          says "None", is empty, or still holds the unedited template comment. Name the specific
          file and line that is breaking.

          FAIL if the section claims a breaking change that has no corresponding change in the diff.

          PASS if the section describes, in a table or in prose, each breaking change present in
          the diff — `.github/pull_request_template.md` accepts either shape — or if the diff
          contains none of the above and the section says "None".

          Return inconclusive rather than failing when the diff alone does not let you determine
          an API response shape — for example when the shape comes from a serializer or type that
          this PR does not touch.

      - name: QA plan is executable by a tester
        mode: warning
        instructions: |
          Check the PR description's "## QA / Test Plan" section. Its audience is a manual tester
          with no repository or CLI access, working only from the running app or the live API.

          FAIL if any of the following is true:
          - The "How to test" subsection has no steps, or holds only the unedited template
            placeholder text.
          - A step cannot be performed through the app UI or an HTTP request — for example it
            references `pnpm test`, `pnpm build`, `grep`, a source file, a function name, or
            reading code. Those belong in "How this was tested" instead. Published documentation
            pages are a user-facing surface and are fine to reference.
          - A step states an action with no expected result, or an expected result with no action.

          PASS if every step in "How to test" pairs an action such a tester can perform with an
          observable expected result.

          PASS also when the PR changes no user-facing or API behaviour — for example it only
          touches CI configuration, repository tooling, tests, or documentation — and the section
          says so explicitly rather than being left empty.

  post_merge_actions: []

  tools:
    ast-grep:
      rule_dirs: []
      util_dirs: []
      essential_rules: true
      packages: []
    shellcheck:
      enabled: true
    ruff:
      enabled: true
    markdownlint:
      enabled: true
    github-checks:
      enabled: true
      timeout_ms: 90000
    languagetool:
      enabled: true
      enabled_rules: []
      disabled_rules: []
      enabled_categories: []
      disabled_categories: []
      enabled_only: false
      level: default
    biome:
      enabled: true
    hadolint:
      enabled: true
    swiftlint:
      enabled: true
    phpstan:
      enabled: true
      level: default
    phpmd:
      enabled: true
    phpcs:
      enabled: true
    golangci-lint:
      enabled: true
    yamllint:
      enabled: true
    gitleaks:
      enabled: true
    trufflehog:
      enabled: true
    checkov:
      enabled: true
    tflint:
      enabled: true
    detekt:
      enabled: true
    eslint:
      enabled: true
      e18e:
        enabled: true
    flake8:
      enabled: true
    fbinfer:
      enabled: true
      enable_java: false
    fortitudeLint:
      enabled: true
    rubocop:
      enabled: true
    buf:
      enabled: true
    regal:
      enabled: true
    actionlint:
      enabled: true
    zizmor:
      enabled: true
    pmd:
      enabled: true
    clang:
      enabled: true
    cppcheck:
      enabled: true
    opengrep:
      enabled: true
    semgrep:
      enabled: true
    circleci:
      enabled: true
    clippy:
      enabled: true
    sqlfluff:
      enabled: true
    squawk:
      enabled: true
    trivy:
      enabled: true
    prismaLint:
      enabled: true
    pylint:
      enabled: true
    oxc:
      enabled: true
    shopifyThemeCheck:
      enabled: true
    luacheck:
      enabled: true
    brakeman:
      enabled: true
    dotenvLint:
      enabled: true
    htmlhint:
      enabled: true
    stylelint:
      enabled: true
    checkmake:
      enabled: true
    osvScanner:
      enabled: true
    oasdiff:
      enabled: true
    reactDoctor:
      enabled: true
    presidio:
      enabled: true
    blinter:
      enabled: true
    smartyLint:
      enabled: true
    emberTemplateLint:
      enabled: true
    skillspector:
      enabled: true
    psscriptanalyzer:
      enabled: true

chat:
  art: true
  # Public repo: only org members may drive the bot with commands. Outside PRs are
  # still reviewed automatically — this only stops non-members invoking
  # `@coderabbitai` at all. The autofix and fix_ci write recipes are off above, so
  # this is defence in depth rather than the thing keeping them out of reach.
  allow_non_org_members: false
  auto_reply: true
  integrations:
    jira:
      usage: auto
    linear:
      usage: auto

knowledge_base:
  opt_out: false
  web_search:
    enabled: true
  code_guidelines:
    enabled: true
    filePatterns: []
  learnings:
    scope: auto
    # Not 0. A learning is a durable review rule, and at 0 it applies immediately —
    # unversioned, unreviewed, and settable by anyone who replies to the bot. That is
    # the same failure this file exists to end. Seven days give an admin time to reject
    # one. `scope: auto` resolves to local on a public repo, so it stays in this repo.
    approval_delay: 7
  issues:
    scope: auto
  jira:
    usage: auto
    project_keys: []
    excluded_project_keys: []
  linear:
    usage: auto
    team_keys: []
  pull_requests:
    scope: auto
  mcp:
    usage: auto
    disabled_servers: []
  automatic_repository_linking: false
  linked_repositories: []

code_generation:
  docstrings:
    language: en-US
    path_instructions: []
  unit_tests:
    path_instructions: []

issue_enrichment:
  auto_enrich:
    enabled: false
  planning:
    enabled: true
    auto_planning:
      enabled: true
      labels: []
  labeling:
    labeling_instructions: []
    auto_apply_labels: false
