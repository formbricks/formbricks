name: Breaking Change Label

# Keeps the `breaking-change` label in sync with the PR's "Breaking changes" section
# (see .github/pull_request_template.md). If the section declares a change (a filled table
# / any content other than "None"), the label is added; otherwise it is removed. The label
# is what the Release QA audit filters on to compile release notes + the migration guide.
#
# Uses pull_request_target because adding a label needs a write-scoped token (incl. fork PRs).
# This is safe here: the job only reads the PR *body* (data) and never checks out or runs PR code.
# Note: pull_request_target always runs the workflow definition from the base branch, so this
# takes effect once merged to main — it does not self-run on its own introducing PR.

on:
  pull_request_target:
    types: [opened, edited, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: breaking-change-label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync-label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - name: Sync breaking-change label from PR body
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const LABEL = "breaking-change";
            const pr = context.payload.pull_request;

            // Strip HTML comments first so the template's guidance and example table never count.
            const body = (pr.body || "").replace(/<!--[\s\S]*?-->/g, "");

            // Isolate the "## Breaking changes" section (up to the next H2 or end of body).
            const heading = body.match(/^##\s+Breaking changes\s*$/im);
            if (!heading) {
              core.info("No '## Breaking changes' section found; leaving labels unchanged.");
              return;
            }
            const afterHeading = body.slice(heading.index + heading[0].length);
            const nextH2 = afterHeading.search(/^##\s/m);

            // What remains after the heading and comments: table rows, prose, or just "None".
            const content = (nextH2 === -1 ? afterHeading : afterHeading.slice(0, nextH2)).trim();
            const isNone = content === "" || /^none\.?$/i.test(content);
            const isBreaking = !isNone;
            core.info(`Breaking changes section -> ${isBreaking ? "BREAKING" : "none"}`);

            const hasLabel = (pr.labels || []).some((l) => l.name === LABEL);

            if (isBreaking && !hasLabel) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: [LABEL],
              });
              core.info(`Added '${LABEL}'.`);
            } else if (!isBreaking && hasLabel) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                name: LABEL,
              });
              core.info(`Removed '${LABEL}'.`);
            } else {
              core.info("Label already in the correct state; nothing to do.");
            }
