name: Publish v6 upgrade assistant

on:
  workflow_call:
    inputs:
      release_tag:
        description: Existing GitHub release tag receiving the signed bundle
        required: true
        type: string
      bridge_image_ref:
        description: Immutable, signed v5 bridge image reference
        required: true
        type: string
      bridge_runtime_manifest_digest:
        description: Verified digest of the runtime manifest embedded in the bridge image
        required: true
        type: string
      target_image_ref:
        description: Immutable, signed v6 target image reference
        required: true
        type: string
      target_runtime_manifest_digest:
        description: Verified digest of the runtime manifest embedded in the target image
        required: true
        type: string
      minimum_source_version:
        description: Oldest supported v5 source version
        required: false
        default: 5.4.0
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag receiving the signed bundle
        required: true
        type: string
      bridge_image_ref:
        description: Immutable, signed v5 bridge image reference
        required: true
        type: string
      bridge_runtime_manifest_digest:
        description: Verified digest of the runtime manifest embedded in the bridge image
        required: true
        type: string
      target_image_ref:
        description: Immutable, signed v6 target image reference
        required: true
        type: string
      target_runtime_manifest_digest:
        description: Verified digest of the runtime manifest embedded in the target image
        required: true
        type: string
      minimum_source_version:
        description: Oldest supported v5 source version
        required: false
        default: 5.4.0
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Sign and attach preflight bundle
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      packages: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - name: Checkout the released source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb # v3.8.2

      - name: Set up Helm
        uses: azure/setup-helm@5119fcb9089d432beecbf79bb2c7915207344b78 # v3.5
        with:
          version: v3.15.4

      - name: Validate release and signed immutable images
        env:
          BRIDGE_IMAGE_REF: ${{ inputs.bridge_image_ref }}
          BRIDGE_RUNTIME_MANIFEST_DIGEST: ${{ inputs.bridge_runtime_manifest_digest }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TARGET_IMAGE_REF: ${{ inputs.target_image_ref }}
          TARGET_RUNTIME_MANIFEST_DIGEST: ${{ inputs.target_runtime_manifest_digest }}
        run: |
          set -euo pipefail

          image_pattern='^ghcr\.io/formbricks/formbricks@sha256:[0-9a-f]{64}$'
          if [[ ! "$BRIDGE_IMAGE_REF" =~ $image_pattern ]]; then
            echo "::error::bridge_image_ref must be an immutable official image reference"
            exit 1
          fi
          if [[ ! "$TARGET_IMAGE_REF" =~ $image_pattern ]]; then
            echo "::error::target_image_ref must be an immutable official image reference"
            exit 1
          fi
          if [[ "$BRIDGE_IMAGE_REF" == "$TARGET_IMAGE_REF" ]]; then
            echo "::error::Bridge and target images must be distinct build artifacts"
            exit 1
          fi
          digest_pattern='^sha256:[0-9a-f]{64}$'
          if [[ ! "$BRIDGE_RUNTIME_MANIFEST_DIGEST" =~ $digest_pattern || ! "$TARGET_RUNTIME_MANIFEST_DIGEST" =~ $digest_pattern ]]; then
            echo "::error::runtime manifest digests must come from verified image artifacts"
            exit 1
          fi
          if [[ "$BRIDGE_RUNTIME_MANIFEST_DIGEST" == "$TARGET_RUNTIME_MANIFEST_DIGEST" ]]; then
            echo "::error::Bridge and target runtime manifests must be distinct"
            exit 1
          fi

          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null

          identity='^https://github\.com/formbricks/formbricks/\.github/workflows/.+@refs/(heads/main|tags/.+)$'
          issuer='https://token.actions.githubusercontent.com'
          cosign verify --certificate-identity-regexp "$identity" --certificate-oidc-issuer "$issuer" \
            "$BRIDGE_IMAGE_REF" >/dev/null
          cosign verify --certificate-identity-regexp "$identity" --certificate-oidc-issuer "$issuer" \
            "$TARGET_IMAGE_REF" >/dev/null

      - name: Build release-matched preflight bundle
        env:
          BRIDGE_IMAGE_REF: ${{ inputs.bridge_image_ref }}
          BRIDGE_RUNTIME_MANIFEST_DIGEST: ${{ inputs.bridge_runtime_manifest_digest }}
          MINIMUM_SOURCE_VERSION: ${{ inputs.minimum_source_version }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TARGET_IMAGE_REF: ${{ inputs.target_image_ref }}
          TARGET_RUNTIME_MANIFEST_DIGEST: ${{ inputs.target_runtime_manifest_digest }}
        run: |
          set -euo pipefail
          source_revision=$(git rev-parse HEAD)
          scripts/build-v6-upgrade-assistant-bundle.sh \
            --release-version "$RELEASE_TAG" \
            --source-revision "$source_revision" \
            --minimum-source-version "$MINIMUM_SOURCE_VERSION" \
            --bridge-image "$BRIDGE_IMAGE_REF" \
            --bridge-runtime-manifest-digest "$BRIDGE_RUNTIME_MANIFEST_DIGEST" \
            --target-image "$TARGET_IMAGE_REF" \
            --target-runtime-manifest-digest "$TARGET_RUNTIME_MANIFEST_DIGEST" \
            --output-directory dist/v6-upgrade

          release_version="${RELEASE_TAG#v}"
          helm lint charts/formbricks
          helm package charts/formbricks \
            --version "$release_version" \
            --app-version "$release_version" \
            --destination dist/v6-upgrade
          helm lint charts/formbricks-upgrade --values charts/formbricks-upgrade/values.example.yaml
          helm package charts/formbricks-upgrade \
            --version "$release_version" \
            --app-version "$release_version" \
            --destination dist/v6-upgrade

          (
            cd dist/v6-upgrade
            sha256sum \
              formbricks-upgrade-assistant \
              formbricks-upgrade-manifest.json \
              "formbricks-${release_version}.tgz" \
              "formbricks-upgrade-${release_version}.tgz" \
              > formbricks-upgrade-checksums.txt
          )

      - name: Sign and verify checksums
        env:
          CERTIFICATE_IDENTITY_REGEXP: ^https://github\.com/formbricks/formbricks/\.github/workflows/.+@refs/(heads/main|tags/.+)$
        run: |
          set -euo pipefail
          issuer='https://token.actions.githubusercontent.com'
          cosign sign-blob --yes \
            --bundle dist/v6-upgrade/formbricks-upgrade-checksums.sigstore.json \
            dist/v6-upgrade/formbricks-upgrade-checksums.txt
          cosign verify-blob \
            --bundle dist/v6-upgrade/formbricks-upgrade-checksums.sigstore.json \
            --certificate-identity-regexp "$CERTIFICATE_IDENTITY_REGEXP" \
            --certificate-oidc-issuer "$issuer" \
            dist/v6-upgrade/formbricks-upgrade-checksums.txt
          (cd dist/v6-upgrade && sha256sum --check formbricks-upgrade-checksums.txt)

      - name: Attach signed bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            dist/v6-upgrade/formbricks-upgrade-assistant \
            dist/v6-upgrade/formbricks-upgrade-manifest.json \
            dist/v6-upgrade/formbricks-[0-9]*.tgz \
            dist/v6-upgrade/formbricks-upgrade-*.tgz \
            dist/v6-upgrade/formbricks-upgrade-checksums.txt \
            dist/v6-upgrade/formbricks-upgrade-checksums.sigstore.json
