name: Docker Security Scan

on:
  schedule:
    - cron: "0 2 * * *" # Daily at 2 AM UTC
  workflow_dispatch:
  # Called by formbricks-release.yml once the community image is published, so a release is
  # scanned by the digest it actually pushed rather than whatever `:latest` points at. Called
  # workflows see the caller's github context, so github.ref/github.sha are the release tag.
  workflow_call:
    inputs:
      image_ref:
        description: "Image to scan, pinned by digest (e.g. ghcr.io/formbricks/formbricks@sha256:...)"
        required: true
        type: string

permissions:
  contents: read
  packages: read
  security-events: write

jobs:
  scan:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout (for SARIF fingerprinting only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ inputs.image_ref || format('ghcr.io/{0}:latest', github.repository) }}
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH,MEDIUM,LOW"
          version: "v0.71.2"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        with:
          sarif_file: "trivy-results.sarif"
          ref: ${{ github.ref }}
          sha: ${{ github.sha }}
          category: "trivy-container-scan"

  # The bundled Cube image (docker/cube-image, published by cube-image.yml) on the daily schedule and
  # manual runs only. A release calls this workflow for its own community image, so the job skips
  # whenever `image_ref` is passed.
  scan-cube:
    name: Vulnerability Scan (Cube)
    if: ${{ !inputs.image_ref }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout (for SARIF fingerprinting and the pinned tag)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # Scan what the chart installs, not `latest`, which follows main rather than a release.
      - name: Resolve the pinned Cube image
        id: cube
        shell: bash
        run: |
          set -euo pipefail
          image="$(yq -r '.cube.image.repository + ":" + .cube.image.tag' charts/formbricks/values.yaml)"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.cube.outputs.image }}
          format: "sarif"
          output: "trivy-cube-results.sarif"
          severity: "CRITICAL,HIGH,MEDIUM,LOW"
          version: "v0.71.2"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: ${{ always() && hashFiles('trivy-cube-results.sarif') != '' }}
        with:
          sarif_file: "trivy-cube-results.sarif"
          ref: ${{ github.ref }}
          sha: ${{ github.sha }}
          category: "trivy-cube-image-scan"
