name: API v3 Contract Tests

# Drives a real instance against the committed v3 OpenAPI bundle with Schemathesis and fails when a
# response violates the documented status codes, content type, or schema — or answers 5xx.
# api-v3-spec.yml proves the document is well-formed and the bundle is fresh; this proves the running
# API still matches it. Harness and local instructions: docs/api-v3-reference/contract-tests/.
#
# Fast profile on purpose: the `examples` phase only, which is a sampled case per documented
# operation (~70 requests, ~25s). The job's cost is the Next.js build, not the tests. Deep fuzzing,
# the coverage phase and stateful suites are deliberately out of the PR gate.

on:
  workflow_call:
    secrets:
      ENTERPRISE_LICENSE_KEY:
        # Optional: without it every entitlement-gated operation answers its documented 403 instead of
        # a real payload — the run stays honest, just shallower, which is also the fork-PR path since
        # secrets are never available there. With it, `contacts` resolves; `workflows` does not yet,
        # because the CI key's feature set does not grant it (ENG-2553). The probe after boot reports
        # which of the two you got.
        required: false
  workflow_dispatch:

permissions:
  contents: read

# No `concurrency` block on purpose: under `workflow_call`, `github.workflow` resolves to the *caller*,
# so the obvious group expression would collide with pr.yml's own group and let this job cancel its
# parent. The caller's concurrency already covers superseded runs. e2e.yml omits it for the same reason.

jobs:
  contract-tests:
    name: v3 OpenAPI contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      # Same pinned images as e2e.yml so both jobs exercise the same engine versions.
      postgres:
        image: pgvector/pgvector@sha256:9ae02a756ba16a2d69dd78058e25915e36e189bb36ddf01ceae86390d7ed786a
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      valkey:
        image: valkey/valkey@sha256:e0eb7c480958d32bdc4357a74bdd70653ae15f2f9b4c93c4a5a9fad1dc471c84
        ports:
          - 6379:6379
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false # no later step needs git auth (dangerous-git-checkout re-auths)
      - uses: ./.github/actions/dangerous-git-checkout

      # This workflow is resolved from the base branch but tests the PR head, so branches cut before
      # this landed do not contain the harness. Detect it and skip instead of failing every open PR —
      # same pattern, and same reason, as integration-tests.yml.
      - name: Detect contract-test harness
        id: harness
        shell: bash
        run: |
          if [ -f docs/api-v3-reference/contract-tests/hooks.py ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v3 contract-test harness absent on this ref (branch predates ENG-2191) — skipping."
          fi

      - name: Install pnpm
        if: steps.harness.outputs.present == 'true'
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node.js (version from .nvmrc)
        if: steps.harness.outputs.present == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        if: steps.harness.outputs.present == 'true'
        run: pnpm install --frozen-lockfile --config.platform=linux --config.architecture=x64
        shell: bash

      # Must exist before the build: @formbricks/database's prisma.config.ts resolves DATABASE_URL at
      # config load, so `prisma generate` fails without it. Same order as e2e.yml.
      - name: Create .env
        if: steps.harness.outputs.present == 'true'
        run: pnpm dev:setup
        shell: bash

      - name: Point .env at the CI services
        if: steps.harness.outputs.present == 'true'
        shell: bash
        # The license reaches the script through `env`, never interpolated into the command: a `${{ }}`
        # secret pasted into a `sed` expression both breaks on its own metacharacters and is the pattern
        # GitHub's hardening guidance tells you not to write.
        env:
          ENTERPRISE_LICENSE_KEY: ${{ secrets.ENTERPRISE_LICENSE_KEY }}
        run: |
          sed -i "s|REDIS_URL=.*|REDIS_URL=redis://localhost:6379|" .env
          sed -i "/^ENTERPRISE_LICENSE_KEY=/d" .env
          printf 'ENTERPRISE_LICENSE_KEY=%s\n' "${ENTERPRISE_LICENSE_KEY}" >> .env
          # A burst of cases would otherwise trip the limiter and turn most operations into
          # documented-but-uninteresting 429s.
          echo "RATE_LIMITING_DISABLED=1" >> .env
          sed -i "s|AUTHZED_CONSISTENCY=.*|AUTHZED_CONSISTENCY=fully_consistent|" .env
          # Not about running Playwright: this is the flag that stops the app sending an instanceId
          # alongside the shared licence key (license.ts — "Skip instance ID during E2E tests to avoid
          # license key conflicts"). Without it the licence server answers 403 "bound to another
          # instance", every entitlement falls back to DEFAULT_FEATURES, and the 13 workflow
          # operations plus contacts are only ever checked against their documented 403.
          echo "E2E_TESTING=1" >> .env

      - name: Build App
        if: steps.harness.outputs.present == 'true'
        timeout-minutes: 15
        env:
          # Turborepo hashes its own process environment, not the `.env` file, and next.config.mjs
          # reads this at build time — so setting it only in `.env` would let a cached non-E2E build
          # be replayed here. Same reason e2e.yml passes it twice.
          E2E_TESTING: "1"
        run: pnpm build --filter=@formbricks/web...
        shell: bash

      # Keep the fixture offline during the build: a successful build still proves importing the
      # authorization runtime does not perform an RPC. Runtime contract requests are authoritative,
      # however, so install the canonical schema before projecting the seeded PostgreSQL grants.
      - name: Start AuthZed CI fixture
        if: steps.harness.outputs.present == 'true'
        run: bash scripts/start-authzed-ci.sh
        shell: bash

      - name: Apply Prisma migrations
        if: steps.harness.outputs.present == 'true'
        # @formbricks/database is already built by the build step, so run the migration runner
        # directly rather than db:migrate:dev, which would rebuild and re-generate the package.
        run: pnpm --filter=@formbricks/database db:migrate:ci
        shell: bash

      # Feedback records are the one v3 resource whose data lives outside this database: the app
      # authorizes the call and forwards it to the feedback store (ghcr.io/formbricks/hub). Without a
      # store, the nine feedback operations answer 503 — documented, but a 5xx, so the run would fail
      # on `not_a_server_error` and the operations would only ever be seen degraded.
      #
      # Started with `docker run` rather than as a `services:` container because the sequence matters:
      # create the database, migrate it, *then* start the API. A service container starts before any
      # step runs and would exit against an unmigrated database with nothing to restart it.
      - name: Start the embedding stub
        if: steps.harness.outputs.present == 'true'
        shell: bash
        run: |
          node docs/api-v3-reference/contract-tests/embedding-stub.mjs 8079 > embedding-stub.log 2>&1 &
          for _ in {1..10}; do
            if [ "$(curl -o /dev/null -s -w "%{http_code}" http://localhost:8079/health)" -eq 200 ]; then
              echo "Embedding stub is ready."
              exit 0
            fi
            sleep 1
          done
          echo "::error::Embedding stub failed to start; the two semantic-search operations would answer 503."
          cat embedding-stub.log
          exit 1

      - name: Start the feedback store
        if: steps.harness.outputs.present == 'true'
        shell: bash
        env:
          # Same tag the dev compose pins, and the same one the chart ships, so CI exercises the
          # contract the product actually serves. Keep the API and the worker on one tag: they share
          # an image, and drift breaks migrations or job processing.
          HUB_IMAGE: ghcr.io/formbricks/hub:0.8.5
          # Matches .env.example, which `pnpm dev:setup` copied — so the app needs no further wiring.
          HUB_API_KEY: dev-api-key
          HUB_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hub?sslmode=disable
        run: |
          set -euo pipefail

          # psql from the same pinned image the postgres service runs, rather than assuming the runner
          # ships a client. Already pulled, so this costs nothing.
          docker run --rm --network host \
            -e PGPASSWORD=postgres \
            pgvector/pgvector@sha256:9ae02a756ba16a2d69dd78058e25915e36e189bb36ddf01ceae86390d7ed786a \
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE hub"

          # goose for the schema, river for the job queue the embedding worker consumes — the same two
          # commands, in the same order, as the `hub-migrate` service in docker-compose.dev.yml.
          docker run --rm --network host -e DATABASE_URL="${HUB_DATABASE_URL}" \
            --entrypoint sh "${HUB_IMAGE}" -c \
            '/usr/local/bin/goose -dir /app/migrations postgres "$DATABASE_URL" up && /usr/local/bin/river migrate-up --database-url "$DATABASE_URL"'

          # `--network host` so the store reaches postgres and the embedding stub on localhost, and the
          # app reaches the store the same way. The embedding provider must be `openai`: it is the only
          # one that honours EMBEDDING_BASE_URL, and it insists on a non-empty key the stub ignores.
          hub_env=(
            -e "DATABASE_URL=${HUB_DATABASE_URL}"
            -e "API_KEY=${HUB_API_KEY}"
            -e PGHOST=localhost -e PGPORT=5432 -e PGUSER=postgres -e PGPASSWORD=postgres
            -e PGDATABASE=hub -e PGSSLMODE=disable
            -e EMBEDDING_PROVIDER=openai
            -e EMBEDDING_MODEL=text-embedding-3-small
            -e EMBEDDING_PROVIDER_API_KEY=embedding-stub-ignores-this
            -e EMBEDDING_BASE_URL=http://localhost:8079/v1
          )
          docker run -d --name hub --network host "${hub_env[@]}" "${HUB_IMAGE}"
          docker run -d --name hub-worker --network host "${hub_env[@]}" \
            --entrypoint /app/hub-worker "${HUB_IMAGE}"

          for attempt in {1..20}; do
            # 401 is the healthy answer to an unauthenticated read: the store is up and refusing.
            status=$(curl -o /dev/null -s -w "%{http_code}" http://localhost:8080/v1/feedback-records)
            if [ "${status}" -eq 401 ]; then
              echo "Feedback store is ready."
              exit 0
            fi
            echo "Waiting for the feedback store... (${attempt}/20, last status ${status})"
            sleep 3
          done
          echo "::error::Feedback store failed to start in time."
          docker logs hub 2>&1 | tail -40
          exit 1

      - name: Seed the workspace and a throwaway API key
        if: steps.harness.outputs.present == 'true'
        shell: bash
        run: |
          # Generated per run and never leaves this job: the database is disposable and the key only
          # ever grants access to the seeded workspace on this runner.
          SEED_API_KEY="$(openssl rand -hex 32)"
          echo "::add-mask::${SEED_API_KEY}"
          echo "SEED_API_KEY=${SEED_API_KEY}" >> "$GITHUB_ENV"
          SEED_API_KEY="${SEED_API_KEY}" pnpm --filter=@formbricks/database db:seed

      - name: Seed the contract fixtures
        if: steps.harness.outputs.present == 'true'
        run: pnpm --filter=@formbricks/database db:seed:contract
        shell: bash

      - name: Project seeded authorization relationships
        if: steps.harness.outputs.present == 'true'
        shell: bash
        run: |
          set +e
          pnpm authzed:backfill --apply > /tmp/authzed-backfill.json
          backfill_exit=$?
          set -e

          # Aggregate evidence only: the detailed report contains disposable fixture identifiers.
          jq -c '{status, code, counters, truncated}' /tmp/authzed-backfill.json || true
          exit "${backfill_exit}"

      - name: Run App
        if: steps.harness.outputs.present == 'true'
        shell: bash
        run: |
          NODE_ENV=test pnpm start --filter=@formbricks/web > app.log 2>&1 &
          for attempt in {1..20}; do
            if [ "$(curl -o /dev/null -s -w "%{http_code}" http://localhost:3000/health)" -eq 200 ]; then
              echo "Application is ready."
              exit 0
            fi
            echo "Waiting for the application to be ready... (${attempt}/20)"
            sleep 5
          done
          echo "::error::Application failed to start in time."
          exit 1

      # Guards the failure mode this job is most likely to die of quietly: if seeding or the API key
      # broke, every operation would answer 401/403 — all documented, so Schemathesis would report a
      # green run that proved nothing. One authenticated read is enough to know the fixtures are live.
      - name: Verify the seeded API key reaches real data
        if: steps.harness.outputs.present == 'true'
        shell: bash
        run: |
          workspace_id=$(node -p "require('./docs/api-v3-reference/contract-tests/fixtures.json').workspaceId")
          status=$(curl -o /tmp/preflight.json -s -w "%{http_code}" \
            -H "x-api-key: fbk_${SEED_API_KEY}" \
            "http://localhost:3000/api/v3/surveys?workspaceId=${workspace_id}&limit=1")
          if [ "${status}" -ne 200 ]; then
            echo "::error::Pre-flight read returned ${status}, expected 200. Seeded data or API key is broken — the contract run would be meaningless."
            cat /tmp/preflight.json
            exit 1
          fi

          # The list endpoint above answers 200 off the base seed alone, so it says nothing about the
          # contract fixtures. The deepest response schema in the contract — the survey resource —
          # only gets exercised when the read fixture exists *and* carries the languages the spec's
          # `lang` examples ask for; without them the operation degrades to a documented 400 and the
          # suite stays green having validated nothing.
          survey_id=$(node -p "require('./docs/api-v3-reference/contract-tests/fixtures.json').read.surveyId")
          survey_status=$(curl -o /tmp/preflight-survey.json -s -w "%{http_code}" \
            -H "x-api-key: fbk_${SEED_API_KEY}" \
            "http://localhost:3000/api/v3/surveys/${survey_id}?lang=de-DE")
          if [ "${survey_status}" -ne 200 ]; then
            echo "::error::Read fixture check returned ${survey_status}, expected 200. The survey resource schema would not be validated by this run."
            cat /tmp/preflight-survey.json
            exit 1
          fi

          # Entitlement-gated operations answer a documented 403 when the licence does not grant the
          # feature, so the suite stays green while testing half the contract shallowly. Probe one of
          # them and say so out loud, rather than leaving that to whoever reads the warnings.
          workflows_status=$(curl -o /tmp/preflight-workflows.json -s -w "%{http_code}" \
            -H "x-api-key: fbk_${SEED_API_KEY}" \
            "http://localhost:3000/api/v3/workflows?workspaceId=${workspace_id}&limit=1")
          if [ "${workflows_status}" -eq 200 ]; then
            echo "::notice::Workflows entitlement active — the 13 workflow operations run against real data."
          elif [ "${workflows_status}" -eq 403 ]; then
            echo "::warning::Workflows entitlement inactive (GET /api/v3/workflows → ${workflows_status}). The 13 workflow operations are only checked against their documented 403."
            cat /tmp/preflight-workflows.json
          else
            # Anything else is a setup failure, not an entitlement answer. Treating it as "inactive"
            # would let a 401 or 404 pass as a warning and the run go green having never exercised the
            # workflow fixtures at all — the shallow-green outcome this whole job exists to prevent.
            echo "::error::Workflow entitlement probe returned ${workflows_status}, expected 200 or 403."
            cat /tmp/preflight-workflows.json
            exit 1
          fi

      # Same reasoning as the survey fixture check above: the feedback operations all answer a
      # documented 403 when the dataset is not reachable, so a broken fixture would leave the run
      # green having validated none of the record or dataset schemas.
      - name: Verify the feedback fixtures reach real data
        if: steps.harness.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          fixtures=./docs/api-v3-reference/contract-tests/fixtures.json
          workspace_id=$(node -p "require('${fixtures}').workspaceId")
          dataset_id=$(node -p "require('${fixtures}').read.datasetId ?? ''")
          record_id=$(node -p "require('${fixtures}').read.feedbackRecordId ?? ''")

          if [ -z "${dataset_id}" ] || [ -z "${record_id}" ]; then
            echo "::error::No feedback fixtures in the id map. The seeder could not reach the feedback store, so all nine feedback operations would only be checked against their documented 403."
            exit 1
          fi

          record_status=$(curl -o /tmp/preflight-feedback.json -s -w "%{http_code}" \
            -H "x-api-key: fbk_${SEED_API_KEY}" \
            "http://localhost:3000/api/v3/feedback-records/${record_id}?workspaceId=${workspace_id}")
          if [ "${record_status}" -ne 200 ]; then
            echo "::error::Feedback record fixture read returned ${record_status}, expected 200."
            cat /tmp/preflight-feedback.json
            exit 1
          fi

          # The rename this whole change is about. A response that still carried the store's spelling
          # would satisfy the schema only if the schema were wrong too, and both were written in the
          # same sitting — so assert the wire name directly rather than trusting the pair to disagree.
          if ! node -e "
            const body = require('/tmp/preflight-feedback.json');
            const record = body.data ?? {};
            if (!('datasetId' in record)) throw new Error('response carries no datasetId: ' + JSON.stringify(Object.keys(record)));
            if ('tenant_id' in record || 'dataset_id' in record) throw new Error('response still carries the store spelling');
          "; then
            echo "::error::The feedback record response is not in v3 spelling."
            cat /tmp/preflight-feedback.json
            exit 1
          fi
          echo "::notice::Feedback fixtures live; record responses are in v3 spelling."

      # Text is embedded asynchronously after it is stored, so a freshly seeded record has no embedding
      # for a moment and `/similar` correctly answers 409. Both are documented, so the run is green
      # either way — but 200 is the one that validates the match schema, so wait for it and say so when
      # it does not arrive.
      - name: Wait for the seeded record to be embedded
        if: steps.harness.outputs.present == 'true'
        shell: bash
        run: |
          set -uo pipefail
          fixtures=./docs/api-v3-reference/contract-tests/fixtures.json
          workspace_id=$(node -p "require('${fixtures}').workspaceId")
          record_id=$(node -p "require('${fixtures}').read.feedbackRecordId")

          for _ in {1..20}; do
            status=$(curl -o /tmp/preflight-similar.json -s -w "%{http_code}" \
              -H "x-api-key: fbk_${SEED_API_KEY}" \
              "http://localhost:3000/api/v3/feedback-records/${record_id}/similar?workspaceId=${workspace_id}")
            if [ "${status}" -eq 200 ]; then
              echo "::notice::Seeded record is embedded — the similarity operations run against real vectors."
              exit 0
            fi
            if [ "${status}" -ne 409 ]; then
              echo "::error::Similarity probe returned ${status}, expected 200 or 409."
              cat /tmp/preflight-similar.json
              docker logs hub-worker 2>&1 | tail -20
              exit 1
            fi
            sleep 3
          done
          echo "::warning::Seeded record still has no embedding after 60s. The two similarity operations are only checked against their documented 409 — the response schema for a match is not validated by this run."
          docker logs hub-worker 2>&1 | tail -20

      - name: Set up Python
        if: steps.harness.outputs.present == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Schemathesis
        if: steps.harness.outputs.present == 'true'
        run: python -m pip install schemathesis==4.25.0
        shell: bash

      # `--exclude-path-regex '^/api/v3/responses'` skips the eight response operations. They are
      # documented (ENG-2868 agreed the contract before implementation, deliberately) but not yet
      # routed, and `fill-missing` in schemathesis.toml means a documented operation is exercised the
      # moment it appears — so each one answers Next.js's HTML 404 against a spec that documents
      # 200/400/401/403/429/500. Remove the flag when the routes land: ENG-2959, which is blocked by
      # the read, write, delete, batch-delete and validate tickets. Verify by re-running the command
      # below without the flag and checking the selected-operation count rises.
      - name: Run v3 contract tests
        if: steps.harness.outputs.present == 'true'
        shell: bash
        env:
          SCHEMATHESIS_HOOKS: docs/api-v3-reference/contract-tests/hooks.py
        run: |
          schemathesis \
            --config-file docs/api-v3-reference/contract-tests/schemathesis.toml \
            run docs/api-v3-reference/openapi.yml \
            --url http://localhost:3000 \
            --phases examples \
            --checks not_a_server_error,status_code_conformance,content_type_conformance,response_schema_conformance \
            --exclude-path-regex '^/api/v3/responses' \
            --generation-database=:memory: \
            --report junit \
            --report-dir schemathesis-report \
            -H "x-api-key: fbk_${SEED_API_KEY}"

      # Schemathesis proves the surface matches its documentation. It cannot prove tenancy: it is only
      # ever told about one workspace, so a cross-tenant read would never be attempted, let alone
      # caught. This is that missing axis, and it is deliberately a separate script so it can be run
      # against any instance rather than only here.
      - name: Check tenant isolation
        if: steps.harness.outputs.present == 'true'
        shell: bash
        run: bash docs/api-v3-reference/contract-tests/tenancy-check.sh http://localhost:3000

      - name: Upload contract test report
        if: always() && steps.harness.outputs.present == 'true'
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: api-v3-contract-report
          if-no-files-found: ignore
          path: schemathesis-report/

      # Failure only. A green run's log has nothing to say that the entitlement probe above does not,
      # and an application log is the wrong thing to ship as an artifact on every green PR.
      - name: Upload app logs
        if: failure() && steps.harness.outputs.present == 'true'
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: api-v3-contract-app-logs
          if-no-files-found: ignore
          path: app.log

      # The store and its worker are the new moving parts, and an embedding failure is invisible in
      # the app log — it shows up as a permanent 409 on the similarity operations and nothing else.
      - name: Collect feedback store logs
        if: failure() && steps.harness.outputs.present == 'true'
        shell: bash
        run: |
          docker logs hub > hub.log 2>&1 || true
          docker logs hub-worker > hub-worker.log 2>&1 || true

      - name: Upload feedback store logs
        if: failure() && steps.harness.outputs.present == 'true'
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: api-v3-contract-store-logs
          if-no-files-found: ignore
          path: |
            hub.log
            hub-worker.log
            embedding-stub.log
