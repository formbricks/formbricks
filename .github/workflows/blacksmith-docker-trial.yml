name: Verify bounded cache pruning on a disposable clone
on:
  workflow_call:
permissions:
  contents: read
jobs:
  prune:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: useblacksmith/setup-docker-builder@19215110ab936351210feebdfa5b440b4493e184 # v2
        with:
          cache-key: apps/web/Dockerfile-blacksmith-trial-amd64
          nofallback: true
      - name: Reclaim real cache entries and check disk usage
        run: |
          docker buildx du
          docker buildx prune --force --max-used-space 15gb
          docker buildx du
          echo 'Cache reclamation and post-prune disk usage succeeded.'
      - name: Discard this diagnostic clone
        run: |
          echo 'Intentional failure prevents committing this diagnostic clone to the shared cache.'
          exit 1
