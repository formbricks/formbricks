name: Inspect completed ARM64 release cache
on:
  workflow_call:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: blacksmith-32vcpu-ubuntu-2404-arm
    timeout-minutes: 10
    steps:
      - uses: useblacksmith/setup-docker-builder@19215110ab936351210feebdfa5b440b4493e184 # v2
        with:
          cache-key: apps/web/Dockerfile-blacksmith-trial-arm64
          nofallback: true
      - name: Inspect restored cache records
        run: docker buildx du --verbose
      - name: Discard this diagnostic clone
        run: |
          echo 'Intentional failure prevents committing this diagnostic clone to the shared cache.'
          exit 1
