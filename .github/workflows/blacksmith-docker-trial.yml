name: Inspect Blacksmith release cache
on:
  workflow_call:
permissions:
  contents: read
jobs:
  inspect:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: blacksmith-16vcpu-ubuntu-2404
          - arch: arm64
            runner: blacksmith-16vcpu-ubuntu-2404-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - uses: useblacksmith/setup-docker-builder@19215110ab936351210feebdfa5b440b4493e184 # v2
        with:
          cache-key: apps/web/Dockerfile-blacksmith-trial-${{ matrix.arch }}
          nofallback: true
      - name: Inspect restored cache without committing a new snapshot
        run: |
          docker buildx du
          sudo du -sb /var/lib/buildkit
          echo 'Diagnostic job intentionally fails to prevent cache commit; no build or pruning was performed.'
          exit 1
