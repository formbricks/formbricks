name: Lint
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Linters
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: formbricks_migration_shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/dangerous-git-checkout

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node.js (version from .nvmrc)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.platform=linux --config.architecture=x64

      - name: Create .env
        run: pnpm dev:setup

      # Runs before the linters: formatting takes seconds where linting takes
      # minutes, so a formatting slip fails fast instead of after a full lint.
      # Otherwise only applied by the lint-staged pre-commit hook, which
      # `git commit --no-verify` skips. Run `pnpm format` to fix failures.
      - name: Check formatting
        run: pnpm format:check

      - name: Lint changed database migrations
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
        shell: bash
        run: |
          set -euo pipefail

          base_sha="${BASE_SHA}"
          if [[ -z "${base_sha}" ]]; then
            base_sha="$(git rev-parse HEAD^)"
            echo "::notice::No event base SHA was provided; comparing against ${base_sha}."
          fi

          if [[ ! "${base_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid base SHA: ${base_sha}"
            exit 1
          fi

          if ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "${base_sha}"
          fi

          mapfile -d '' base_migration_files < <(
            git diff --diff-filter=ACMR --name-only -z "${base_sha}" HEAD -- \
              'packages/database/migration/*/migration.sql'
          )

          if (( ${#base_migration_files[@]} == 0 )); then
            echo "::notice::No changed schema migrations to lint."
            exit 0
          fi

          # The diff against the PR base is the wrong scope on its own for a merge-direction PR --
          # one that syncs main into a long-lived epic branch. From that base's point of view every
          # migration main has gained since the fork is newly added, so the step lints migrations
          # that are already applied in production and immutable by checksum: unfixable findings on
          # a PR that did not write them.
          #
          # A migration is this branch's business only if it is new or changed against *both* the
          # PR base and main, so intersect the two diffs. For an ordinary PR into main the base is
          # on main and the two sets are identical, which leaves that path behaving exactly as
          # before.
          git fetch --no-tags --depth=1 origin main
          main_sha="$(git rev-parse FETCH_HEAD)"

          mapfile -d '' main_migration_files < <(
            git diff --diff-filter=ACMR --name-only -z "${main_sha}" HEAD -- \
              'packages/database/migration/*/migration.sql'
          )

          migration_files=()
          for base_migration_file in "${base_migration_files[@]}"; do
            for main_migration_file in "${main_migration_files[@]}"; do
              if [[ "${base_migration_file}" == "${main_migration_file}" ]]; then
                migration_files+=("${base_migration_file}")
                break
              fi
            done
          done

          if (( ${#migration_files[@]} == 0 )); then
            echo "::notice::No schema migrations of this branch's own to lint."
            exit 0
          fi

          absolute_migration_files=()
          for migration_file in "${migration_files[@]}"; do
            absolute_migration_files+=("${GITHUB_WORKSPACE}/${migration_file}")
          done

          printf 'Linting migration: %s\n' "${migration_files[@]}"
          pnpm --filter @formbricks/database lint:migrations -- "${absolute_migration_files[@]}"

      - name: Check database migration drift
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?schema=public
          SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/formbricks_migration_shadow?schema=public
        run: pnpm --filter @formbricks/database check:migration-drift

      - name: Lint
        run: pnpm lint
