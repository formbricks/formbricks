name: Build, release & deploy Formbricks images

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  check-latest-release:
    name: Check if this is the latest release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      is_latest: ${{ steps.compare_tags.outputs.is_latest }}
    # This job determines if the current release was marked as "Set as the latest release"
    # by comparing it with the latest release from GitHub API
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - name: Get latest release tag from API
        id: get_latest_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Get the latest release tag from GitHub API with error handling
          echo "Fetching latest release from GitHub API..."

          # Use curl with error handling - API returns 404 if no releases exist
          if ! http_code=$(curl -sS -w "%{http_code}" -H "Authorization: token ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${REPO}/releases/latest" -o /tmp/latest_release.json); then
            echo "❌ GitHub API request failed; refusing to select a moving release alias."
            exit 1
          fi

          if [[ "$http_code" == "404" ]]; then
            echo "⚠️  No previous releases found (404). This appears to be the first release."
            echo "latest_release=" >> $GITHUB_OUTPUT
          elif [[ "$http_code" == "200" ]]; then
            latest_release=$(jq -r .tag_name /tmp/latest_release.json)
            if [[ "$latest_release" == "null" || -z "$latest_release" ]]; then
              echo "❌ GitHub API returned an invalid latest release payload."
              exit 1
            else
              echo "Latest release from API: ${latest_release}"
              echo "latest_release=${latest_release}" >> $GITHUB_OUTPUT
            fi
          else
            echo "❌ GitHub API error (HTTP ${http_code}); refusing to select a moving release alias."
            exit 1
          fi

          echo "Current release tag: ${{ github.event.release.tag_name }}"

      - name: Compare release tags
        id: compare_tags
        env:
          CURRENT_TAG: ${{ github.event.release.tag_name }}
          LATEST_TAG: ${{ steps.get_latest_release.outputs.latest_release }}
        run: |
          set -euo pipefail

          # Handle first release case (no previous releases)
          if [[ -z "${LATEST_TAG}" ]]; then
            echo "🎉 This is the first release (${CURRENT_TAG}) - treating as latest"
            echo "is_latest=true" >> $GITHUB_OUTPUT
          elif [[ "${CURRENT_TAG}" == "${LATEST_TAG}" ]]; then
            echo "✅ This release (${CURRENT_TAG}) is marked as the latest release"
            echo "is_latest=true" >> $GITHUB_OUTPUT
          else
            echo "ℹ️  This release (${CURRENT_TAG}) is not the latest release (latest: ${LATEST_TAG})"
            echo "is_latest=false" >> $GITHUB_OUTPUT
          fi
  docker-build-community:
    name: Build & release community docker image
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/release-docker-github.yml
    secrets: inherit
    needs:
      - check-latest-release
    with:
      IS_PRERELEASE: ${{ github.event.release.prerelease }}
      # The build publishes only the immutable release tag. Every moving alias is promoted from the
      # verified digest after the Helm and, for v6, signed-upgrade artifacts have succeeded.
      MAKE_LATEST: false
      PUBLISH_RELEASE_ALIASES: false
      # v5 is the durable projection bridge customers upgrade from; only v6 images may make
      # SpiceDB authoritative. This keeps the supported 5.4.0 source release bootable without an
      # activation receipt while still shipping the outbox and repair machinery.
      AUTHZED_RELEASE_MODE: ${{ (startsWith(github.event.release.tag_name, '6.') || startsWith(github.event.release.tag_name, 'v6.')) && 'spicedb_authoritative' || 'legacy_bridge' }}

  docker-build-authzed-bridge:
    name: Build & release signed AuthZed bridge image
    if: ${{ startsWith(github.event.release.tag_name, '6.') || startsWith(github.event.release.tag_name, 'v6.') }}
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/release-docker-github.yml
    secrets: inherit
    needs:
      - check-latest-release
    with:
      IS_PRERELEASE: ${{ github.event.release.prerelease }}
      MAKE_LATEST: false
      AUTHZED_RELEASE_MODE: legacy_bridge
      TAG_SUFFIX: -authzed-bridge
      PUBLISH_RELEASE_ALIASES: false

  publish-v6-upgrade-assistant:
    name: Publish signed v6 upgrade assistant
    if: ${{ startsWith(github.event.release.tag_name, '6.') || startsWith(github.event.release.tag_name, 'v6.') }}
    permissions:
      contents: write
      id-token: write
      packages: read
    uses: ./.github/workflows/publish-v6-upgrade-assistant.yml
    needs:
      - docker-build-community
      - docker-build-authzed-bridge
    with:
      release_tag: ${{ github.event.release.tag_name }}
      bridge_image_ref: ghcr.io/${{ github.repository }}@${{ needs.docker-build-authzed-bridge.outputs.IMAGE_DIGEST }}
      target_image_ref: ghcr.io/${{ github.repository }}@${{ needs.docker-build-community.outputs.IMAGE_DIGEST }}
      minimum_source_version: 5.4.0

  docker-build-cloud:
    name: Build & push Formbricks Cloud to ECR
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build-and-push-ecr.yml
    secrets: inherit
    with:
      image_tag: ${{ needs.docker-build-community.outputs.VERSION }}
      # Releases publish an immutable ECR version only. Moving staging/production aliases is an
      # environment cutover action and must happen after that environment has an activation receipt.
      IS_PRERELEASE: false
      MAKE_LATEST: false
      AUTHZED_RELEASE_MODE: ${{ (startsWith(github.event.release.tag_name, '6.') || startsWith(github.event.release.tag_name, 'v6.')) && 'spicedb_authoritative' || 'legacy_bridge' }}
    needs:
      - check-latest-release
      - docker-build-community

  helm-chart-release:
    name: Release Helm Chart
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release-helm-chart.yml
    secrets: inherit
    needs:
      - docker-build-community
    with:
      VERSION: ${{ needs.docker-build-community.outputs.VERSION }}

  promote-stable-image:
    name: Promote verified community image to stable
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: formbricks-release-moving-aliases-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    outputs:
      aliases_complete: ${{ steps.promote.outputs.aliases_complete }}
      promoted: ${{ steps.promote.outputs.promoted }}
      source_stable: ${{ steps.promote.outputs.source_stable }}
    needs:
      - check-latest-release
      - docker-build-community
      - publish-v6-upgrade-assistant
      - helm-chart-release
    # `always()` lets non-v6 releases proceed past the intentionally skipped v6 bundle job. A v6
    # release must publish its signed bridge/upgrade bundle before either stable entrypoint moves.
    if: >-
      ${{
        always() &&
        !github.event.release.prerelease &&
        needs.docker-build-community.result == 'success' &&
        needs.helm-chart-release.result == 'success' &&
        (
          (!startsWith(github.event.release.tag_name, '6.') && !startsWith(github.event.release.tag_name, 'v6.')) ||
          needs.publish-v6-upgrade-assistant.result == 'success'
        )
      }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b163ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Promote and verify stable image alias
        id: promote
        env:
          EXPECTED_DIGEST: ${{ needs.docker-build-community.outputs.IMAGE_DIGEST }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.docker-build-community.outputs.VERSION }}
          # Explicit release policy: keep `latest` on the supported v5 migration line until this
          # value is deliberately changed after the published migration window.
          KEEP_LATEST_ON_V5: "true"
        run: |
          scripts/promote-release-image-aliases.sh

  verify-cloud-build:
    name: Verify Cloud Build Outputs
    runs-on: ubuntu-latest
    timeout-minutes: 5 # Simple verification should be quick
    needs:
      - docker-build-cloud
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - name: Display ECR build outputs
        env:
          IMAGE_TAG: ${{ needs.docker-build-cloud.outputs.IMAGE_TAG }}
          TAGS: ${{ needs.docker-build-cloud.outputs.TAGS }}
        run: |
          set -euo pipefail

          echo "✅ ECR Build Completed Successfully"
          echo "Image Tag: ${IMAGE_TAG}"
          echo "ECR Tags:"
          printf '%s\n' "${TAGS}"

  move-stable-tag:
    name: Move stable tag to release
    permissions:
      contents: write # Required for tag push operations in called workflow
    uses: ./.github/workflows/move-stable-tag.yml
    if: >-
      ${{
        always() &&
        needs.promote-stable-image.outputs.promoted == 'true' &&
        needs.promote-stable-image.outputs.source_stable == 'true'
      }}
    needs:
      - check-latest-release
      - promote-stable-image
    with:
      release_tag: ${{ github.event.release.tag_name }}
      commit_sha: ${{ github.sha }}
      is_prerelease: ${{ github.event.release.prerelease }}
      make_latest: true

  update-helm-app-version:
    name: Create Helm app version update
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - docker-build-community
      - helm-chart-release
    if: ${{ !github.event.release.prerelease }}
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false

      - name: Install YQ
        uses: dcarbone/install-yq-action@4075b4dca348d74bd83f2bf82d30f25d7c54539b # v1.3.1

      - name: Prepare Helm app version update
        id: update
        env:
          VERSION: ${{ needs.docker-build-community.outputs.VERSION }}
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Skipping Helm app version source update for non-stable version: ${VERSION}"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          yq -i ".appVersion = \"${VERSION}\"" charts/formbricks/Chart.yaml
          perl -0pi -e "s/!\[Version: [^\]]+\]/![Version: ${VERSION}]/" charts/formbricks/README.md
          perl -0pi -e "s/Version-[0-9A-Za-z._+-]+-informational/Version-${VERSION}-informational/" charts/formbricks/README.md
          perl -0pi -e "s/!\[AppVersion: [^\]]+\]/![AppVersion: ${VERSION}]/" charts/formbricks/README.md
          perl -0pi -e "s/AppVersion-[0-9A-Za-z._+-]+-informational/AppVersion-${VERSION}-informational/" charts/formbricks/README.md

          if git diff --quiet -- charts/formbricks/Chart.yaml charts/formbricks/README.md; then
            echo "Helm chart appVersion already matches ${VERSION}"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Validate Helm update PR app configuration
        if: steps.update.outputs.changed == 'true'
        env:
          APP_CLIENT_ID: ${{ vars.HELM_APP_VERSION_PR_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.HELM_APP_VERSION_PR_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "$APP_CLIENT_ID" || -z "$APP_PRIVATE_KEY" ]]; then
            echo "::error::Configure HELM_APP_VERSION_PR_APP_CLIENT_ID as a repository variable and HELM_APP_VERSION_PR_APP_PRIVATE_KEY as a repository secret."
            exit 1
          fi

      - name: Create GitHub App token for Helm update PR
        id: helm-update-pr-token
        if: steps.update.outputs.changed == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.HELM_APP_VERSION_PR_APP_CLIENT_ID }}
          private-key: ${{ secrets.HELM_APP_VERSION_PR_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create Helm app version PR
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.helm-update-pr-token.outputs.token }}
          VERSION: ${{ needs.docker-build-community.outputs.VERSION }}
          APP_SLUG: ${{ steps.helm-update-pr-token.outputs.app-slug }}
        run: |
          set -euo pipefail

          branch="chore/update-helm-app-version-${VERSION}"
          title="chore: update Helm app version to ${VERSION}"
          body_file="$(mktemp)"
          app_user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"

          gh auth setup-git
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${app_user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add charts/formbricks/Chart.yaml charts/formbricks/README.md
          git commit -m "$title"
          git push --force-with-lease origin "$branch"

          cat > "$body_file" <<EOF
          Updates the Helm chart default app version after publishing stable Formbricks release ${VERSION}.

          Release candidates and pre-releases do not create this source update.
          EOF

          if gh pr view "$branch" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh pr edit "$branch" --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$body_file" --base main
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --title "$title" --body-file "$body_file"
          fi

  linear-release-complete:
    name: Mark Linear release as complete
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Published artifacts only. `always()` lets non-v6 releases proceed past the intentionally
    # skipped v6 bundle while requiring that bundle for every v6 release.
    #
    # update-helm-app-version opens a follow-up PR against main rather than publishing
    # anything for this tag, so gating completion on it left Linear stuck on every stable
    # release its appVersion PR job failed.
    #
    needs:
      - docker-build-community
      - docker-build-cloud
      - helm-chart-release
      - publish-v6-upgrade-assistant
      - promote-stable-image
    if: >-
      ${{
        always() &&
        !github.event.release.prerelease &&
        needs.docker-build-community.result == 'success' &&
        needs.docker-build-cloud.result == 'success' &&
        needs.helm-chart-release.result == 'success' &&
        (
          (!startsWith(github.event.release.tag_name, '6.') && !startsWith(github.event.release.tag_name, 'v6.')) ||
          needs.publish-v6-upgrade-assistant.result == 'success'
        ) &&
        needs.promote-stable-image.outputs.aliases_complete == 'true'
      }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # A versioned sync targets the release carrying this exact version, or creates it when
      # none exists - which is what makes patch releases work, since 5.3.4 never had a
      # planned train of its own. complete then looks that exact version up; it never
      # assigns one, so the sync has to run first.
      #
      # VERSION is this release's tag with any v-prefix stripped and validated as SemVer by
      # release-docker-github.yml. Using the raw tag_name instead would silently create a
      # second, v-prefixed Linear release the first time somebody tags v5.6.0.
      - name: Stamp Linear release version
        uses: linear/linear-release-action@17b8c24f8ceb2b98cabaf1965ff83c55dd596fac # v0.15.1
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          version: ${{ needs.docker-build-community.outputs.VERSION }}

      - name: Complete Linear release
        uses: linear/linear-release-action@17b8c24f8ceb2b98cabaf1965ff83c55dd596fac # v0.15.1
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          command: complete
          version: ${{ needs.docker-build-community.outputs.VERSION }}
