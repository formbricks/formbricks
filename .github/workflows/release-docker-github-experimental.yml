name: Build Community Testing Images

# This workflow builds experimental/testing versions of Formbricks for self-hosting customers
# to test fixes and features before official releases. Images are pushed to GHCR with
# timestamped experimental versions for easy identification and testing.

on:
  workflow_dispatch:
    inputs:
      version_override:
        description: "Override version (SemVer only, e.g., 1.2.3-beta). Leave empty for auto-generated experimental version."
        required: false
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-community-testing:
    name: Build Community Testing Image
    runs-on: ubuntu-latest
    timeout-minutes: 90

    outputs:
      IMAGE_REF: ${{ steps.build.outputs.image_ref }}
      BUILD_IDENTITY: ${{ steps.build.outputs.build_identity }}
      DEPOT_BUILD_ID: ${{ steps.build.outputs.depot_build_id }}
      TAGS: ${{ steps.build.outputs.registry_tags }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Build and push community testing image
        id: build
        uses: ./.github/actions/build-and-push-docker
        with:
          registry_type: "ghcr"
          ghcr_image_name: "${{ github.repository }}-experimental"
          experimental_mode: "true"
          version: ${{ inputs.version_override }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPOT_PROJECT_TOKEN: ${{ secrets.DEPOT_PROJECT_TOKEN }}
          DUMMY_DATABASE_URL: ${{ secrets.DUMMY_DATABASE_URL }}
          DUMMY_ENCRYPTION_KEY: ${{ secrets.DUMMY_ENCRYPTION_KEY }}
          DUMMY_REDIS_URL: ${{ secrets.DUMMY_REDIS_URL }}
          DUMMY_HUB_API_URL: ${{ secrets.DUMMY_HUB_API_URL }}
          DUMMY_HUB_API_KEY: ${{ secrets.DUMMY_HUB_API_KEY }}
          DUMMY_CUBEJS_API_URL: ${{ secrets.DUMMY_CUBEJS_API_URL }}
          DUMMY_CUBEJS_API_SECRET: ${{ secrets.DUMMY_CUBEJS_API_SECRET }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

  validate:
    name: Image smoke (${{ matrix.platform }})
    needs: build-community-testing
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/test-release-image
        with:
          depot_build_id: ${{ needs.build-community-testing.outputs.DEPOT_BUILD_ID }}
          depot_token: ${{ secrets.DEPOT_PROJECT_TOKEN }}
          image_ref: ${{ needs.build-community-testing.outputs.IMAGE_REF }}
          build_identity: ${{ needs.build-community-testing.outputs.BUILD_IDENTITY }}
          registry_type: "ghcr"
          platform: ${{ matrix.platform }}

  promote:
    name: Promote verified image
    needs: [build-community-testing, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/promote-verified-image
        with:
          depot_build_id: ${{ needs.build-community-testing.outputs.DEPOT_BUILD_ID }}
          depot_token: ${{ secrets.DEPOT_PROJECT_TOKEN }}
          image_ref: ${{ needs.build-community-testing.outputs.IMAGE_REF }}
          registry_type: "ghcr"
          release_tags: ${{ needs.build-community-testing.outputs.TAGS }}
