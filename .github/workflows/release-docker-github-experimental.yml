name: Build Community Testing Images

# This workflow builds experimental/testing versions of Formbricks for self-hosting customers
# to test fixes and features before official releases. Images are pushed to GHCR with
# timestamped experimental versions for easy identification and testing.

on:
  workflow_dispatch:
    inputs:
      blacksmith_trial:
        description: "Benchmark and smoke-test Blacksmith on both architectures without publishing release images"
        required: false
        type: boolean
        default: false
      blacksmith_registry_trial:
        description: "Validate private ECR staging, digest-preserving copy to a dedicated GHCR test package, and signing"
        required: false
        type: boolean
        default: false
      version_override:
        description: "Override version (SemVer only, e.g., 1.2.3-beta). Leave empty for auto-generated experimental version."
        required: false
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  blacksmith-registry-trial:
    if: inputs.blacksmith_registry_trial
    uses: ./.github/workflows/blacksmith-registry-trial.yml
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write

  blacksmith-trial:
    if: inputs.blacksmith_trial
    uses: ./.github/workflows/blacksmith-docker-trial.yml
    permissions:
      contents: read

  build-community-testing:
    if: ${{ !inputs.blacksmith_trial && !inputs.blacksmith_registry_trial }}
    name: Build private community testing candidate
    uses: ./.github/workflows/build-docker-candidate.yml
    permissions:
      contents: read
      id-token: write
    with:
      registry_type: ghcr
      ghcr_image_name: ${{ format('{0}-experimental', github.repository) }}
      experimental_mode: true
      version: ${{ inputs.version_override || '' }}
    secrets: inherit

  validate:
    name: Image smoke (${{ matrix.platform }})
    needs: build-community-testing
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/test-release-image
        with:
          aws_role_arn: ${{ secrets.AWS_ECR_PUSH_ROLE_ARN }}
          ecr_region: ${{ vars.ECR_REGION }}
          image_ref: ${{ needs.build-community-testing.outputs.IMAGE_REF }}
          build_identity: ${{ needs.build-community-testing.outputs.BUILD_IDENTITY }}
          registry_type: "ghcr"
          platform: ${{ matrix.platform }}

  promote:
    name: Promote verified image
    needs: [build-community-testing, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/promote-verified-image
        with:
          aws_role_arn: ${{ secrets.AWS_ECR_PUSH_ROLE_ARN }}
          ecr_region: ${{ vars.ECR_REGION }}
          image_ref: ${{ needs.build-community-testing.outputs.IMAGE_REF }}
          registry_type: "ghcr"
          release_tags: ${{ needs.build-community-testing.outputs.TAGS }}
