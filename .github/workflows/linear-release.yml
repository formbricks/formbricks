name: Linear Release Sync

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  linear-release:
    name: Sync release to Linear
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Sync Linear release
        uses: linear/linear-release-action@dd4fc407f860b9460d2cf0b3fb1edd8985cf443f # v0.18.2
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
