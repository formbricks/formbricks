name: Build Cloud Deployment Images

# This workflow builds Formbricks Docker images for ECR deployment:
# - workflow_call: Used by releases with explicit SemVer versions
# - workflow_dispatch: Auto-detects version from current branch or uses override

on:
  workflow_dispatch:
    inputs:
      rebuild_application:
        description: "Bypass application build and packaging caches for a repair candidate"
        required: false
        type: boolean
        default: false
      version_override:
        description: "Override version (SemVer only, e.g., 1.2.3). Leave empty to auto-detect from branch."
        required: false
        type: string
      deploy_production:
        description: "Tag image for production deployment"
        required: false
        default: false
        type: boolean
      deploy_staging:
        description: "Tag image for staging deployment"
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      rebuild_application:
        description: "Bypass application build and packaging caches for a repair candidate"
        required: false
        type: boolean
        default: false
      image_tag:
        description: "Image tag to push (required for workflow_call)"
        required: true
        type: string
      IS_PRERELEASE:
        description: "Whether this is a prerelease (auto-tags for staging/production)"
        required: false
        type: boolean
        default: false
      MAKE_LATEST:
        description: "Whether to tag for production (from GitHub release 'Set as the latest release' option)"
        required: false
        type: boolean
        default: false
      deployment_tag:
        description: "Additional mutable environment tag for a manual environment deployment"
        required: false
        type: string
        default: ""
    secrets:
      AWS_ECR_PUSH_ROLE_ARN:
        required: true
      DUMMY_DATABASE_URL:
        required: false
      DUMMY_ENCRYPTION_KEY:
        required: false
      DUMMY_REDIS_URL:
        required: false
      DUMMY_HUB_API_URL:
        required: false
      DUMMY_HUB_API_KEY:
        required: false
      DUMMY_CUBEJS_API_URL:
        required: false
      DUMMY_CUBEJS_API_SECRET:
        required: false
      SENTRY_AUTH_TOKEN:
        required: false
      POSTHOG_KEY:
        required: false
    outputs:
      IMAGE_TAG:
        description: "Normalized image tag used for the build"
        value: ${{ jobs.build-and-push.outputs.IMAGE_TAG }}
      TAGS:
        description: "Newline-separated list of ECR tags pushed"
        value: ${{ jobs.build-and-push.outputs.TAGS }}

permissions:
  contents: read
  id-token: write

# Serialize writers of each mutable environment tag across releases and manual deployments.
concurrency:
  group: ecr-${{ inputs.deployment_tag || (inputs.IS_PRERELEASE && 'staging') || (inputs.deploy_staging && 'staging') || (inputs.deploy_production && 'production') || (inputs.MAKE_LATEST && 'production') || github.run_id }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build cloud candidate
    uses: ./.github/workflows/build-docker-candidate.yml
    permissions:
      contents: read
      id-token: write
    with:
      registry_type: ecr
      version: ${{ inputs.version_override || inputs.image_tag || '' }}
      rebuild_application: ${{ inputs.rebuild_application }}
      deploy_production: ${{ inputs.deploy_production || false }}
      deploy_staging: ${{ inputs.deploy_staging || false }}
      deployment_tag: ${{ inputs.deployment_tag || '' }}
      is_prerelease: ${{ inputs.IS_PRERELEASE || false }}
      make_latest: ${{ inputs.MAKE_LATEST || false }}
    secrets: inherit

  validate:
    name: Image smoke (${{ matrix.platform }})
    needs: build-and-push
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/test-release-image
        with:
          aws_role_arn: ${{ secrets.AWS_ECR_PUSH_ROLE_ARN }}
          ecr_region: ${{ vars.ECR_REGION }}
          image_ref: ${{ needs.build-and-push.outputs.IMAGE_REF }}
          build_identity: ${{ needs.build-and-push.outputs.BUILD_IDENTITY }}
          registry_type: "ecr"
          platform: ${{ matrix.platform }}

  promote:
    name: Promote verified image
    needs: [build-and-push, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/promote-verified-image
        with:
          aws_role_arn: ${{ secrets.AWS_ECR_PUSH_ROLE_ARN }}
          ecr_region: ${{ vars.ECR_REGION }}
          image_ref: ${{ needs.build-and-push.outputs.IMAGE_REF }}
          registry_type: "ecr"
          release_tags: ${{ needs.build-and-push.outputs.TAGS }}
