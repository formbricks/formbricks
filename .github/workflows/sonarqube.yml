name: SonarQube
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
permissions:
  contents: read
  pull-requests: read
jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Setup Java 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.platform=linux --config.architecture=x64

      - name: Create .env
        run: pnpm dev:setup

      - name: Adjust CI-specific env values
        run: |
          sed -i "s|REDIS_URL=.*|REDIS_URL=|" .env

      # Backport PRs (base `release/*`) deliberately don't carry tests, so skip the coverage run and
      # tell Sonar to ignore coverage for them (see the scan args). `github.base_ref` is empty on
      # `push` and `merge_group`, so `main` is analysed as before.
      - name: Run tests with coverage
        if: ${{ !startsWith(github.base_ref, 'release/') }}
        run: |
          pnpm test:coverage
      - name: DIAG start memory sampler
        run: |
          free -m
          swapon --show || true
          echo "swappiness=$(cat /proc/sys/vm/swappiness)"
          echo "systemd-oomd=$(systemctl is-active systemd-oomd || true)"
          cat > "$RUNNER_TEMP/memsample.sh" <<'EOF'
          #!/usr/bin/env bash
          while true; do
            avail=$(awk '/MemAvailable/ {print int($2/1024)}' /proc/meminfo)
            swapfree=$(awk '/SwapFree/ {print int($2/1024)}' /proc/meminfo)
            rss=$(ps -eo rss,args --no-headers | awk '/server\.cjs/ {n+=$1} /java/ {j+=$1} END {printf "node=%d java=%d", n/1024, j/1024}')
            echo "$(date +%T) avail=${avail} swapfree=${swapfree} ${rss}"
            sleep 2
          done
          EOF
          chmod +x "$RUNNER_TEMP/memsample.sh"
          nohup "$RUNNER_TEMP/memsample.sh" > "$RUNNER_TEMP/mem.log" 2>&1 &

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        with:
          args: >
            -Dsonar.verbose=true
            ${{ startsWith(github.base_ref, 'release/') && '-Dsonar.coverage.exclusions=**/*' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: DIAG memory report
        if: always()
        run: |
          echo "samples: $(wc -l < "$RUNNER_TEMP/mem.log")"
          awk '{split($2,a,"="); split($3,s,"="); split($4,n,"="); split($5,j,"=");
                if (min=="" || a[2]<min) {min=a[2]; minline=$0}
                if (n[2]>maxn) {maxn=n[2]; nline=$0}
                if (j[2]>maxj) {maxj=j[2]; jline=$0}
                if (n[2]+j[2]>maxs) {maxs=n[2]+j[2]; sline=$0}
                if (smin=="" || s[2]<smin) smin=s[2]}
               END {print "lowest available: " minline; print "peak node rss:    " nline; print "peak java rss:    " jline; print "peak node+java:   " sline; print "lowest swap free: " smin " MB"}' "$RUNNER_TEMP/mem.log"
          echo "--- timeline while the scanner ran (every 5th sample) ---"
          awk '{split($5,j,"="); if (j[2]>200) {c++; if (c%5==1) print}}' "$RUNNER_TEMP/mem.log"
          echo "--- kernel oom messages ---"
          sudo dmesg | grep -i -E 'oom|out of memory|killed process' | tail -20 || true
