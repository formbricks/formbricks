name: SonarQube
# Pushes to `main` only. Pull requests and the merge queue scan in pr.yml's `SonarQube` job, from the
# coverage its unit-test run already produced, so the suite runs once per pull request (ENG-7529).
# This run is also the one that saves the Turborepo cache of package builds that pull requests restore.
on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: read
  pull-requests: read
jobs:
  test:
    name: Run Unit Tests
    uses: ./.github/workflows/test.yml
    with:
      coverage: true
      save-build-cache: true

  sonarqube:
    name: SonarQube
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
          persist-credentials: false

      - uses: ./.github/actions/sonarqube-scan
        with:
          coverage: "true"
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
