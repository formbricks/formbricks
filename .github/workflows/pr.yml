name: PR Update

# Update permissions to include all necessary ones
permissions:
  contents: read
  pull-requests: read
  actions: read
  checks: write
  id-token: write

on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Unit Tests
    uses: ./.github/workflows/test.yml
    secrets: inherit

  lint:
    name: Run Linters
    uses: ./.github/workflows/lint.yml
    secrets: inherit

  typecheck:
    name: Run Typecheck
    uses: ./.github/workflows/typecheck.yml
    secrets: inherit

  # NOTE: there is deliberately no standalone "build the web app" job here. It used to run
  # `pnpm build --filter=@formbricks/web...` in parallel with e2e-test, which builds the
  # very same app, and cached the output into a key nothing downstream ever read. Sharing
  # that build with e2e-test would require `needs: build`, which serializes two jobs that
  # are currently concurrent and makes the critical path longer, not shorter. The compile
  # signal is still covered twice: e2e-test builds the app, and docker-build-validation.yml
  # builds it again in production config.

  helm-chart-validation:
    name: Validate Helm Chart
    uses: ./.github/workflows/helm-chart-validation.yml

  e2e-test:
    name: Run E2E Tests
    uses: ./.github/workflows/e2e.yml
    secrets: inherit

  required:
    name: PR Check Summary
    needs: [lint, typecheck, test, helm-chart-validation, e2e-test]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      statuses: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0
        with:
          egress-policy: audit
      - name: fail if conditional jobs failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'skipped') || contains(needs.*.result, 'cancelled')
        run: exit 1
