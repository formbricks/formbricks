name: Promote verified image
description: Sign and tag an image after every native validation job succeeds
inputs:
  depot_build_id:
    description: "Saved build ID"
    required: true
  depot_token:
    description: "Depot project credential"
    required: true
  image_ref:
    description: "Immutable candidate image digest"
    required: true
  registry_type:
    description: "ecr or ghcr"
    required: true
  ecr_region:
    description: "AWS region for ECR"
    required: false
  aws_role_arn:
    description: "AWS role for ECR"
    required: false
  release_tags:
    description: "Intended release tags"
    required: true
runs:
  using: composite
  steps:
    - uses: ./.github/actions/depot-registry-login
      with:
        depot_build_id: ${{ inputs.depot_build_id }}
        depot_token: ${{ inputs.depot_token }}
    - uses: ./.github/actions/image-registry-login
      with:
        registry_type: ${{ inputs.registry_type }}
        ecr_region: ${{ inputs.ecr_region }}
        aws_role_arn: ${{ inputs.aws_role_arn }}
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb # v3.8.2
      if: inputs.registry_type == 'ghcr'
    - name: Promote verified digest without rebuilding
      env:
        IMAGE: ${{ inputs.image_ref }}
        RELEASE_TAGS: ${{ inputs.release_tags }}
        BUILD_ID: ${{ inputs.depot_build_id }}
        DEPOT_TOKEN: ${{ inputs.depot_token }}
      shell: bash
      run: |
        set -euo pipefail
        # A deployer may already have consumed a changed tag; recovery must move forward.
        trap 'echo "Tag promotion failed; inspect release tags and resume with the verified digest. Do not automatically roll back deployed workloads." >&2' ERR
        args=()
        while IFS= read -r tag; do
          if [ -n "$tag" ]; then args+=(--tag "$tag"); fi
        done <<< "$RELEASE_TAGS"
        test "${#args[@]}" -gt 0
        # Bind Depot's build-ID copy to the exact private digest exercised by both native jobs.
        saved="$(docker buildx imagetools inspect --format '{{json .Manifest}}' "registry.depot.dev/tw0fqmsx3c:$BUILD_ID" | jq -r .digest)"
        test "$saved" = "${IMAGE##*@}"
        depot push --project tw0fqmsx3c "${args[@]}" "$BUILD_ID"
        while IFS= read -r tag; do
          if [ -z "$tag" ]; then continue; fi
          actual="$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$tag" | jq -r .digest)"
          test "$actual" = "${IMAGE##*@}"
        done <<< "$RELEASE_TAGS"
    - name: Sign verified community image
      if: inputs.registry_type == 'ghcr'
      env:
        IMAGE: ${{ inputs.image_ref }}
        RELEASE_TAGS: ${{ inputs.release_tags }}
      shell: bash
      run: |
        set -euo pipefail
        first_tag="${RELEASE_TAGS%%$'\n'*}"
        cosign sign --yes "$first_tag@${IMAGE##*@}"
