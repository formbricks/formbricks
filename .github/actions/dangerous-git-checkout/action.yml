name: Dangerous git Checkout
description: "Git Checkout from PR code so we can run checks from forks"
runs:
  using: "composite"
  steps:
    - name: Checkout repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 2
        # This checks out PR-controlled code that later steps execute (pnpm scripts),
        # so never leave the token behind in .git/config.
        persist-credentials: false
